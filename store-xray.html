<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mağaza X-Ray</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    padding: 20px;
    border-bottom: 1px solid #232838;
    background: #141821;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header a { color: #9aa3b2; text-decoration: none; font-size: 14px; }
  header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .intro { color: #9aa3b2; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .search-box input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #232838;
    background: #141821;
    color: #e6e8ee;
    font-size: 14px;
  }
  .search-box button {
    background: #1D9E75;
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .search-box button:disabled { opacity: 0.6; }
  .loading { text-align: center; color: #9aa3b2; padding: 30px; font-size: 14px; }
  .error-box {
    background: #2a1620;
    border: 1px solid #4a2030;
    color: #f28b8b;
    padding: 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .result-section {
    background: #141821;
    border: 1px solid #232838;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .result-section h3 {
    font-size: 13px;
    color: #5DCAA5;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .result-section p { font-size: 14px; line-height: 1.6; color: #e6e8ee; }
  .product-item {
    padding: 10px 0;
    border-bottom: 1px solid #1c212c;
  }
  .product-item:last-child { border-bottom: none; }
  .product-item .p-name { font-size: 14px; font-weight: 600; color: #fff; }
  .product-item .p-price { font-size: 13px; color: #5DCAA5; margin: 2px 0; }
  .product-item .p-reason { font-size: 12px; color: #9aa3b2; }
  .list-item {
    font-size: 14px;
    color: #e6e8ee;
    padding: 6px 0 6px 18px;
    position: relative;
    line-height: 1.5;
  }
  .list-item:before {
    content: "•";
    position: absolute;
    left: 0;
    color: #5DCAA5;
  }
</style>
</head>
<body>
<header>
  <a href="dashboard.html">←</a>
  <h1>🔍 Mağaza X-Ray</h1>
</header>
<main>
  <div class="intro">Bir rakip mağazanın linkini yapıştır, AI senin için mağazayı analiz etsin: en çok satan ürünler, fiyatlandırma stratejisi ve fark yaratabileceğin fırsatlar.</div>

  <div class="search-box">
    <input id="storeUrlInput" type="text" placeholder="https://www.trendyol.com/magaza/...">
    <button id="analyzeBtn" onclick="analyzeStore()">Analiz Et</button>
  </div>

  <div id="resultArea"></div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function analyzeStore() {
    const storeUrl = document.getElementById('storeUrlInput').value.trim();
    const resultArea = document.getElementById('resultArea');
    const btn = document.getElementById('analyzeBtn');

    if (!storeUrl) {
      resultArea.innerHTML = '<div class="error-box">Lütfen bir mağaza linki gir.</div>';
      return;
    }

    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    if (!accessToken) {
      resultArea.innerHTML = '<div class="error-box">Oturum bulunamadı, lütfen tekrar giriş yap.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = '...';
    resultArea.innerHTML = '<div class="loading">Mağaza inceleniyor, bu biraz sürebilir...</div>';

    try {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/store-spy`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY
        },
        body: JSON.stringify({ storeUrl, userAccessToken: accessToken })
      });

      const data = await response.json();

      if (data.error) {
        resultArea.innerHTML = `<div class="error-box">Hata: ${escapeHtml(data.error)}</div>`;
        return;
      }

      renderResult(data);
    } catch (err) {
      resultArea.innerHTML = `<div class="error-box">Hata: ${escapeHtml(String(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Analiz Et';
    }
  }

  function renderResult(data) {
    const resultArea = document.getElementById('resultArea');
    let html = '';

    if (data.storeSummary) {
      html += `<div class="result-section"><h3>Mağaza Özeti</h3><p>${escapeHtml(data.storeSummary)}</p></div>`;
    }

    if (data.topProducts && data.topProducts.length > 0) {
      html += `<div class="result-section"><h3>Öne Çıkan Ürünler</h3>`;
      data.topProducts.forEach(p => {
        html += `<div class="product-item">
          <div class="p-name">${escapeHtml(p.name || '')}</div>
          <div class="p-price">${escapeHtml(p.estimatedPrice || '')}</div>
          <div class="p-reason">${escapeHtml(p.reason || '')}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (data.pricingStrategy) {
      html += `<div class="result-section"><h3>Fiyatlandırma Stratejisi</h3><p>${escapeHtml(data.pricingStrategy)}</p></div>`;
    }

    if (data.strengths && data.strengths.length > 0) {
      html += `<div class="result-section"><h3>Güçlü Yönleri</h3>`;
      data.strengths.forEach(s => html += `<div class="list-item">${escapeHtml(s)}</div>`);
      html += `</div>`;
    }

    if (data.opportunities && data.opportunities.length > 0) {
      html += `<div class="result-section"><h3>Senin Fırsatların</h3>`;
      data.opportunities.forEach(o => html += `<div class="list-item">${escapeHtml(o)}</div>`);
      html += `</div>`;
    }

    resultArea.innerHTML = html || '<div class="error-box">Sonuç alınamadı.</div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
