      const data = await callParse({ imageBase64: jpg });
      if (data.site && !docSite) docSite = data.site;
      const got = data.rows || [];
      // Fotoğraf yerleri ayrı ve odaklı bir adımda bulunur (okuma sırasında verilen konum kaba olabiliyor)
      const boxes = new Map();
      if (got.length) {
        try {
          const pm = await callParse({ action: 'page_photos', imageBase64: jpg, rows: got.map((r, i) => ({ i: i, code: r.code, name: r.name })) });
          (pm.matches || []).forEach(m => { if (m.box) boxes.set(m.i, m.box); });
        } catch (e) { console.warn('fotoğraf yerleri bulunamadı', e); }
      }
      got.forEach((r, i) => {
        const box = boxes.get(i) || r.box;
        const im = box ? cropBox(cv, box) : null;
        rows.push(Object.assign({}, r, { images: im ? [im] : [], fileName: f.name }));
      });
      done++;
    }
    return rows;
  }

  // PDF: model koduyla eşleşmeyen ürünlerin fotoğrafı (kodsuz katalog / taranmış sayfa).
  // Sayfadaki resim alanları belliyse numaralanıp yapay zekâya hangisinin hangi ürün olduğu sorulur;
  // taranmış sayfada (resim alanı yok) fotoğrafın yerini yapay zekâ bulur.
  async function matchPdfPhotos(file, rows) {
    const need = new Map(); // sayfa -> [satır sırası]
    rows.forEach((r, i) => {
      if (pdfImageMap.get(normCode(r.code)) || (r.images && r.images.length) || !r.page) return;
      if (!need.has(r.page)) need.set(r.page, []);
      need.get(r.page).push(i);
    });
    if (!need.size) return;
    const lib = await loadPdfJs();
    const OPS = lib.OPS;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [...need.keys()].filter(p => p >= 1 && p <= pdf.numPages).sort((a, b) => a - b).slice(0, 60);
    let done = 0;
    for (const pno of pages) {
      setProgress(fmt(t('photoMatch'), { d: done, t: pages.length }), 90 + done / pages.length * 10);
      done++;
      try {
        const page = await pdf.getPage(pno);
        const base = page.getViewport({ scale: 1 });
        const pageArea = base.width * base.height;
        const ops = await page.getOperatorList();
        let ctm = [1, 0, 0, 1, 0, 0];
        const stack = [], boxes = [];
        for (let i = 0; i < ops.fnArray.length; i++) {
          const fn = ops.fnArray[i], args = ops.argsArray[i];
          if (fn === OPS.save) stack.push(ctm.slice());
          else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
          else if (fn === OPS.transform) ctm = mulM(ctm, args);
          else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageXObjectRepeat) {
            const xs = [ctm[4], ctm[4] + ctm[0], ctm[4] + ctm[2], ctm[4] + ctm[0] + ctm[2]];
            const ys = [ctm[5], ctm[5] + ctm[1], ctm[5] + ctm[3], ctm[5] + ctm[1] + ctm[3]];
            const x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
            const w = Math.max.apply(null, xs) - x, h = Math.max.apply(null, ys) - y;
            if (w < 20 || h < 20 || w * h > pageArea * 0.5 || w / h > 4 || h / w > 4) continue;
            boxes.push({ x, y, w, h });
          }
        }
        const scale = 2;
        const vp = page.getViewport({ scale });
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        const pageRows = need.get(pno).map(i => ({ i: i, code: rows[i].code, name: rows[i].name }));
        let payload, rects = [];
        if (boxes.length) {
          // Resim alanlarını numaralı kırmızı kutularla işaretle
          const mark = document.createElement('canvas');
          mark.width = cv.width; mark.height = cv.height;
          const mctx = mark.getContext('2d');
          mctx.drawImage(cv, 0, 0);
          mctx.lineWidth = 4; mctx.strokeStyle = '#ff0000'; mctx.fillStyle = '#ff0000'; mctx.font = 'bold 28px sans-serif';
          rects = boxes.slice(0, 60).map((b, k) => {
            const r = vp.convertToViewportRectangle([b.x, b.y, b.x + b.w, b.y + b.h]);
            const x0 = Math.min(r[0], r[2]), y0 = Math.min(r[1], r[3]), x1 = Math.max(r[0], r[2]), y1 = Math.max(r[1], r[3]);
            mctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
            mctx.fillText(String(k + 1), x0 + 6, y0 + 30);
            return { n: k + 1, box: [x0 / cv.width * 1000, y0 / cv.height * 1000, x1 / cv.width * 1000, y1 / cv.height * 1000] };
          });
          payload = { action: 'page_photos', imageBase64: mark.toDataURL('image/jpeg', 0.8), rows: pageRows, boxes: rects.map(r => ({ n: r.n })) };
        } else {
          payload = { action: 'page_photos', imageBase64: cv.toDataURL('image/jpeg', 0.8), rows: pageRows };
        }
        const data = await callParse(payload);
        (data.matches || []).forEach(m => {
          const row = rows[m.i];
          if (!row) return;
          const box = m.n ? (rects.find(r => r.n === m.n) || {}).box : m.box;
          const im = box ? cropBox(cv, box) : null;
          if (im) row.images = [im];
        });
        page.cleanup();
      } catch (e) { console.warn('sayfa fotoğrafları eşleştirilemedi', pno, e); }
    }
  }

  const SHEET_EXT = ['xlsx', 'xls', 'csv', 'ods', 'txt'];
  function fileKind(f) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf' || f.type === 'application/pdf') return 'pdf';
    if (SHEET_EXT.includes(ext)) return 'sheet';
    if (/^image\//.test(f.type) || ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'heic', 'heif'].includes(ext)) return 'image';
    return null;
  }
  async function onFilesPicked(list) {
    if (!list || !list.length || running) return;
    if (srcMode !== 'file') setSrc('file');
    const files = Array.from(list);
    const bad = files.filter(f => !fileKind(f));
    if (bad.length) { toast(fmt(t('fileBad'), { n: bad.map(f => f.name).join(', ') }), true); }
    const ok = files.filter(f => fileKind(f));
    if (ok.length) await onFilePicked(ok);
  }
  async function onFilePicked(files) {
    if (!Array.isArray(files)) files = [files];
    if (!files.length || running) return;
    const box = document.getElementById('fileResult');
    box.style.display = 'none';
    running = true;
    document.getElementById('stopBtn').style.display = 'none';
    const exts = new Set();
    try {
      let rows = [];
      pdfImageMap = new Map();
      const images = files.filter(f => fileKind(f) === 'image');
      for (const file of files) {
        const kind = fileKind(file);
        exts.add((file.name.split('.').pop() || '').toUpperCase());
        if (kind === 'pdf') {
          const pr = await readPdf(file);
          if (pr.length) {
            try {
              const m = await extractPdfImages(file, pr.map(r => r.code).filter(Boolean),
                (d, n) => setProgress(fmt(t('pdfImgs'), { d: d, t: n }), 85 + d / n * 5));
              m.forEach((v, k) => pdfImageMap.set(k, v));
            } catch (e) { console.warn('PDF resimleri çıkarılamadı', e); }
            try { await matchPdfPhotos(file, pr); } catch (e) { console.warn('PDF fotoğraf eşleştirme', e); }
          }
          rows = rows.concat(pr);
        } else if (kind === 'sheet') {
          rows = rows.concat(await readSheet(file));
        }
      }
      if (images.length) rows = rows.concat(await readImages(images));
      const file = files[0];
      const vat = parseFloat(document.getElementById('vatSel').value) || 0;
      if (vat) rows = rows.map(r => Object.assign({}, r, {
        price: r.price ? Math.round(r.price * (1 + vat / 100) * 100) / 100 : r.price,
        list_price: r.list_price ? Math.round(r.list_price * (1 + vat / 100) * 100) / 100 : r.list_price
      }));
      priceRows = rows;
      if (!rows.length) throw new Error(t('fileNoRows'));
      sourceUrl = files.length > 1 ? files.map(f => f.name).join(', ').slice(0, 300) : file.name;
      await applyPriceList();
      setProgress(fmt(t('feedDone'), { n: HS.number(rows.length) }).replace('XML', Array.from(exts).join('/')), 100);
    } catch (e) {
      setProgress(t('fnError') + e.message, 0);
      toast(t('fnError') + e.message, true);
    } finally {
      running = false;
    }
    renderBgNote();
  }

  function findRow(code, byNorm) {
    const n = normCode(code);
    if (!n) return null;
    if (byNorm.has(n)) return byNorm.get(n);
    if (n.length < 5) return null;
    let hit = null, count = 0;
    byNorm.forEach((row, k) => { if (k.length >= 5 && (k.includes(n) || n.includes(k))) { hit = row; count++; } });
    return count === 1 ? hit : null;
  }

  function rowToItem(u) {
    return {
      url: '', name: u.name || u.code, price: u.price, list_price: u.list_price, currency: u.currency,
      model_code: u.code, brand: u.brand || '', category: '', description: '',
      images: (u.images && u.images.length ? u.images : (pdfImageMap.get(normCode(u.code)) || [])).slice(), specs: [], stock: null,
      imgSrc: null
    };
  }

  async function applyPriceList() {
    // Önizleme boşsa (sadece dosya yüklendiyse) dosyadaki ürünler doğrudan önizlemeye gelir
    const fromFile = !items.length;
    if (fromFile) {
      addItems(priceRows.filter(u => u.code || u.name).map(rowToItem));
      await markExisting();
    }
    const r = rules();
    const byNorm = new Map();
    priceRows.forEach(row => { const k = normCode(row.code); if (k && !byNorm.has(k)) byNorm.set(k, row); });
    const used = new Set();

    // 1) Önizlemedeki ürünler
    let filled = 0;
    items.forEach(it => {
      const row = findRow(it.model_code, byNorm);
      if (!row) return;
      used.add(row);
      it.price = row.price;
      if (row.list_price) it.list_price = row.list_price;
      if (row.currency) it.currency = row.currency;
      if (!it.images.length && row.images && row.images.length) it.images = row.images.slice();
      if (!it.priceEdited) it.newPrice = calcPrice(it, r);
      filled++;
    });
    items.forEach(it => {
      if (!it.images.length) { const im = pdfImageMap.get(normCode(it.model_code)); if (im && im.length) it.images = im.slice(); }
    });
    const previewCodes = new Set(items.map(i => normCode(i.model_code)).filter(Boolean));

    // 2) Paneldeki mevcut ürünler
    dbUpdates = [];
    const res = await db.from('products').select('id, name, model_code, supplier_price, sale_price, cost_currency')
      .eq('user_id', userId).is('deleted_at', null).not('model_code', 'is', null).limit(5000);
    (res.data || []).forEach(p => {
      if (previewCodes.has(normCode(p.model_code))) return;
      const row = findRow(p.model_code, byNorm);
      if (!row) return;
      used.add(row);
      const it = { price: row.price, list_price: row.list_price };
      const newSale = calcPrice(it, r);
      const cur = (r.currency && r.currency !== 'auto') ? r.currency : (row.currency || p.cost_currency || 'TRY');
      if (Number(p.supplier_price) === row.price && Number(p.sale_price) === newSale) return;
      dbUpdates.push({ id: p.id, name: p.name, code: p.model_code, oldCost: Number(p.supplier_price) || 0, newCost: row.price, oldSale: Number(p.sale_price) || 0, newSale: newSale, cur: cur, selected: true });
    });

    unmatchedRows = fromFile ? [] : priceRows.filter(row => !used.has(row));
    renderFileResult(filled, fromFile);
    renderPreview();
  }

  function renderFileResult(filled, fromFile) {
    const box = document.getElementById('fileResult');
    box.style.display = 'block';
    const withPdfImg = items.filter(i => i.images.some(u => String(u).indexOf('data:') === 0)).length;
    const summary = fromFile
      ? fmt(t('fileSummaryNew'), { n: HS.number(items.length), u: HS.number(dbUpdates.length) })
      : fmt(t('fileSummary'), { n: HS.number(priceRows.length), p: HS.number(filled || 0), u: HS.number(dbUpdates.length), x: HS.number(unmatchedRows.length) });
    let h = '<div class="stat-line">' + summary + (withPdfImg ? fmt(t('fileImgs'), { n: HS.number(withPdfImg) }) : '') + '</div>';
    if (dbUpdates.length) {
      h += '<div style="margin-top:14px;font-weight:600;color:#fff;font-size:14px">' + esc(t('updTitle')) + '</div>' +
        '<div class="table-wrap" style="margin-top:8px"><table class="mini-table"><thead><tr><th></th><th>' + esc(t('thProduct')) + '</th><th>' + esc(t('thCode')) + '</th>' +
        '<th class="num">' + esc(t('thOldCost')) + '</th><th class="num">' + esc(t('thNewCost')) + '</th><th class="num">' + esc(t('thNewSale')) + '</th></tr></thead><tbody>' +
        dbUpdates.slice(0, 300).map((u, i) => '<tr><td><input type="checkbox" ' + (u.selected ? 'checked' : '') + ' onchange="dbUpdates[' + i + '].selected=this.checked;updBtnText()"></td>' +
          '<td>' + esc(u.name || '') + '</td><td>' + esc(u.code) + '</td>' +
          '<td class="num">' + esc(HS.money(u.oldCost, u.cur)) + '</td>' +
          '<td class="num ' + (u.newCost > u.oldCost ? 'up' : 'down') + '">' + esc(HS.money(u.newCost, u.cur)) + '</td>' +
          '<td class="num">' + (u.newSale ? esc(HS.money(u.newSale, u.cur)) : '–') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="row" style="margin-top:10px"><div class="spacer"></div><button class="btn-primary btn-small" id="updBtn" onclick="applyDbUpdates()"></button></div>';
    }
    if (unmatchedRows.length) {
      h += '<details><summary>' + esc(fmt(t('unmatchedTitle'), { n: unmatchedRows.length })) + '</summary>' +
        '<div class="spec-list" style="max-height:220px;overflow:auto">' + unmatchedRows.slice(0, 200).map(u => '<div><span>' + esc(u.code || '–') + '</span> · ' + esc(u.name || '') + ' · ' + esc(HS.money(u.price, u.currency || 'TRY')) + '</div>').join('') + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="btn-secondary btn-small" onclick="addUnmatched()">' + esc(fmt(t('addUnmatched'), { n: unmatchedRows.length })) + '</button></div></details>';
    }
    box.innerHTML = h;
    updBtnText();
  }
  function updBtnText() {
    const b = document.getElementById('updBtn');
    if (!b) return;
    const n = dbUpdates.filter(u => u.selected).length;
    b.textContent = fmt(t('updBtn'), { n: n });
    b.disabled = !n;
  }

  function addUnmatched() {
    const list = unmatchedRows.filter(u => u.code || u.name).map(rowToItem);
    addItems(list);
    toast(fmt(t('addedUnmatched'), { n: list.length }));
    unmatchedRows = [];
    renderFileResult(null);
    renderPreview();
    autoComplete();
  }

  async function applyDbUpdates() {
    const sel = dbUpdates.filter(u => u.selected);
    if (!sel.length) return;
    const b = document.getElementById('updBtn');
    b.disabled = true;
    let ok = 0, fail = 0, lastErr = '';
    for (const u of sel) {
      const up = await db.from('products').update({ supplier_price: u.newCost, sale_price: u.newSale || u.oldSale, cost_currency: u.cur }).eq('id', u.id);
      if (up.error) { fail++; lastErr = up.error.message; continue; }
      if (u.newSale) {
        let price = u.newSale;
        if (u.cur !== 'TRY') { const c = await HS.convert(price, u.cur, 'TRY'); if (c != null) price = Math.round(c * 100) / 100; }
        await db.from('listings').update({ price: price }).eq('product_id', u.id).eq('marketplace_code', 'own_store');
      }
      ok++;
    }
    dbUpdates = dbUpdates.filter(u => !u.selected);
    renderFileResult(null);
    toast(fail ? fmt(t('updFail'), { n: ok, e: fail, m: lastErr }) : fmt(t('updDone'), { n: ok }), !!fail);
  }

  // ---------- Eksikleri üretici sitesinden tamamla (otomatik) ----------
  async function callLookup(body) {
    const res = await fetch(HS.SUPABASE_URL + '/functions/v1/product-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ language: HS.lang }, body))
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }
  function normSiteC(v) {
    const s = String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[\/?#\s]/)[0];
    return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(s) ? s : '';
  }
  // Site bilgisini kurallara ekle (diğer kural ayarlarına dokunmadan)
  async function saveRulesPatch(patch) {
    try {
      const cur = await db.from('import_rules').select('rules').eq('user_id', userId).maybeSingle();
      const r = Object.assign({}, (cur.data && cur.data.rules) || {}, patch);
      await db.from('import_rules').upsert({ user_id: userId, rules: r, updated_at: new Date().toISOString() });
    } catch (e) { console.warn('rules patch', e); }
  }
  function nameWordCount(s) { return String(s || '').split(/\s+/).filter(w => w.length > 2).length; }
  function needsLookup(it) {
    return !it.lookupDone && (normCode(it.model_code).length >= 3 || nameWordCount(it.name) >= 2) && (!it.images.length || !it.specs.length);
  }
  // Markanın resmi sitesi (marka başına bir kez bulunur; satıcının elle verdiği site önceliklidir)
  async function siteForBrand(brand, samples) {
    const key = String(brand || '').trim().toLowerCase();
    if (!key) return lookupSite;
    if (siteByBrand.has(key)) return siteByBrand.get(key);
    let site = '';
    try { const res = await callLookup({ action: 'site', brand: brand, hint: sourceUrl, samples: samples }); site = normSiteC(res.site); } catch (e) { console.warn('site', e); }
    siteByBrand.set(key, site);
    return site;
  }
  function setImages(it, images, kind, url) {
    if (it.images.length || !Array.isArray(images) || !images.length) return false;
    it.images = images.slice(0, 12);
    it.imgSrc = { kind: kind, url: url || '' };
    it.lkFilled = it.lkFilled || {};
    it.lkFilled.images = true;
    return true;
  }
  // Görsel tamamlama ürünler eklendikten sonra arka planda yapılır; satıcı beklemez
  function renderBgNote() {
    const n = items.filter(i => i.selected && !i.exists && (!i.images.length || !i.specs.length)).length;
    const el = document.getElementById('lookupBar');
    if (!n) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'block';
    el.innerHTML = fmt(t('bgNote'), { n: HS.number(n) });
  }
  function renderLookupBar() {
    const el = document.getElementById('lookupBar');
    const s = lookupState;
    if (!s) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'block';
    const site = esc(lookupSite);
    let h = '';
    if (s.mode === 'finding') h = esc(t('lkFindingSite'));
    else if (s.mode === 'running') h = fmt(t('lkRunning'), { site: site, d: HS.number(s.d), t: HS.number(s.t) });
    else if (s.mode === 'done') h = fmt(t('lkDone'), { site: site, f: HS.number(s.f), n: HS.number(s.n) }) + ' · <a onclick="changeSite()">' + esc(t('lkChange')) + '</a>';
    else if (s.mode === 'stopped') h = fmt(t('lkStopped'), { site: site, f: HS.number(s.f) }) + ' · <a onclick="changeSite()">' + esc(t('lkChange')) + '</a>';
    else if (s.mode === 'nosite') h = esc(t('lkNoSite')) + ' <a onclick="changeSite()">' + esc(t('lkSetSite')) + '</a>';
    el.innerHTML = h;
  }
  function mergeLookup(it, x, url, kind) {
    it.lkFilled = it.lkFilled || {};
    setImages(it, x.images, kind || 'brand_site', url);
    if (!it.specs.length && Array.isArray(x.specs) && x.specs.length) { it.specs = x.specs.slice(0, 80); it.lkFilled.specs = true; }
    if (!it.description && x.description) { it.description = x.description; it.lkFilled.description = true; }
    if (!it.brand && x.brand) { it.brand = x.brand; it.lkFilled.brand = true; }
    if (!it.category && x.category) { it.category = x.category; it.lkFilled.category = true; }
    if (!it.url && url) { it.url = url; it.lkFilled.url = true; }
  }
  // Önceki siteden gelen bilgileri geri al (site değiştirilince)
  function undoLookup(it) {
    const f = it.lkFilled || {};
    if (f.images) { it.images = []; it.imgSrc = null; }
    if (f.specs) it.specs = [];
    if (f.description) it.description = '';
    if (f.brand) it.brand = '';
    if (f.category) it.category = '';
    if (f.url) it.url = '';
    it.lkFilled = {};
    it.lookupDone = false;
    it.lookupFound = false;
  }

  async function autoComplete() {
    if (running) return;
    const todo = items.filter(needsLookup);
    if (!todo.length) return;
    running = true; stopFlag = false;
    document.getElementById('stopBtn').style.display = '';
    try {
      // 1) Site bilinmiyorsa kendimiz bulalım
      if (!lookupSite) {
        lookupState = { mode: 'finding' }; renderLookupBar();
        const r = rules();
        const brand = r.brand || (items.find(i => i.brand) || {}).brand || '';
        try {
          const res = await callLookup({ action: 'site', brand: brand, hint: sourceUrl, samples: todo.slice(0, 8).map(i => ({ code: i.model_code, name: i.name })) });
          const site = normSiteC(res.site);
          if (site) { lookupSite = site; lookupTpl = ''; lookupSkip = false; await saveRulesPatch({ site: site, siteSearch: '' }); }
        } catch (e) { console.warn('site', e); }
      }
      if (!lookupSite) { lookupState = { mode: 'nosite' }; renderLookupBar(); }

      // 2) Her ürünü sitede ara (aynı anda 4 ürün)
      const r = rules();
      let idx = 0, d = 0, f = 0, noTpl = 0;
      const total = todo.length;
      lookupState = { mode: 'running', d: 0, t: total }; renderLookupBar();
      const worker = async () => {
        while (idx < total && !stopFlag) {
          const it = todo[idx++];
          const brand = it.brand || r.brand || '';
          try {
            // 1) Markanın resmi sitesi: önce basın / medya kiti, sonra ürün sayfası (görsel + teknik özellik)
            const bSite = brand && brand.toLowerCase() !== String(r.brand || '').toLowerCase()
              ? await siteForBrand(brand, [{ code: it.model_code, name: it.name }]) : lookupSite;
            if (bSite) {
              if (!it.images.length) {
                try {
                  const m = await callLookup({ action: 'media', site: bSite, brand: brand, code: it.model_code, name: it.name });
                  if (m.found) setImages(it, m.images, 'brand_media_kit', m.url);
                } catch (e) { console.warn('media', e); }
              }
              const res = await callLookup({
                action: 'find', site: bSite, brand: brand, code: it.model_code, name: it.name,
                searchTpl: bSite === lookupSite ? lookupTpl : '', skipSiteSearch: bSite === lookupSite ? lookupSkip : false
              });
              if (bSite === lookupSite) {
                if (res.searchTpl && res.searchTpl !== lookupTpl) { lookupTpl = res.searchTpl; saveRulesPatch({ siteSearch: lookupTpl }); }
                if (!lookupTpl && ++noTpl >= 3) lookupSkip = true; // sitenin araması çalışmıyor, sadece internet aramasıyla devam
              }
              let found = res.found && res.item ? res : null;
              // İnternet araması değişken sonuç verebiliyor: bulunamazsa bir kez daha dene
              if (!found && !it.images.length) {
                const again = await callLookup({ action: 'find', site: bSite, brand: brand, code: it.model_code, name: it.name, skipSiteSearch: true });
                if (again.found && again.item) found = again;
              }
              if (found) { mergeLookup(it, found.item, found.url, 'brand_site'); it.lookupFound = true; }
            }
            // 2) Toptancının sitesi (dosyada yazıyorsa)
            if (!it.images.length && docSite && docSite !== bSite) {
              const w = await callLookup({ action: 'find', site: docSite, brand: brand, code: it.model_code, name: it.name, skipSiteSearch: false });
              if (w.found && w.item) { mergeLookup(it, w.item, w.url, 'wholesaler'); it.lookupFound = true; }
            }
            // 3) CJ / AliExpress eşleşmesi
            if (!it.images.length) {
              const mk = await callLookup({ action: 'market', brand: brand, code: it.model_code, name: it.name });
              if (mk.found) { setImages(it, mk.images, mk.kind, mk.url); it.lookupFound = true; }
            }
            it.lookupDone = true;
            it.imageMissing = !it.images.length;
            if (it.lookupFound) f++;
          } catch (e) {
            console.warn('lookup', it.model_code, e);
            it.lookupDone = true; it.lookupFound = !!it.images.length; it.imageMissing = !it.images.length;
          }
          d++;
          lookupState = { mode: 'running', d: d, t: total }; renderLookupBar();
          if (d % 4 === 0) renderPreview();
        }
      };
      await Promise.all(Array.from({ length: 4 }, worker));
      const nf = todo.filter(i => i.lookupDone && !i.lookupFound).length;
      lookupState = stopFlag ? { mode: 'stopped', f: f } : { mode: 'done', f: f, n: nf };
      renderLookupBar();
    } finally {
      running = false;
      document.getElementById('stopBtn').style.display = 'none';
      renderPreview();
    }
  }

  async function changeSite() {
    if (running) return;
    const v = prompt(t('lkAsk'), lookupSite || '');
    if (v == null) return;
    const site = normSiteC(v);
    if (!site) { toast(t('lkBadSite'), true); return; }
    if (site !== lookupSite) {
      lookupSite = site; lookupTpl = ''; lookupSkip = false;
      await saveRulesPatch({ site: site, siteSearch: '' });
      items.forEach(it => { if (it.lookupDone) undoLookup(it); });
    } else {
      items.forEach(it => { if (it.lookupDone && !it.lookupFound) undoLookup(it); });
    }
    renderPreview();
    await autoComplete();
  }

  // ---------- Aktar ----------
  function fullDescription(it) {
    let d = (it.description || '').trim();
    if (it.specs.length) {
      d += (d ? '\n\n' : '') + t('specsHeader') + ':\n' + it.specs.map(s => '• ' + s.k + ': ' + s.v).join('\n');
    }
    return d.slice(0, 8000);
  }

  async function dataUrlToBlob(u) { const r = await fetch(u); return await r.blob(); }
  // PDF'ten gelen (data:) resimleri depoya yükleyip gerçek adrese çevirir
  async function uploadPdfImages(list) {
    const todo = [];
    list.forEach(it => it.images.forEach((u, j) => { if (String(u).indexOf('data:') === 0) todo.push({ it: it, j: j }); }));
    let done = 0;
    for (const x of todo) {
      done++;
      document.getElementById('importText').textContent = fmt(t('uploadingImgs'), { d: done, t: todo.length });
      try {
        const blob = await dataUrlToBlob(x.it.images[x.j]);
        const path = userId + '/pdf/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        const up = await db.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
        if (up.error) throw up.error;
        x.it.images[x.j] = db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
      } catch (e) { console.warn('resim yüklenemedi', e); x.it.images[x.j] = null; }
    }
    list.forEach(it => { it.images = it.images.filter(Boolean); });
  }

  async function doImport() {
    const sel = items.filter(i => i.selected);
    if (!sel.length) return;
    if (!document.getElementById('consentChk').checked) { toast(t('needConsent'), true); return; }
    const aeSrcEl = document.querySelector('input[name="aeSrc"]:checked');
    if (sel.some(i => i.source_platform === 'aliexpress') && !aeSrcEl) { toast(t('needAeSource'), true); return; }
    const aeDropship = !!aeSrcEl && aeSrcEl.value === 'aliexpress';
    if (!imageTermsAccepted) {
      if (!document.getElementById('imageTermsChk').checked) { toast(t('needImageTerms'), true); return; }
      const up = await db.from('user_profiles').update({ image_terms_accepted_at: new Date().toISOString(), image_terms_text: t('imageTerms') }).eq('user_id', userId).select('user_id');
      if (!up.error && (!up.data || !up.data.length)) {
        await db.from('user_profiles').insert({ user_id: userId, image_terms_accepted_at: new Date().toISOString(), image_terms_text: t('imageTerms') });
      }
      imageTermsAccepted = true;
    }
    const dupN = sel.filter(i => i.exists).length;
    if (dupN && !confirm(fmt(t('confirmDup'), { n: dupN }))) return;
    const r = rules();
    const publish = document.getElementById('publishChk').checked;
    const sync = document.getElementById('syncChk').checked;
    const syncHours = Number(document.getElementById('syncHours').value) === 6 ? 6 : 24;
    const btn = document.getElementById('importBtn');
    btn.disabled = true;
    const resBox = document.getElementById('resultBox');
    resBox.style.display = 'none';
    document.getElementById('importProgress').style.display = 'block';

    // Kullanım hakkı onayı kaydı
    await db.from('import_consents').insert({ user_id: userId, source_url: sourceUrl, item_count: sel.length, consent_text: t('consentLog') });

    await uploadPdfImages(sel);

    let added = 0, failed = 0, lastErr = '', imgErr = '';
    const addedIds = [];
    const needJobs = [];   // görseli / özelliği eksik eklenen ürünler
    const CHUNK = 40;
    for (let i = 0; i < sel.length; i += CHUNK) {
      const chunk = sel.slice(i, i + CHUNK);
      document.getElementById('importText').textContent = fmt(t('importing'), { d: HS.number(Math.min(i + chunk.length, sel.length)), t: HS.number(sel.length) });
      document.getElementById('importBar').style.width = ((i + chunk.length) / sel.length * 100) + '%';
      try {
        const rows = chunk.map(it => ({
          user_id: userId,
          name: it.name.slice(0, 300),
          supplier_price: it.price > 0 ? it.price : 0,
          weight_kg: 0,
          platform: null,
          commission_rate: 0,
          sale_price: it.newPrice > 0 ? it.newPrice : 0,
          generated_title: it.name.slice(0, 300),
          generated_description: fullDescription(it),
          // Ürün kaynağı: yalnız satıcı "AliExpress" derse tedarikçili (sipariş otomatik AliExpress / CJ eşdeğerinden);
          // diğer her şey "Kendi stoğum" (supplier boş)
          supplier: aeDropship && it.source_platform === 'aliexpress' && it.source_item_id ? 'aliexpress' : null,
          supplier_item_id: aeDropship && it.source_platform === 'aliexpress' ? (it.source_item_id || null) : null,
          supplier_cost: aeDropship && it.source_platform === 'aliexpress' && it.price > 0 ? it.price : null,
          image_url: it.images[0] || null,
          cost_currency: itemCurrency(it, r),
          content_language: 'tr',
          store_visible: publish,
          specs: it.specs.length ? it.specs : null,
          image_missing: !it.images.length,
          source_url: it.url || null,
          source_platform: it.source_platform || (it.url ? 'web' : null),
          source_item_id: it.source_item_id || null,
          source_sync: !!(sync && it.url),
          source_sync_hours: syncHours,
          stock_qty: Number.isFinite(it.stock) && it.stock !== null ? it.stock : null,
          model_code: it.model_code || null,
          brand: r.brand || it.brand || null
        }));
        const ins = await db.from('products').insert(rows).select('id, source_url, model_code, name');
        if (ins.error) throw ins.error;
        const created = ins.data || [];
        // Oluşan kayıtları ürünlerle eşleştir
        const pairs = chunk.map((it, k) => {
          let row = created[k];
          if (!row || row.name !== rows[k].name) row = created.find(c => c.name === rows[k].name && (c.source_url || null) === rows[k].source_url && (c.model_code || null) === rows[k].model_code);
          return row ? { it: it, id: row.id } : null;
        }).filter(Boolean);

        // Görseller
        const imgRows = [];
        pairs.forEach(p => p.it.images.slice(0, 12).forEach((u, pos) => imgRows.push({
          product_id: p.id, user_id: userId, url: u, position: pos, source: 'supplier',
          source_kind: (p.it.imgSrc && p.it.imgSrc.kind) || null,
          source_url: (p.it.imgSrc && (p.it.imgSrc.url || p.it.imgSrc.file)) || null
        })));
        if (imgRows.length) {
          const ir = await db.from('product_images').insert(imgRows);
          if (ir.error) { imgErr = ir.error.message; console.warn('product_images', ir.error); }
        }

        // Seçenekler (beden, renk...): varsayılan seçeneğe ek olarak her biri ayrı kayıt
        const varRows = [];
        pairs.forEach(p => (p.it.variants || []).slice(0, 100).forEach((v, k) => {
          if (!v || !v.attributes || !Object.keys(v.attributes).length) return;
          varRows.push({
            product_id: p.id, user_id: userId, sku: 'HS-' + p.id + '-' + (k + 1),
            supplier_variant_id: v.supplier_variant_id || null, supplier_sku: v.sku || null,
            attributes: v.attributes, cost: v.price > 0 ? v.price : null, cost_currency: itemCurrency(p.it, r),
            stock_qty: Number.isFinite(v.stock) && v.stock !== null ? v.stock : null,
            stock_status: v.stock === 0 ? 'tukendi' : null, image_url: v.image || null, is_default: false, is_active: true
          });
        }));
        for (let k = 0; k < varRows.length; k += 500) {
          const vr = await db.from('product_variants').insert(varRows.slice(k, k + 500));
          if (vr.error) { imgErr = vr.error.message; console.warn('product_variants', vr.error); }
        }

        // Kendi mağazada yayın
        if (publish && pairs.length) {
          const listingRows = [];
          for (const p of pairs) {
            let price = p.it.newPrice > 0 ? p.it.newPrice : 0;
            const cur = itemCurrency(p.it, r);
            if (cur !== 'TRY' && price > 0) {
              const conv = await HS.convert(price, cur, 'TRY');
              price = conv != null ? Math.round(conv * 100) / 100 : price;
            }
            listingRows.push({
              user_id: userId, product_id: p.id, source_product_id: p.id,
              marketplace_code: 'own_store', language: 'tr', currency: 'TRY',
              title: p.it.name.slice(0, 300), description: fullDescription(p.it), keywords: [],
              category_key: null, price: price, commission_pct: 0, vat_payer: 'seller',
              price_mode: 'manual', status: 'published', published_at: new Date().toISOString()
            });
          }
          const li = await db.from('listings').insert(listingRows).select('id, product_id, price, status');
          if (li.error) throw li.error;
          const ids = pairs.map(p => p.id);
          const vr = await db.from('product_variants').select('id, product_id').in('product_id', ids).eq('is_default', true);
          const vmap = {};
          (vr.data || []).forEach(v => { vmap[v.product_id] = v.id; });
          const lvRows = (li.data || []).filter(l => vmap[l.product_id]).map(l => ({ listing_id: l.id, variant_id: vmap[l.product_id], user_id: userId, price: l.price, status: l.status }));
          if (lvRows.length) await db.from('listing_variants').insert(lvRows);
        }
        // AliExpress ürünleri için CJ eşdeğeri araması arka planda başlasın (saatlik görev de tekrar dener)
        pairs.filter(p => aeDropship && p.it.source_platform === 'aliexpress').forEach(p => {
          fetch(HS.SUPABASE_URL + '/functions/v1/cj-alt-match', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ productId: p.id })
          }).catch(() => {});
        });
        pairs.forEach(p => { if (!p.it.images.length || !p.it.specs.length) needJobs.push(p.id); });
        added += pairs.length;
        pairs.forEach(p => addedIds.push(p.id));
        pairs.forEach(p => { p.it.selected = false; p.it.exists = true; });
      } catch (e) {
        failed += chunk.length;
        lastErr = e.message || String(e);
        console.error(e);
      }
    }

    // Arka plan görsel tamamlama işleri
    let bgN = 0;
    if (needJobs.length) {
      try {
        const b = await db.from('image_job_batches').insert({ user_id: userId, total: needJobs.length }).select('id').single();
        if (b.error) throw b.error;
        for (let i = 0; i < needJobs.length; i += 500) {
          const jr = await db.from('image_jobs').insert(needJobs.slice(i, i + 500).map(id => ({
            batch_id: b.data.id, user_id: userId, product_id: id, wholesaler_site: docSite || null
          })));
          if (jr.error) throw jr.error;
        }
        bgN = needJobs.length;
      } catch (e) { console.warn('image_jobs', e); }
    }

    document.getElementById('importProgress').style.display = 'none';
    resBox.style.display = 'block';
    if (failed) {
      resBox.className = 'result err';
      resBox.innerHTML = esc(fmt(t('importPartial'), { n: added, e: failed, m: lastErr })) + ' <a href="dashboard.html">' + esc(t('goPanel')) + '</a>';
    } else {
      resBox.className = 'result ok';
      resBox.innerHTML = esc(fmt(t('importDone'), { n: HS.number(added) })) + ' <a href="dashboard.html">' + esc(t('goPanel')) + '</a>';
    }
    if (imgErr) {
      resBox.innerHTML += '<div style="color:#e6c96a;margin-top:6px">' + esc(t('imgSaveErr') + imgErr) + '</div>';
    }
    if (bgN) resBox.innerHTML += '<div style="margin-top:6px">' + fmt(t('bgStarted'), { n: HS.number(bgN) }) + '</div>';
    if (addedIds.length) resBox.innerHTML += await sendToMarketplaces(addedIds);
    renderBgNote();
    renderPreview();
  }

  window.addEventListener('beforeunload', (e) => {
    if (running) { e.preventDefault(); e.returnValue = t('confirmLeave'); return t('confirmLeave'); }
  });
  document.getElementById('srcUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') startFetch(); });

  // ---------- Başlat ----------
  (async function start() {
    applyStatic();
    const ctx = await HS.init();
    if (!ctx) return;
    userId = ctx.user.id;
    document.getElementById('userEmail').textContent = ctx.user.email || '';
    document.getElementById('stopBtn').style.display = 'none';
    applyStatic();
    await loadRules();
    loadChannels();
    try {
      const pr = await db.from('user_profiles').select('image_terms_accepted_at').eq('user_id', userId).maybeSingle();
      imageTermsAccepted = !!(pr.data && pr.data.image_terms_accepted_at);
    } catch (e) { imageTermsAccepted = false; }
    // HIZ: kullanım hakkı onayını daha önce verdiyse işaretli gelir (her yükleme import_consents'e yine yazılır)
    try {
      const ic = await db.from('import_consents').select('id').eq('user_id', userId).limit(1);
      if (ic.data && ic.data.length) document.getElementById('consentChk').checked = true;
    } catch (e) { /* işaretsiz kalır */ }
    renderPreview();
  })();

  window.addEventListener('hs:langchange', () => { applyStatic(); renderPreview(); });
</script>
<script>
  // ---------- 📥 PDF + link ile yükleme (catalog-import; asistanla aynı motor) ----------
  (function () {
    const t = HS.t, esc = HS.escapeHtml, db = HS.db;
    const ACTIVE = ['parsing', 'merging', 'saving', 'publishing'];
    const MAX = 20 * 1024 * 1024;
    let plFileObj = null, plTimer = null, plOpen = null, plUid = null;
    const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
    const money = (v, c) => { const n = Number(v); if (!(n > 0)) return '–'; try { return new Intl.NumberFormat(HS.lang === 'en' ? 'en-US' : 'tr-TR', { style: 'currency', currency: c || 'TRY' }).format(n); } catch (e) { return n.toFixed(2) + ' ' + (c || ''); } };
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u || ''; } };
    async function call(body) {
      const tok = (await db.auth.getSession()).data.session.access_token;
      const r = await fetch(HS.SUPABASE_URL + '/functions/v1/catalog-import', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
        body: JSON.stringify({ ...body, userAccessToken: tok }) });
      return await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
    }
    function msg(s, err) { const el = document.getElementById('plMsg'); el.textContent = s || ''; el.style.color = err ? '#f28b8b' : ''; }
    window.plPicked = function (f) {
      document.getElementById('plFile').value = '';
      if (!f) return;
      if (!/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)) { msg(t('plOnlyPdf'), true); return; }
      if (f.size > MAX) { msg(t('plTooBig'), true); return; }
      plFileObj = f; msg('');
      document.getElementById('plFileName').textContent = f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)';
    };
    window.plStart = async function () {
      const url = document.getElementById('plUrl').value.trim();
      if (!plFileObj && !url) { msg(t('plNeedInput'), true); return; }
      const btn = document.getElementById('plStartBtn');
      btn.disabled = true;
      try {
        if (!plUid) plUid = (await db.auth.getUser()).data.user.id;
        let pdfPath = null;
        if (plFileObj) {
          msg(t('plUploading'));
          pdfPath = plUid + '/panel/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.pdf';
          const up = await db.storage.from('catalog-uploads').upload(pdfPath, plFileObj, { contentType: 'application/pdf', upsert: false });
          if (up.error) throw new Error(up.error.message);
        }
        const mEl = document.getElementById('rMargin');
        const r = await call({ action: 'start', pdfPath, pdfName: plFileObj ? plFileObj.name : null, url: url || null, margin: mEl ? Number(mEl.value) : null });
        if (!r.ok) throw new Error(r.error || 'Hata');
        msg(t('plStarted'));
        plFileObj = null; document.getElementById('plFileName').textContent = ''; document.getElementById('plUrl').value = '';
        plOpen = r.importId;
        await plLoad();
      } catch (e) { msg(String(e.message || e), true); }
      btn.disabled = false;
    };
    window.plPublish = async function (id) {
      msg(t('plPublishing'));
      const r = await call({ action: 'publish', importId: id });
      if (!r.ok) { msg(r.error || 'Hata', true); return; }
      msg(''); plLoad();
    };
    window.plToggle = function (id) { plOpen = plOpen === id ? null : id; plLoad(); };
    window.plLoad = async function () {
      clearTimeout(plTimer);
      const { data } = await db.from('catalog_imports').select('*').order('created_at', { ascending: false }).limit(20);
      const list = data || [];
      const box = document.getElementById('plHistory');
      if (!list.length) box.innerHTML = '<div class="muted">' + esc(t('plNoHistory')) + '</div>';
      else box.innerHTML = '<div class="table-wrap"><table class="mini-table" id="plTable"><thead><tr><th>' + esc(t('plThDate')) + '</th><th>' + esc(t('plThSource')) + '</th><th>' + esc(t('plThFrom')) +
        '</th><th>' + esc(t('plThStatus')) + '</th><th>' + esc(t('plThCounts')) + '</th><th></th></tr></thead><tbody>' + list.map((m) => {
          const from = [m.pdf_name ? '📄 ' + esc(m.pdf_name) : '', m.link_url ? '🔗 ' + esc(host(m.link_url)) : ''].filter(Boolean).join('<br>');
          const st = esc(t('plSt_' + m.status)) + (m.status === 'parsing' && m.pdf_chunks ? ' (' + m.pdf_chunks_done + '/' + m.pdf_chunks + ')' : '') + (m.error && m.status === 'failed' ? '<div class="muted" style="font-size:11px">' + esc(m.error) + '</div>' : '');
          return '<tr data-imp="' + m.id + '"><td style="white-space:nowrap">' + esc(new Date(m.created_at).toLocaleString(HS.lang === 'en' ? 'en-GB' : 'tr-TR')) + '</td><td>' + esc(t('plSrc_' + m.source)) + '</td><td>' + from + '</td><td>' + st + '</td><td>' +
            esc(fmt(t('plCounts'), m)) + '</td><td style="white-space:nowrap"><button class="btn-secondary btn-small" onclick="plToggle(\'' + m.id + '\')">' + esc(t('plDetail')) + '</button>' +
            (m.status === 'ready' ? ' <button class="btn-primary btn-small" onclick="plPublish(\'' + m.id + '\')">' + esc(t('plPublish')) + '</button>' : '') + '</td></tr>' +
            (m.id === plOpen ? '<tr class="pl-detail-row"><td colspan="6" style="background:#0b0e15;padding:10px 12px"><div id="plDetail"></div></td></tr>' : '');
        }).join('') + '</tbody></table></div>';
      await plDetail(list.find((m) => m.id === plOpen));
      if (list.some((m) => ACTIVE.includes(m.status))) plTimer = setTimeout(plLoad, 3000);
      else if (document.getElementById('plMsg').textContent === t('plStarted')) msg('');
    };
    async function plDetail(m) {
      const box = document.getElementById('plDetail');
      if (!m || !box) return;
      const { data } = await db.from('catalog_import_rows').select('id, source, final, page, name, model_code, barcode, cost, sale_price, currency, stock, images, status, problems, error, product_id, variants, match_by')
        .eq('import_id', m.id).or('final.eq.true,status.eq.error').order('idx').limit(500);
      const rows = data || [];
      box.innerHTML = '<div class="table-wrap"><table class="mini-table" id="plRows"><thead><tr><th>#</th><th>' + esc(t('plThProduct')) + '</th><th>' + esc(t('plThCode')) + '</th><th class="num">' + esc(t('plThPrice')) +
        '</th><th class="num">' + esc(t('plThStock')) + '</th><th>' + esc(t('plThImg')) + '</th><th>' + esc(t('plThNote')) + '</th></tr></thead><tbody>' + rows.map((r, i) => {
          const img = (r.images || [])[0];
          const note = r.status === 'error' ? '<span style="color:#f28b8b">' + esc(r.error || t('plRow_error')) + '</span>'
            : esc(t('plRow_' + r.status)) + ((r.problems || []).length ? '<div class="muted" style="font-size:11px">' + esc((r.problems || []).join(' · ')) + '</div>' : '')
              + (r.match_by ? '<div class="muted" style="font-size:11px">🔗 ' + esc(fmt(t('plMatch'), { by: t('plBy_' + r.match_by) })) + '</div>' : '');
          const vars = (r.variants || []).length > 1 ? ' <span class="muted">(' + r.variants.length + ')</span>' : '';
          return '<tr class="' + (r.status === 'error' ? 'row-error' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r.name || '') + vars +
            (r.product_id ? ' <a href="urun-duzenle.html?id=' + r.product_id + '" style="font-size:11px;color:#1D9E75">' + esc(t('plOpenProduct')) + '</a>' : '') + '</td><td>' + esc([r.model_code, r.barcode].filter(Boolean).join(' · ')) +
            '</td><td class="num">' + money(r.cost, r.currency) + ' → ' + money(r.sale_price, r.currency) + '</td><td class="num">' + (r.stock != null ? r.stock : '–') + '</td><td>' +
            (img ? '<img src="' + esc(img) + '" style="width:40px;height:40px;object-fit:cover;border-radius:6px">' : '–') + '</td><td>' + note + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    // Asistandaki "Panelde kontrol et" bağlantısı: ?import=<id>
    const q = new URLSearchParams(location.search).get('import');
    window.addEventListener('hs:langchange', () => { const u = document.getElementById('plUrl'); if (u) u.placeholder = t('plUrlPh'); if (document.getElementById('pdfLinkPanel').style.display !== 'none') plLoad(); });
    (async function () {
      // Oturum ana betikte (HS.init) açılır; burada yalnız oturumun hazır olmasını bekle
      for (let i = 0; i < 50 && !HS.user; i++) await new Promise((r) => setTimeout(r, 200));
      document.getElementById('plUrl').placeholder = t('plUrlPh');
      if (q) { plOpen = q; setSrc('pdflink'); }
    })();
  })();
</script>
