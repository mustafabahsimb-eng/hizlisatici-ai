<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seltigo - Toplu Ürün Yükleme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821; gap: 12px; flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; max-width: 700px; line-height: 1.5; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }

  .step { background: #141821; border: 1px solid #232838; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .step.disabled { opacity: .45; pointer-events: none; }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .step-num { width: 26px; height: 26px; border-radius: 50%; background: #123222; color: #6ee7b7; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-size: 16px; font-weight: 600; color: #fff; }
  .hint { font-size: 12px; color: #9aa3b2; line-height: 1.6; margin-top: 8px; }
  .muted { color: #6b7385; font-size: 12px; }

  .src-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .src-tab { background: #0d0f16; border: 1px solid #2a3040; color: #9aa3b2; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .src-tab.active { border-color: #1D9E75; color: #fff; background: #123222; }
  .src-tab:disabled { opacity: .5; cursor: not-allowed; }
  .drop { border: 2px dashed #2a3040; border-radius: 12px; padding: 26px 16px; text-align: center; color: #9aa3b2; font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: #1D9E75; background: #0f1a16; color: #fff; }
  .drop b { color: #fff; }
  .file-result { margin-top: 14px; background: #11151d; border: 1px solid #232838; border-radius: 12px; padding: 14px; display: none; }
  .file-result .stat-line { font-size: 14px; color: #e6e8ee; line-height: 1.7; }
  .file-result .stat-line b { color: #6ee7b7; }
  .up { color: #f28b8b; } .down { color: #6ee7b7; }
  details summary { cursor: pointer; color: #9aa3b2; font-size: 13px; margin-top: 10px; }
  .mini-table td, .mini-table th { padding: 7px 10px; font-size: 12px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  input[type=text], input[type=url], input[type=number], select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3040;
    background: #0d0f16; color: #e6e8ee; font-size: 14px; font-family: inherit;
  }
  input.grow { flex: 1; min-width: 240px; }
  .rules-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .field label { display: block; font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }
  .field input, .field select { width: 100%; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c3c9d4; cursor: pointer; line-height: 1.5; }
  .chk input { accent-color: #1D9E75; width: 16px; height: 16px; flex-shrink: 0; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 10px 18px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-secondary {
    background: transparent; color: #c3c9d4; border: 1px solid #2a3040; padding: 10px 16px;
    border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .btn-small { padding: 6px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .progress { margin-top: 14px; display: none; }
  .bar { height: 8px; background: #1c212c; border-radius: 6px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: #1D9E75; width: 0; transition: width .3s; }
  .progress-text { font-size: 13px; color: #c3c9d4; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: #0d0f16; border: 1px solid #2a3040; color: #9aa3b2; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip.active { border-color: #1D9E75; color: #fff; background: #123222; }
  .chip b { color: #fff; }

  .table-wrap { border: 1px solid #232838; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7385; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #232838; white-space: nowrap; background: #11151d; }
  td { padding: 10px 12px; border-bottom: 1px solid #1c212c; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: #1c212c; display: block; }
  .thumb-empty { width: 54px; height: 54px; border-radius: 8px; background: #1c212c; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .pname { color: #fff; font-weight: 600; line-height: 1.35; }
  .pmeta { font-size: 11px; color: #9aa3b2; margin-top: 3px; }
  .img-count { font-size: 11px; color: #9aa3b2; margin-top: 4px; text-align: center; }
  .img-src { font-size: 10px; color: #8b93a3; margin-top: 4px; max-width: 120px; overflow-wrap: anywhere; }
  .link-btn { background: none; border: none; color: #6ee7b7; font-size: 11px; padding: 4px 0 0; cursor: pointer; text-align: left; max-width: 120px; }
  .link-btn:hover { text-decoration: underline; }
  .spec-toggle { background: none; border: none; color: #6ee7b7; font-size: 12px; cursor: pointer; padding: 0; margin-top: 4px; }
  .spec-list { margin-top: 6px; font-size: 12px; color: #c3c9d4; line-height: 1.6; }
  .spec-list span { color: #9aa3b2; }
  .price-input { width: 110px; padding: 6px 8px; font-size: 13px; text-align: right; }
  .warn { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; display: inline-block; margin: 2px 2px 0 0; }
  .w-bad { background: #2a1414; color: #f28b8b; }
  .w-mid { background: #2a2410; color: #e6c96a; }
  .w-exist { background: #142230; color: #7db8e6; }
  .more-row { text-align: center; padding: 12px; }
  .lookup-bar { display: none; font-size: 13px; color: #c3c9d4; background: #11151d; border: 1px solid #232838; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; line-height: 1.6; }
  .lookup-bar b { color: #fff; }
  .lookup-bar a { color: #6ee7b7; cursor: pointer; text-decoration: underline; }

  .consent { background: #11151d; border: 1px solid #2a3040; border-radius: 10px; padding: 14px; margin: 16px 0; }
  .result { margin-top: 14px; font-size: 14px; line-height: 1.6; display: none; }
  .result.ok { color: #6ee7b7; }
  .result.err { color: #f28b8b; }
  .result a { color: #6ee7b7; }
  .empty-state { text-align: center; color: #9aa3b2; padding: 30px 20px; border: 1px dashed #232838; border-radius: 12px; font-size: 14px; line-height: 1.6; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1c212c; border: 1px solid #1D9E75; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 1000; display: none; max-width: 90%; text-align: center;
  }
  .toast.err { border-color: #e0554f; }

  @media (max-width: 800px) {
    .rules-grid { grid-template-columns: 1fr 1fr; }
    main { padding: 20px 16px 60px; }
  }
  @media (max-width: 520px) { .rules-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot">S</div><div class="logo-text">Seltigo</div></div>
  <div class="header-right">
    <span id="langSwitcherHost"></span>
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="HS.logout()" data-t="logout"></button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1 data-t="title"></h1>
      <div class="subtitle" data-t="subtitle"></div>
    </div>
    <a class="back-link" href="dashboard.html" data-t="back"></a>
  </div>

  <!-- 1) Kaynak -->
  <div class="step" id="step1">
    <div class="step-head"><div class="step-num">1</div><div class="step-title" data-t="s1Title"></div></div>
    <div class="src-tabs">
      <button class="src-tab active" id="tabLinkBtn" onclick="setSrc('link')" data-t="tabLink"></button>
      <button class="src-tab" id="tabFileBtn" onclick="setSrc('file')" data-t="tabFile"></button>
      <button class="src-tab" id="tabFolderBtn" onclick="setSrc('folder')" data-t="tabFolder"></button>
      <button class="src-tab" id="tabPdfLinkBtn" onclick="setSrc('pdflink')" data-t="tabPdfLink"></button>
    </div>
    <!-- PDF + link ile yükleme (WhatsApp / Telegram asistanıyla aynı motor: catalog-import) -->
    <div id="pdfLinkPanel" style="display:none">
      <div class="hint" data-t="plHint" style="margin-bottom:10px"></div>
      <input type="file" id="plFile" accept="application/pdf,.pdf" style="display:none" onchange="plPicked(this.files[0])">
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <button class="btn-secondary" onclick="document.getElementById('plFile').click()" data-t="plPick"></button>
        <span class="muted" id="plFileName"></span>
      </div>
      <div class="row" style="margin-top:10px">
        <input type="url" class="grow" id="plUrl" autocomplete="off">
      </div>
      <div class="hint" data-t="plMarginNote" style="margin-top:6px"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn-primary" id="plStartBtn" onclick="plStart()" data-t="plStart"></button>
        <span class="muted" id="plMsg"></span>
      </div>
      <h3 style="margin:22px 0 8px;font-size:15px" data-t="plHistory"></h3>
      <div id="plHistory"><div class="muted" data-t="plNoHistory"></div></div>
    </div>
    <div id="folderPanel" style="display:none">
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" onchange="onFolderPicked(this.files); this.value='';">
      <div class="row">
        <button class="btn-primary" id="folderPickBtn" onclick="document.getElementById('folderInput').click()" data-t="folderPick"></button>
        <span class="muted" id="folderName"></span>
      </div>
      <div class="hint" data-th="folderHint"></div>
      <div class="file-result" id="folderMsg"></div>
      <div id="folderPreview"></div>
      <div id="folderActions" style="display:none">
        <div class="row" style="margin-top:12px;gap:14px;flex-wrap:wrap">
          <label class="chk"><input type="radio" name="etsyMode" value="draft" checked> <span data-t="etsyDraft"></span></label>
          <label class="chk"><input type="radio" name="etsyMode" value="publish"> <span data-t="etsyPublish"></span></label>
        </div>
        <div class="hint" id="folderEtsyNote"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn-primary" id="folderSendBtn" onclick="sendFolder()" data-t="etsySend"></button>
          <span class="muted" id="folderProgress"></span>
        </div>
      </div>
    </div>
    <div id="linkPanel">
      <div class="row">
        <input type="url" class="grow" id="srcUrl" autocomplete="off">
        <button class="btn-primary" id="fetchBtn" onclick="startFetch()" data-t="fetchBtn"></button>
      </div>
      <div class="hint" data-th="s1Hint"></div>
    </div>
    <div id="filePanel" style="display:none">
      <input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls,.csv,.ods,.txt,image/*" style="display:none" onchange="onFilesPicked(this.files); this.value='';">
      <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()" data-th="dropText"></div>
      <div class="row" style="margin-top:12px">
        <label class="muted" data-t="vatLabel" style="font-size:13px;color:#c3c9d4"></label>
        <select id="vatSel">
          <option value="0" data-t="vat0"></option>
          <option value="20" data-t="vat20"></option>
          <option value="10" data-t="vat10"></option>
          <option value="1" data-t="vat1"></option>
        </select>
      </div>
      <div class="hint" data-th="fileHint"></div>
      <div class="file-result" id="fileResult"></div>
    </div>
    <div class="progress" id="progress">
      <div class="progress-text" id="progressText"></div>
      <div class="bar"><div id="progressBar"></div></div>
      <div class="row">
        <span class="muted" id="progressSub"></span>
        <div class="spacer"></div>
        <button class="btn-secondary btn-small" id="stopBtn" onclick="stopFetch()" data-t="stop"></button>
      </div>
    </div>
  </div>

  <!-- 2) Kurallar -->
  <div class="step" id="step2">
    <div class="step-head"><div class="step-num">2</div><div class="step-title" data-t="s2Title"></div></div>
    <div class="rules-grid">
      <div class="field">
        <label data-t="rPriceBase"></label>
        <select id="rPriceBase" onchange="onRulesChange()">
          <option value="cost" data-t="rBaseCost"></option>
          <option value="list" data-t="rBaseList"></option>
        </select>
      </div>
      <div class="field">
        <label data-t="rMargin"></label>
        <input type="number" id="rMargin" value="30" min="0" max="1000" step="1" oninput="onRulesChange()">
      </div>
      <div class="field">
        <label data-t="rRound"></label>
        <select id="rRound" onchange="onRulesChange()">
          <option value="none" data-t="rRoundNone"></option>
          <option value="1" data-t="rRound1"></option>
          <option value="5" data-t="rRound5"></option>
          <option value="10" data-t="rRound10"></option>
          <option value="99" data-t="rRound99"></option>
        </select>
      </div>
      <div class="field">
        <label data-t="rCurrency"></label>
        <select id="rCurrency" onchange="onRulesChange()">
          <option value="auto" data-t="rCurAuto"></option>
          <option value="TRY">TRY (₺)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>
      <div class="field">
        <label data-t="rCategory"></label>
        <input type="text" id="rCategory" maxlength="120" oninput="onRulesChange()">
      </div>
      <div class="field">
        <label data-t="rBrand"></label>
        <input type="text" id="rBrand" maxlength="80" oninput="onRulesChange()">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="muted" id="rulesMsg"></span>
      <div class="spacer"></div>
      <button class="btn-secondary btn-small" onclick="saveRules()" data-t="saveRules"></button>
    </div>
  </div>

  <!-- 3) Önizleme -->
  <div class="step disabled" id="step3">
    <div class="step-head"><div class="step-num">3</div><div class="step-title" data-t="s3Title"></div></div>
    <div class="lookup-bar" id="lookupBar"></div>
    <div id="previewBox"><div class="empty-state" data-t="noItems"></div></div>
  </div>

  <!-- 4) Aktar -->
  <div class="step disabled" id="step4">
    <div class="step-head"><div class="step-num">4</div><div class="step-title" data-t="s4Title"></div></div>
    <div class="consent">
      <label class="chk"><input type="checkbox" id="consentChk" onchange="updateImportBtn()"> <span data-t="consent"></span></label>
      <div id="aeSourceRow" style="display:none;margin-top:10px">
        <div style="font-size:13px;color:#c3c9d4;margin-bottom:6px" data-t="aeSourceQ"></div>
        <label class="chk" style="margin-right:18px"><input type="radio" name="aeSrc" value="aliexpress" onchange="updateImportBtn()"> <span data-t="aeSourceAe"></span></label>
        <label class="chk"><input type="radio" name="aeSrc" value="own" onchange="updateImportBtn()"> <span data-t="aeSourceOwn"></span></label>
      </div>
      <label class="chk" id="imageTermsRow" style="display:none;margin-top:8px"><input type="checkbox" id="imageTermsChk" onchange="updateImportBtn()"> <span data-t="imageTerms"></span></label>
    </div>
    <label class="chk" style="margin-bottom:8px"><input type="checkbox" id="publishChk" checked> <span data-t="publishStore"></span></label>
    <div id="chanRow" style="display:none;margin-bottom:12px">
      <div style="font-size:13px;color:#c3c9d4;margin-bottom:6px" data-t="sendChannels"></div>
      <div id="chanList" style="display:flex;flex-wrap:wrap;gap:6px 18px"></div>
    </div>
    <div class="row" style="margin-bottom:14px;align-items:center;gap:10px">
      <label class="chk" style="margin:0"><input type="checkbox" id="syncChk" checked> <span data-t="syncKeep"></span></label>
      <select id="syncHours" style="width:auto">
        <option value="6" data-t="sync6"></option>
        <option value="24" selected data-t="sync24"></option>
      </select>
    </div>
    <div class="row">
      <button class="btn-primary" id="importBtn" onclick="doImport()" disabled></button>
    </div>
    <div class="progress" id="importProgress">
      <div class="progress-text" id="importText"></div>
      <div class="bar"><div id="importBar"></div></div>
    </div>
    <div class="result" id="resultBox"></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onOwnPhoto(this.files[0]); this.value='';">
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // PDF + link ile yükleme (geçici adlar; Mustafa'nın onayında)
  HS.i18n.add({
    tr: {
      tabPdfLink: '📥 PDF + link',
      plHint: 'Toptancının PDF fiyat listesini / kataloğunu yükle, istersen ürünlerin bulunduğu site linkini de yaz. Fiyat ve stok PDF\'ten, görsel ve açıklama siteden alınır; aynı barkod / kod varsa yeni ürün açılmaz, fiyat ve stok güncellenir. WhatsApp\'tan gönderdiğinde de aynısı olur.',
      plPick: '📄 PDF seç',
      plUrlPh: 'Site / mağaza linki (isteğe bağlı)',
      plMarginNote: 'Satış fiyatı, aşağıdaki Kurallar bölümündeki Kâr oranına göre hesaplanır (PDF\'teki fiyat alış fiyatı sayılır).',
      plStart: 'Başlat',
      plHistory: 'Yükleme geçmişi',
      plNoHistory: 'Henüz yükleme yok.',
      plNeedInput: 'PDF seç ya da link yaz.',
      plOnlyPdf: 'Yalnız PDF dosyası kabul edilir.',
      plTooBig: 'PDF en fazla 20 MB olabilir.',
      plUploading: 'PDF yükleniyor…',
      plStarted: 'Başladı; ürünler okunuyor. Bu sayfayı kapatabilirsin.',
      plDetail: 'Ayrıntı',
      plPublish: 'Yayınla',
      plPublishing: 'Yayınlanıyor…',
      plPublished: 'Yayınlandı.',
      plThDate: 'Tarih', plThSource: 'Kaynak', plThFrom: 'Dosya / link', plThStatus: 'Durum', plThCounts: 'Ürün',
      plThProduct: 'Ürün', plThCode: 'Kod / barkod', plThPrice: 'Alış → satış', plThStock: 'Stok', plThImg: 'Görsel', plThNote: 'Durum',
      plCounts: '{found} bulundu · {created} yeni · {updated} güncellendi · {missing} eksik · {failed} hata',
      plSrc_panel: 'Panel', plSrc_whatsapp: 'WhatsApp', plSrc_telegram: 'Telegram', plSrc_test: 'Test', plSrc_instagram: 'Instagram', plSrc_messenger: 'Messenger',
      plSt_parsing: 'Okunuyor', plSt_merging: 'Eşleştiriliyor', plSt_need_margin: 'Kâr oranı bekleniyor', plSt_saving: 'Kaydediliyor', plSt_ready: 'Hazır (taslak)',
      plSt_publishing: 'Yayınlanıyor', plSt_published: 'Yayında', plSt_failed: 'Hata', plSt_cancelled: 'İptal',
      plRow_created: 'Yeni', plRow_updated: 'Güncellendi', plRow_error: 'Okunamadı', plRow_unmatched: 'Eşleşmedi', plRow_ok: 'Tam', plRow_missing: 'Eksik', plRow_new: '—', plRow_skipped: 'Atlandı',
      plMatch: 'Siteyle eşleşti: {by}', plBy_barcode: 'barkod', plBy_sku: 'stok kodu / model', plBy_name: 'ürün adı',
      plOpenProduct: 'Düzenle',
      plMore: '… ve {n} satır daha',
    },

  const t = HS.t;

  const MAX_LINKS = 3000;

  let userId = null;
  let items = [];          // { key, url, name, price, list_price, currency, images, specs, model_code, brand, category, description, stock, selected, exists, newPrice, priceEdited, open }

  function fmt(s, vars) { return String(s).replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m); }
  function toast(msg, isErr) {
    const el = document.getElementById('toast');
    el.textContent = msg;

    el.style.display = 'block';

  function applyStatic() {
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = t(el.getAttribute('data-th')); });
    document.getElementById('srcUrl').placeholder = t('urlPh');
    document.getElementById('rCategory').placeholder = t('catPh');

    updateImportBtn();

  // ---------- Kurallar ----------
  function rules() {
    return {
      base: document.getElementById('rPriceBase').value,
      margin: Math.max(0, parseFloat(document.getElementById('rMargin').value) || 0),
      round: document.getElementById('rRound').value,
      currency: document.getElementById('rCurrency').value,
      category: document.getElementById('rCategory').value.trim(),
      brand: document.getElementById('rBrand').value.trim(),
      site: lookupSite,
      siteSearch: lookupTpl,
    };
  }
  function applyRuleValues(r) {
    if (!r) return;
    if (r.base) document.getElementById('rPriceBase').value = r.base;
    if (r.margin != null) document.getElementById('rMargin').value = r.margin;
    if (r.round) document.getElementById('rRound').value = r.round;
    if (r.currency) document.getElementById('rCurrency').value = r.currency;
    if (r.category != null) document.getElementById('rCategory').value = r.category;
    if (r.brand != null) document.getElementById('rBrand').value = r.brand;
    if (r.site) lookupSite = r.site;
    if (r.siteSearch) lookupTpl = r.siteSearch;
  }
  function roundPrice(v, mode) {
    if (!(v > 0)) return null;
    if (mode === '1') return Math.ceil(v);
    if (mode === '5') return Math.ceil(v / 5) * 5;
    if (mode === '10') return Math.ceil(v / 10) * 10;
    if (mode === '99') return Math.ceil((v + 0.1) / 10) * 10 - 0.10;
    return Math.round(v * 100) / 100;
  }
  function calcPrice(it, r) {
    if (r.base === 'list' && it.list_price > 0) return roundPrice(it.list_price, r.round);
    if (!(it.price > 0)) return null;
    return roundPrice(it.price * (1 + r.margin / 100), r.round);
  }
  function itemCurrency(it, r) {
    if (r.currency && r.currency !== 'auto') return r.currency;
    return it.currency || 'TRY';
  }
  let rulesTimer = null;
  function onRulesChange() {
    clearTimeout(rulesTimer);
    rulesTimer = setTimeout(() => {
      const r = rules();
      items.forEach(it => { if (!it.priceEdited) it.newPrice = calcPrice(it, r); });
      renderPreview();
    }, 250);
  }
  // ---------- Pazaryerlerine gönderim (varsayılan kanallar: asistan ayarıyla ortak, bir kez seçilir) ----------
  let chanDefaults = ['own_store'];
  const chanKey = (code) => code.startsWith('amazon_') ? 'amazon' : code.endsWith('_tr') ? code.slice(0, -3) : code;
  async function loadChannels() {
    try {
      const session = (await db.auth.getSession()).data.session;
      const [chRes, st] = await Promise.all([
        fetch(HS.SUPABASE_URL + '/functions/v1/site-store', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify({ action: 'channels', userAccessToken: session.access_token }) }).then(r => r.json()),
        db.from('assistant_settings').select('default_channels').eq('user_id', userId).maybeSingle(),
      ]);
      chanDefaults = (st.data && st.data.default_channels) || ['own_store'];
      const groups = {};
      for (const m of (chRes.marketplaces || [])) {
        const k = chanKey(m.code);
        (groups[k] = groups[k] || []).push(m);
      }
      const keys = Object.keys(groups);
      if (!keys.length) return;
      document.getElementById('chanList').innerHTML = keys.map(k => {
        const g = groups[k];
        const name = k === 'amazon' ? 'Amazon' : esc(String(g[0].label || g[0].code).split(' · ')[0]);
        const extra = g.length > 1 ? ' <span style="color:#8b93a1">(' + fmt(t('chanMarkets'), { n: g.length }) + ')</span>' : '';
        return '<label class="chk" style="margin:0"><input type="checkbox" class="chanChk" value="' + k + '"' + (chanDefaults.includes(k) ? ' checked' : '') + ' onchange="saveChannels()"> ' + name + extra + '</label>';
      }).join('');
      document.getElementById('chanRow').style.display = 'block';
    } catch (e) { console.warn('kanallar', e); }
  }
  async function saveChannels() {
    const picked = [...document.querySelectorAll('.chanChk:checked')].map(x => x.value);
    const shown = [...document.querySelectorAll('.chanChk')].map(x => x.value);
    chanDefaults = [...new Set([...chanDefaults.filter(k => !shown.includes(k)), ...picked])];
    if (!chanDefaults.includes('own_store')) chanDefaults.unshift('own_store');
    const up = await db.from('assistant_settings').update({ default_channels: chanDefaults }).eq('user_id', userId).select('user_id');
    if (!up.error && (!up.data || !up.data.length)) await db.from('assistant_settings').insert({ user_id: userId, default_channels: chanDefaults });
  }
  async function sendToMarketplaces(productIds) {
    const picked = [...document.querySelectorAll('.chanChk:checked')].map(x => x.value);
    if (!picked.length || !productIds.length) return '';
    try {
      const session = (await db.auth.getSession()).data.session;
      const r = await fetch(HS.SUPABASE_URL + '/functions/v1/site-store', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
        body: JSON.stringify({ action: 'send_products', productIds: productIds, defaults: picked, userAccessToken: session.access_token }) }).then(r => r.json());
      if (!r.ok) return '<div style="color:#f28b8b;margin-top:6px">' + esc(t('sendFail') + (r.error || '')) + '</div>';
      const parts = Object.entries(r.result || {}).filter(([, v]) => v && (v.listings || v.existing)).map(([k, v]) => k + ' ' + HS.number((v.listings || 0) + (v.existing || 0)));
      return parts.length ? '<div style="margin-top:6px">' + esc(fmt(t('sentTo'), { r: parts.join(', ') })) + '</div>' : '';
    } catch (e) { return '<div style="color:#f28b8b;margin-top:6px">' + esc(t('sendFail') + e.message) + '</div>'; }
  }

  async function loadRules() {
    const res = await db.from('import_rules').select('rules').eq('user_id', userId).maybeSingle();
    if (res.data && res.data.rules) applyRuleValues(res.data.rules);
  }
  async function saveRules() {
    const res = await db.from('import_rules').upsert({ user_id: userId, rules: rules(), updated_at: new Date().toISOString() });
    const el = document.getElementById('rulesMsg');
    if (res.error) { el.textContent = res.error.message; el.style.color = '#f28b8b'; return; }
    el.textContent = t('rulesSaved'); el.style.color = '#6ee7b7';
    setTimeout(() => { el.textContent = ''; }, 4000);
  }

  // ---------- Çekme ----------
  // ---------- ✨ Metni kanala göre yaz ----------
  let copyChannel = 'own_store', copyRunning = false, copyProgress = '';
  async function rewriteCopy() {
    if (copyRunning) return;
    const sel = items.filter(i => i.selected && !i.exists);
    if (!sel.length) { toast(t('copyNone'), true); return; }
    copyRunning = true;
    const BATCH = 8, total = sel.length;
    let done = 0, ok = 0, lastErr = '', idx = 0;
    copyProgress = fmt(t('copyRunning'), { d: 0, t: total });
    renderPreview();
    const batches = [];
    for (let i = 0; i < sel.length; i += BATCH) batches.push(sel.slice(i, i + BATCH));
    const worker = async () => {
      while (idx < batches.length) {
        const b = batches[idx++];
        try {
          const res = await fetch(HS.SUPABASE_URL + '/functions/v1/channel-copy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ channel: copyChannel, items: b.map(it => ({ name: it.name, description: it.description, specs: it.specs, brand: it.brand, category: it.category })) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error || !Array.isArray(data.items)) throw new Error(data.error || ('HTTP ' + res.status));
          data.items.forEach((o, k) => {
            if (!o || !o.title) return;
            b[k].name = o.title;
            b[k].description = o.description || b[k].description;
            b[k].key = itemKey(b[k]);
            ok++;
          });
        } catch (e) { lastErr = e.message || String(e); }
        done += b.length;
        copyProgress = fmt(t('copyRunning'), { d: Math.min(done, total), t: total });
        const btn = document.getElementById('copyBtn');
        if (btn) btn.textContent = copyProgress;
      }
    };
    await Promise.all([worker(), worker()]);
    copyRunning = false;
    renderPreview();
    if (lastErr) toast(t('copyErr') + lastErr, true);
    else toast(fmt(t('copyDone'), { n: HS.number(ok) }));
  }

  async function callImport(url) {
    const res = await fetch(HS.SUPABASE_URL + '/functions/v1/product-import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
      body: JSON.stringify({ url: url, language: HS.lang })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function setProgress(text, pct, sub) {
    document.getElementById('progress').style.display = 'block';
    document.getElementById('progressText').textContent = text;
    document.getElementById('progressBar').style.width = Math.max(0, Math.min(100, pct || 0)) + '%';
    document.getElementById('progressSub').textContent = sub || '';
  }

  function itemKey(it) {
    return (it.url || '') + '|' + (it.model_code || '') + '|' + (it.name || '');
  }

  function addItems(list) {
    const r = rules();
    const seen = new Set(items.map(i => i.key));
    list.forEach(raw => {
      if (!raw || !raw.name) return;
      const it = Object.assign({}, raw);
      it.images = Array.isArray(it.images) ? it.images : [];
      it.specs = Array.isArray(it.specs) ? it.specs : [];
      it.key = itemKey(it);
      if (seen.has(it.key)) return;
      seen.add(it.key);
      if (!it.imgSrc && it.images.length) {
        it.imgSrc = it.url ? { kind: 'link', url: it.url } : { kind: 'catalog', url: '', file: sourceUrl || '' };
      }
      it.selected = true;
      it.exists = false;
      it.priceEdited = false;
      it.newPrice = calcPrice(it, r);
      items.push(it);
    });
  }

  function stopFetch() { stopFlag = true; }

  async function startFetch() {
    if (running) return;
    const url = document.getElementById('srcUrl').value.trim();
    if (!url) { toast(t('needUrl'), true); return; }
    running = true; stopFlag = false; sourceUrl = url;
    items = []; filter = 'all'; shown = PAGE_SIZE;
    document.getElementById('resultBox').style.display = 'none';
    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    document.getElementById('stopBtn').style.display = '';
    setProgress(t('fetching'), 5);

    try {
      const first = await callImport(url);
      if (first.kind === 'feed') {
        addItems(first.items || []);
        // Mağaza listesi sayfa sayfa gelir (Shopify / WooCommerce)
        let next = first.next_page || '';
        const seenFeed = new Set([url]);
        while (next && !seenFeed.has(next) && items.length < MAX_LINKS * 3 && !stopFlag) {
          seenFeed.add(next);
          setProgress(fmt(t('feedDone'), { n: HS.number(items.length) }), 50);
          renderPreview();
          try {
            const pr = await callImport(next);
            if (pr.kind !== 'feed' || !(pr.items || []).length) break;
            addItems(pr.items);
            next = pr.next_page || '';
          } catch (e) { break; }
        }
        setProgress(fmt(t('feedDone'), { n: HS.number(items.length) }), 100);
      } else if (first.kind === 'product') {
        addItems([first.item]);
        setProgress(fmt(t('fetchDone'), { n: 1 }), 100);
      } else if (first.kind === 'category') {
        // 1) Tüm sayfaları dolaşıp ürün linklerini topla
        let links = (first.links || []).slice();
        let next = first.next_page || '';
        let page = 1;
        const seenPages = new Set([url, first.url]);
        setProgress(fmt(t('scanning'), { n: links.length, p: page }), 10);
        while (next && !seenPages.has(next) && page < MAX_CATEGORY_PAGES && links.length < MAX_LINKS && !stopFlag) {
          seenPages.add(next);
          page++;
          try {
            const pr = await callImport(next);
            if (pr.kind !== 'category') break;
            const before = links.length;
            links = Array.from(new Set(links.concat(pr.links || [])));
            next = pr.next_page || '';
            if (links.length === before) break;
          } catch (e) { break; }
          setProgress(fmt(t('scanning'), { n: links.length, p: page }), 10);
        }
        links = links.slice(0, MAX_LINKS);

        // 2) Ürünleri aynı anda birkaç tane çek
        let done = 0, errors = 0, idx = 0;
        const total = links.length;
        const worker = async () => {
          while (idx < total && !stopFlag) {
            const my = links[idx++];
            try {
              const pr = await callImport(my);
              if (pr.kind === 'product' && pr.item) addItems([pr.item]);
              else errors++;
            } catch (e) { errors++; }
            done++;
            setProgress(fmt(t('pulling'), { d: HS.number(done), t: HS.number(total) }), 10 + (done / Math.max(1, total)) * 90,
              errors ? fmt(t('pullErr'), { e: errors }) : '');
            if (done % 10 === 0) renderPreview();
          }
        };
        await Promise.all(Array.from({ length: CONCURRENCY }, worker));
        setProgress(stopFlag ? fmt(t('stopped'), { n: HS.number(items.length) }) : fmt(t('fetchDone'), { n: HS.number(items.length) }), 100,
          errors ? fmt(t('pullErr'), { e: errors }) : '');
      }
      await markExisting();
      if (priceRows.length) await applyPriceList();
    } catch (e) {
      setProgress(t('fnError') + e.message, 0);
      toast(t('fnError') + e.message, true);
    } finally {
      running = false;
      btn.disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      renderPreview();
    }
  }

  // Daha önce eklenmiş ürünleri işaretle (aynı kaynak link ya da aynı model kodu)
  async function markExisting() {
    const urls = Array.from(new Set(items.map(i => i.url).filter(Boolean)));
    const codes = Array.from(new Set(items.map(i => i.model_code).filter(Boolean)));
    const existUrls = new Set(), existCodes = new Set();
    for (let i = 0; i < urls.length; i += 150) {
      const r = await db.from('products').select('source_url').eq('user_id', userId).is('deleted_at', null).in('source_url', urls.slice(i, i + 150));
      (r.data || []).forEach(x => existUrls.add(x.source_url));
    }
    for (let i = 0; i < codes.length; i += 150) {
      const r = await db.from('products').select('model_code').eq('user_id', userId).is('deleted_at', null).in('model_code', codes.slice(i, i + 150));
      (r.data || []).forEach(x => existCodes.add(x.model_code));
    }
    items.forEach(it => {
      it.exists = (it.url && existUrls.has(it.url)) || (it.model_code && existCodes.has(it.model_code));
      if (it.exists) it.selected = false;
    });
  }

  // ---------- Önizleme ----------
  function imgSourceText(src) {
    if (!src) return '';
    if (src.kind === 'seller_photo') return t('imgSrcSeller');
    if (src.kind === 'catalog') return src.file ? src.file : t('imgSrcCatalog');
    try { return new URL(src.url).hostname.replace(/^www\./, ''); } catch (e) { return src.url || ''; }
  }

  // ---------- Kendi fotoğrafı (telefonda kamera açılır); arka plan otomatik temizlenir ----------
  let photoFor = -1;
  function pickOwnPhoto(i) { photoFor = i; document.getElementById('photoInput').click(); }
  async function onOwnPhoto(file) {
    const it = items[photoFor];
    if (!file || !it) return;
    toast(t('photoWorking'));
    try {
      const cv = await fileToCanvas(file, 1600);
      let dataUrl = cv.toDataURL('image/jpeg', 0.9);
      try {
        const res = await fetch(HS.SUPABASE_URL + '/functions/v1/remove-background', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify({ imageBase64: dataUrl })
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok || !d.imageBase64) throw new Error(d.error || ('HTTP ' + res.status));
        // Şeffaf PNG -> beyaz zeminli JPEG (pazaryerleri beyaz zemin ister)
        const img = new Image();
        await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = d.imageBase64; });
        const out = document.createElement('canvas');
        out.width = img.naturalWidth; out.height = img.naturalHeight;
        const ctx = out.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(img, 0, 0);
        dataUrl = out.toDataURL('image/jpeg', 0.9);
      } catch (e) { console.warn('remove-background', e); toast(t('photoBgFail'), true); }
      it.images = [dataUrl].concat(it.images.filter(u => u !== dataUrl)).slice(0, 12);
      it.imgSrc = { kind: 'seller_photo', url: '' };
      it.imageMissing = false;
      renderPreview();
    } catch (e) { toast(t('fnError') + e.message, true); }
  }

  function problems(it) {
    const p = [];
    if (!(it.newPrice > 0)) p.push(['bad', t('wNoPrice')]);
    if (!it.images.length) p.push(['mid', t('wNoImage')]);
    if (!it.specs.length) p.push(['mid', t('wNoSpecs')]);
    return p;
  }
  function filtered() {
    if (filter === 'selected') return items.filter(i => i.selected);
    if (filter === 'problem') return items.filter(i => problems(i).some(p => p[0] === 'bad'));
    if (filter === 'exists') return items.filter(i => i.exists);
    return items;
  }
  function setFilter(f) { filter = f; shown = PAGE_SIZE; renderPreview(); }

  function renderPreview() {
    const box = document.getElementById('previewBox');
    const has = items.length > 0;
    document.getElementById('step3').classList.toggle('disabled', !has);
    document.getElementById('step4').classList.toggle('disabled', !has);
    if (!has) { box.innerHTML = '<div class="empty-state">' + esc(t('noItems')) + '</div>'; updateImportBtn(); return; }

    const r = rules();
    const nSel = items.filter(i => i.selected).length;
    const nProb = items.filter(i => problems(i).some(p => p[0] === 'bad')).length;
    const nEx = items.filter(i => i.exists).length;
    const chip = (key, label, n) => '<button class="chip' + (filter === key ? ' active' : '') + '" onclick="setFilter(\'' + key + '\')">' + esc(label) + ' <b>' + HS.number(n) + '</b></button>';
    const list = filtered();
    const visible = list.slice(0, shown);
    const selectable = list.filter(i => !i.exists);
    const allChecked = selectable.length > 0 && selectable.every(i => i.selected);

    const rows = visible.map(it => {
      const idx = items.indexOf(it);

  async function loadEtsyConn() {

  function relPath(f) { const p = (f.webkitRelativePath || f.name).replace(/\\/g, '/'); const i = p.indexOf('/'); return i >= 0 ? p.slice(i + 1) : p; }
  function lookupFile(name, folder) {
    const want = String(name || '').replace(/\\/g, '/').replace(/^\.?\//, '').toLowerCase();
    if (!want) return null;
    const cands = [want, folder ? (folder.replace(/\/$/, '') + '/' + want).toLowerCase() : null].filter(Boolean);
    for (const c of cands) if (folderMap.has(c)) return folderMap.get(c);
    // yalnız dosya adıyla (benzersizse)
    const hits = [...folderMap.entries()].filter(([k]) => k.split('/').pop() === want.split('/').pop());
    return hits.length === 1 ? hits[0][1] : null;
  }
  async function onFolderPicked(fileList) {
    const all = Array.from(fileList || []);
    folderMap = new Map(all.map(f => [relPath(f).toLowerCase(), f]));
    document.getElementById('folderName').textContent = all.length ? (all[0].webkitRelativePath || '').split('/')[0] + ' · ' + tf('folderCount', { n: all.length }) : '';
    // Klasörde birden çok .json olabilir: ürün listesi ("products" dizisi ya da dizi) olanı seçilir
    const jsons = all.filter(f => /\.json$/i.test(f.name));
    folderItems = [];
    const msg = document.getElementById('folderMsg');
    if (!jsons.length) { msg.textContent = t('folderNoJson'); renderFolder(); return; }
    let data, jsonFile, lastErr;
    for (const f of jsons) {
      try { const d = JSON.parse(await f.text()); if (Array.isArray(d) || Array.isArray(d && d.products)) { data = d; jsonFile = f; break; } } catch (e) { lastErr = e; }
    }
    if (!data) { msg.textContent = lastErr ? tf('folderBadJson', { e: lastErr.message }) : t('folderNoJson'); renderFolder(); return; }
    const list = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : []);
    msg.textContent = tf('folderFound', { n: list.length, f: jsonFile.name });
    folderItems = list.map((p, i) => {
      const folder = p.folder ? String(p.folder) : '';
      const inFolder = folder ? [...folderMap.entries()].filter(([k]) => k.startsWith(folder.toLowerCase().replace(/\/$/, '') + '/')).map(([, f]) => f) : [];
      const imgs = (Array.isArray(p.images) && p.images.length ? p.images.map(n => lookupFile(n, folder)) : inFolder.filter(f => IMG_RE.test(f.name)).sort((a, b) => a.name.localeCompare(b.name)));
      const fls = (Array.isArray(p.files) && p.files.length ? p.files.map(n => lookupFile(n, folder)) : inFolder.filter(f => !IMG_RE.test(f.name) && !/\.json$/i.test(f.name)).sort((a, b) => a.name.localeCompare(b.name)));
      const errors = [];
      const missing = [...(p.images || []).filter((n, k) => !imgs[k]), ...(p.files || []).filter((n, k) => !fls[k])];
      if (missing.length) errors.push(tf('folderMissing', { n: missing.join(', ') }));
      const images = imgs.filter(Boolean).slice(0, 10), files = fls.filter(Boolean);
      if (!String(p.title || '').trim()) errors.push(t('folderNoTitle'));
      if (!(Number(p.price) > 0)) errors.push(t('folderNoPrice'));
      if (!images.length) errors.push(t('folderNoImage'));
      const digital = (p.type || (files.length ? 'digital' : 'physical')) === 'digital';
      if (digital && !files.length) errors.push(t('folderNoFile'));
      if (files.length > 5) errors.push(t('fileMax5'));
      files.filter(f => f.size > 20 * 1024 * 1024).forEach(f => errors.push(tf('fileTooBig20', { n: f.name })));
      return { i, title: String(p.title || '').trim(), description: String(p.description || '').trim(), tags: Array.isArray(p.tags) ? p.tags.map(String) : [],
        price: Number(p.price) || 0, quantity: p.quantity != null ? Number(p.quantity) : null, digital, images, files: files.slice(0, 5), errors, status: '', link: null, productId: null, listingId: null,
        autoRenew: typeof p.auto_renew === 'boolean' ? p.auto_renew : null, etsyListingId: /^\d+$/.test(String(p.etsy_listing_id || '')) ? String(p.etsy_listing_id) : null };
    });
    renderFolder();
  }

  async function aiFill(items) {
    // Eksik açıklama / etiketleri Etsy kurallarına göre tamamla (8'erli)
    const need = items.filter(it => !it.description || it.tags.length < 5);
    for (let k = 0; k < need.length; k += 8) {
      const chunk = need.slice(k, k + 8);
      try {
        const { data: { session } } = await db.auth.getSession();
        const r = await fetch(HS.SUPABASE_URL + '/functions/v1/channel-copy', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify({ channel: 'etsy', items: chunk.map(it => ({ name: it.title, description: it.description })) }) }).then(x => x.json());
        (r.items || []).forEach((o, j) => {
          const it = chunk[j];
          if (!it.description && o.description) it.description = o.description;
          if (it.tags.length < 5 && Array.isArray(o.tags)) it.tags = [...it.tags, ...o.tags].slice(0, 13);

  async function extractPdfImages(file, codes, onPage) {

      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i], args = ops.argsArray[i];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
        else if (fn === OPS.transform) ctm = mulM(ctm, args);
        else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageXObjectRepeat) {
          const xs = [ctm[4], ctm[4] + ctm[0], ctm[4] + ctm[2], ctm[4] + ctm[0] + ctm[2]];
          const ys = [ctm[5], ctm[5] + ctm[1], ctm[5] + ctm[3], ctm[5] + ctm[1] + ctm[3]];
          const x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
          const w = Math.max.apply(null, xs) - x, h = Math.max.apply(null, ys) - y;
          if (w < 20 || h < 20) continue;               // çok küçük (ikon)
          if (w * h > pageArea * 0.5) continue;         // sayfa arka planı
          if (w / h > 4 || h / w > 4) continue;         // şerit / logo bandı
          boxes.push({ id: typeof args[0] === 'string' ? args[0] : null, x, y, w, h, cx: x + w / 2, cy: y + h / 2 });
        }
      }
      if (!boxes.length) continue;
      // 2) Model kodlarının konumları
      const tc = await page.getTextContent();
      const found = [];
      tc.items.forEach(it => {
        const s = normCode(it.str);
        if (s.length < 3) return;
        let hit = codeSet.get(s);
        if (!hit) codeSet.forEach((orig, k) => { if (!hit && k.length >= 5 && s.includes(k)) hit = orig; });
        if (hit) found.push({ code: hit, x: it.transform[4] + (it.width || 0) / 2, y: it.transform[5] + (it.height || 8) / 2 });
      });
      if (!found.length) continue;
      // 3) Sayfayı çiz, her resmi en yakın model koduna bağla
      const scale = 3;
      const vp = page.getViewport({ scale });
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      boxes.forEach(b => {
        let best = null, bestD = Infinity;
        found.forEach(f => {
          const dy = Math.abs(f.y - b.cy), dx = Math.abs(f.x - b.cx);
          const sameRow = f.y >= b.y - 4 && f.y <= b.y + b.h + 4;
          const d = sameRow ? dx * 0.2 + dy : dy + dx * 0.6 + 200;
          if (d < bestD) { bestD = d; best = f; }
        });
        if (!best || bestD > Math.max(b.h * 1.5, 120) + 200) return;
        let out = null;
        // Önce resmin PDF içindeki asıl (yüksek çözünürlüklü) halini dene
        try {
          const store = b.id && b.id.indexOf('g_') === 0 ? page.commonObjs : page.objs;
          const obj = b.id ? store.get(b.id) : null;
          if (obj && obj.bitmap && obj.width >= 80 && obj.height >= 80) {
            const k = Math.min(1, 1200 / Math.max(obj.width, obj.height));
            out = document.createElement('canvas');
            out.width = Math.round(obj.width * k); out.height = Math.round(obj.height * k);
            const octx = out.getContext('2d');
            octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
            octx.drawImage(obj.bitmap, 0, 0, out.width, out.height);
          }
        } catch (e) { out = null; }
        // Olmazsa sayfanın çizilmiş halinden kes
        if (!out) {
          const r = vp.convertToViewportRectangle([b.x, b.y, b.x + b.w, b.y + b.h]);
          const x0 = Math.max(0, Math.floor(Math.min(r[0], r[2]))), y0 = Math.max(0, Math.floor(Math.min(r[1], r[3])));
          const x1 = Math.min(cv.width, Math.ceil(Math.max(r[0], r[2]))), y1 = Math.min(cv.height, Math.ceil(Math.max(r[1], r[3])));
          if (x1 - x0 < 30 || y1 - y0 < 30) return;
          const k = Math.min(1, 900 / Math.max(x1 - x0, y1 - y0));
          out = document.createElement('canvas');
          out.width = Math.round((x1 - x0) * k); out.height = Math.round((y1 - y0) * k);
          const octx = out.getContext('2d');
          octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
          octx.drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
        }
        const key = normCode(best.code);
        const arr = result.get(key) || [];
        if (arr.length < 6) arr.push(out.toDataURL('image/jpeg', 0.88));
        result.set(key, arr);
      });
      page.cleanup();
    }
    return result;
  }


  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script'));
      document.head.appendChild(s);
    });
  }
  function bytesToBase64(bytes) {
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function normCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function numVal(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 0 ? Math.round(v * 100) / 100 : null;
    let s = String(v).replace(/[^\d.,]/g, '');
    if (!s) return null;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
    else if (ld > -1) { const pp = s.split('.'); if (pp.length > 2 || pp[1].length === 3) s = s.replace(/\./g, ''); }
    const n = parseFloat(s);
    return n > 0 ? Math.round(n * 100) / 100 : null;
  }
  function curOf(v) {
    const s = String(v || '').toUpperCase();
    if (/TRY|TL|₺/.test(s)) return 'TRY';
    if (/USD|\$/.test(s)) return 'USD';
    if (/EUR|€/.test(s)) return 'EUR';
    if (/GBP|£/.test(s)) return 'GBP';
    return null;
  }

  async function readPdf(file) {
    setProgress(t('fileLib'), 5);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
    const src = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    const n = src.getPageCount();
    const PER = 3;
    const parts = [];
    for (let i = 0; i < n; i += PER) {
      const doc = await PDFLib.PDFDocument.create();
      const idx = [];
      for (let k = i; k < Math.min(n, i + PER); k++) idx.push(k);
      const pages = await doc.copyPages(src, idx);
      pages.forEach(pg => doc.addPage(pg));
      parts.push(await doc.save());
    }
    const out = new Array(parts.length);
    let done = 0, next = 0, lastErr = '';
    // Beklerken takılmış gibi görünmesin: geçen süre + yavaşça ilerleyen çubuk
    const t0 = Date.now();
    const tick = () => {
      const sec = Math.round((Date.now() - t0) / 1000);
      const creep = done < parts.length ? Math.min(0.9, sec / 45) : 0;
      setProgress(fmt(t('fileReading'), { d: done, t: parts.length }) + ' · ' + fmt(t('secs'), { s: sec }),
        10 + Math.min(0.97, (done + creep) / parts.length) * 80);
    };
    tick();
    const timer = setInterval(tick, 1000);
    const worker = async () => {
      while (next < parts.length) {
        const my = next++;
        try {
          const res = await fetch(HS.SUPABASE_URL + '/functions/v1/price-list-parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ pdfBase64: 'data:application/pdf;base64,' + bytesToBase64(parts[my]), language: HS.lang })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
          if (data.site && !docSite) docSite = data.site;
          out[my] = (data.rows || []).map(r => Object.assign({}, r, { page: my * PER + (r.page || 1) }));
        } catch (e) { lastErr = e.message; out[my] = []; }
        done++;
        tick();
      }
    };
    try { await Promise.all(Array.from({ length: Math.min(3, parts.length) }, worker)); }
    finally { clearInterval(timer); }
    const rows = [].concat.apply([], out);
    if (!rows.length && lastErr) throw new Error(lastErr);
    return rows;
  }

  async function readSheet(file) {
    setProgress(t('fileLib'), 10);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    // CSV / TXT metin olarak çözülür (Türkçe karakterler bozulmasın): önce UTF-8, olmazsa Windows-1254
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    let wb;
    if (ext === 'csv' || ext === 'txt') {
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.indexOf('\uFFFD') >= 0) { try { text = new TextDecoder('windows-1254').decode(buf); } catch (e) { /* kalsın */ } }
      // raw: say\u0131lar metin kal\u0131r; "149,90" / "3.999,00" T\u00FCrk\u00E7e bi\u00E7imiyle numVal'de do\u011Fru okunur
      wb = XLSX.read(text.replace(/^\uFEFF/, ''), { type: 'string', raw: true });
    } else {
      wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    }
    const rows = [];
    const aiSheets = []; // sütunları tanınmayan sayfalar: yapay zekâ okur (satıcı şablon doldurmaz)
    for (const name of wb.SheetNames) {
      const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
      // Başlık satırını bul (ilk 20 satır içinde)
      let hi = -1, col = null;
      for (let r = 0; r < Math.min(20, data.length); r++) {
        const h = data[r].map(x => String(x || '').toLowerCase());
        const find = (re, not) => h.findIndex(x => re.test(x) && !(not && not.test(x)));
        const code = find(/model|kod|code|sku|stok\s*no|ürün\s*no|urun\s*no|mpn/);
        const list = find(/psf|tavsiye|liste|perakende|retail|msrp|son\s*kullan/);
        let price = find(/bayi|net|alış|alis|dealer|maliyet/);
        if (price < 0) price = find(/fiyat|price|tutar|birim/, /psf|tavsiye|liste|perakende|retail|msrp/);
        if (code >= 0 && (price >= 0 || list >= 0)) {
          col = { code, price, list, name: find(/ürün\s*ad|urun\s*ad|açıklama|aciklama|tanım|tanim|name|description|isim|ürün$|urun$/, /kod|code/), cur: find(/döviz|doviz|para|currency|kur|birim$/), brand: find(/marka|brand|üretici|uretici|manufacturer/) };
          hi = r; break;
        }
      }
      if (hi < 0) { aiSheets.push(data); continue; }
      const headerCur = curOf(data[hi].join(' '));
      for (let r = hi + 1; r < data.length; r++) {
        const row = data[r];
        const code = String(row[col.code] || '').trim();
        const price = col.price >= 0 ? numVal(row[col.price]) : null;
        const list = col.list >= 0 ? numVal(row[col.list]) : null;
        const nm = col.name >= 0 ? String(row[col.name] || '').trim() : '';
        if (!code && !nm) continue; // model kodu olmayan ürün de alınır (adıyla)
        rows.push({
          code: code.slice(0, 80),
          name: nm.slice(0, 200),
          brand: col.brand >= 0 ? String(row[col.brand] || '').trim().slice(0, 80) : '',
          price: price || list || null, list_price: price ? list : null,
          currency: (col.cur >= 0 ? curOf(row[col.cur]) : null) || curOf(col.price >= 0 ? row[col.price] : '') || headerCur
        });
      }
    }
    if (aiSheets.length) {
      const lines = [];
      aiSheets.forEach(data => data.forEach(r => {
        const cells = r.map(x => String(x == null ? '' : x).replace(/[\t\r\n]+/g, ' ').trim());
        if (cells.some(Boolean)) lines.push(cells.join('\t'));
      }));
      const CHUNK = 250, parts = [];
      for (let i = 0; i < lines.length; i += CHUNK) parts.push(lines.slice(i, i + CHUNK).join('\n'));
      let done = 0;
      for (const part of parts.slice(0, 40)) {
        setProgress(fmt(t('sheetAi'), { d: done, t: parts.length }), 10 + done / parts.length * 80);
        const data = await callParse({ text: part });
        if (data.site && !docSite) docSite = data.site;
        (data.rows || []).forEach(r => rows.push(r));
        done++;
      }
    }
    if (!rows.length) throw new Error(t('fileNoCols'));
    return rows;
  }

  // Okuma çağrısı; geçici hata (sunucu / yapay zekâ yoğunluğu) ya da boş sonuçta bir kez daha dener
  async function callParse(payload) {
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetch(HS.SUPABASE_URL + '/functions/v1/price-list-parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify(Object.assign({ language: HS.lang }, payload))
        });
        const data = await res.json().catch(() => ({}));
        if (res.status >= 400 && res.status < 500) throw Object.assign(new Error(data.error || ('HTTP ' + res.status)), { final: true });
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        const empty = payload.action ? !(data.matches || []).length : !(data.rows || []).length;
        if (empty && attempt === 0) { lastErr = null; continue; }
        return data;
      } catch (e) {
        lastErr = e;
        if (e.final) break;
      }
    }
    if (lastErr) throw lastErr;
    return payload.action ? { matches: [] } : { rows: [] };
  }

  // Görüntü dosyasını (fotoğraf / ekran görüntüsü; telefondan da) tuvale çiz
  function fileToCanvas(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
      img.src = url;
    });
  }
  // 0-1000 ölçekli kutuyu tuvalden kes (biraz pay bırakarak)
  function cropBox(cv, box) {
    const pad = 8;
    const x0 = Math.max(0, Math.floor(box[0] / 1000 * cv.width) - pad), y0 = Math.max(0, Math.floor(box[1] / 1000 * cv.height) - pad);
    const x1 = Math.min(cv.width, Math.ceil(box[2] / 1000 * cv.width) + pad), y1 = Math.min(cv.height, Math.ceil(box[3] / 1000 * cv.height) + pad);
    if (x1 - x0 < 40 || y1 - y0 < 40) return null;
    const k = Math.min(1, 1000 / Math.max(x1 - x0, y1 - y0));
    const out = document.createElement('canvas');
    out.width = Math.round((x1 - x0) * k); out.height = Math.round((y1 - y0) * k);
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.88);
  }
  async function readImages(files) {
    const rows = [];
    let done = 0;
    for (const f of files) {
      setProgress(fmt(t('imgReading'), { d: done, t: files.length }), 10 + done / files.length * 85);
      const cv = await fileToCanvas(f, 2000);
