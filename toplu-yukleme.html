<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seltigo - Toplu Ürün Yükleme</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821; gap: 12px; flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; max-width: 700px; line-height: 1.5; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }

  .step { background: #141821; border: 1px solid #232838; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .step.disabled { opacity: .45; pointer-events: none; }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .step-num { width: 26px; height: 26px; border-radius: 50%; background: #123222; color: #6ee7b7; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-size: 16px; font-weight: 600; color: #fff; }
  .hint { font-size: 12px; color: #9aa3b2; line-height: 1.6; margin-top: 8px; }
  .muted { color: #6b7385; font-size: 12px; }

  .src-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .src-tab { background: #0d0f16; border: 1px solid #2a3040; color: #9aa3b2; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .src-tab.active { border-color: #1D9E75; color: #fff; background: #123222; }
  .src-tab:disabled { opacity: .5; cursor: not-allowed; }
  .drop { border: 2px dashed #2a3040; border-radius: 12px; padding: 26px 16px; text-align: center; color: #9aa3b2; font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: #1D9E75; background: #0f1a16; color: #fff; }
  .drop b { color: #fff; }
  .file-result { margin-top: 14px; background: #11151d; border: 1px solid #232838; border-radius: 12px; padding: 14px; display: none; }
  .file-result .stat-line { font-size: 14px; color: #e6e8ee; line-height: 1.7; }
  .file-result .stat-line b { color: #6ee7b7; }
  .up { color: #f28b8b; } .down { color: #6ee7b7; }
  details summary { cursor: pointer; color: #9aa3b2; font-size: 13px; margin-top: 10px; }
  .mini-table td, .mini-table th { padding: 7px 10px; font-size: 12px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  input[type=text], input[type=url], input[type=number], select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3040;
    background: #0d0f16; color: #e6e8ee; font-size: 14px; font-family: inherit;
  }
  input.grow { flex: 1; min-width: 240px; }
  .rules-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .field label { display: block; font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }
  .field input, .field select { width: 100%; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c3c9d4; cursor: pointer; line-height: 1.5; }
  .chk input { accent-color: #1D9E75; width: 16px; height: 16px; flex-shrink: 0; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 10px 18px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-secondary {
    background: transparent; color: #c3c9d4; border: 1px solid #2a3040; padding: 10px 16px;
    border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .btn-small { padding: 6px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .progress { margin-top: 14px; display: none; }
  .bar { height: 8px; background: #1c212c; border-radius: 6px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: #1D9E75; width: 0; transition: width .3s; }
  .progress-text { font-size: 13px; color: #c3c9d4; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: #0d0f16; border: 1px solid #2a3040; color: #9aa3b2; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip.active { border-color: #1D9E75; color: #fff; background: #123222; }
  .chip b { color: #fff; }

  .table-wrap { border: 1px solid #232838; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7385; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #232838; white-space: nowrap; background: #11151d; }
  td { padding: 10px 12px; border-bottom: 1px solid #1c212c; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: #1c212c; display: block; }
  .thumb-empty { width: 54px; height: 54px; border-radius: 8px; background: #1c212c; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .pname { color: #fff; font-weight: 600; line-height: 1.35; }
  .pmeta { font-size: 11px; color: #9aa3b2; margin-top: 3px; }
  .img-count { font-size: 11px; color: #9aa3b2; margin-top: 4px; text-align: center; }
  .spec-toggle { background: none; border: none; color: #6ee7b7; font-size: 12px; cursor: pointer; padding: 0; margin-top: 4px; }
  .spec-list { margin-top: 6px; font-size: 12px; color: #c3c9d4; line-height: 1.6; }
  .spec-list span { color: #9aa3b2; }
  .price-input { width: 110px; padding: 6px 8px; font-size: 13px; text-align: right; }
  .warn { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; display: inline-block; margin: 2px 2px 0 0; }
  .w-bad { background: #2a1414; color: #f28b8b; }
  .w-mid { background: #2a2410; color: #e6c96a; }
  .w-exist { background: #142230; color: #7db8e6; }
  .more-row { text-align: center; padding: 12px; }
  .lookup-bar { display: none; font-size: 13px; color: #c3c9d4; background: #11151d; border: 1px solid #232838; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; line-height: 1.6; }
  .lookup-bar b { color: #fff; }
  .lookup-bar a { color: #6ee7b7; cursor: pointer; text-decoration: underline; }

  .consent { background: #11151d; border: 1px solid #2a3040; border-radius: 10px; padding: 14px; margin: 16px 0; }
  .result { margin-top: 14px; font-size: 14px; line-height: 1.6; display: none; }
  .result.ok { color: #6ee7b7; }
  .result.err { color: #f28b8b; }
  .result a { color: #6ee7b7; }
  .empty-state { text-align: center; color: #9aa3b2; padding: 30px 20px; border: 1px dashed #232838; border-radius: 12px; font-size: 14px; line-height: 1.6; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1c212c; border: 1px solid #1D9E75; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 1000; display: none; max-width: 90%; text-align: center;
  }
  .toast.err { border-color: #e0554f; }

  @media (max-width: 800px) {
    .rules-grid { grid-template-columns: 1fr 1fr; }
    main { padding: 20px 16px 60px; }
  }
  @media (max-width: 520px) { .rules-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot">S</div><div class="logo-text">Seltigo</div></div>
  <div class="header-right">
    <span id="langSwitcherHost"></span>
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="HS.logout()" data-t="logout"></button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1 data-t="title"></h1>
      <div class="subtitle" data-t="subtitle"></div>
    </div>
    <a class="back-link" href="dashboard.html" data-t="back"></a>
  </div>

  <!-- 1) Kaynak -->
  <div class="step" id="step1">
    <div class="step-head"><div class="step-num">1</div><div class="step-title" data-t="s1Title"></div></div>
    <div class="src-tabs">
      <button class="src-tab active" id="tabLinkBtn" onclick="setSrc('link')" data-t="tabLink"></button>
      <button class="src-tab" id="tabFileBtn" onclick="setSrc('file')" data-t="tabFile"></button>
    </div>
    <div id="linkPanel">
      <div class="row">
        <input type="url" class="grow" id="srcUrl" autocomplete="off">
        <button class="btn-primary" id="fetchBtn" onclick="startFetch()" data-t="fetchBtn"></button>
      </div>
      <div class="hint" data-th="s1Hint"></div>
    </div>
    <div id="filePanel" style="display:none">
      <input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls,.csv,.ods,.txt,image/*" style="display:none" onchange="onFilesPicked(this.files); this.value='';">
      <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()" data-th="dropText"></div>
      <div class="row" style="margin-top:12px">
        <label class="muted" data-t="vatLabel" style="font-size:13px;color:#c3c9d4"></label>
        <select id="vatSel">
          <option value="0" data-t="vat0"></option>
          <option value="20" data-t="vat20"></option>
          <option value="10" data-t="vat10"></option>
          <option value="1" data-t="vat1"></option>
        </select>
      </div>
      <div class="hint" data-th="fileHint"></div>
      <div class="file-result" id="fileResult"></div>
    </div>
    <div class="progress" id="progress">
      <div class="progress-text" id="progressText"></div>
      <div class="bar"><div id="progressBar"></div></div>
      <div class="row">
        <span class="muted" id="progressSub"></span>
        <div class="spacer"></div>
        <button class="btn-secondary btn-small" id="stopBtn" onclick="stopFetch()" data-t="stop"></button>
      </div>
    </div>
  </div>

  <!-- 2) Kurallar -->
  <div class="step" id="step2">
    <div class="step-head"><div class="step-num">2</div><div class="step-title" data-t="s2Title"></div></div>
    <div class="rules-grid">
      <div class="field">
        <label data-t="rPriceBase"></label>
        <select id="rPriceBase" onchange="onRulesChange()">
          <option value="cost" data-t="rBaseCost"></option>
          <option value="list" data-t="rBaseList"></option>
        </select>
      </div>
      <div class="field">
        <label data-t="rMargin"></label>
        <input type="number" id="rMargin" value="30" min="0" max="1000" step="1" oninput="onRulesChange()">
      </div>
      <div class="field">
        <label data-t="rRound"></label>
        <select id="rRound" onchange="onRulesChange()">
          <option value="none" data-t="rRoundNone"></option>
          <option value="1" data-t="rRound1"></option>
          <option value="5" data-t="rRound5"></option>
          <option value="10" data-t="rRound10"></option>
          <option value="99" data-t="rRound99"></option>
        </select>
      </div>
      <div class="field">
        <label data-t="rCurrency"></label>
        <select id="rCurrency" onchange="onRulesChange()">
          <option value="auto" data-t="rCurAuto"></option>
          <option value="TRY">TRY (₺)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>
      <div class="field">
        <label data-t="rCategory"></label>
        <input type="text" id="rCategory" maxlength="120" oninput="onRulesChange()">
      </div>
      <div class="field">
        <label data-t="rBrand"></label>
        <input type="text" id="rBrand" maxlength="80" oninput="onRulesChange()">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="muted" id="rulesMsg"></span>
      <div class="spacer"></div>
      <button class="btn-secondary btn-small" onclick="saveRules()" data-t="saveRules"></button>
    </div>
  </div>

  <!-- 3) Önizleme -->
  <div class="step disabled" id="step3">
    <div class="step-head"><div class="step-num">3</div><div class="step-title" data-t="s3Title"></div></div>
    <div class="lookup-bar" id="lookupBar"></div>
    <div id="previewBox"><div class="empty-state" data-t="noItems"></div></div>
  </div>

  <!-- 4) Aktar -->
  <div class="step disabled" id="step4">
    <div class="step-head"><div class="step-num">4</div><div class="step-title" data-t="s4Title"></div></div>
    <div class="consent">
      <label class="chk"><input type="checkbox" id="consentChk" onchange="updateImportBtn()"> <span data-t="consent"></span></label>
    </div>
    <label class="chk" style="margin-bottom:8px"><input type="checkbox" id="publishChk" checked> <span data-t="publishStore"></span></label>
    <div class="row" style="margin-bottom:14px;align-items:center;gap:10px">
      <label class="chk" style="margin:0"><input type="checkbox" id="syncChk" checked> <span data-t="syncKeep"></span></label>
      <select id="syncHours" style="width:auto">
        <option value="6" data-t="sync6"></option>
        <option value="24" selected data-t="sync24"></option>
      </select>
    </div>
    <div class="row">
      <button class="btn-primary" id="importBtn" onclick="doImport()" disabled></button>
      <button class="btn-secondary" disabled data-t="excelSoon"></button>
    </div>
    <div class="progress" id="importProgress">
      <div class="progress-text" id="importText"></div>
      <div class="bar"><div id="importBar"></div></div>
    </div>
    <div class="result" id="resultBox"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

  function fmt(s, vars) { return String(s).replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m); }
  function toast(msg, isErr) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (isErr ? ' err' : '');
    el.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
  }

    document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = t(el.getAttribute('data-th')); });
    document.getElementById('srcUrl').placeholder = t('urlPh');
    document.getElementById('rCategory').placeholder = t('catPh');
    document.getElementById('rBrand').placeholder = t('brandPh');
    updateImportBtn();
  }

  // ---------- Kurallar ----------
  function rules() {
    return {
      base: document.getElementById('rPriceBase').value,
      margin: Math.max(0, parseFloat(document.getElementById('rMargin').value) || 0),
      round: document.getElementById('rRound').value,
      currency: document.getElementById('rCurrency').value,
      category: document.getElementById('rCategory').value.trim(),
      brand: document.getElementById('rBrand').value.trim(),
      site: lookupSite,
      siteSearch: lookupTpl,
    };
  }
  function applyRuleValues(r) {
    if (!r) return;
    if (r.base) document.getElementById('rPriceBase').value = r.base;
    if (r.margin != null) document.getElementById('rMargin').value = r.margin;
    if (r.round) document.getElementById('rRound').value = r.round;
    if (r.currency) document.getElementById('rCurrency').value = r.currency;
    if (r.category != null) document.getElementById('rCategory').value = r.category;
    if (r.brand != null) document.getElementById('rBrand').value = r.brand;
    if (r.site) lookupSite = r.site;
    if (r.siteSearch) lookupTpl = r.siteSearch;
  }
  function roundPrice(v, mode) {
    if (!(v > 0)) return null;
    if (mode === '1') return Math.ceil(v);
    if (mode === '5') return Math.ceil(v / 5) * 5;
    if (mode === '10') return Math.ceil(v / 10) * 10;
    if (mode === '99') return Math.ceil((v + 0.1) / 10) * 10 - 0.10;
    return Math.round(v * 100) / 100;
  }
  function calcPrice(it, r) {
    if (r.base === 'list' && it.list_price > 0) return roundPrice(it.list_price, r.round);
    if (!(it.price > 0)) return null;
    return roundPrice(it.price * (1 + r.margin / 100), r.round);
  }
  function itemCurrency(it, r) {
    if (r.currency && r.currency !== 'auto') return r.currency;
    return it.currency || 'TRY';
  }
  let rulesTimer = null;
  function onRulesChange() {
    clearTimeout(rulesTimer);
    rulesTimer = setTimeout(() => {
      const r = rules();
      items.forEach(it => { if (!it.priceEdited) it.newPrice = calcPrice(it, r); });
      renderPreview();
    }, 250);
  }
  async function loadRules() {
    const res = await db.from('import_rules').select('rules').eq('user_id', userId).maybeSingle();
    if (res.data && res.data.rules) applyRuleValues(res.data.rules);
  }
  async function saveRules() {
    const res = await db.from('import_rules').upsert({ user_id: userId, rules: rules(), updated_at: new Date().toISOString() });
    const el = document.getElementById('rulesMsg');
    if (res.error) { el.textContent = res.error.message; el.style.color = '#f28b8b'; return; }
    el.textContent = t('rulesSaved'); el.style.color = '#6ee7b7';
    setTimeout(() => { el.textContent = ''; }, 4000);
  }

  // ---------- Çekme ----------
  // ---------- ✨ Metni kanala göre yaz ----------
  let copyChannel = 'own_store', copyRunning = false, copyProgress = '';
  async function rewriteCopy() {
    if (copyRunning) return;
    const sel = items.filter(i => i.selected && !i.exists);
    if (!sel.length) { toast(t('copyNone'), true); return; }
    copyRunning = true;
    const BATCH = 8, total = sel.length;
    let done = 0, ok = 0, lastErr = '', idx = 0;
    copyProgress = fmt(t('copyRunning'), { d: 0, t: total });
    renderPreview();
    const batches = [];
    for (let i = 0; i < sel.length; i += BATCH) batches.push(sel.slice(i, i + BATCH));
    const worker = async () => {
      while (idx < batches.length) {
        const b = batches[idx++];
        try {
          const res = await fetch(HS.SUPABASE_URL + '/functions/v1/channel-copy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ channel: copyChannel, items: b.map(it => ({ name: it.name, description: it.description, specs: it.specs, brand: it.brand, category: it.category })) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error || !Array.isArray(data.items)) throw new Error(data.error || ('HTTP ' + res.status));
          data.items.forEach((o, k) => {
            if (!o || !o.title) return;
            b[k].name = o.title;
            b[k].description = o.description || b[k].description;
            b[k].key = itemKey(b[k]);
            ok++;
          });
        } catch (e) { lastErr = e.message || String(e); }
        done += b.length;
        copyProgress = fmt(t('copyRunning'), { d: Math.min(done, total), t: total });
        const btn = document.getElementById('copyBtn');
        if (btn) btn.textContent = copyProgress;
      }
    };
    await Promise.all([worker(), worker()]);
    copyRunning = false;
    renderPreview();
    if (lastErr) toast(t('copyErr') + lastErr, true);
    else toast(fmt(t('copyDone'), { n: HS.number(ok) }));
  }

  async function callImport(url) {
    const res = await fetch(HS.SUPABASE_URL + '/functions/v1/product-import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
      body: JSON.stringify({ url: url, language: HS.lang })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function setProgress(text, pct, sub) {
    document.getElementById('progress').style.display = 'block';
    document.getElementById('progressText').textContent = text;
    document.getElementById('progressBar').style.width = Math.max(0, Math.min(100, pct || 0)) + '%';
    document.getElementById('progressSub').textContent = sub || '';
  }

  function itemKey(it) {
    return (it.url || '') + '|' + (it.model_code || '') + '|' + (it.name || '');
  }

  function addItems(list) {
    const r = rules();
    const seen = new Set(items.map(i => i.key));
    list.forEach(raw => {
      if (!raw || !raw.name) return;
      const it = Object.assign({}, raw);
      it.images = Array.isArray(it.images) ? it.images : [];
      it.specs = Array.isArray(it.specs) ? it.specs : [];
      it.key = itemKey(it);
      if (seen.has(it.key)) return;
      seen.add(it.key);
      it.selected = true;
      it.exists = false;
      it.priceEdited = false;
      it.newPrice = calcPrice(it, r);
      items.push(it);
    });
  }

  function stopFetch() { stopFlag = true; }

  async function startFetch() {
    if (running) return;
    const url = document.getElementById('srcUrl').value.trim();
    if (!url) { toast(t('needUrl'), true); return; }
    running = true; stopFlag = false; sourceUrl = url;
    items = []; filter = 'all'; shown = PAGE_SIZE;
    document.getElementById('resultBox').style.display = 'none';
    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    document.getElementById('stopBtn').style.display = '';
    setProgress(t('fetching'), 5);

    try {
      const first = await callImport(url);
      if (first.kind === 'feed') {
        addItems(first.items || []);
        // Mağaza listesi sayfa sayfa gelir (Shopify / WooCommerce)
        let next = first.next_page || '';
        const seenFeed = new Set([url]);
        while (next && !seenFeed.has(next) && items.length < MAX_LINKS * 3 && !stopFlag) {
          seenFeed.add(next);
          setProgress(fmt(t('feedDone'), { n: HS.number(items.length) }), 50);
          renderPreview();
          try {
            const pr = await callImport(next);
            if (pr.kind !== 'feed' || !(pr.items || []).length) break;
            addItems(pr.items);
            next = pr.next_page || '';
          } catch (e) { break; }
        }
        setProgress(fmt(t('feedDone'), { n: HS.number(items.length) }), 100);
      } else if (first.kind === 'product') {
        addItems([first.item]);
        setProgress(fmt(t('fetchDone'), { n: 1 }), 100);
      } else if (first.kind === 'category') {
        // 1) Tüm sayfaları dolaşıp ürün linklerini topla
        let links = (first.links || []).slice();
        let next = first.next_page || '';
        let page = 1;
        const seenPages = new Set([url, first.url]);
        setProgress(fmt(t('scanning'), { n: links.length, p: page }), 10);
        while (next && !seenPages.has(next) && page < MAX_CATEGORY_PAGES && links.length < MAX_LINKS && !stopFlag) {
          seenPages.add(next);
          page++;
          try {
            const pr = await callImport(next);
            if (pr.kind !== 'category') break;
            const before = links.length;
            links = Array.from(new Set(links.concat(pr.links || [])));
            next = pr.next_page || '';
            if (links.length === before) break;
          } catch (e) { break; }
          setProgress(fmt(t('scanning'), { n: links.length, p: page }), 10);
        }
        links = links.slice(0, MAX_LINKS);

        // 2) Ürünleri aynı anda birkaç tane çek
        let done = 0, errors = 0, idx = 0;
        const total = links.length;
        const worker = async () => {
          while (idx < total && !stopFlag) {
            const my = links[idx++];
            try {
              const pr = await callImport(my);
              if (pr.kind === 'product' && pr.item) addItems([pr.item]);
              else errors++;
            } catch (e) { errors++; }
            done++;
            setProgress(fmt(t('pulling'), { d: HS.number(done), t: HS.number(total) }), 10 + (done / Math.max(1, total)) * 90,
              errors ? fmt(t('pullErr'), { e: errors }) : '');
            if (done % 10 === 0) renderPreview();
          }
        };
        await Promise.all(Array.from({ length: CONCURRENCY }, worker));
        setProgress(stopFlag ? fmt(t('stopped'), { n: HS.number(items.length) }) : fmt(t('fetchDone'), { n: HS.number(items.length) }), 100,
          errors ? fmt(t('pullErr'), { e: errors }) : '');
      }
      await markExisting();
      if (priceRows.length) await applyPriceList();
    } catch (e) {
      setProgress(t('fnError') + e.message, 0);
      toast(t('fnError') + e.message, true);
    } finally {
      running = false;
      btn.disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      renderPreview();
    }
  }

  // Daha önce eklenmiş ürünleri işaretle (aynı kaynak link ya da aynı model kodu)
  async function markExisting() {
    const urls = Array.from(new Set(items.map(i => i.url).filter(Boolean)));
    const codes = Array.from(new Set(items.map(i => i.model_code).filter(Boolean)));
    const existUrls = new Set(), existCodes = new Set();
    for (let i = 0; i < urls.length; i += 150) {
      const r = await db.from('products').select('source_url').eq('user_id', userId).is('deleted_at', null).in('source_url', urls.slice(i, i + 150));
      (r.data || []).forEach(x => existUrls.add(x.source_url));
    }
    for (let i = 0; i < codes.length; i += 150) {
      const r = await db.from('products').select('model_code').eq('user_id', userId).is('deleted_at', null).in('model_code', codes.slice(i, i + 150));
      (r.data || []).forEach(x => existCodes.add(x.model_code));
    }
    items.forEach(it => {
      it.exists = (it.url && existUrls.has(it.url)) || (it.model_code && existCodes.has(it.model_code));
      if (it.exists) it.selected = false;
    });
  }

  // PDF içindeki ürün resimlerini çıkarıp model kodlarına bağlar

  async function loadPdfJs() {
    if (pdfjsMod) return pdfjsMod;
    pdfjsMod = await import(PDFJS_BASE + 'pdf.min.mjs');
    pdfjsMod.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.mjs';

  function mulM(a, b) {
    return [a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1], a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
      a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];
  }
  async function extractPdfImages(file, codes, onPage) {
    const lib = await loadPdfJs();
    const OPS = lib.OPS;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const codeSet = new Map();
    codes.forEach(c => { const k = normCode(c); if (k.length >= 3) codeSet.set(k, c); });
    const result = new Map(); // normCode -> [dataUrl]
    const pageCount = Math.min(pdf.numPages, 300);
    for (let p = 1; p <= pageCount; p++) {
      if (onPage) onPage(p, pageCount);
      const page = await pdf.getPage(p);
      const base = page.getViewport({ scale: 1 });
      const pageArea = base.width * base.height;
      // 1) Resimlerin konumları
      const ops = await page.getOperatorList();
      let ctm = [1, 0, 0, 1, 0, 0];
      const stack = [];
      const boxes = [];
      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i], args = ops.argsArray[i];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
        else if (fn === OPS.transform) ctm = mulM(ctm, args);
        else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageXObjectRepeat) {
          const xs = [ctm[4], ctm[4] + ctm[0], ctm[4] + ctm[2], ctm[4] + ctm[0] + ctm[2]];
          const ys = [ctm[5], ctm[5] + ctm[1], ctm[5] + ctm[3], ctm[5] + ctm[1] + ctm[3]];
          const x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
          const w = Math.max.apply(null, xs) - x, h = Math.max.apply(null, ys) - y;
          if (w < 20 || h < 20) continue;               // çok küçük (ikon)
          if (w * h > pageArea * 0.5) continue;         // sayfa arka planı
          if (w / h > 4 || h / w > 4) continue;         // şerit / logo bandı
          boxes.push({ id: typeof args[0] === 'string' ? args[0] : null, x, y, w, h, cx: x + w / 2, cy: y + h / 2 });
        }
      }
      if (!boxes.length) continue;
      // 2) Model kodlarının konumları
      const tc = await page.getTextContent();
      const found = [];
      tc.items.forEach(it => {
        const s = normCode(it.str);
        if (s.length < 3) return;
        let hit = codeSet.get(s);
        if (!hit) codeSet.forEach((orig, k) => { if (!hit && k.length >= 5 && s.includes(k)) hit = orig; });
        if (hit) found.push({ code: hit, x: it.transform[4] + (it.width || 0) / 2, y: it.transform[5] + (it.height || 8) / 2 });
      });
      if (!found.length) continue;
      // 3) Sayfayı çiz, her resmi en yakın model koduna bağla
      const scale = 3;
      const vp = page.getViewport({ scale });
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      boxes.forEach(b => {
        let best = null, bestD = Infinity;
        found.forEach(f => {
          const dy = Math.abs(f.y - b.cy), dx = Math.abs(f.x - b.cx);
          const sameRow = f.y >= b.y - 4 && f.y <= b.y + b.h + 4;
          const d = sameRow ? dx * 0.2 + dy : dy + dx * 0.6 + 200;
          if (d < bestD) { bestD = d; best = f; }
        });
        if (!best || bestD > Math.max(b.h * 1.5, 120) + 200) return;
        let out = null;
        // Önce resmin PDF içindeki asıl (yüksek çözünürlüklü) halini dene
        try {
          const store = b.id && b.id.indexOf('g_') === 0 ? page.commonObjs : page.objs;
          const obj = b.id ? store.get(b.id) : null;
          if (obj && obj.bitmap && obj.width >= 80 && obj.height >= 80) {
            const k = Math.min(1, 1200 / Math.max(obj.width, obj.height));
            out = document.createElement('canvas');
            out.width = Math.round(obj.width * k); out.height = Math.round(obj.height * k);
            const octx = out.getContext('2d');
            octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
            octx.drawImage(obj.bitmap, 0, 0, out.width, out.height);
          }
        } catch (e) { out = null; }
        // Olmazsa sayfanın çizilmiş halinden kes
        if (!out) {
          const r = vp.convertToViewportRectangle([b.x, b.y, b.x + b.w, b.y + b.h]);
          const x0 = Math.max(0, Math.floor(Math.min(r[0], r[2]))), y0 = Math.max(0, Math.floor(Math.min(r[1], r[3])));
          const x1 = Math.min(cv.width, Math.ceil(Math.max(r[0], r[2]))), y1 = Math.min(cv.height, Math.ceil(Math.max(r[1], r[3])));
          if (x1 - x0 < 30 || y1 - y0 < 30) return;
          const k = Math.min(1, 900 / Math.max(x1 - x0, y1 - y0));
          out = document.createElement('canvas');
          out.width = Math.round((x1 - x0) * k); out.height = Math.round((y1 - y0) * k);
          const octx = out.getContext('2d');
          octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
          octx.drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
        }
        const key = normCode(best.code);
        const arr = result.get(key) || [];
        if (arr.length < 6) arr.push(out.toDataURL('image/jpeg', 0.88));
        result.set(key, arr);
      });
      page.cleanup();
    }
    return result;
  }


  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script'));
      document.head.appendChild(s);
    });
  }
  function bytesToBase64(bytes) {
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function normCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function numVal(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 0 ? Math.round(v * 100) / 100 : null;
    let s = String(v).replace(/[^\d.,]/g, '');
    if (!s) return null;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
    else if (ld > -1) { const pp = s.split('.'); if (pp.length > 2 || pp[1].length === 3) s = s.replace(/\./g, ''); }
    const n = parseFloat(s);
    return n > 0 ? Math.round(n * 100) / 100 : null;
  }
  function curOf(v) {
    const s = String(v || '').toUpperCase();
    if (/TRY|TL|₺/.test(s)) return 'TRY';
    if (/USD|\$/.test(s)) return 'USD';
    if (/EUR|€/.test(s)) return 'EUR';
    if (/GBP|£/.test(s)) return 'GBP';
    return null;
  }

  async function readPdf(file) {
    setProgress(t('fileLib'), 5);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
    const src = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    const n = src.getPageCount();
    const PER = 3;
    const parts = [];
    for (let i = 0; i < n; i += PER) {
      const doc = await PDFLib.PDFDocument.create();
      const idx = [];
      for (let k = i; k < Math.min(n, i + PER); k++) idx.push(k);
      const pages = await doc.copyPages(src, idx);
      pages.forEach(pg => doc.addPage(pg));
      parts.push(await doc.save());
    }
    const out = new Array(parts.length);
    let done = 0, next = 0, lastErr = '';
    // Beklerken takılmış gibi görünmesin: geçen süre + yavaşça ilerleyen çubuk
    const t0 = Date.now();
    const tick = () => {
      const sec = Math.round((Date.now() - t0) / 1000);
      const creep = done < parts.length ? Math.min(0.9, sec / 45) : 0;
      setProgress(fmt(t('fileReading'), { d: done, t: parts.length }) + ' · ' + fmt(t('secs'), { s: sec }),
        10 + Math.min(0.97, (done + creep) / parts.length) * 80);
    };
    tick();
    const timer = setInterval(tick, 1000);
    const worker = async () => {
      while (next < parts.length) {
        const my = next++;
        try {
          const res = await fetch(HS.SUPABASE_URL + '/functions/v1/price-list-parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ pdfBase64: 'data:application/pdf;base64,' + bytesToBase64(parts[my]), language: HS.lang })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
          out[my] = (data.rows || []).map(r => Object.assign({}, r, { page: my * PER + (r.page || 1) }));
        } catch (e) { lastErr = e.message; out[my] = []; }
        done++;
        tick();
      }
    };
    try { await Promise.all(Array.from({ length: Math.min(3, parts.length) }, worker)); }
    finally { clearInterval(timer); }
    const rows = [].concat.apply([], out);
    if (!rows.length && lastErr) throw new Error(lastErr);
    return rows;
  }

  async function readSheet(file) {
    setProgress(t('fileLib'), 10);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = [];
    const aiSheets = []; // sütunları tanınmayan sayfalar: yapay zekâ okur (satıcı şablon doldurmaz)
    for (const name of wb.SheetNames) {
      const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
      // Başlık satırını bul (ilk 20 satır içinde)
      let hi = -1, col = null;
      for (let r = 0; r < Math.min(20, data.length); r++) {
        const h = data[r].map(x => String(x || '').toLowerCase());
        const find = (re, not) => h.findIndex(x => re.test(x) && !(not && not.test(x)));
        const code = find(/model|kod|code|sku|stok\s*no|ürün\s*no|urun\s*no|mpn/);
        const list = find(/psf|tavsiye|liste|perakende|retail|msrp|son\s*kullan/);
        let price = find(/bayi|net|alış|alis|dealer|maliyet/);
        if (price < 0) price = find(/fiyat|price|tutar|birim/, /psf|tavsiye|liste|perakende|retail|msrp/);
        if (code >= 0 && (price >= 0 || list >= 0)) {
          col = { code, price, list, name: find(/ürün\s*ad|urun\s*ad|açıklama|aciklama|tanım|tanim|name|description|isim|ürün$|urun$/, /kod|code/), cur: find(/döviz|doviz|para|currency|kur|birim$/) };
          hi = r; break;
        }
      }
      if (hi < 0) { aiSheets.push(data); continue; }
      const headerCur = curOf(data[hi].join(' '));
      for (let r = hi + 1; r < data.length; r++) {
        const row = data[r];
        const code = String(row[col.code] || '').trim();
        const price = col.price >= 0 ? numVal(row[col.price]) : null;
        const list = col.list >= 0 ? numVal(row[col.list]) : null;
        if (!code || (!price && !list)) continue;
        rows.push({
          code: code.slice(0, 80),
          name: col.name >= 0 ? String(row[col.name] || '').slice(0, 200) : '',
          price: price || list, list_price: price ? list : null,
          currency: (col.cur >= 0 ? curOf(row[col.cur]) : null) || curOf(col.price >= 0 ? row[col.price] : '') || headerCur
        });
      }
    }
    if (aiSheets.length) {
      const lines = [];
      aiSheets.forEach(data => data.forEach(r => {
        const cells = r.map(x => String(x == null ? '' : x).replace(/[\t\r\n]+/g, ' ').trim());
        if (cells.some(Boolean)) lines.push(cells.join('\t'));
      }));
      const CHUNK = 250, parts = [];
      for (let i = 0; i < lines.length; i += CHUNK) parts.push(lines.slice(i, i + CHUNK).join('\n'));
      let done = 0;
      for (const part of parts.slice(0, 40)) {
        setProgress(fmt(t('sheetAi'), { d: done, t: parts.length }), 10 + done / parts.length * 80);
        const data = await callParse({ text: part });
        (data.rows || []).forEach(r => rows.push(r));
        done++;
      }
    }
    if (!rows.length) throw new Error(t('fileNoCols'));
    return rows;
  }

  // Okuma çağrısı; geçici hata (sunucu / yapay zekâ yoğunluğu) ya da boş sonuçta bir kez daha dener
  async function callParse(payload) {
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetch(HS.SUPABASE_URL + '/functions/v1/price-list-parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify(Object.assign({ language: HS.lang }, payload))
        });
        const data = await res.json().catch(() => ({}));
        if (res.status >= 400 && res.status < 500) throw Object.assign(new Error(data.error || ('HTTP ' + res.status)), { final: true });
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        const empty = payload.action ? !(data.matches || []).length : !(data.rows || []).length;
        if (empty && attempt === 0) { lastErr = null; continue; }
        return data;
      } catch (e) {
        lastErr = e;
        if (e.final) break;
      }
    }
    if (lastErr) throw lastErr;
    return payload.action ? { matches: [] } : { rows: [] };
  }

  // Görüntü dosyasını (fotoğraf / ekran görüntüsü; telefondan da) tuvale çiz
  function fileToCanvas(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
      img.src = url;
    });
  }
  // 0-1000 ölçekli kutuyu tuvalden kes (biraz pay bırakarak)
  function cropBox(cv, box) {
    const pad = 8;
    const x0 = Math.max(0, Math.floor(box[0] / 1000 * cv.width) - pad), y0 = Math.max(0, Math.floor(box[1] / 1000 * cv.height) - pad);
    const x1 = Math.min(cv.width, Math.ceil(box[2] / 1000 * cv.width) + pad), y1 = Math.min(cv.height, Math.ceil(box[3] / 1000 * cv.height) + pad);
    if (x1 - x0 < 40 || y1 - y0 < 40) return null;
    const k = Math.min(1, 1000 / Math.max(x1 - x0, y1 - y0));
    const out = document.createElement('canvas');
    out.width = Math.round((x1 - x0) * k); out.height = Math.round((y1 - y0) * k);
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.88);
  }
  async function readImages(files) {
    const rows = [];
    let done = 0;
    for (const f of files) {
      setProgress(fmt(t('imgReading'), { d: done, t: files.length }), 10 + done / files.length * 85);
      const cv = await fileToCanvas(f, 2000);
      const jpg = cv.toDataURL('image/jpeg', 0.85);
      const data = await callParse({ imageBase64: jpg });
      const got = data.rows || [];
      // Fotoğraf yerleri ayrı ve odaklı bir adımda bulunur (okuma sırasında verilen konum kaba olabiliyor)
      const boxes = new Map();
      if (got.length) {
        try {
          const pm = await callParse({ action: 'page_photos', imageBase64: jpg, rows: got.map((r, i) => ({ i: i, code: r.code, name: r.name })) });
          (pm.matches || []).forEach(m => { if (m.box) boxes.set(m.i, m.box); });
        } catch (e) { console.warn('fotoğraf yerleri bulunamadı', e); }
      }
      got.forEach((r, i) => {
        const box = boxes.get(i) || r.box;
        const im = box ? cropBox(cv, box) : null;
        rows.push(Object.assign({}, r, { images: im ? [im] : [], fileName: f.name }));
      });
      done++;
    }
    return rows;
  }

  // PDF: model koduyla eşleşmeyen ürünlerin fotoğrafı (kodsuz katalog / taranmış sayfa).
  // Sayfadaki resim alanları belliyse numaralanıp yapay zekâya hangisinin hangi ürün olduğu sorulur;
  // taranmış sayfada (resim alanı yok) fotoğrafın yerini yapay zekâ bulur.
  async function matchPdfPhotos(file, rows) {
    const need = new Map(); // sayfa -> [satır sırası]
    rows.forEach((r, i) => {
      if (pdfImageMap.get(normCode(r.code)) || (r.images && r.images.length) || !r.page) return;
      if (!need.has(r.page)) need.set(r.page, []);
      need.get(r.page).push(i);
    });
    if (!need.size) return;
    const lib = await loadPdfJs();
    const OPS = lib.OPS;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [...need.keys()].filter(p => p >= 1 && p <= pdf.numPages).sort((a, b) => a - b).slice(0, 60);
    let done = 0;
    for (const pno of pages) {
      setProgress(fmt(t('photoMatch'), { d: done, t: pages.length }), 90 + done / pages.length * 10);
      done++;
      try {
        const page = await pdf.getPage(pno);
        const base = page.getViewport({ scale: 1 });
        const pageArea = base.width * base.height;
        const ops = await page.getOperatorList();
        let ctm = [1, 0, 0, 1, 0, 0];
        const stack = [], boxes = [];
        for (let i = 0; i < ops.fnArray.length; i++) {
          const fn = ops.fnArray[i], args = ops.argsArray[i];
          if (fn === OPS.save) stack.push(ctm.slice());
          else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
          else if (fn === OPS.transform) ctm = mulM(ctm, args);
          else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageXObjectRepeat) {
            const xs = [ctm[4], ctm[4] + ctm[0], ctm[4] + ctm[2], ctm[4] + ctm[0] + ctm[2]];
            const ys = [ctm[5], ctm[5] + ctm[1], ctm[5] + ctm[3], ctm[5] + ctm[1] + ctm[3]];
            const x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
            const w = Math.max.apply(null, xs) - x, h = Math.max.apply(null, ys) - y;
            if (w < 20 || h < 20 || w * h > pageArea * 0.5 || w / h > 4 || h / w > 4) continue;
            boxes.push({ x, y, w, h });
          }
        }
        const scale = 2;
        const vp = page.getViewport({ scale });
        const cv = document.createElement('canvas');
        cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        const pageRows = need.get(pno).map(i => ({ i: i, code: rows[i].code, name: rows[i].name }));
        let payload, rects = [];
        if (boxes.length) {
          // Resim alanlarını numaralı kırmızı kutularla işaretle
          const mark = document.createElement('canvas');
          mark.width = cv.width; mark.height = cv.height;
          const mctx = mark.getContext('2d');
          mctx.drawImage(cv, 0, 0);
          mctx.lineWidth = 4; mctx.strokeStyle = '#ff0000'; mctx.fillStyle = '#ff0000'; mctx.font = 'bold 28px sans-serif';
          rects = boxes.slice(0, 60).map((b, k) => {
            const r = vp.convertToViewportRectangle([b.x, b.y, b.x + b.w, b.y + b.h]);
            const x0 = Math.min(r[0], r[2]), y0 = Math.min(r[1], r[3]), x1 = Math.max(r[0], r[2]), y1 = Math.max(r[1], r[3]);
            mctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
            mctx.fillText(String(k + 1), x0 + 6, y0 + 30);
            return { n: k + 1, box: [x0 / cv.width * 1000, y0 / cv.height * 1000, x1 / cv.width * 1000, y1 / cv.height * 1000] };
          });
          payload = { action: 'page_photos', imageBase64: mark.toDataURL('image/jpeg', 0.8), rows: pageRows, boxes: rects.map(r => ({ n: r.n })) };
        } else {
          payload = { action: 'page_photos', imageBase64: cv.toDataURL('image/jpeg', 0.8), rows: pageRows };
        }
        const data = await callParse(payload);
        (data.matches || []).forEach(m => {
          const row = rows[m.i];
          if (!row) return;
          const box = m.n ? (rects.find(r => r.n === m.n) || {}).box : m.box;
          const im = box ? cropBox(cv, box) : null;
          if (im) row.images = [im];
        });
        page.cleanup();
      } catch (e) { console.warn('sayfa fotoğrafları eşleştirilemedi', pno, e); }
    }
  }

  const SHEET_EXT = ['xlsx', 'xls', 'csv', 'ods', 'txt'];
  function fileKind(f) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf' || f.type === 'application/pdf') return 'pdf';
    if (SHEET_EXT.includes(ext)) return 'sheet';
    if (/^image\//.test(f.type) || ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'heic', 'heif'].includes(ext)) return 'image';
    return null;
  }
  async function onFilesPicked(list) {
    if (!list || !list.length || running) return;
    const files = Array.from(list);
    const bad = files.filter(f => !fileKind(f));
    if (bad.length) { toast(fmt(t('fileBad'), { n: bad.map(f => f.name).join(', ') }), true); }
    const ok = files.filter(f => fileKind(f));
    if (ok.length) await onFilePicked(ok);
  }
  async function onFilePicked(files) {
    if (!Array.isArray(files)) files = [files];
    if (!files.length || running) return;
    const box = document.getElementById('fileResult');
    box.style.display = 'none';
    running = true;
    document.getElementById('stopBtn').style.display = 'none';
    const exts = new Set();
    try {
      let rows = [];
      pdfImageMap = new Map();
      const images = files.filter(f => fileKind(f) === 'image');
      for (const file of files) {
        const kind = fileKind(file);
        exts.add((file.name.split('.').pop() || '').toUpperCase());
        if (kind === 'pdf') {
          const pr = await readPdf(file);
          if (pr.length) {
            try {
              const m = await extractPdfImages(file, pr.map(r => r.code).filter(Boolean),
                (d, n) => setProgress(fmt(t('pdfImgs'), { d: d, t: n }), 85 + d / n * 5));
              m.forEach((v, k) => pdfImageMap.set(k, v));
            } catch (e) { console.warn('PDF resimleri çıkarılamadı', e); }
            try { await matchPdfPhotos(file, pr); } catch (e) { console.warn('PDF fotoğraf eşleştirme', e); }
          }
          rows = rows.concat(pr);
        } else if (kind === 'sheet') {
          rows = rows.concat(await readSheet(file));
        }
      }
      if (images.length) rows = rows.concat(await readImages(images));
      const file = files[0];
      const vat = parseFloat(document.getElementById('vatSel').value) || 0;
      if (vat) rows = rows.map(r => Object.assign({}, r, {
        price: r.price ? Math.round(r.price * (1 + vat / 100) * 100) / 100 : r.price,
        list_price: r.list_price ? Math.round(r.list_price * (1 + vat / 100) * 100) / 100 : r.list_price
      }));
      priceRows = rows;
      if (!rows.length) throw new Error(t('fileNoRows'));
      sourceUrl = files.length > 1 ? files.map(f => f.name).join(', ').slice(0, 300) : file.name;
      await applyPriceList();
      setProgress(fmt(t('feedDone'), { n: HS.number(rows.length) }).replace('XML', Array.from(exts).join('/')), 100);
    } catch (e) {
      setProgress(t('fnError') + e.message, 0);
      toast(t('fnError') + e.message, true);
    } finally {
      running = false;
    }
    if (priceRows.length) await autoComplete();
  }

  function findRow(code, byNorm) {
    const n = normCode(code);
    if (!n) return null;
    if (byNorm.has(n)) return byNorm.get(n);
    if (n.length < 5) return null;
    let hit = null, count = 0;
    byNorm.forEach((row, k) => { if (k.length >= 5 && (k.includes(n) || n.includes(k))) { hit = row; count++; } });
    return count === 1 ? hit : null;
  }

  function rowToItem(u) {
    return {
      url: '', name: u.name || u.code, price: u.price, list_price: u.list_price, currency: u.currency,
      model_code: u.code, brand: u.brand || '', category: '', description: '',
      images: (u.images && u.images.length ? u.images : (pdfImageMap.get(normCode(u.code)) || [])).slice(), specs: [], stock: null
    };
  }

  async function applyPriceList() {
    // Önizleme boşsa (sadece dosya yüklendiyse) dosyadaki ürünler doğrudan önizlemeye gelir
    const fromFile = !items.length;
    if (fromFile) {
      addItems(priceRows.filter(u => u.code || u.name).map(rowToItem));
      await markExisting();
    }
    const r = rules();
    const byNorm = new Map();
    priceRows.forEach(row => { const k = normCode(row.code); if (k && !byNorm.has(k)) byNorm.set(k, row); });
    const used = new Set();

    // 1) Önizlemedeki ürünler
    let filled = 0;
    items.forEach(it => {
      const row = findRow(it.model_code, byNorm);
      if (!row) return;
      used.add(row);
      it.price = row.price;
      if (row.list_price) it.list_price = row.list_price;
      if (row.currency) it.currency = row.currency;
      if (!it.images.length && row.images && row.images.length) it.images = row.images.slice();
      if (!it.priceEdited) it.newPrice = calcPrice(it, r);
      filled++;
    });
    items.forEach(it => {
      if (!it.images.length) { const im = pdfImageMap.get(normCode(it.model_code)); if (im && im.length) it.images = im.slice(); }
    });
    const previewCodes = new Set(items.map(i => normCode(i.model_code)).filter(Boolean));

    // 2) Paneldeki mevcut ürünler
    dbUpdates = [];
    const res = await db.from('products').select('id, name, model_code, supplier_price, sale_price, cost_currency')
      .eq('user_id', userId).is('deleted_at', null).not('model_code', 'is', null).limit(5000);
    (res.data || []).forEach(p => {
      if (previewCodes.has(normCode(p.model_code))) return;
      const row = findRow(p.model_code, byNorm);
      if (!row) return;
      used.add(row);
      const it = { price: row.price, list_price: row.list_price };
      const newSale = calcPrice(it, r);
      const cur = (r.currency && r.currency !== 'auto') ? r.currency : (row.currency || p.cost_currency || 'TRY');
      if (Number(p.supplier_price) === row.price && Number(p.sale_price) === newSale) return;
      dbUpdates.push({ id: p.id, name: p.name, code: p.model_code, oldCost: Number(p.supplier_price) || 0, newCost: row.price, oldSale: Number(p.sale_price) || 0, newSale: newSale, cur: cur, selected: true });
    });

    unmatchedRows = fromFile ? [] : priceRows.filter(row => !used.has(row));
    renderFileResult(filled, fromFile);
    renderPreview();
  }

  function renderFileResult(filled, fromFile) {
    const box = document.getElementById('fileResult');
    box.style.display = 'block';
    const withPdfImg = items.filter(i => i.images.some(u => String(u).indexOf('data:') === 0)).length;
    const summary = fromFile
      ? fmt(t('fileSummaryNew'), { n: HS.number(items.length), u: HS.number(dbUpdates.length) })
      : fmt(t('fileSummary'), { n: HS.number(priceRows.length), p: HS.number(filled || 0), u: HS.number(dbUpdates.length), x: HS.number(unmatchedRows.length) });
    let h = '<div class="stat-line">' + summary + (withPdfImg ? fmt(t('fileImgs'), { n: HS.number(withPdfImg) }) : '') + '</div>';
    if (dbUpdates.length) {
      h += '<div style="margin-top:14px;font-weight:600;color:#fff;font-size:14px">' + esc(t('updTitle')) + '</div>' +
        '<div class="table-wrap" style="margin-top:8px"><table class="mini-table"><thead><tr><th></th><th>' + esc(t('thProduct')) + '</th><th>' + esc(t('thCode')) + '</th>' +
        '<th class="num">' + esc(t('thOldCost')) + '</th><th class="num">' + esc(t('thNewCost')) + '</th><th class="num">' + esc(t('thNewSale')) + '</th></tr></thead><tbody>' +
        dbUpdates.slice(0, 300).map((u, i) => '<tr><td><input type="checkbox" ' + (u.selected ? 'checked' : '') + ' onchange="dbUpdates[' + i + '].selected=this.checked;updBtnText()"></td>' +
          '<td>' + esc(u.name || '') + '</td><td>' + esc(u.code) + '</td>' +
          '<td class="num">' + esc(HS.money(u.oldCost, u.cur)) + '</td>' +
          '<td class="num ' + (u.newCost > u.oldCost ? 'up' : 'down') + '">' + esc(HS.money(u.newCost, u.cur)) + '</td>' +
          '<td class="num">' + (u.newSale ? esc(HS.money(u.newSale, u.cur)) : '–') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="row" style="margin-top:10px"><div class="spacer"></div><button class="btn-primary btn-small" id="updBtn" onclick="applyDbUpdates()"></button></div>';
    }
    if (unmatchedRows.length) {
      h += '<details><summary>' + esc(fmt(t('unmatchedTitle'), { n: unmatchedRows.length })) + '</summary>' +
        '<div class="spec-list" style="max-height:220px;overflow:auto">' + unmatchedRows.slice(0, 200).map(u => '<div><span>' + esc(u.code || '–') + '</span> · ' + esc(u.name || '') + ' · ' + esc(HS.money(u.price, u.currency || 'TRY')) + '</div>').join('') + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="btn-secondary btn-small" onclick="addUnmatched()">' + esc(fmt(t('addUnmatched'), { n: unmatchedRows.length })) + '</button></div></details>';
    }
    box.innerHTML = h;
    updBtnText();
  }
  function updBtnText() {
    const b = document.getElementById('updBtn');
    if (!b) return;
    const n = dbUpdates.filter(u => u.selected).length;
    b.textContent = fmt(t('updBtn'), { n: n });
    b.disabled = !n;
  }

  function addUnmatched() {
    const list = unmatchedRows.filter(u => u.code || u.name).map(rowToItem);
    addItems(list);
    toast(fmt(t('addedUnmatched'), { n: list.length }));
    unmatchedRows = [];
    renderFileResult(null);
    renderPreview();
    autoComplete();
  }

  async function applyDbUpdates() {
    const sel = dbUpdates.filter(u => u.selected);
    if (!sel.length) return;
    const b = document.getElementById('updBtn');
    b.disabled = true;
    let ok = 0, fail = 0, lastErr = '';
    for (const u of sel) {
      const up = await db.from('products').update({ supplier_price: u.newCost, sale_price: u.newSale || u.oldSale, cost_currency: u.cur }).eq('id', u.id);
      if (up.error) { fail++; lastErr = up.error.message; continue; }
      if (u.newSale) {
        let price = u.newSale;
        if (u.cur !== 'TRY') { const c = await HS.convert(price, u.cur, 'TRY'); if (c != null) price = Math.round(c * 100) / 100; }
        await db.from('listings').update({ price: price }).eq('product_id', u.id).eq('marketplace_code', 'own_store');
      }
      ok++;
    }
    dbUpdates = dbUpdates.filter(u => !u.selected);
    renderFileResult(null);
    toast(fail ? fmt(t('updFail'), { n: ok, e: fail, m: lastErr }) : fmt(t('updDone'), { n: ok }), !!fail);
  }

  // ---------- Eksikleri üretici sitesinden tamamla (otomatik) ----------
  async function callLookup(body) {
    const res = await fetch(HS.SUPABASE_URL + '/functions/v1/product-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ language: HS.lang }, body))
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }
  function normSiteC(v) {
    const s = String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[\/?#\s]/)[0];
    return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(s) ? s : '';
  }
  // Site bilgisini kurallara ekle (diğer kural ayarlarına dokunmadan)
  async function saveRulesPatch(patch) {
    try {
      const cur = await db.from('import_rules').select('rules').eq('user_id', userId).maybeSingle();
      const r = Object.assign({}, (cur.data && cur.data.rules) || {}, patch);
      await db.from('import_rules').upsert({ user_id: userId, rules: r, updated_at: new Date().toISOString() });
    } catch (e) { console.warn('rules patch', e); }
  }
  function needsLookup(it) {
    return !it.lookupDone && normCode(it.model_code).length >= 3 && (!it.images.length || !it.specs.length);
  }
  function renderLookupBar() {
    const el = document.getElementById('lookupBar');
    const s = lookupState;
    if (!s) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'block';
    const site = esc(lookupSite);

    else if (s.mode === 'running') h = fmt(t('lkRunning'), { site: site, d: HS.number(s.d), t: HS.number(s.t) });

    else if (s.mode === 'stopped') h = fmt(t('lkStopped'), { site: site, f: HS.number(s.f) }) + ' · <a onclick="changeSite()">' + esc(t('lkChange')) + '</a>';

  }
  function mergeLookup(it, x, url) {
    it.lkFilled = it.lkFilled || {};
    if (!it.images.length && Array.isArray(x.images) && x.images.length) { it.images = x.images.slice(0, 12); it.lkFilled.images = true; }
    if (!it.specs.length && Array.isArray(x.specs) && x.specs.length) { it.specs = x.specs.slice(0, 80); it.lkFilled.specs = true; }
    if (!it.description && x.description) { it.description = x.description; it.lkFilled.description = true; }
    if (!it.brand && x.brand) { it.brand = x.brand; it.lkFilled.brand = true; }
    if (!it.category && x.category) { it.category = x.category; it.lkFilled.category = true; }
    if (!it.url && url) { it.url = url; it.lkFilled.url = true; }
  }
  // Önceki siteden gelen bilgileri geri al (site değiştirilince)
  function undoLookup(it) {
    const f = it.lkFilled || {};
    if (f.images) it.images = [];
    if (f.specs) it.specs = [];
    if (f.description) it.description = '';
    if (f.brand) it.brand = '';
    if (f.category) it.category = '';
    if (f.url) it.url = '';
    it.lkFilled = {};
    it.lookupDone = false;
    it.lookupFound = false;
  }

  async function autoComplete() {
    if (running) return;
    const todo = items.filter(needsLookup);
    if (!todo.length) return;
    running = true; stopFlag = false;
    document.getElementById('stopBtn').style.display = '';
    try {
      // 1) Site bilinmiyorsa kendimiz bulalım
      if (!lookupSite) {
        lookupState = { mode: 'finding' }; renderLookupBar();
        const r = rules();
        const brand = r.brand || (items.find(i => i.brand) || {}).brand || '';
        try {
          const res = await callLookup({ action: 'site', brand: brand, hint: sourceUrl, samples: todo.slice(0, 8).map(i => ({ code: i.model_code, name: i.name })) });
          const site = normSiteC(res.site);
          if (site) { lookupSite = site; lookupTpl = ''; lookupSkip = false; await saveRulesPatch({ site: site, siteSearch: '' }); }
        } catch (e) { console.warn('site', e); }
      }
      if (!lookupSite) { lookupState = { mode: 'nosite' }; renderLookupBar(); return; }

      // 2) Her ürünü sitede ara (aynı anda 4 ürün)
      const r = rules();
      let idx = 0, d = 0, f = 0, noTpl = 0;
      const total = todo.length;
      lookupState = { mode: 'running', d: 0, t: total }; renderLookupBar();
      const worker = async () => {
        while (idx < total && !stopFlag) {
          const it = todo[idx++];
          try {
            const res = await callLookup({
              action: 'find', site: lookupSite, brand: r.brand || it.brand || '', code: it.model_code, name: it.name,
              searchTpl: lookupTpl, skipSiteSearch: lookupSkip
            });
            if (res.searchTpl && res.searchTpl !== lookupTpl) { lookupTpl = res.searchTpl; saveRulesPatch({ siteSearch: lookupTpl }); }
            if (!lookupTpl && ++noTpl >= 3) lookupSkip = true; // sitenin araması çalışmıyor, sadece internet aramasıyla devam
            it.lookupDone = true;
            it.lookupFound = !!res.found;
            if (res.found && res.item) { mergeLookup(it, res.item, res.url); f++; }
          } catch (e) {
            console.warn('lookup', it.model_code, e);
            it.lookupDone = true; it.lookupFound = false;
          }
          d++;
          lookupState = { mode: 'running', d: d, t: total }; renderLookupBar();
          if (d % 4 === 0) renderPreview();
        }
      };
      await Promise.all(Array.from({ length: 4 }, worker));
      const nf = todo.filter(i => i.lookupDone && !i.lookupFound).length;
      lookupState = stopFlag ? { mode: 'stopped', f: f } : { mode: 'done', f: f, n: nf };
      renderLookupBar();
    } finally {
      running = false;
      document.getElementById('stopBtn').style.display = 'none';
      renderPreview();
    }
  }

  async function changeSite() {
    if (running) return;
    const v = prompt(t('lkAsk'), lookupSite || '');
    if (v == null) return;
    const site = normSiteC(v);
    if (!site) { toast(t('lkBadSite'), true); return; }
    if (site !== lookupSite) {
      lookupSite = site; lookupTpl = ''; lookupSkip = false;
      await saveRulesPatch({ site: site, siteSearch: '' });
      items.forEach(it => { if (it.lookupDone) undoLookup(it); });
    } else {
      items.forEach(it => { if (it.lookupDone && !it.lookupFound) undoLookup(it); });
    }
    renderPreview();
    await autoComplete();
  }

  // ---------- Aktar ----------
  function fullDescription(it) {
    let d = (it.description || '').trim();
    if (it.specs.length) {
      d += (d ? '\n\n' : '') + t('specsHeader') + ':\n' + it.specs.map(s => '• ' + s.k + ': ' + s.v).join('\n');
    }
    return d.slice(0, 8000);
  }

  async function dataUrlToBlob(u) { const r = await fetch(u); return await r.blob(); }
  // PDF'ten gelen (data:) resimleri depoya yükleyip gerçek adrese çevirir
  async function uploadPdfImages(list) {
    const todo = [];
    list.forEach(it => it.images.forEach((u, j) => { if (String(u).indexOf('data:') === 0) todo.push({ it: it, j: j }); }));
    let done = 0;
    for (const x of todo) {
      done++;
      document.getElementById('importText').textContent = fmt(t('uploadingImgs'), { d: done, t: todo.length });
      try {
        const blob = await dataUrlToBlob(x.it.images[x.j]);
        const path = userId + '/pdf/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        const up = await db.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
        if (up.error) throw up.error;
        x.it.images[x.j] = db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
      } catch (e) { console.warn('resim yüklenemedi', e); x.it.images[x.j] = null; }
    }
    list.forEach(it => { it.images = it.images.filter(Boolean); });
  }

  async function doImport() {
    const sel = items.filter(i => i.selected);
    if (!sel.length) return;
    if (!document.getElementById('consentChk').checked) { toast(t('needConsent'), true); return; }
    const dupN = sel.filter(i => i.exists).length;
    if (dupN && !confirm(fmt(t('confirmDup'), { n: dupN }))) return;
    const r = rules();
    const publish = document.getElementById('publishChk').checked;
    const sync = document.getElementById('syncChk').checked;
    const syncHours = Number(document.getElementById('syncHours').value) === 6 ? 6 : 24;
    const btn = document.getElementById('importBtn');
    btn.disabled = true;
    const resBox = document.getElementById('resultBox');
    resBox.style.display = 'none';
    document.getElementById('importProgress').style.display = 'block';

    // Kullanım hakkı onayı kaydı
    await db.from('import_consents').insert({ user_id: userId, source_url: sourceUrl, item_count: sel.length, consent_text: t('consentLog') });

    await uploadPdfImages(sel);

    let added = 0, failed = 0, lastErr = '', imgErr = '';
    const CHUNK = 40;
    for (let i = 0; i < sel.length; i += CHUNK) {
      const chunk = sel.slice(i, i + CHUNK);
      document.getElementById('importText').textContent = fmt(t('importing'), { d: HS.number(Math.min(i + chunk.length, sel.length)), t: HS.number(sel.length) });
      document.getElementById('importBar').style.width = ((i + chunk.length) / sel.length * 100) + '%';
      try {
        const rows = chunk.map(it => ({
          user_id: userId,
          name: it.name.slice(0, 300),
          supplier_price: it.price > 0 ? it.price : 0,
          weight_kg: 0,
          platform: null,
          commission_rate: 0,
          sale_price: it.newPrice > 0 ? it.newPrice : 0,
          generated_title: it.name.slice(0, 300),
          generated_description: fullDescription(it),
          // AliExpress'ten gelen ürün: tedarikçili (siparişi otomatik AliExpress / CJ eşdeğerinden verilir)
          supplier: it.source_platform === 'aliexpress' && it.source_item_id ? 'aliexpress' : null,
          supplier_item_id: it.source_platform === 'aliexpress' ? (it.source_item_id || null) : null,
          supplier_cost: it.source_platform === 'aliexpress' && it.price > 0 ? it.price : null,
          image_url: it.images[0] || null,
          cost_currency: itemCurrency(it, r),
          content_language: 'tr',
          store_visible: publish,
          specs: it.specs.length ? it.specs : null,
          source_url: it.url || null,
          source_platform: it.source_platform || (it.url ? 'web' : null),
          source_item_id: it.source_item_id || null,
          source_sync: !!(sync && it.url),
          source_sync_hours: syncHours,
          stock_qty: Number.isFinite(it.stock) && it.stock !== null ? it.stock : null,
          model_code: it.model_code || null,
          brand: r.brand || it.brand || null
        }));
        const ins = await db.from('products').insert(rows).select('id, source_url, model_code, name');
        if (ins.error) throw ins.error;
        const created = ins.data || [];
        // Oluşan kayıtları ürünlerle eşleştir
        const pairs = chunk.map((it, k) => {
          let row = created[k];
          if (!row || row.name !== rows[k].name) row = created.find(c => c.name === rows[k].name && (c.source_url || null) === rows[k].source_url && (c.model_code || null) === rows[k].model_code);
          return row ? { it: it, id: row.id } : null;
        }).filter(Boolean);

        // Görseller
        const imgRows = [];
        pairs.forEach(p => p.it.images.slice(0, 12).forEach((u, pos) => imgRows.push({ product_id: p.id, user_id: userId, url: u, position: pos, source: 'supplier' })));
        if (imgRows.length) {
          const ir = await db.from('product_images').insert(imgRows);
          if (ir.error) { imgErr = ir.error.message; console.warn('product_images', ir.error); }
        }

        // Seçenekler (beden, renk...): varsayılan seçeneğe ek olarak her biri ayrı kayıt
        const varRows = [];
        pairs.forEach(p => (p.it.variants || []).slice(0, 100).forEach((v, k) => {
          if (!v || !v.attributes || !Object.keys(v.attributes).length) return;
          varRows.push({
            product_id: p.id, user_id: userId, sku: 'HS-' + p.id + '-' + (k + 1),
            supplier_variant_id: v.supplier_variant_id || null, supplier_sku: v.sku || null,
            attributes: v.attributes, cost: v.price > 0 ? v.price : null, cost_currency: itemCurrency(p.it, r),
            stock_qty: Number.isFinite(v.stock) && v.stock !== null ? v.stock : null,
            stock_status: v.stock === 0 ? 'tukendi' : null, image_url: v.image || null, is_default: false, is_active: true
          });
        }));
        for (let k = 0; k < varRows.length; k += 500) {
          const vr = await db.from('product_variants').insert(varRows.slice(k, k + 500));
          if (vr.error) { imgErr = vr.error.message; console.warn('product_variants', vr.error); }
        }

        // Kendi mağazada yayın
        if (publish && pairs.length) {
          const listingRows = [];
          for (const p of pairs) {
            let price = p.it.newPrice > 0 ? p.it.newPrice : 0;
            const cur = itemCurrency(p.it, r);
            if (cur !== 'TRY' && price > 0) {
              const conv = await HS.convert(price, cur, 'TRY');
              price = conv != null ? Math.round(conv * 100) / 100 : price;
            }
            listingRows.push({
              user_id: userId, product_id: p.id, source_product_id: p.id,
              marketplace_code: 'own_store', language: 'tr', currency: 'TRY',
              title: p.it.name.slice(0, 300), description: fullDescription(p.it), keywords: [],
              category_key: null, price: price, commission_pct: 0, vat_payer: 'seller',
              price_mode: 'manual', status: 'published', published_at: new Date().toISOString()
            });
          }
          const li = await db.from('listings').insert(listingRows).select('id, product_id, price, status');
          if (li.error) throw li.error;
          const ids = pairs.map(p => p.id);
          const vr = await db.from('product_variants').select('id, product_id').in('product_id', ids).eq('is_default', true);
          const vmap = {};
          (vr.data || []).forEach(v => { vmap[v.product_id] = v.id; });
          const lvRows = (li.data || []).filter(l => vmap[l.product_id]).map(l => ({ listing_id: l.id, variant_id: vmap[l.product_id], user_id: userId, price: l.price, status: l.status }));
          if (lvRows.length) await db.from('listing_variants').insert(lvRows);
        }
        // AliExpress ürünleri için CJ eşdeğeri araması arka planda başlasın (saatlik görev de tekrar dener)
        pairs.filter(p => p.it.source_platform === 'aliexpress').forEach(p => {
          fetch(HS.SUPABASE_URL + '/functions/v1/cj-alt-match', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
            body: JSON.stringify({ productId: p.id })
          }).catch(() => {});
        });
        added += pairs.length;
        pairs.forEach(p => { p.it.selected = false; p.it.exists = true; });
      } catch (e) {
        failed += chunk.length;
        lastErr = e.message || String(e);
        console.error(e);
      }
    }

    document.getElementById('importProgress').style.display = 'none';
    resBox.style.display = 'block';
    if (failed) {
      resBox.className = 'result err';
      resBox.innerHTML = esc(fmt(t('importPartial'), { n: added, e: failed, m: lastErr })) + ' <a href="dashboard.html">' + esc(t('goPanel')) + '</a>';
    } else {
      resBox.className = 'result ok';
      resBox.innerHTML = esc(fmt(t('importDone'), { n: HS.number(added) })) + ' <a href="dashboard.html">' + esc(t('goPanel')) + '</a>';
    }
    if (imgErr) {
      resBox.innerHTML += '<div style="color:#e6c96a;margin-top:6px">' + esc(t('imgSaveErr') + imgErr) + '</div>';
    }
    renderPreview();
  }

  window.addEventListener('beforeunload', (e) => {
    if (running) { e.preventDefault(); e.returnValue = t('confirmLeave'); return t('confirmLeave'); }
  });
  document.getElementById('srcUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') startFetch(); });

  // ---------- Başlat ----------
  (async function start() {
    applyStatic();
    const ctx = await HS.init();
    if (!ctx) return;
    userId = ctx.user.id;
    document.getElementById('userEmail').textContent = ctx.user.email || '';
    document.getElementById('stopBtn').style.display = 'none';
    applyStatic();
    await loadRules();
    renderPreview();
  })();

  window.addEventListener('hs:langchange', () => { applyStatic(); renderPreview(); });
</script>
