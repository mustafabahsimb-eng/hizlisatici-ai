<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Baskı Sağlayıcıları</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; line-height: 1.5; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 11px 18px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .card { background: #141821; border-radius: 14px; border: 1px solid #232838; padding: 22px; margin-bottom: 20px; }
  .card-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .search-row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: #1c212c; border: 1px solid #2a3040; border-radius: 8px;
    padding: 10px 12px; color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  input[type=text]:focus { border-color: #1D9E75; }
  .hint { font-size: 12px; color: #9aa3b2; margin-top: 8px; }

  .bp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .bp {
    background: #1c212c; border: 1px solid #2a3040; border-radius: 10px; padding: 10px;
    cursor: pointer; font-size: 12px; line-height: 1.4;
  }
  .bp:hover { border-color: #3a4258; }
  .bp.sel { border-color: #1D9E75; background: #123222; }
  .bp img { width: 100%; height: 100px; object-fit: contain; border-radius: 6px; background: #0d0f16; margin-bottom: 8px; }
  .bp-brand { color: #9aa3b2; }

  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
  .msg.error { background: #2a1414; color: #f28b8b; }
  .msg.info { background: #142230; color: #7db8e6; }

  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: #cfd5e2; }
  .filter-row input { width: auto; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px; }
  th { text-align: left; font-weight: 500; color: #9aa3b2; padding: 10px 12px; border-bottom: 1px solid #232838; white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid #232838; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .prov-name { color: #fff; font-weight: 500; }
  .prov-loc { color: #9aa3b2; font-size: 12px; margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; display: inline-block; }
  .badge-eu { background: #123222; color: #6ee7b7; }
  .badge-europe { background: #142230; color: #7db8e6; }
  .badge-other { background: #232838; color: #9aa3b2; }
  .price { white-space: nowrap; }
  .price.best { color: #6ee7b7; font-weight: 600; }
  .price.na { color: #5a6376; }
  .legend { font-size: 12px; color: #9aa3b2; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1>Baskı Sağlayıcıları</h1>
      <div class="subtitle">Bir ürün türü seç, Printify'daki atölyeleri konumlarına, üretim sürelerine ve kargo ücretlerine göre karşılaştır.</div>
    </div>
    <a href="dashboard.html" class="back-link">← Panele dön</a>
  </div>

  <div class="card">
    <div class="card-title">1. Ürün türünü ara</div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Örn: tişört, kupa, hoodie, poster" onkeydown="if(event.key==='Enter') searchBlueprints()">
      <button class="btn-primary" id="searchBtn" onclick="searchBlueprints()">Ara</button>
    </div>
    <div class="hint">Türkçe ya da İngilizce yazabilirsin.</div>
    <div id="searchMsg"></div>
    <div class="bp-list" id="bpList"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="card-title" id="resultTitle">2. Sağlayıcılar</div>
    <div id="resultMsg"></div>
    <div id="resultBody"></div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const COUNTRY_NAMES = { DE: 'Almanya', PL: 'Polonya', IT: 'İtalya', GB: 'İngiltere', US: 'ABD', CA: 'Kanada' };
  const REGION_LABEL = { eu: 'Avrupa Birliği', europe: 'Avrupa (AB dışı)', other: 'Diğer' };

  let compareData = null;
  let selectedBp = null;

  async function callFn(name, body) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; throw new Error('Oturum yok'); }
    const response = await fetch(SUPABASE_URL + '/functions/v1/' + name, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY,
      },
      body: JSON.stringify(Object.assign({ userAccessToken: session.access_token }, body)),
    });
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || 'Bilinmeyen hata');
    return data;
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    document.getElementById('userEmail').textContent = session.user.email;
  }

  async function searchBlueprints() {
    const q = document.getElementById('searchInput').value.trim();
    const btn = document.getElementById('searchBtn');
    const msg = document.getElementById('searchMsg');
    const list = document.getElementById('bpList');
    if (!q) { msg.innerHTML = '<div class="msg error">Bir ürün türü yaz.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Aranıyor...';
    msg.innerHTML = ''; list.innerHTML = '';
    try {
      const r = await callFn('printify-catalog', { action: 'search', query: q });
      if (!r.blueprints.length) {
        msg.innerHTML = '<div class="msg info">Sonuç bulunamadı, başka bir kelime dene.</div>';
      } else {
        list.innerHTML = r.blueprints.map((b, i) =>
          '<div class="bp" id="bp' + i + '" onclick="pickBlueprint(' + b.id + ', ' + i + ')">' +
          (b.image ? '<img src="' + escapeHtml(b.image) + '" alt="">' : '') +
          '<div>' + escapeHtml(b.title) + '</div><div class="bp-brand">' + escapeHtml(b.brand || '') + '</div></div>'
        ).join('');
        window._bps = r.blueprints;
      }
    } catch (err) {
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
    } finally {
      btn.disabled = false; btn.textContent = 'Ara';
    }
  }

  async function pickBlueprint(id, idx) {
    document.querySelectorAll('.bp').forEach(el => el.classList.remove('sel'));
    const el = document.getElementById('bp' + idx);
    if (el) el.classList.add('sel');
    selectedBp = (window._bps || []).find(b => b.id === id) || { id: id, title: '' };

    const card = document.getElementById('resultCard');
    const body = document.getElementById('resultBody');
    const msg = document.getElementById('resultMsg');
    card.style.display = 'block';
    document.getElementById('resultTitle').textContent = '2. Sağlayıcılar: ' + (selectedBp.title || '');
    body.innerHTML = '';
    msg.innerHTML = '<div class="msg info">Sağlayıcılar ve kargo ücretleri getiriliyor, birkaç saniye sürebilir...</div>';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try {
      compareData = await callFn('printify-eu-providers', { action: 'compare', blueprintId: id });
      msg.innerHTML = '';
      renderTable();
    } catch (err) {
      compareData = null;
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
    }
  }

  function fmtMoney(c) {
    return (c.currency === 'USD' || !c.currency ? '$' : escapeHtml(c.currency) + ' ') + (c.cost / 100).toFixed(2);
  }
  function fmtHandling(h) {
    if (!h || h.value == null) return '-';
    const unit = h.unit === 'day' || h.unit === 'days' ? 'gün' : (h.unit || '');
    return escapeHtml(String(h.value)) + ' ' + escapeHtml(unit);
  }

  function renderTable() {
    const body = document.getElementById('resultBody');
    if (!compareData) return;
    const onlyEurope = document.getElementById('onlyEurope') ? document.getElementById('onlyEurope').checked : true;
    let rows = compareData.providers;
    if (onlyEurope) rows = rows.filter(p => p.region === 'eu' || p.region === 'europe');
    const targets = compareData.targets;

    // Her ülke için görünen satırlar arasında en ucuz kargo
    const best = {};
    targets.forEach(t => {
      let min = null;
      rows.forEach(p => {
        const s = p.ship && p.ship[t];
        if (s && (min === null || s.cost < min)) min = s.cost;
      });
      best[t] = min;
    });

    let html = '<div class="filter-row"><input type="checkbox" id="onlyEurope" ' + (onlyEurope ? 'checked' : '') +
      ' onchange="renderTable()"><label for="onlyEurope" style="margin:0;color:#cfd5e2;">Sadece Avrupa\'daki atölyeleri göster</label></div>';

    if (!rows.length) {
      html += '<div class="msg info">' + (onlyEurope
        ? 'Bu ürün türü için Avrupa\'da atölye bulunamadı. Kutuyu kaldırıp tüm sağlayıcılara bakabilirsin.'
        : 'Bu ürün türü için sağlayıcı bulunamadı.') + '</div>';
      body.innerHTML = html;
      return;
    }

    html += '<div class="table-wrap"><table><thead><tr><th>Sağlayıcı</th><th>Bölge</th><th>Üretim süresi</th>' +
      targets.map(t => '<th>' + escapeHtml(COUNTRY_NAMES[t] || t) + '</th>').join('') + '</tr></thead><tbody>';
    rows.forEach(p => {
      const loc = [p.city, p.country].filter(Boolean).map(escapeHtml).join(', ');
      html += '<tr><td><div class="prov-name">' + escapeHtml(p.title) + '</div><div class="prov-loc">' + (loc || 'Konum bilgisi yok') + '</div></td>' +
        '<td><span class="badge badge-' + p.region + '">' + REGION_LABEL[p.region] + '</span></td>' +
        '<td>' + fmtHandling(p.handling_time) + '</td>';
      targets.forEach(t => {
        const s = p.ship && p.ship[t];
        if (!s) {
          html += '<td><span class="price na">' + (p.error ? '?' : 'Gönderilmiyor') + '</span></td>';
        } else {
          const isBest = best[t] !== null && s.cost === best[t];
          html += '<td><span class="price' + (isBest ? ' best' : '') + '">' + fmtMoney(s) + (s.rest ? '*' : '') + '</span></td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>' +
      '<div class="legend">Kargo ücretleri tek ürün içindir (ilk ürün). Yeşil, o ülke için listedeki en ucuz seçenektir. ' +
      '* işareti, ülkeye özel tarife olmadığı için "dünyanın geri kalanı" tarifesinin kullanıldığı anlamına gelir. ' +
      'Ürünün kendi baskı maliyeti sağlayıcıya göre değişir, onu taslak ürün oluştururken göreceksin.</div>';
    body.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
