<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">HızlıSatıcı AI - Giriş</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #141821;
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    border: 1px solid #232838;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #1D9E75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 16px;
  }
  #langSwitcherHost { margin-left: auto; }
  #langSwitcherHost .hs-lang { margin-left: 0; }
  .logo-text {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #fff;
  }
  .subtitle {
    font-size: 14px;
    color: #9aa3b2;
    margin-bottom: 24px;
  }
  .tabs {
    display: flex;
    background: #0d0f16;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: #9aa3b2;
    transition: all 0.15s;
  }
  .tab.active {
    background: #1D9E75;
    color: #fff;
  }
  label {
    display: block;
    font-size: 13px;
    color: #9aa3b2;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: #1c212c;
    border: 1px solid #2a3040;
    border-radius: 8px;
    padding: 11px 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #1D9E75;
  }
  button.submit {
    width: 100%;
    background: #1D9E75;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 22px;
    cursor: pointer;
  }
  button.submit:hover { background: #178a65; }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.error { background: #2a1414; color: #f28b8b; display: block; }
  .msg.success { background: #123222; color: #6ee7b7; display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
    <div id="langSwitcherHost"></div>
  </div>
  <h1 id="formTitle" data-i18n="login.title"></h1>
  <div class="subtitle" id="formSub" data-i18n="login.sub"></div>

  <div class="tabs">
    <div class="tab active" id="loginTab" data-i18n="login.tabLogin"></div>
    <div class="tab" id="signupTab" data-i18n="login.tabSignup"></div>
  </div>

  <form id="authForm">
    <label for="email" data-i18n="login.email"></label>
    <input type="email" id="email" data-i18n-placeholder="login.emailPh" required autocomplete="email">

    <label for="password" data-i18n="login.password"></label>
    <input type="password" id="password" data-i18n-placeholder="login.passwordPh" required minlength="6" autocomplete="current-password">

    <button type="submit" class="submit" id="submitBtn"></button>
  </form>

  <div class="msg" id="msgBox"></div>
</div>

<script src="app.js"></script>
<script>
  HS.i18n.add({
    tr: {
      'login.pageTitle': 'HızlıSatıcı AI - Giriş',
      'login.title': 'Giriş yap',
      'login.titleSignup': 'Hesap oluştur',
      'login.sub': 'Ürünlerini yönetmeye devam et.',
      'login.subSignup': 'Birkaç saniyede ücretsiz hesabını aç.',
      'login.tabLogin': 'Giriş yap',
      'login.tabSignup': 'Kayıt ol',
      'login.email': 'E-posta',
      'login.emailPh': 'ornek@eposta.com',
      'login.password': 'Şifre',
      'login.passwordPh': 'En az 6 karakter',
      'login.btnLogin': 'Giriş yap',
      'login.btnSignup': 'Kayıt ol',
      'login.loggingIn': 'Giriş yapılıyor...',
      'login.signingUp': 'Kayıt oluyor...',
      'login.okLogin': 'Giriş başarılı, yönlendiriliyorsun...',
      'login.okSignup': 'Hesabın oluşturuldu. Şimdi giriş yapabilirsin.',
      'login.errInvalid': 'E-posta ya da şifre hatalı.',
      'login.errExists': 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.',
      'login.errNotConfirmed': 'E-posta adresin henüz onaylanmamış. Gelen kutunu kontrol et.',
      'login.errWeak': 'Şifre en az 6 karakter olmalı.',
      'login.errRate': 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.',
      'login.errGeneric': 'Bir hata oluştu, tekrar dene.'
    },
    en: {
      'login.pageTitle': 'HızlıSatıcı AI - Log in',
      'login.title': 'Log in',
      'login.titleSignup': 'Create account',
      'login.sub': 'Continue managing your products.',
      'login.subSignup': 'Open your free account in seconds.',
      'login.tabLogin': 'Log in',
      'login.tabSignup': 'Sign up',
      'login.email': 'Email',
      'login.emailPh': 'name@example.com',
      'login.password': 'Password',
      'login.passwordPh': 'At least 6 characters',
      'login.btnLogin': 'Log in',
      'login.btnSignup': 'Sign up',
      'login.loggingIn': 'Logging in...',
      'login.signingUp': 'Creating account...',
      'login.okLogin': 'Logged in, redirecting...',
      'login.okSignup': 'Your account has been created. You can log in now.',
      'login.errInvalid': 'Incorrect email or password.',
      'login.errExists': 'An account with this email already exists. Try logging in.',
      'login.errNotConfirmed': 'Your email address is not confirmed yet. Please check your inbox.',
      'login.errWeak': 'Password must be at least 6 characters.',
      'login.errRate': 'Too many attempts. Please wait a moment and try again.',
      'login.errGeneric': 'Something went wrong, please try again.'
    }
  });

  let mode = 'login';
  let busy = false;

  function renderMode() {
    const isLogin = mode === 'login';
    document.getElementById('loginTab').classList.toggle('active', isLogin);
    document.getElementById('signupTab').classList.toggle('active', !isLogin);
    document.getElementById('formTitle').textContent = HS.t(isLogin ? 'login.title' : 'login.titleSignup');
    document.getElementById('formSub').textContent = HS.t(isLogin ? 'login.sub' : 'login.subSignup');
    document.getElementById('password').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
    if (!busy) {
      document.getElementById('submitBtn').textContent = HS.t(isLogin ? 'login.btnLogin' : 'login.btnSignup');
    }
    document.title = HS.t('login.pageTitle');
  }

  function switchTab(newMode) {
    mode = newMode;
    renderMode();
    hideMsg();
  }

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
  }

  function hideMsg() {
    const box = document.getElementById('msgBox');
    box.className = 'msg';
    box.textContent = '';
  }

  // Supabase'in İngilizce hata mesajlarını kullanıcı diline çevir
  function friendlyError(err) {
    const m = ((err && err.message) || '').toLowerCase();
    if (m.includes('invalid login credentials')) return HS.t('login.errInvalid');
    if (m.includes('already registered') || m.includes('already exists')) return HS.t('login.errExists');
    if (m.includes('not confirmed')) return HS.t('login.errNotConfirmed');
    if (m.includes('password should be') || m.includes('at least 6')) return HS.t('login.errWeak');
    if (m.includes('rate limit') || m.includes('too many')) return HS.t('login.errRate');
    return (err && err.message) || HS.t('login.errGeneric');
  }

  document.getElementById('loginTab').addEventListener('click', () => switchTab('login'));
  document.getElementById('signupTab').addEventListener('click', () => switchTab('signup'));
  window.addEventListener('hs:langchange', renderMode);

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    hideMsg();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');

    busy = true;
    btn.disabled = true;
    btn.textContent = HS.t(mode === 'login' ? 'login.loggingIn' : 'login.signingUp');

    try {
      if (mode === 'login') {
        const { error } = await HS.db.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showMsg(HS.t('login.okLogin'), 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        const { error } = await HS.db.auth.signUp({
          email,
          password,
          options: { data: { ui_language: HS.lang } }
        });
        if (error) throw error;
        showMsg(HS.t('login.okSignup'), 'success');
        mode = 'login';
        renderMode();
      }
    } catch (err) {
      showMsg(friendlyError(err), 'error');
    } finally {
      busy = false;
      btn.disabled = false;
      renderMode();
    }
  });

  (async function start() {
    await HS.init({ auth: false });
    renderMode();
  })();
</script>

</body>
</html>
