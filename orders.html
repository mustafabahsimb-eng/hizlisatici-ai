<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Siparişler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px;
    background: #1D9E75; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 11px 18px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040; padding: 11px 18px;
    border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .btn-secondary:disabled { opacity: 0.6; cursor: not-allowed; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat-card { background: #1c212c; border-radius: 12px; padding: 16px; border: 1px solid #232838; }
  .stat-label { font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #fff; }

  .section {
    background: #141821; border-radius: 14px; border: 1px solid #232838;
    padding: 22px; margin-bottom: 20px; display: none;
  }
  .section.open { display: block; }
  .section-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 16px; }
  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; color: #9aa3b2; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; background: #1c212c; border: 1px solid #2a3040; border-radius: 8px;
    padding: 10px 12px; color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: #1D9E75; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { background: #2a1414; color: #f28b8b; display: block; }
  .msg.success { background: #123222; color: #6ee7b7; display: block; }

  .order-list { background: #141821; border-radius: 14px; border: 1px solid #232838; overflow: hidden; }
  .empty-state { padding: 60px 20px; text-align: center; color: #9aa3b2; }
  .empty-state h3 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 500; }
  .empty-state p { font-size: 14px; margin-bottom: 20px; }

  .order-row { padding: 16px 20px; border-bottom: 1px solid #232838; }
  .order-row:last-child { border-bottom: none; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .order-name { font-size: 14px; font-weight: 500; color: #fff; }
  .order-meta { font-size: 12px; color: #9aa3b2; margin-top: 3px; line-height: 1.6; }
  .order-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .status-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  }
  .status-beklemede { background: #2a2410; color: #e6c96a; }
  .status-tedarikciye_verildi { background: #142230; color: #7db8e6; }
  .status-kargoya_verildi { background: #1a2a40; color: #6ea8f2; }
  .status-teslim_edildi { background: #123222; color: #6ee7b7; }
  .status-iptal { background: #232838; color: #9aa3b2; }
  .status-hata { background: #2a1414; color: #f28b8b; }
  .status-select {
    background: #1c212c; border: 1px solid #2a3040; color: #e6e8ee; font-size: 12px;
    padding: 6px 8px; border-radius: 6px;
  }
  .icon-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2; width: 32px; height: 32px;
    border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: #f28b8b; color: #f28b8b; background: #2a1414; }
  .tracking-line { font-size: 12px; margin-top: 8px; }
  .tracking-line a { color: #9aa3b2; text-decoration: underline; cursor: pointer; }
  .tracking-line .tracking-value { color: #6ee7b7; font-weight: 600; }
  .cj-action-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .cj-action-btn { font-size: 12px; padding: 7px 12px; }
  .error-line { color: #f28b8b; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1>Siparişler</h1>
      <div class="subtitle" id="orderCountText">Yükleniyor...</div>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="dashboard.html" class="back-link" style="align-self:center;">← Panele dön</a>
      <button class="btn-primary" onclick="toggleForm()">+ Yeni sipariş kaydet</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Beklemede</div>
      <div class="stat-value" id="statBeklemede">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tedarikçiye verildi</div>
      <div class="stat-value" id="statTedarikci">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Kargoda</div>
      <div class="stat-value" id="statKargo">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Teslim edildi</div>
      <div class="stat-value" id="statTeslim">0</div>
    </div>
  </div>

  <div class="section" id="formSection">
    <div class="section-title">Yeni sipariş kaydet</div>
    <div class="form-row">
      <label for="productSelect">Hangi ürün satıldı?</label>
      <select id="productSelect">
        <option value="">Ürün seç...</option>
      </select>
    </div>
    <div class="two-col">
      <div class="form-row">
        <label for="platformInput">Satış platformu</label>
        <select id="platformInput">
          <option value="">Seç...</option>
          <option value="Trendyol">Trendyol</option>
          <option value="Hepsiburada">Hepsiburada</option>
          <option value="N11">N11</option>
          <option value="Çiçeksepeti">Çiçeksepeti</option>
          <option value="PTT AVM">PTT AVM</option>
          <option value="Amazon TR">Amazon TR</option>
          <option value="Pazarama">Pazarama</option>
          <option value="Etsy">Etsy</option>
          <option value="Amazon (Global)">Amazon (Global)</option>
          <option value="eBay">eBay</option>
          <option value="Facebook Marketplace">Facebook Marketplace</option>
          <option value="TikTok Shop">TikTok Shop</option>
          <option value="Shopify">Shopify</option>
          <option value="WooCommerce">WooCommerce</option>
          <option value="Wix">Wix</option>
          <option value="Diğer">Diğer</option>
        </select>
      </div>
      <div class="form-row">
        <label for="marketplaceOrderNo">Pazaryeri sipariş no (opsiyonel)</label>
        <input type="text" id="marketplaceOrderNo" placeholder="Örn: TY-2026-000123">
      </div>
    </div>
    <div class="two-col">
      <div class="form-row">
        <label for="customerName">Müşteri adı</label>
        <input type="text" id="customerName" placeholder="Ad Soyad">
      </div>
      <div class="form-row">
        <label for="customerPhone">Müşteri telefonu</label>
        <input type="text" id="customerPhone" placeholder="05xx xxx xx xx">
      </div>
    </div>
    <div class="form-row">
      <label for="customerAddress">Teslimat adresi</label>
      <textarea id="customerAddress" rows="2" placeholder="Açık adres"></textarea>
    </div>
    <div class="two-col">
      <div class="form-row">
        <label for="customerCity">Şehir</label>
        <input type="text" id="customerCity" placeholder="İstanbul">
      </div>
      <div class="form-row">
        <label for="quantityInput">Adet</label>
        <input type="number" id="quantityInput" value="1" min="1">
      </div>
    </div>
    <div class="form-row">
      <label for="noteInput">Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Kendine hatırlatma notu">
    </div>
    <div class="actions">
      <button class="btn-primary" id="saveOrderBtn" onclick="saveOrder()">Siparişi kaydet</button>
      <button class="btn-secondary" onclick="toggleForm()">Vazgeç</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </div>

  <div class="order-list" id="orderList">
    <div class="empty-state">
      <h3>Henüz sipariş kaydı yok</h3>
      <p>Bir pazaryerinde satış olduğunda buraya kaydet, tedarikçi ve kargo durumunu buradan takip et.</p>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const STATUS_LABELS = {
    beklemede: 'Beklemede',
    tedarikciye_verildi: 'Tedarikçiye verildi',
    kargoya_verildi: 'Kargoya verildi',
    teslim_edildi: 'Teslim edildi',
    iptal: 'İptal',
    hata: 'Hata',
  };

  let currentUserId = null;
  let myProducts = [];

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUserId = session.user.id;
    document.getElementById('userEmail').textContent = session.user.email;
    await loadProducts();
    await loadOrders();
  }

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from('products')
      .select('id, name, platform, supplier')
      .eq('user_id', currentUserId)
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    myProducts = data || [];
    const sel = document.getElementById('productSelect');
    sel.innerHTML = '<option value="">Ürün seç...</option>' +
      myProducts.map(p => `<option value="${p.id}">${escapeHtml(p.name || 'İsimsiz ürün')}</option>`).join('');
  }

  function toggleForm() {
    const section = document.getElementById('formSection');
    section.classList.toggle('open');
  }

  async function saveOrder() {
    const productId = document.getElementById('productSelect').value || null;
    const platform = document.getElementById('platformInput').value || null;
    const marketplaceOrderNo = document.getElementById('marketplaceOrderNo').value.trim() || null;
    const customerName = document.getElementById('customerName').value.trim() || null;
    const customerPhone = document.getElementById('customerPhone').value.trim() || null;
    const customerAddress = document.getElementById('customerAddress').value.trim() || null;
    const customerCity = document.getElementById('customerCity').value.trim() || null;
    const quantity = parseInt(document.getElementById('quantityInput').value, 10) || 1;
    const note = document.getElementById('noteInput').value.trim() || null;

    if (!productId) {
      showFormMsg('Hangi ürünün satıldığını seçmelisin.', 'error');
      return;
    }

    const product = myProducts.find(p => p.id === productId);
    const btn = document.getElementById('saveOrderBtn');
    btn.disabled = true;
    btn.textContent = 'Kaydediliyor...';

    const { error } = await supabaseClient.from('orders').insert({
      user_id: currentUserId,
      product_id: productId,
      platform: platform || (product ? product.platform : null),
      marketplace_order_no: marketplaceOrderNo,
      customer_name: customerName,
      customer_phone: customerPhone,
      customer_address: customerAddress,
      customer_city: customerCity,
      quantity: quantity,
      supplier: product ? product.supplier : null,
      status: 'beklemede',
      note: note,
    });

    btn.disabled = false;
    btn.textContent = 'Siparişi kaydet';

    if (error) {
      showFormMsg('Kaydedilemedi: ' + error.message, 'error');
      return;
    }

    showFormMsg('Sipariş kaydedildi.', 'success');
    document.getElementById('marketplaceOrderNo').value = '';
    document.getElementById('customerName').value = '';
    document.getElementById('customerPhone').value = '';
    document.getElementById('customerAddress').value = '';
    document.getElementById('customerCity').value = '';
    document.getElementById('quantityInput').value = '1';
    document.getElementById('noteInput').value = '';
    document.getElementById('formSection').classList.remove('open');
    loadOrders();
  }

  function showFormMsg(text, type) {
    const box = document.getElementById('formMsg');
    box.textContent = text;
    box.className = 'msg ' + type;
  }

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, products(name, platform)')
      .eq('user_id', currentUserId)
      .order('created_at', { ascending: false });

    if (error) { console.error(error); return; }

    document.getElementById('orderCountText').textContent =
      orders.length === 0 ? 'Henüz sipariş yok' : orders.length + ' sipariş listeleniyor';

    const counts = { beklemede: 0, tedarikciye_verildi: 0, kargoya_verildi: 0, teslim_edildi: 0 };
    orders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
    document.getElementById('statBeklemede').textContent = counts.beklemede;
    document.getElementById('statTedarikci').textContent = counts.tedarikciye_verildi;
    document.getElementById('statKargo').textContent = counts.kargoya_verildi;
    document.getElementById('statTeslim').textContent = counts.teslim_edildi;

    const listEl = document.getElementById('orderList');
    if (orders.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <h3>Henüz sipariş kaydı yok</h3>
          <p>Bir pazaryerinde satış olduğunda buraya kaydet, tedarikçi ve kargo durumunu buradan takip et.</p>
        </div>`;
      return;
    }

    listEl.innerHTML = orders.map(o => {
      const productName = o.products ? o.products.name : 'Silinmiş ürün';
      const metaParts = [];
      if (o.platform) metaParts.push(o.platform);
      if (o.marketplace_order_no) metaParts.push('Sipariş no: ' + escapeHtml(o.marketplace_order_no));
      metaParts.push(o.quantity + ' adet');
      if (o.customer_name) metaParts.push(escapeHtml(o.customer_name));
      if (o.customer_city) metaParts.push(escapeHtml(o.customer_city));
      if (o.supplier) metaParts.push('Tedarikçi: ' + (o.supplier === 'cj' ? 'CJ Dropshipping' : o.supplier === 'aliexpress' ? 'AliExpress' : escapeHtml(o.supplier)));

      const statusOptions = Object.keys(STATUS_LABELS).map(s =>
        `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`
      ).join('');

      const canPlaceCjOrder = o.supplier === 'cj' && (o.status === 'beklemede' || o.status === 'hata');
      const canSyncTracking = o.supplier === 'cj' && (o.status === 'tedarikciye_verildi' || o.status === 'kargoya_verildi');

      return `
        <div class="order-row" data-id="${o.id}">
          <div class="order-top">
            <div>
              <div class="order-name">${escapeHtml(productName)}</div>
              <div class="order-meta">${metaParts.join(' · ')}</div>
            </div>
            <div class="order-right">
              <span class="status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
              <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
                ${statusOptions}
              </select>
              <button class="icon-btn" title="Siparişi sil" onclick="deleteOrder('${o.id}')">🗑</button>
            </div>
          </div>
          ${o.status === 'hata' && o.error_message ? '<div class="error-line">Hata: ' + escapeHtml(o.error_message) + '</div>' : ''}
          ${canPlaceCjOrder || canSyncTracking ? `
            <div class="cj-action-row">
              ${canPlaceCjOrder ? `<button class="btn-secondary cj-action-btn" onclick="placeCjOrder('${o.id}', this)">📦 CJ'ye Sipariş Ver</button>` : ''}
              ${canSyncTracking ? `<button class="btn-secondary cj-action-btn" onclick="syncCjTracking('${o.id}', this)">🔄 Kargo Durumunu Güncelle</button>` : ''}
            </div>` : ''}
          <div class="tracking-line">
            ${o.tracking_number
              ? 'Kargo takip no: <span class="tracking-value">' + escapeHtml(o.tracking_number) + '</span> <a onclick="editTracking(\'' + o.id + '\', \'' + escapeAttr(o.tracking_number) + '\')">değiştir</a>'
              : '<a onclick="editTracking(\'' + o.id + '\', \'\')">+ Kargo takip no ekle</a>'}
            ${o.note ? ' · <span style="color:#9aa3b2;">' + escapeHtml(o.note) + '</span>' : ''}
          </div>
        </div>`;
    }).join('');
  }

  async function placeCjOrder(orderId, btn) {
    if (!confirm('CJ Dropshipping\'e gerçek sipariş oluşturulacak. Ödeme OTOMATİK yapılmayacak — CJ panelinden (cjdropshipping.com > Orders) sen onaylayıp ödeyeceksin. Devam edilsin mi?')) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    btn.disabled = true;
    btn.textContent = 'Sipariş veriliyor...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/cj-place-order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ orderId, userAccessToken: session.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      alert('Sipariş CJ\'de oluşturuldu (sipariş no: ' + data.supplierOrderId + ').\n\n' + (data.note || ''));
      loadOrders();
    } catch (err) {
      alert('Sipariş verilemedi: ' + err.message);
      btn.disabled = false;
      btn.textContent = "📦 CJ'ye Sipariş Ver";
    }
  }

  async function syncCjTracking(orderId, btn) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/cj-sync-tracking', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ orderId, userAccessToken: session.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      if (data.trackingNumber) {
        alert('Kargo takip no bulundu: ' + data.trackingNumber);
      } else {
        alert('CJ henüz kargo takip numarası vermemiş, daha sonra tekrar dene.');
      }
      loadOrders();
    } catch (err) {
      alert('Kontrol edilemedi: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🔄 Kargo Durumunu Güncelle';
    }
  }

  async function updateStatus(orderId, status) {
    const { error } = await supabaseClient.from('orders').update({ status }).eq('id', orderId);
    if (error) { alert('Güncellenemedi: ' + error.message); return; }
    loadOrders();
  }

  async function editTracking(orderId, current) {
    const value = prompt('Kargo takip numarası:', current || '');
    if (value === null) return;
    const { error } = await supabaseClient.from('orders').update({ tracking_number: value.trim() || null }).eq('id', orderId);
    if (error) { alert('Güncellenemedi: ' + error.message); return; }
    loadOrders();
  }

  async function deleteOrder(orderId) {
    if (!confirm('Bu sipariş kaydını silmek istediğine emin misin?')) return;
    const { error } = await supabaseClient.from('orders').delete().eq('id', orderId);
    if (error) { alert('Silinemedi: ' + error.message); return; }
    loadOrders();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return (str || '').replace(/'/g, "\\'");
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
