<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görsel Stüdyosu - HızlıSatıcı AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-dark:#0b1220;
    --bg-panel:#111a2e;
    --bg-panel-2:#16213a;
    --border:#233150;
    --text:#e7ecf5;
    --text-dim:#9aa7c2;
    --accent:#1D9E75;
    --accent-hover:#178a65;
    --danger:#e0554f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-dark);
    color:var(--text);
    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh;
  }
  a{color:var(--accent); text-decoration:none;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:18px; margin:0; display:flex; align-items:center; gap:8px;}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--bg-panel-2);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:#1c2942; border-color:var(--accent);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#04150f; font-weight:600;}
  button.primary:hover{background:var(--accent-hover);}
  button.danger{border-color:var(--danger); color:var(--danger); background:transparent;}
  button.danger:hover{background:rgba(224,85,79,.12);}
  button.icon-btn{padding:6px 9px; font-size:15px; line-height:1;}
  .layout{
    display:flex;
    gap:14px;
    padding:14px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
  }
  .sidebar-left{width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
  .sidebar-right{width:230px; flex-shrink:0;}
  .canvas-wrap{
    flex:1;
    min-width:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .canvas-stage{
    background:repeating-conic-gradient(#1a2540 0% 25%, #10182b 0% 50%) 50% / 20px 20px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    max-width:100%;
    overflow:auto;
  }
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); margin:0 0 10px 0; font-weight:600;
  }
  .tool-group{border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}
  .tool-group:first-child{border-top:none; padding-top:0; margin-top:0;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .btn-grid button{width:100%;}
  .full-btn{width:100%; margin-bottom:6px;}
  label.small{font-size:12px; color:var(--text-dim); display:block; margin:8px 0 4px;}
  input[type=range]{width:100%; accent-color:var(--accent);}
  input[type=color]{width:100%; height:32px; border:1px solid var(--border); border-radius:6px; background:none; padding:2px;}
  input[type=text], input[type=number], select{
    width:100%; padding:6px 8px; border-radius:6px;
    border:1px solid var(--border); background:var(--bg-panel-2); color:var(--text); font-size:13px;
  }
  .row{display:flex; gap:6px; align-items:center;}
  .row > *{flex:1;}
  .hint{font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
  #fileInput{display:none;}
  .layer-item{
    display:flex; align-items:center; gap:6px;
    padding:6px 8px; border-radius:8px; border:1px solid transparent;
    background:var(--bg-panel-2); margin-bottom:6px; cursor:pointer; font-size:12px;
  }
  .layer-item.active{border-color:var(--accent);}
  .layer-item span.lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .layer-actions{display:flex; gap:2px;}
  .layer-actions button{padding:2px 6px; font-size:11px;}
  .empty-msg{color:var(--text-dim); font-size:12px; text-align:center; padding:16px 0;}
  .props-box{border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}
  #cropBar{display:none; gap:8px; margin-top:8px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--bg-panel-2); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    display:none;
  }
  .spinner{
    display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.3);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <h1>🎨 Görsel Stüdyosu</h1>
  <div class="top-actions">
    <button id="undoBtn" class="icon-btn" title="Geri al">↶ Geri Al</button>
    <button id="redoBtn" class="icon-btn" title="Yinele">↷ Yinele</button>
    <button id="downloadBtn" class="primary">⬇ PNG İndir</button>
    <a href="dashboard.html"><button>← Panele Dön</button></a>
  </div>
</header>

<div class="layout">

  <!-- SOL PANEL: ARAÇLAR -->
  <div class="sidebar-left">

    <div class="panel">
      <p class="section-title">Görsel</p>
      <input type="file" id="fileInput" accept="image/*">
      <button class="full-btn primary" id="uploadBtn">📤 Görsel Yükle</button>
      <button class="full-btn" id="removeBgBtn">✂️ Arka Planı Temizle</button>
      <div class="hint" id="removeBgHint"></div>
    </div>

    <div class="panel">
      <p class="section-title">Ekle</p>
      <div class="btn-grid">
        <button id="addTextBtn">🔤 Metin</button>
        <button id="addRectBtn">▭ Dikdörtgen</button>
        <button id="addCircleBtn">◯ Daire</button>
        <button id="addLineBtn">／ Çizgi</button>
      </div>
    </div>

    <div class="panel">
      <p class="section-title">Düzenle</p>
      <div class="row">
        <button id="rotateBtn">↻ 90° Döndür</button>
        <button id="cropToggleBtn">✂ Kırp</button>
      </div>
      <div id="cropBar">
        <button id="cropApplyBtn" class="primary">Kırpmayı Uygula</button>
        <button id="cropCancelBtn">İptal</button>
      </div>

      <div class="tool-group">
        <label class="small">Parlaklık</label>
        <input type="range" id="brightnessSlider" min="-100" max="100" value="0">
        <label class="small">Kontrast</label>
        <input type="range" id="contrastSlider" min="-100" max="100" value="0">
        <label class="small">Doygunluk</label>
        <input type="range" id="saturationSlider" min="-100" max="100" value="0">
        <button class="full-btn" id="resetFiltersBtn" style="margin-top:8px;">Ayarları Sıfırla</button>
      </div>

      <div class="tool-group">
        <label class="small">Zemin Rengi</label>
        <div class="row">
          <input type="color" id="bgColorPicker" value="#ffffff">
          <button id="bgColorClearBtn" title="Zemin rengini kaldır">✕</button>
        </div>
        <div class="hint">Sadece şeffaf alanlarda görünür (önce arka planı temizle).</div>
      </div>
    </div>

    <div class="panel">
      <p class="section-title">Boyut Şablonu</p>
      <button class="full-btn" data-w="1080" data-h="1080">Trendyol Kare (1080×1080)</button>
      <button class="full-btn" data-w="1080" data-h="1080">Instagram Kare (1080×1080)</button>
      <button class="full-btn" data-w="1080" data-h="1350">Instagram Dikey (1080×1350)</button>
      <button class="full-btn" data-w="1200" data-h="630">Facebook Yatay (1200×630)</button>
    </div>

  </div>

  <!-- ORTA: CANVAS -->
  <div class="canvas-wrap">
    <div class="canvas-stage">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="hint">Seçili öğeyi taşımak için sürükle, köşelerden boyutlandır, üstteki tutamaçtan döndür. Silmek için <b>Delete</b> tuşuna bas.</div>
  </div>

  <!-- SAĞ PANEL: KATMANLAR + ÖZELLİKLER -->
  <div class="sidebar-right">
    <div class="panel">
      <p class="section-title">Katmanlar</p>
      <div id="layerList"><div class="empty-msg">Henüz öğe yok</div></div>
    </div>

    <div class="panel" id="propsPanel" style="display:none; margin-top:14px;">
      <p class="section-title">Seçili Öğe</p>
      <div id="propsContent"></div>
      <button class="full-btn danger" id="deleteSelectedBtn" style="margin-top:10px;">🗑 Sil</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============== Supabase ============== */
const SUPABASE_URL = "https://ytucdrrgxsjhrqmaxckt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserAccessToken = null;

async function initAuth(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href = "index.html";
    return;
  }
  currentUserAccessToken = session.access_token;
}

/* ============== Toast ============== */
let toastTimer = null;
function showToast(msg, ms=2500){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.style.display='none', ms);
}

/* ============== Fabric Canvas ============== */
const canvas = new fabric.Canvas('mainCanvas', {
  width: 800,
  height: 800,
  backgroundColor: null,
  preserveObjectStacking: true
});

let baseImage = null; // yüklenen / düzenlenen ana ürün görseli (fabric.Image)

/* ============== Undo / Redo ============== */
let undoStack = [];
let redoStack = [];
let isRestoring = false;
const HISTORY_LIMIT = 40;

function snapshotState(){
  if(isRestoring) return;
  const json = JSON.stringify(canvas.toJSON(['selectable','evented']));
  undoStack.push(json);
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function restoreFromJSON(json){
  isRestoring = true;
  canvas.loadFromJSON(json, ()=>{
    canvas.renderAll();
    // baseImage referansını yeniden bul (ilk eklenen image objesi)
    const imgs = canvas.getObjects('image');
    baseImage = imgs.length ? imgs[0] : null;
    isRestoring = false;
    refreshLayerList();
  });
}

function undo(){
  if(undoStack.length < 2) return; // en az 1 önceki state kalmalı
  const current = undoStack.pop();
  redoStack.push(current);
  const prev = undoStack[undoStack.length - 1];
  restoreFromJSON(prev);
  updateUndoRedoButtons();
}

function redo(){
  if(redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(next);
  restoreFromJSON(next);
  updateUndoRedoButtons();
}

function updateUndoRedoButtons(){
  document.getElementById('undoBtn').disabled = undoStack.length < 2;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}

canvas.on('object:added', ()=>{ snapshotState(); refreshLayerList(); });
canvas.on('object:removed', ()=>{ snapshotState(); refreshLayerList(); });
canvas.on('object:modified', ()=>{ snapshotState(); refreshLayerList(); });

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    const active = canvas.getActiveObject();
    if(active){ e.preventDefault(); canvas.remove(active); canvas.discardActiveObject(); canvas.renderAll(); }
  }
});

/* ============== Görsel Yükleme ============== */
document.getElementById('uploadBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());

function loadImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    fabric.Image.fromURL(ev.target.result, (img)=>{
      // canvas'a sığacak şekilde ölçekle
      const scale = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
      img.set({
        left: canvas.width/2,
        top: canvas.height/2,
        originX: 'center',
        originY: 'center',
        scaleX: scale,
        scaleY: scale,
        cornerColor: '#1D9E75',
        cornerStyle: 'circle',
        transparentCorners: false
      });
      canvas.add(img);
      canvas.setActiveObject(img);
      baseImage = img;
      canvas.renderAll();
      showToast('Görsel yüklendi');
    }, { crossOrigin: 'anonymous' });
  };
  reader.readAsDataURL(file);
}

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  loadImageFile(file);
  e.target.value = '';
});

/* ============== Sürükle-Bırak ile Görsel Yükleme ============== */
// Tüm SAYFA (sadece küçük canvas kutusu değil) geçerli bırakma alanı - hedefi tutturmak kolay olsun diye.
// Tarayıcının varsayılan davranışı (sayfayı terk edip görseli doğrudan açması) engelleniyor,
// böylece sekme çubuğuna çok yakın olmadığın sürece dosya nereye bırakılırsa bırakılsın editör ekranı kaybolmuyor.
const canvasStageEl = document.querySelector('.canvas-stage');
let dragDepth = 0;

['dragenter','dragover','dragleave','drop'].forEach(evtName=>{
  document.documentElement.addEventListener(evtName, (e)=>{
    e.preventDefault();
    e.stopPropagation();
  });
});

document.documentElement.addEventListener('dragenter', ()=>{
  dragDepth++;
  canvasStageEl.style.borderColor = '#1D9E75';
});
document.documentElement.addEventListener('dragleave', ()=>{
  dragDepth = Math.max(0, dragDepth - 1);
  if(dragDepth === 0) canvasStageEl.style.borderColor = '';
});
document.documentElement.addEventListener('drop', (e)=>{
  dragDepth = 0;
  canvasStageEl.style.borderColor = '';
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  loadImageFile(file);
});

/* ============== Metin / Şekil Ekleme ============== */
document.getElementById('addTextBtn').addEventListener('click', ()=>{
  const text = new fabric.IText('Metninizi yazın', {
    left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center',
    fontSize: 42, fill: '#ffffff', fontFamily: 'Arial',
    cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
  });
  canvas.add(text);
  canvas.setActiveObject(text);
  canvas.renderAll();
});

document.getElementById('addRectBtn').addEventListener('click', ()=>{
  const rect = new fabric.Rect({
    left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center',
    width: 200, height: 140, fill: 'transparent', stroke: '#ffffff', strokeWidth: 3,
    cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
  });
  canvas.add(rect); canvas.setActiveObject(rect); canvas.renderAll();
});

document.getElementById('addCircleBtn').addEventListener('click', ()=>{
  const circle = new fabric.Circle({
    left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center',
    radius: 90, fill: 'transparent', stroke: '#ffffff', strokeWidth: 3,
    cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
  });
  canvas.add(circle); canvas.setActiveObject(circle); canvas.renderAll();
});

document.getElementById('addLineBtn').addEventListener('click', ()=>{
  const line = new fabric.Line([50,50,250,50], {
    left: canvas.width/2, top: canvas.height/2, originX:'center', originY:'center',
    stroke: '#ffffff', strokeWidth: 6,
    cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
  });
  canvas.add(line); canvas.setActiveObject(line); canvas.renderAll();
});

/* ============== Döndür (90°) ============== */
document.getElementById('rotateBtn').addEventListener('click', ()=>{
  const target = canvas.getActiveObject() || baseImage;
  if(!target){ showToast('Önce bir görsel yükle veya öğe seç'); return; }
  target.rotate(((target.angle || 0) + 90) % 360);
  canvas.renderAll();
  snapshotState();
});

/* ============== Kırpma ============== */
let cropRect = null;

document.getElementById('cropToggleBtn').addEventListener('click', ()=>{
  if(!baseImage){ showToast('Önce bir görsel yükle'); return; }
  if(cropRect){ cancelCrop(); return; }
  const b = baseImage.getBoundingRect();
  cropRect = new fabric.Rect({
    left: b.left + b.width*0.1,
    top: b.top + b.height*0.1,
    width: b.width*0.8,
    height: b.height*0.8,
    fill: 'rgba(29,158,117,0.15)',
    stroke: '#1D9E75',
    strokeDashArray: [6,4],
    strokeWidth: 2,
    cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false,
    lockRotation:true
  });
  cropRect.setControlsVisibility({ mtr:false });
  canvas.add(cropRect);
  canvas.setActiveObject(cropRect);
  canvas.renderAll();
  document.getElementById('cropBar').style.display = 'flex';
});

function cancelCrop(){
  if(cropRect){ canvas.remove(cropRect); cropRect = null; canvas.renderAll(); }
  document.getElementById('cropBar').style.display = 'none';
}

document.getElementById('cropCancelBtn').addEventListener('click', cancelCrop);

document.getElementById('cropApplyBtn').addEventListener('click', ()=>{
  if(!cropRect || !baseImage) return;
  const rectBounds = cropRect.getBoundingRect();
  // absolute positioned clipPath kullanarak, ekranda çizilen dikdörtgeni doğrudan kırpma alanı yapıyoruz
  const absClip = new fabric.Rect({
    left: rectBounds.left,
    top: rectBounds.top,
    width: rectBounds.width,
    height: rectBounds.height,
    absolutePositioned: true
  });
  baseImage.clipPath = absClip;
  canvas.remove(cropRect);
  cropRect = null;
  canvas.renderAll();
  document.getElementById('cropBar').style.display = 'none';
  snapshotState();
  showToast('Kırpma uygulandı');
});

/* ============== Parlaklık / Kontrast / Doygunluk ============== */
function applyImageFilters(){
  if(!baseImage) return;
  const b = parseInt(document.getElementById('brightnessSlider').value, 10) / 100;
  const c = parseInt(document.getElementById('contrastSlider').value, 10) / 100;
  const s = parseInt(document.getElementById('saturationSlider').value, 10) / 100;
  baseImage.filters = [
    new fabric.Image.filters.Brightness({ brightness: b }),
    new fabric.Image.filters.Contrast({ contrast: c }),
    new fabric.Image.filters.Saturation({ saturation: s })
  ];
  baseImage.applyFilters();
  canvas.renderAll();
}

['brightnessSlider','contrastSlider','saturationSlider'].forEach(id=>{
  document.getElementById(id).addEventListener('input', applyImageFilters);
  document.getElementById(id).addEventListener('change', ()=> snapshotState());
});

document.getElementById('resetFiltersBtn').addEventListener('click', ()=>{
  document.getElementById('brightnessSlider').value = 0;
  document.getElementById('contrastSlider').value = 0;
  document.getElementById('saturationSlider').value = 0;
  if(baseImage){ baseImage.filters = []; baseImage.applyFilters(); canvas.renderAll(); snapshotState(); }
});

/* ============== Zemin Rengi ============== */
document.getElementById('bgColorPicker').addEventListener('input', (e)=>{
  canvas.backgroundColor = e.target.value;
  canvas.renderAll();
});
document.getElementById('bgColorPicker').addEventListener('change', ()=> snapshotState());
document.getElementById('bgColorClearBtn').addEventListener('click', ()=>{
  canvas.backgroundColor = null;
  canvas.renderAll();
  snapshotState();
});

/* ============== Boyut Şablonları ============== */
document.querySelectorAll('.sidebar-left [data-w]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const w = parseInt(btn.dataset.w,10), h = parseInt(btn.dataset.h,10);
    canvas.setWidth(w);
    canvas.setHeight(h);
    if(baseImage){
      const scale = Math.min(w / baseImage.width, h / baseImage.height, 1);
      baseImage.set({ left: w/2, top: h/2, scaleX: scale, scaleY: scale });
    }
    canvas.renderAll();
    snapshotState();
    showToast(`Boyut ${w}×${h} olarak ayarlandı`);
  });
});

/* ============== Arka Planı Temizle (mevcut Edge Function) ============== */
document.getElementById('removeBgBtn').addEventListener('click', async ()=>{
  if(!baseImage){ showToast('Önce bir görsel yükle'); return; }
  const btn = document.getElementById('removeBgBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> İşleniyor...';
  try{
    // görselin mevcut halini (filtreler dahil) base64 olarak al
    const dataUrl = baseImage.toDataURL({ format: 'png' });
    const res = await fetch(`${SUPABASE_URL}/functions/v1/remove-background`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ imageBase64: dataUrl })
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok){ throw new Error(data.error || `Sunucu hatası: ${res.status}`); }
    const resultUrl = data.imageBase64;
    if(!resultUrl) throw new Error('Beklenmeyen yanıt formatı');

    fabric.Image.fromURL(resultUrl, (newImg)=>{
      const old = baseImage;
      newImg.set({
        left: old.left, top: old.top, originX: old.originX, originY: old.originY,
        scaleX: old.scaleX, scaleY: old.scaleY, angle: old.angle,
        cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
      });
      // önceki parlaklık/kontrast/doygunluk ayarlarını yeni görsele de uygula
      if(old.filters && old.filters.length){
        newImg.filters = old.filters;
        newImg.applyFilters();
      }
      canvas.remove(old);
      canvas.add(newImg);
      canvas.setActiveObject(newImg);
      baseImage = newImg;
      canvas.renderAll();
      showToast('Arka plan temizlendi');
    }, { crossOrigin: 'anonymous' });

  }catch(err){
    console.error(err);
    showToast('Hata: ' + err.message, 4000);
  }finally{
    btn.disabled = false;
    btn.innerHTML = original;
  }
});

/* ============== Katman Paneli ============== */
function refreshLayerList(){
  const list = document.getElementById('layerList');
  const objects = canvas.getObjects().slice().reverse();
  if(objects.length === 0){
    list.innerHTML = '<div class="empty-msg">Henüz öğe yok</div>';
    return;
  }
  const active = canvas.getActiveObject();
  list.innerHTML = '';
  objects.forEach((obj)=>{
    const div = document.createElement('div');
    div.className = 'layer-item' + (obj === active ? ' active' : '');
    const label = obj.type === 'i-text' ? ('🔤 ' + (obj.text||'').slice(0,14))
      : obj.type === 'image' ? '🖼️ Görsel'
      : obj.type === 'rect' ? '▭ Dikdörtgen'
      : obj.type === 'circle' ? '◯ Daire'
      : obj.type === 'line' ? '／ Çizgi'
      : obj.type;
    div.innerHTML = `<span class="lname">${label}</span>
      <div class="layer-actions">
        <button data-act="up" title="Öne al">↑</button>
        <button data-act="down" title="Arkaya gönder">↓</button>
        <button data-act="del" title="Sil">🗑</button>
      </div>`;
    div.querySelector('.lname').addEventListener('click', ()=>{
      canvas.setActiveObject(obj); canvas.renderAll(); refreshLayerList();
    });
    div.querySelector('[data-act="up"]').addEventListener('click', (e)=>{ e.stopPropagation(); obj.bringForward(); canvas.renderAll(); refreshLayerList(); });
    div.querySelector('[data-act="down"]').addEventListener('click', (e)=>{ e.stopPropagation(); obj.sendBackwards(); canvas.renderAll(); refreshLayerList(); });
    div.querySelector('[data-act="del"]').addEventListener('click', (e)=>{ e.stopPropagation(); canvas.remove(obj); canvas.renderAll(); refreshLayerList(); });
    list.appendChild(div);
  });
}

/* ============== Seçili Öğe Özellik Paneli ============== */
function refreshPropsPanel(){
  const panel = document.getElementById('propsPanel');
  const content = document.getElementById('propsContent');
  const obj = canvas.getActiveObject();
  if(!obj){ panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  content.innerHTML = '';

  if(obj.type === 'i-text'){
    content.innerHTML = `
      <label class="small">Yazı Boyutu</label>
      <input type="number" id="propFontSize" value="${obj.fontSize}" min="8" max="300">
      <label class="small">Renk</label>
      <input type="color" id="propColor" value="${obj.fill || '#ffffff'}">
    `;
    document.getElementById('propFontSize').addEventListener('input', (e)=>{
      obj.set('fontSize', parseInt(e.target.value,10)||42); canvas.renderAll();
    });
    document.getElementById('propColor').addEventListener('input', (e)=>{
      obj.set('fill', e.target.value); canvas.renderAll();
    });
  } else if(obj.type === 'rect' || obj.type === 'circle'){
    const currentFill = (obj.fill && obj.fill !== 'transparent') ? obj.fill : '#1D9E75';
    content.innerHTML = `
      <label class="small">Kenarlık Rengi</label>
      <input type="color" id="propStroke" value="${obj.stroke || '#ffffff'}">
      <label class="small">Kenarlık Kalınlığı</label>
      <input type="range" id="propStrokeWidth" min="0" max="20" value="${obj.strokeWidth || 0}">
      <label class="small">Dolgu Rengi</label>
      <div class="row">
        <input type="color" id="propFill" value="${currentFill}">
        <button id="propFillClear" title="Dolguyu kaldır (içi boş)">✕</button>
      </div>
    `;
    document.getElementById('propStroke').addEventListener('input', (e)=>{
      obj.set('stroke', e.target.value); canvas.renderAll();
    });
    document.getElementById('propStrokeWidth').addEventListener('input', (e)=>{
      obj.set('strokeWidth', parseInt(e.target.value,10)||0); canvas.renderAll();
    });
    document.getElementById('propFill').addEventListener('input', (e)=>{
      obj.set('fill', e.target.value); canvas.renderAll();
    });
    document.getElementById('propFillClear').addEventListener('click', ()=>{
      obj.set('fill', 'transparent'); canvas.renderAll();
    });
  } else if(obj.type === 'line'){
    content.innerHTML = `
      <label class="small">Çizgi Rengi</label>
      <input type="color" id="propStroke" value="${obj.stroke}">
    `;
    document.getElementById('propStroke').addEventListener('input', (e)=>{
      obj.set('stroke', e.target.value); canvas.renderAll();
    });
  } else {
    content.innerHTML = '<div class="hint">Bu öğe için özel ayar yok.</div>';
  }
}

document.getElementById('deleteSelectedBtn').addEventListener('click', ()=>{
  const obj = canvas.getActiveObject();
  if(obj){ canvas.remove(obj); canvas.discardActiveObject(); canvas.renderAll(); }
});

canvas.on('selection:created', ()=>{ refreshPropsPanel(); refreshLayerList(); });
canvas.on('selection:updated', ()=>{ refreshPropsPanel(); refreshLayerList(); });
canvas.on('selection:cleared', ()=>{ document.getElementById('propsPanel').style.display='none'; refreshLayerList(); });

/* ============== İndir ============== */
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  canvas.discardActiveObject();
  canvas.renderAll();
  const dataUrl = canvas.toDataURL({ format: 'png', quality: 1 });
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'gorsel-studyosu-' + Date.now() + '.png';
  a.click();
});

/* ============== Başlat ============== */
initAuth();
updateUndoRedoButtons();
snapshotState(); // boş canvas'ı ilk state olarak kaydet
</script>
