<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görsel Stüdyosu - HızlıSatıcı AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  :root{
    --bg-dark:#0b1220;
    --bg-panel:#111a2e;
    --bg-panel-2:#16213a;
    --border:#233150;
    --text:#e7ecf5;
    --text-dim:#9aa7c2;
    --accent:#1D9E75;
    --accent-hover:#178a65;
    --danger:#e0554f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-dark);
    color:var(--text);
    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh;
  }
  a{color:var(--accent); text-decoration:none;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:18px; margin:0; display:flex; align-items:center; gap:8px;}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button{
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--bg-panel-2);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:#1c2942; border-color:var(--accent);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#04150f; font-weight:600;}
  button.primary:hover{background:var(--accent-hover);}
  button.danger{border-color:var(--danger); color:var(--danger); background:transparent;}
  button.danger:hover{background:rgba(224,85,79,.12);}
  button.icon-btn{padding:6px 9px; font-size:15px; line-height:1;}
  .layout{
    display:flex;
    gap:14px;
    padding:14px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
  }
  .sidebar-left{width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
  .sidebar-right{width:230px; flex-shrink:0;}
  .canvas-wrap{
    flex:1;
    min-width:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .canvas-stage{
    background:repeating-conic-gradient(#1a2540 0% 25%, #10182b 0% 50%) 50% / 20px 20px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    max-width:100%;
    overflow:auto;
  }
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); margin:0 0 10px 0; font-weight:600;
  }
  .tool-group{border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}
  .tool-group:first-child{border-top:none; padding-top:0; margin-top:0;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .btn-grid button{width:100%;}
  .full-btn{width:100%; margin-bottom:6px;}
  label.small{font-size:12px; color:var(--text-dim); display:block; margin:8px 0 4px;}
  input[type=range]{width:100%; accent-color:var(--accent);}
  input[type=color]{width:100%; height:32px; border:1px solid var(--border); border-radius:6px; background:none; padding:2px;}
  input[type=text], input[type=number], select{
    width:100%; padding:6px 8px; border-radius:6px;
    border:1px solid var(--border); background:var(--bg-panel-2); color:var(--text); font-size:13px;
  }
  .row{display:flex; gap:6px; align-items:center;}
  .row > *{flex:1;}
  .hint{font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
  #fileInput{display:none;}
  .layer-item{
    display:flex; align-items:center; gap:6px;
    padding:6px 8px; border-radius:8px; border:1px solid transparent;
    background:var(--bg-panel-2); margin-bottom:6px; cursor:pointer; font-size:12px;
  }
  .layer-item.active{border-color:var(--accent);}
  .layer-item span.lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .layer-actions{display:flex; gap:2px;}
  .layer-actions button{padding:2px 6px; font-size:11px;}
  .empty-msg{color:var(--text-dim); font-size:12px; text-align:center; padding:16px 0;}
  .props-box{border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}
  #cropBar{display:none; gap:8px; margin-top:8px;}
  #lassoBar{display:none; flex-direction:column; gap:6px; margin-top:8px;}
  button.tool-active{border-color:var(--accent); background:#1c2942; color:var(--accent);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--bg-panel-2); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    display:none; max-width:90vw;
  }
  .spinner{
    display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.3);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (max-width: 600px){
    .sidebar-left, .sidebar-right{width:100%;}
    .canvas-wrap{min-width:0; width:100%;}
  }
</style>
</head>

    </div>

    <div class="panel">
      <p class="section-title" data-t="secEdit"></p>
      <div class="row">

      </div>

        <input type="range" id="brightnessSlider" min="-100" max="100" value="0">
        <label class="small" data-t="contrast"></label>
        <input type="range" id="contrastSlider" min="-100" max="100" value="0">
        <label class="small" data-t="saturation"></label>
        <input type="range" id="saturationSlider" min="-100" max="100" value="0">
        <button class="full-btn" id="resetFiltersBtn" style="margin-top:8px;" data-t="resetFilters"></button>
      </div>

      <div class="tool-group">
        <label class="small" data-t="bgColor"></label>
        <div class="row">
          <input type="color" id="bgColorPicker" value="#ffffff">
          <button id="bgColorClearBtn" data-tt="bgColorClear">✕</button>
        </div>
        <div class="hint" data-t="bgColorHint"></div>
      </div>
    </div>

    <div class="panel">
      <p class="section-title" data-t="secSize"></p>
      <button class="full-btn" data-w="1080" data-h="1080" data-t="sizeTrendyol"></button>
      <button class="full-btn" data-w="1080" data-h="1080" data-t="sizeIgSquare"></button>

      <button class="full-btn" data-w="1200" data-h="630" data-t="sizeFb"></button>
    </div>

  </div>

  <div class="canvas-wrap">
    <div class="canvas-stage">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="hint" data-th="canvasHint"></div>
  </div>

  <!-- SAĞ PANEL: KATMANLAR + ÖZELLİKLER -->

    <div class="panel">
      <p class="section-title" data-t="secLayers"></p>

</div>

function lang(){
  const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
  return T[l] ? l : 'tr';
}
function t(key, vars){
  let v = T[lang()][key];
  if(v === undefined) v = T.tr[key] !== undefined ? T.tr[key] : key;
  if(vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k)=> vars[k] != null ? vars[k] : m);
  return v;
}
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function applyStatic(){
  document.documentElement.lang = lang();
  document.title = t('pageTitle');
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-th]').forEach(el=>{ el.innerHTML = t(el.getAttribute('data-th')); });
  document.querySelectorAll('[data-tt]').forEach(el=>{ el.title = t(el.getAttribute('data-tt')); });
}

let toastTimer = null;
function showToast(msg, ms=2500){
  const el = document.getElementById('toast');

  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.style.display='none', ms);

/* ============== Fabric Canvas ============== */
const canvas = new fabric.Canvas('mainCanvas', {
  width: 800,
  height: 800,
  backgroundColor: null,
  preserveObjectStacking: true
});

let baseImage = null; // yüklenen / düzenlenen ana ürün görseli (fabric.Image)

/* ============== Undo / Redo ============== */
let undoStack = [];
let redoStack = [];
let isRestoring = false;
const HISTORY_LIMIT = 40;

function snapshotState(){
  if(isRestoring) return;
  const json = JSON.stringify(canvas.toJSON(['selectable','evented']));
  undoStack.push(json);
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function restoreFromJSON(json){
  isRestoring = true;
  canvas.loadFromJSON(json, ()=>{
    canvas.renderAll();
    // baseImage referansını yeniden bul (ilk eklenen image objesi)
    const imgs = canvas.getObjects('image');
    baseImage = imgs.length ? imgs[0] : null;
    isRestoring = false;
    refreshLayerList();
  });
}

function undo(){
  if(undoStack.length < 2) return; // en az 1 önceki state kalmalı
  const current = undoStack.pop();
  redoStack.push(current);
  const prev = undoStack[undoStack.length - 1];
  restoreFromJSON(prev);
  updateUndoRedoButtons();
}

function redo(){
  if(redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(next);
  restoreFromJSON(next);
  updateUndoRedoButtons();
}

function updateUndoRedoButtons(){
  document.getElementById('undoBtn').disabled = undoStack.length < 2;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}

canvas.on('object:added', ()=>{ snapshotState(); refreshLayerList(); });
canvas.on('object:removed', ()=>{ snapshotState(); refreshLayerList(); });
canvas.on('object:modified', ()=>{ snapshotState(); refreshLayerList(); });

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    const active = canvas.getActiveObject();
    if(active && !active.isEditing){ e.preventDefault(); canvas.remove(active); canvas.discardActiveObject(); canvas.renderAll(); }
  }
});

function loadImageFile(file){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    fabric.Image.fromURL(ev.target.result, (img)=>{
      // canvas'a sığacak şekilde ölçekle
      const scale = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
      img.set({
        left: canvas.width/2,
        top: canvas.height/2,
        originX: 'center',
        originY: 'center',
        scaleX: scale,
        scaleY: scale,
        cornerColor: '#1D9E75',
        cornerStyle: 'circle',
        transparentCorners: false
      });
      canvas.add(img);
      canvas.setActiveObject(img);
      baseImage = img;
      canvas.renderAll();
      showToast(t('tImageLoaded'));
    }, { crossOrigin: 'anonymous' });
  };
  reader.readAsDataURL(file);
}

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  loadImageFile(file);
  e.target.value = '';
});

document.getElementById('removeBgBtn').addEventListener('click', async ()=>{
  if(!baseImage){ showToast(t('tNeedImage')); return; }
  const btn = document.getElementById('removeBgBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> ' + escapeHtml(t('processing'));
  try{
    // görselin mevcut halini (filtreler dahil) base64 olarak al
    const dataUrl = baseImage.toDataURL({ format: 'png' });
    const res = await fetch(`${SUPABASE_URL}/functions/v1/remove-background`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ imageBase64: dataUrl, userAccessToken: currentUserAccessToken, language: lang() })
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok){ throw new Error(data.error || t('tServerError', { s: res.status })); }
    const resultUrl = data.imageBase64;
    if(!resultUrl) throw new Error(t('tBadResponse'));

    fabric.Image.fromURL(resultUrl, (newImg)=>{
      const old = baseImage;
      // Yeni görsel farklı çözünürlükte dönebilir: ekrandaki eski görünür boyut hedeflenir.
      const targetDisplayWidth = old.getScaledWidth();
      const targetDisplayHeight = old.getScaledHeight();
      newImg.set({
        left: old.left, top: old.top, originX: old.originX, originY: old.originY,
        scaleX: targetDisplayWidth / newImg.width,
        scaleY: targetDisplayHeight / newImg.height,
        angle: old.angle,
        cornerColor:'#1D9E75', cornerStyle:'circle', transparentCorners:false
      });
      // önceki parlaklık/kontrast/doygunluk ayarlarını yeni görsele de uygula
      if(old.filters && old.filters.length){
        newImg.filters = old.filters;
        newImg.applyFilters();
      }
      canvas.remove(old);
      canvas.add(newImg);
      canvas.setActiveObject(newImg);
      baseImage = newImg;
      canvas.renderAll();
      showToast(t('tBgRemoved'));
    }, { crossOrigin: 'anonymous' });

  }catch(err){
    console.error(err);
    showToast(t('tError') + err.message, 4000);
  }finally{
    btn.disabled = false;
    btn.textContent = t('removeBg');
  }
});

/* ============== Kes ve Sil (fırçayla sil + çizerek kes) ============== */
let toolMode = null;      // null | 'erase' | 'lasso'
let toolTarget = null;    // üzerinde çalışılan fabric.Image
let toolPts = [];         // fareyle çizilen noktalar (tuval koordinatı)
let toolDrawing = false;
let brushSize = 30;
const MAX_EDIT_PX = 2048; // düzenleme sırasında görselin en uzun kenarı bunu geçmesin (hız için)

const eraseToolBtn = document.getElementById('eraseToolBtn');
const lassoToolBtn = document.getElementById('lassoToolBtn');
const toolDoneBtn = document.getElementById('toolDoneBtn');
const lassoBar = document.getElementById('lassoBar');
const toolHint = document.getElementById('toolHint');

function pickToolTarget(){
  const a = canvas.getActiveObject();
  if(a && a.type === 'image') return a;
  const all = canvas.getObjects();
  if(baseImage && all.indexOf(baseImage) !== -1) return baseImage;
  const imgs = canvas.getObjects('image');
  return imgs.length ? imgs[imgs.length - 1] : null;
}

function drawToolOverlay(){
  if(!toolMode) return;
  const ctx = canvas.contextTop;
  if(!ctx) return;
  canvas.clearContext(ctx);
  ctx.save();
  // Düzenlenen görselin çerçevesi
  if(toolTarget){
    const b = toolTarget.getBoundingRect(true, true);
    ctx.strokeStyle = 'rgba(29,158,117,0.9)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(b.left, b.top, b.width, b.height);
  }
  if(toolPts.length){
    ctx.beginPath();
    toolPts.forEach((p, i)=>{ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    if(toolPts.length === 1) ctx.lineTo(toolPts[0].x + 0.01, toolPts[0].y);
    if(toolMode === 'erase'){
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,80,80,0.55)';
      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    } else {
      ctx.closePath();
      ctx.fillStyle = 'rgba(29,158,117,0.20)';
      ctx.fill();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = '#1D9E75';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  ctx.restore();
  canvas.contextTopDirty = true;
}
canvas.on('after:render', drawToolOverlay);

function updateToolButtons(){
  eraseToolBtn.classList.toggle('tool-active', toolMode === 'erase');
  lassoToolBtn.classList.toggle('tool-active', toolMode === 'lasso');
  toolDoneBtn.style.display = toolMode ? 'block' : 'none';
  if(!toolMode){ lassoBar.style.display = 'none'; toolHint.textContent = t('hintIdle'); }
  else if(toolMode === 'erase'){ toolHint.textContent = t('hintErase'); }
  else { toolHint.textContent = t('hintLasso'); }
}

function startTool(mode){
  const target = pickToolTarget();
  if(!target){ showToast(t('tNeedImage')); return; }
  if(typeof cancelCrop === 'function') cancelCrop();
  toolMode = mode;
  toolTarget = target;
  toolPts = [];
  toolDrawing = false;
  canvas.discardActiveObject();
  canvas.selection = false;
  canvas.skipTargetFind = true;
  canvas.defaultCursor = 'crosshair';
  canvas.hoverCursor = 'crosshair';
  updateToolButtons();
  canvas.renderAll();
}

function exitTool(){
  toolMode = null;
  toolTarget = null;
  toolPts = [];
  toolDrawing = false;
  canvas.selection = true;
  canvas.skipTargetFind = false;
  canvas.defaultCursor = 'default';
  canvas.hoverCursor = 'move';
  if(canvas.contextTop) canvas.clearContext(canvas.contextTop);
  updateToolButtons();
  canvas.renderAll();
}

eraseToolBtn.addEventListener('click', ()=>{ if(toolMode === 'erase'){ exitTool(); } else { startTool('erase'); } });
lassoToolBtn.addEventListener('click', ()=>{ if(toolMode === 'lasso'){ exitTool(); } else { startTool('lasso'); } });
toolDoneBtn.addEventListener('click', exitTool);

document.getElementById('brushSize').addEventListener('input', (e)=>{
  brushSize = parseInt(e.target.value, 10) || 30;
  document.getElementById('brushSizeVal').textContent = brushSize;
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && toolMode) exitTool();
});

// Araç açıkken katman listesinden başka bir görsel seçilirse hedef o olsun
function onToolSelection(e){
  if(!toolMode) return;
  const sel = e && e.selected && e.selected[0];
  if(sel && sel.type === 'image'){ toolTarget = sel; canvas.requestRenderAll(); }
}
canvas.on('selection:created', onToolSelection);
canvas.on('selection:updated', onToolSelection);

canvas.on('mouse:down', (opt)=>{
  if(!toolMode || !toolTarget) return;
  lassoBar.style.display = 'none';
  toolDrawing = true;
  const p = canvas.getPointer(opt.e);
  toolPts = [{ x: p.x, y: p.y }];
  drawToolOverlay();
});
canvas.on('mouse:move', (opt)=>{
  if(!toolMode || !toolDrawing) return;
  const p = canvas.getPointer(opt.e);
  const last = toolPts[toolPts.length - 1];
  if(Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
  toolPts.push({ x: p.x, y: p.y });
  drawToolOverlay();
});
canvas.on('mouse:up', ()=>{
  if(!toolMode || !toolDrawing) return;
  toolDrawing = false;
  if(toolMode === 'erase'){
    const pts = toolPts;
    toolPts = [];
    applyErase(pts);
    drawToolOverlay();
  } else {
    if(toolPts.length < 3){ toolPts = []; drawToolOverlay(); return; }
    lassoBar.style.display = 'flex';
    drawToolOverlay();
  }
});

/* --- Görselin gerçek piksellerine ulaşma yardımcıları --- */
function makeEditContext(img){
  const w = img.width, h = img.height;
  const s = Math.min(1, MAX_EDIT_PX / Math.max(w, h));
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * s));
  off.height = Math.max(1, Math.round(h * s));
  const ctx = off.getContext('2d');
  ctx.drawImage(img.getElement(), 0, 0, off.width, off.height);
  const inv = fabric.util.invertTransform(img.calcTransformMatrix());
  const sx = off.width / w, sy = off.height / h;
  const toPx = (p)=>{
    const l = fabric.util.transformPoint(new fabric.Point(p.x, p.y), inv);
    return { x: (l.x + w / 2) * sx, y: (l.y + h / 2) * sy };
  };
  return { off, ctx, w, h, sx, sy, toPx };
}

// Düzenlenmiş pikselleri aynı görsel nesnesine geri yazar (konum, boyut, açı aynen kalır)
function commitEdit(img, e){
  img.filters = [];
  img.setElement(e.off);
  img.scaleX = img.scaleX / e.sx;
  img.scaleY = img.scaleY / e.sy;
  img.dirty = true;
  img.setCoords();
  if(img === baseImage){
    ['brightnessSlider','contrastSlider','saturationSlider'].forEach(id=>{ document.getElementById(id).value = 0; });
  }
  canvas.renderAll();
  snapshotState();
}

function tracePolygon(ctx, pts){
  ctx.beginPath();
  pts.forEach((p, i)=>{ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
}

/* --- Fırçayla Sil --- */
function applyErase(pts){
  const img = toolTarget;
  if(!img || !pts.length) return;
  const e = makeEditContext(img);
  const px = pts.map(e.toPx);
  const scaleAvg = (Math.abs(img.scaleX) + Math.abs(img.scaleY)) / 2 || 1;
  const ctx = e.ctx;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = Math.max(1, (brushSize / scaleAvg) * e.sx);
  ctx.beginPath();
  px.forEach((p, i)=>{ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  if(px.length === 1) ctx.lineTo(px[0].x + 0.01, px[0].y);
  ctx.stroke();
  ctx.restore();
  commitEdit(img, e);
}

/* --- Çizerek Kes: İçini Sil --- */
document.getElementById('lassoDeleteBtn').addEventListener('click', ()=>{
  const img = toolTarget;
  if(!img || toolPts.length < 3) return;
  const e = makeEditContext(img);
  const px = toolPts.map(e.toPx);
  e.ctx.save();
  e.ctx.globalCompositeOperation = 'destination-out';
  e.ctx.fillStyle = '#000';
  tracePolygon(e.ctx, px);
  e.ctx.fill();
  e.ctx.restore();
  commitEdit(img, e);
  exitTool();
  showToast(t('tAreaDeleted'));
});

/* --- Çizerek Kes: İçini Yeni Katman Yap --- */
document.getElementById('lassoKeepBtn').addEventListener('click', ()=>{
  const img = toolTarget;
  if(!img || toolPts.length < 3) return;
  const e = makeEditContext(img);
  const px = toolPts.map(e.toPx);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  px.forEach(p=>{ minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
  const bx = Math.max(0, Math.floor(minX)), by = Math.max(0, Math.floor(minY));
  const bw = Math.min(e.off.width, Math.ceil(maxX)) - bx;
  const bh = Math.min(e.off.height, Math.ceil(maxY)) - by;
  if(bw < 2 || bh < 2){ showToast(t('tOutside')); return; }

  const cut = document.createElement('canvas');
  cut.width = bw; cut.height = bh;
  const c2 = cut.getContext('2d');
  c2.save();
  tracePolygon(c2, px.map(p=>({ x: p.x - bx, y: p.y - by })));
  c2.clip();
  c2.drawImage(e.off, -bx, -by);
  c2.restore();

  // Parçayı, kaynak görselin üstünde tam aynı yere yerleştir
  const localCenter = new fabric.Point((bx + bw / 2) / e.sx - e.w / 2, (by + bh / 2) / e.sy - e.h / 2);
  const P = fabric.util.transformPoint(localCenter, img.calcTransformMatrix());
  const piece = new fabric.Image(cut, {
    left: P.x, top: P.y, originX: 'center', originY: 'center',
    scaleX: img.scaleX / e.sx, scaleY: img.scaleY / e.sy,
    angle: img.angle, flipX: img.flipX, flipY: img.flipY,
    cornerColor: '#1D9E75', cornerStyle: 'circle', transparentCorners: false
  });
  exitTool();
  canvas.add(piece);
  canvas.setActiveObject(piece);
  canvas.renderAll();
  showToast(t('tPieceLayer'), 4000);
});

document.getElementById('lassoRedrawBtn').addEventListener('click', ()=>{
  toolPts = [];
  lassoBar.style.display = 'none';
  drawToolOverlay();
});

/* ============== Katman Paneli ============== */
function refreshLayerList(){
  const list = document.getElementById('layerList');
  const objects = canvas.getObjects().slice().reverse();
  if(objects.length === 0){
    list.innerHTML = '<div class="empty-msg">' + escapeHtml(t('noLayers')) + '</div>';
    return;
  }
  const active = canvas.getActiveObject();
  list.innerHTML = '';
  objects.forEach((obj)=>{
    const div = document.createElement('div');
    div.className = 'layer-item' + (obj === active ? ' active' : '');
    const label = obj.type === 'i-text' ? ('🔤 ' + (obj.text||'').slice(0,14))
      : obj.type === 'image' ? t('layerImage')
      : obj.type === 'rect' ? t('layerRect')
      : obj.type === 'circle' ? t('layerCircle')
      : obj.type === 'line' ? t('layerLine')
      : obj.type;
    div.innerHTML = '<span class="lname">' + escapeHtml(label) + '</span>' +
      '<div class="layer-actions">' +
        '<button data-act="up" title="' + escapeHtml(t('bringForward')) + '">↑</button>' +
        '<button data-act="down" title="' + escapeHtml(t('sendBackward')) + '">↓</button>' +
        '<button data-act="del" title="' + escapeHtml(t('del')) + '">🗑</button>' +
      '</div>';
    div.querySelector('.lname').addEventListener('click', ()=>{
      canvas.setActiveObject(obj); canvas.renderAll(); refreshLayerList();
    });
    div.querySelector('[data-act="up"]').addEventListener('click', (e)=>{ e.stopPropagation(); obj.bringForward(); canvas.renderAll(); refreshLayerList(); });
    div.querySelector('[data-act="down"]').addEventListener('click', (e)=>{ e.stopPropagation(); obj.sendBackwards(); canvas.renderAll(); refreshLayerList(); });
    div.querySelector('[data-act="del"]').addEventListener('click', (e)=>{ e.stopPropagation(); canvas.remove(obj); canvas.renderAll(); refreshLayerList(); });
    list.appendChild(div);
  });
}

/* ============== Seçili Öğe Özellik Paneli ============== */
function safeColor(c, fallback){
  return /^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : fallback;
}
function refreshPropsPanel(){
  const panel = document.getElementById('propsPanel');
  const content = document.getElementById('propsContent');
  const obj = canvas.getActiveObject();
  if(!obj){ panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  content.innerHTML = '';

  if(obj.type === 'i-text'){
    content.innerHTML =
      '<label class="small">' + escapeHtml(t('fontSize')) + '</label>' +
      '<input type="number" id="propFontSize" value="' + (parseInt(obj.fontSize, 10) || 42) + '" min="8" max="300">' +
      '<label class="small">' + escapeHtml(t('color')) + '</label>' +
      '<input type="color" id="propColor" value="' + safeColor(obj.fill, '#ffffff') + '">';
    document.getElementById('propFontSize').addEventListener('input', (e)=>{
      obj.set('fontSize', parseInt(e.target.value,10)||42); canvas.renderAll();
    });
    document.getElementById('propColor').addEventListener('input', (e)=>{
      obj.set('fill', e.target.value); canvas.renderAll();
    });
  } else if(obj.type === 'rect' || obj.type === 'circle'){
    const currentFill = (obj.fill && obj.fill !== 'transparent') ? safeColor(obj.fill, '#1D9E75') : '#1D9E75';
    content.innerHTML =
      '<label class="small">' + escapeHtml(t('strokeColor')) + '</label>' +
      '<input type="color" id="propStroke" value="' + safeColor(obj.stroke, '#ffffff') + '">' +
      '<label class="small">' + escapeHtml(t('strokeWidth')) + '</label>' +
      '<input type="range" id="propStrokeWidth" min="0" max="20" value="' + (parseInt(obj.strokeWidth, 10) || 0) + '">' +
      '<label class="small">' + escapeHtml(t('fillColor')) + '</label>' +
      '<div class="row">' +
        '<input type="color" id="propFill" value="' + currentFill + '">' +
        '<button id="propFillClear" title="' + escapeHtml(t('fillClear')) + '">✕</button>' +
      '</div>';
    document.getElementById('propStroke').addEventListener('input', (e)=>{
      obj.set('stroke', e.target.value); canvas.renderAll();
    });
    document.getElementById('propStrokeWidth').addEventListener('input', (e)=>{
      obj.set('strokeWidth', parseInt(e.target.value,10)||0); canvas.renderAll();
    });
    document.getElementById('propFill').addEventListener('input', (e)=>{
      obj.set('fill', e.target.value); canvas.renderAll();
    });
    document.getElementById('propFillClear').addEventListener('click', ()=>{
      obj.set('fill', 'transparent'); canvas.renderAll();
    });
  } else if(obj.type === 'line'){
    content.innerHTML =
      '<label class="small">' + escapeHtml(t('lineColor')) + '</label>' +
      '<input type="color" id="propStroke" value="' + safeColor(obj.stroke, '#ffffff') + '">';
    document.getElementById('propStroke').addEventListener('input', (e)=>{
      obj.set('stroke', e.target.value); canvas.renderAll();
    });
  } else {
    content.innerHTML = '<div class="hint">' + escapeHtml(t('noProps')) + '</div>';
  }
}

document.getElementById('deleteSelectedBtn').addEventListener('click', ()=>{
  const obj = canvas.getActiveObject();
  if(obj){ canvas.remove(obj); canvas.discardActiveObject(); canvas.renderAll(); }
});

canvas.on('selection:created', ()=>{ refreshPropsPanel(); refreshLayerList(); });
canvas.on('selection:updated', ()=>{ refreshPropsPanel(); refreshLayerList(); });
canvas.on('selection:cleared', ()=>{ document.getElementById('propsPanel').style.display='none'; refreshLayerList(); });

/* ============== İndir ============== */
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  canvas.discardActiveObject();
  canvas.renderAll();
  const dataUrl = canvas.toDataURL({ format: 'png', quality: 1 });
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = (lang() === 'en' ? 'image-studio-' : 'gorsel-studyosu-') + Date.now() + '.png';
  a.click();
});

/* ============== Print on Demand'a gönder ============== */
function saveDesignForPod(dataUrl){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('hizlisatici-studio', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onerror = ()=>reject(req.error);
    req.onsuccess = ()=>{
      const tx = req.result.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ dataUrl: dataUrl, ts: Date.now() }, 'pod-design');
      tx.oncomplete = ()=>{ req.result.close(); resolve(); };
      tx.onerror = ()=>reject(tx.error);
    };
  });
}
document.getElementById('podBtn').addEventListener('click', async ()=>{
  if(canvas.getObjects().length === 0){
    showToast(t('tNeedContent'));
    return;
  }
  canvas.discardActiveObject();
  canvas.renderAll();
  try{
    // Baskı kalitesi için tuvali büyüterek dışa aktar (800px -> yaklaşık 2400px)
    const dataUrl = canvas.toDataURL({ format: 'png', multiplier: 3 });
    await saveDesignForPod(dataUrl);
    window.location.href = 'pod.html?studio=1';
  }catch(err){
    showToast(t('tSendFail') + err.message);
  }
});

  applyStatic();
  updateToolButtons();
  refreshLayerList();
  if(canvas.getActiveObject()) refreshPropsPanel();
}
window.addEventListener('hs:langchange', onLangChange);
document.addEventListener('hs:langchange', onLangChange);

/* ============== Başlat ============== */
applyStatic();
updateToolButtons();
refreshLayerList();
updateUndoRedoButtons();
snapshotState(); // boş canvas'ı ilk state olarak kaydet
initAuth();
</script>
