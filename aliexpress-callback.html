<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliExpress Yetkilendirme</title>
<style>
  body {
    background: #0f1117;
    color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .box {
    max-width: 520px;
    width: 100%;
    background: #171a23;
    border: 1px solid #2a2f3d;
    border-radius: 14px;
    padding: 28px;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #9aa1b2; font-size: 14px; line-height: 1.5; }
  .code-box {
    margin: 20px 0;
    padding: 14px;
    background: #0f1117;
    border: 1px solid #2a2f3d;
    border-radius: 10px;
    word-break: break-all;
    font-family: monospace;
    font-size: 14px;
    color: #4ade80;
  }
  button {
    background: #22c55e;
    color: #06280f;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #16a34a; }
  .warn { color: #f59e0b; margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>
  <div class="box">
    <h1>AliExpress Yetkilendirme Kodu</h1>
    <p>Bu sayfa hiçbir yere otomatik yönlendirme yapmaz. Aşağıdaki kodu kopyala.</p>
    <div class="code-box" id="codeBox">Kod aranıyor...</div>
    <button onclick="copyCode()">Kodu Kopyala</button>
    <p class="warn" id="warnMsg" style="display:none;">URL'de "code" parametresi bulunamadı. AliExpress yetkilendirme adımını tekrar dene.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const codeBox = document.getElementById('codeBox');
    const warnMsg = document.getElementById('warnMsg');

    if (code) {
      codeBox.textContent = code;
    } else {
      codeBox.textContent = '(kod yok)';
      warnMsg.style.display = 'block';
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        alert('Kopyalandı!');
      });
    }
  </script>
</body>
</html>
