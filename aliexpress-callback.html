<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliExpress Bağlantısı · Seltigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    background: #0f1117;
    color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .box {
    max-width: 480px;
    width: 100%;
    background: #171a23;
    border: 1px solid #2a2f3d;
    border-radius: 14px;
    padding: 28px;
    text-align: center;
  }
  #langSwitcherHost { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  #langSwitcherHost .hs-lang { margin-left: 0; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .msg { color: #9aa1b2; font-size: 15px; line-height: 1.6; }
  .msg.success { color: #5DCAA5; }
  .msg.error { color: #f28b8b; }
  .spinner {
    width: 36px; height: 36px; margin: 18px auto 0;
    border: 3px solid #2a2f3d; border-top-color: #1D9E75; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: inline-block; margin-top: 18px; padding: 11px 20px; border-radius: 10px;
    background: #1D9E75; color: #fff; font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div id="langSwitcherHost"></div>
    <h1 data-i18n="ae.title"></h1>
    <p class="msg" id="msg"></p>
    <div class="spinner" id="spinner"></div>
    <a class="btn" id="backBtn" href="accounts.html" style="display:none;" data-i18n="ae.back"></a>
  </div>

  <script src="app.js"></script>
  <script>
    HS.i18n.add({
      tr: {
        'ae.pageTitle': 'AliExpress Bağlantısı · Seltigo',
        'ae.title': 'AliExpress hesabı bağlanıyor',
        'ae.connecting': 'AliExpress hesabın bağlanıyor, lütfen bekle...',
        'ae.success': '✓ AliExpress hesabın bağlandı{a}. Hesaplarım sayfasına dönülüyor...',
        'ae.noCode': 'AliExpress izin vermedi ya da bağlantı yarıda kaldı. Hesaplarım sayfasından tekrar bağlanmayı dene.',
        'ae.noSession': 'Önce Seltigo hesabına giriş yapmalısın, sonra Hesaplarım sayfasından tekrar bağlan.',
        'ae.failed': 'Bağlanamadı: {e}',
        'ae.back': 'Hesaplarım\'a dön'
      },
      en: {
        'ae.pageTitle': 'AliExpress Connection · Seltigo',
        'ae.title': 'Connecting AliExpress account',
        'ae.connecting': 'Connecting your AliExpress account, please wait...',
        'ae.success': '✓ Your AliExpress account is connected{a}. Returning to My Accounts...',
        'ae.noCode': 'AliExpress did not grant access or the connection was interrupted. Try connecting again from My Accounts.',
        'ae.noSession': 'Please log in to Seltigo first, then connect again from My Accounts.',
        'ae.failed': 'Could not connect: {e}',
        'ae.back': 'Back to My Accounts'
      }
    });

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    let msgKey = 'ae.connecting', msgVars = null, msgCls = '';

    function render() {
      document.title = HS.t('ae.pageTitle');
      const el = document.getElementById('msg');
      el.textContent = HS.t(msgKey, msgVars);
      el.className = 'msg ' + msgCls;
    }
    function finish(key, cls, vars, redirect) {
      msgKey = key; msgCls = cls; msgVars = vars || null;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('backBtn').style.display = redirect ? 'none' : 'inline-block';
      render();
      if (redirect) setTimeout(() => { window.location.href = 'accounts.html'; }, 2000);
    }

    async function connect() {
      render();
      if (!code || !state) return finish('ae.noCode', 'error');
      const res = await HS.db.auth.getSession();
      if (!res || !res.data || !res.data.session) return finish('ae.noSession', 'error');
      try {
        const r = await fetch(HS.SUPABASE_URL + '/functions/v1/aliexpress-token-exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
          body: JSON.stringify({ action: 'exchange', code: code, state: state })
        });
        const d = await r.json().catch(function () { return {}; });
        if (r.ok && d.success) finish('ae.success', 'success', { a: d.account ? ' (' + d.account + ')' : '' }, true);
        else finish('ae.failed', 'error', { e: d.error || ('HTTP ' + r.status) });
      } catch (e) {
        finish('ae.failed', 'error', { e: e.message });
      }
    }

    window.addEventListener('hs:langchange', render);
    HS.init({ auth: false }).then(connect);
  </script>
</body>
</html>
