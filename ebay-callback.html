<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eBay Bağlantısı</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; background: #0f1117; color: #fff; }
  .box { text-align: center; padding: 32px 40px 40px; background: #171a23; border: 1px solid #2a2f3d; border-radius: 12px; max-width: 460px; width: 100%; box-sizing: border-box; }
  #langSwitcherHost { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  #langSwitcherHost .hs-lang { margin-left: 0; }
  .spinner { border: 4px solid #2a2f3d; border-top: 4px solid #0064D2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #message { color: #cfd4de; font-size: 15px; line-height: 1.5; }
  #message.error { color: #f28b8b; }
  #message.success { color: #4ade80; }
</style>
</head>
<body>
<div class="box">
  <div id="langSwitcherHost"></div>
  <div class="spinner" id="spinner"></div>
  <p id="message"></p>
</div>

<script src="app.js"></script>
<script>
  HS.i18n.add({
    tr: {
      'eb.pageTitle': 'eBay Bağlantısı',
      'eb.connecting': 'eBay hesabınız bağlanıyor, lütfen bekleyin...',
      'eb.noCode': 'eBay bağlantısı başarısız oldu (kod alınamadı).',
      'eb.noSession': 'Oturum bulunamadı, giriş sayfasına yönlendiriliyorsunuz...',
      'eb.success': 'eBay hesabınız başarıyla bağlandı! Yönlendiriliyorsunuz...',
      'eb.errPrefix': 'Bağlantı hatası: ',
      'eb.unknown': 'Bilinmeyen hata'
    },
    en: {
      'eb.pageTitle': 'eBay Connection',
      'eb.connecting': 'Connecting your eBay account, please wait...',
      'eb.noCode': 'eBay connection failed (no code received).',
      'eb.noSession': 'No session found, redirecting to the login page...',
      'eb.success': 'Your eBay account has been connected! Redirecting...',
      'eb.errPrefix': 'Connection error: ',
      'eb.unknown': 'Unknown error'
    }
  });

  const msgEl = document.getElementById('message');
  const spinnerEl = document.getElementById('spinner');

  // Ekrandaki mesajı hatırla ki dil değişince aynı mesaj yeni dilde yazılsın
  let msgKey = 'eb.connecting';
  let msgExtra = '';
  let msgClass = '';

  function renderMsg() {
    document.title = HS.t('eb.pageTitle');
    msgEl.textContent = HS.t(msgKey) + msgExtra;
    msgEl.className = msgClass;
  }

  function setMsg(key, cls, extra) {
    msgKey = key;
    msgClass = cls || '';
    msgExtra = extra || '';
    renderMsg();
  }

  window.addEventListener('hs:langchange', renderMsg);

  async function handleCallback() {
    await HS.init({ auth: false });
    renderMsg();

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (!code) {
      setMsg('eb.noCode', 'error');
      spinnerEl.style.display = 'none';
      setTimeout(() => window.location.href = 'accounts.html', 3000);
      return;
    }

    const { data: { session } } = await HS.db.auth.getSession();
    if (!session) {
      setMsg('eb.noSession');
      setTimeout(() => window.location.href = 'index.html', 2000);
      return;
    }

    try {
      const response = await fetch(HS.SUPABASE_URL + '/functions/v1/ebay-token-exchange', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token,
        },
        body: JSON.stringify({ code: code }),
      });

      const result = await response.json();

      if (response.ok && result.success) {
        setMsg('eb.success', 'success');
        spinnerEl.style.display = 'none';
        setTimeout(() => window.location.href = 'accounts.html', 2000);
      } else {
        throw new Error(result.error || HS.t('eb.unknown'));
      }
    } catch (err) {
      setMsg('eb.errPrefix', 'error', err.message);
      spinnerEl.style.display = 'none';
      setTimeout(() => window.location.href = 'accounts.html', 4000);
    }
  }

  handleCallback();
</script>
</body>
</html>
