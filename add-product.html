<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Ürün Ekle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px;
    background: #1D9E75; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .back-link {
    color: #9aa3b2; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 6px;
  }
  .back-link:hover { color: #fff; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 28px; }

  .section {
    background: #141821;
    border-radius: 14px;
    border: 1px solid #232838;
    padding: 22px;
    margin-bottom: 18px;
  }
  .section-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 16px; }

  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; color: #9aa3b2; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    background: #1c212c;
    border: 1px solid #2a3040;
    border-radius: 8px;
    padding: 10px 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: #1D9E75; }
  textarea { resize: vertical; min-height: 70px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none;
    padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040;
    padding: 11px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }

  .ai-result {
    background: #10251d;
    border: 1px solid #1D9E75;
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
    display: none;
  }
  .ai-result.show { display: block; }
  .ai-label { font-size: 11px; color: #5DCAA5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .ai-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 10px; }
  .ai-desc { font-size: 13px; color: #c5cad4; line-height: 1.5; margin-bottom: 10px; }
  .ai-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .ai-tag { background: #1c3a2e; color: #5DCAA5; font-size: 12px; padding: 4px 10px; border-radius: 20px; }

  .profit-box {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 4px;
  }
  .profit-item {
    background: #1c212c;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .profit-label { font-size: 11px; color: #9aa3b2; margin-bottom: 4px; }
  .profit-value { font-size: 17px; font-weight: 600; color: #fff; }
  .profit-value.green { color: #5DCAA5; }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { background: #2a1414; color: #f28b8b; display: block; }
  .msg.success { background: #123222; color: #6ee7b7; display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <a href="dashboard.html" class="back-link">← Panele dön</a>
</header>

<main>
  <h1>Yeni ürün ekle</h1>
  <div class="subtitle">Ürün bilgilerini gir, AI içerik üretsin, kârını gör.</div>

  <div class="section">
    <div class="section-title">Ürün bilgileri</div>
    <div class="form-row">
      <label for="productName">Ürün adı</label>
      <input type="text" id="productName" placeholder="Örn: Kablosuz Bluetooth Kulaklık">
    </div>
    <div class="two-col">
      <div class="form-row">
        <label for="supplierPrice">Tedarikçi/alış fiyatı (₺)</label>
        <input type="number" id="supplierPrice" placeholder="150">
      </div>
      <div class="form-row">
        <label for="weightKg">Ağırlık (kg)</label>
        <input type="number" id="weightKg" placeholder="0.5" step="0.1">
      </div>
    </div>
    <div class="two-col">
      <div class="form-row">
        <label for="platform">Platform</label>
        <select id="platform">
          <option value="">Seç...</option>
          <option value="Trendyol">Trendyol</option>
          <option value="Hepsiburada">Hepsiburada</option>
          <option value="N11">N11</option>
          <option value="Etsy">Etsy</option>
          <option value="Diğer">Diğer</option>
        </select>
      </div>
      <div class="form-row">
        <label for="commissionRate">Komisyon oranı (%)</label>
        <input type="number" id="commissionRate" placeholder="15" step="0.1">
      </div>
    </div>
    <div class="form-row">
      <label for="salePrice">Satış fiyatı (₺) — kâr hesabı için</label>
      <input type="number" id="salePrice" placeholder="299">
    </div>
  </div>

  <div class="section">
    <div class="section-title">AI ile içerik üret</div>
    <button class="btn-primary" id="generateBtn" onclick="generateContent()">✨ Başlık, açıklama ve etiket üret</button>

    <div class="ai-result" id="aiResult">
      <div class="ai-label">Üretilen başlık</div>
      <div class="ai-title" id="genTitle"></div>
      <div class="ai-label">Açıklama</div>
      <div class="ai-desc" id="genDesc"></div>
      <div class="ai-label">Etiketler</div>
      <div class="ai-tags" id="genTags"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Kâr hesabı</div>
    <div class="profit-box">
      <div class="profit-item">
        <div class="profit-label">Kargo maliyeti</div>
        <div class="profit-value" id="shippingCost">₺0</div>
      </div>
      <div class="profit-item">
        <div class="profit-label">Komisyon tutarı</div>
        <div class="profit-value" id="commissionCost">₺0</div>
      </div>
      <div class="profit-item">
        <div class="profit-label">Net kâr</div>
        <div class="profit-value green" id="netProfit">₺0</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="saveBtn" onclick="saveProduct()">Ürünü kaydet</button>
    <button class="btn-secondary" onclick="window.location.href='dashboard.html'">Vazgeç</button>
  </div>

  <div class="msg" id="msgBox"></div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let generatedContent = null;

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
  }
  init();

  // Kâr hesabını canlı güncelle
  ['supplierPrice', 'weightKg', 'commissionRate', 'salePrice'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateProfitCalc);
  });

  async function updateProfitCalc() {
    const supplierPrice = parseFloat(document.getElementById('supplierPrice').value) || 0;
    const weightKg = parseFloat(document.getElementById('weightKg').value) || 0;
    const commissionRate = parseFloat(document.getElementById('commissionRate').value) || 0;
    const salePrice = parseFloat(document.getElementById('salePrice').value) || 0;

    let shippingCost = 0;
    if (weightKg > 0) {
      const { data: rates } = await supabaseClient
        .from('shipping_rates')
        .select('*')
        .lte('min_weight_kg', weightKg)
        .gte('max_weight_kg', weightKg)
        .order('price', { ascending: true })
        .limit(1);
      if (rates && rates.length > 0) shippingCost = rates[0].price;
    }

    const commissionCost = salePrice * (commissionRate / 100);
    const netProfit = salePrice - supplierPrice - shippingCost - commissionCost;

    document.getElementById('shippingCost').textContent = '₺' + shippingCost.toFixed(2);
    document.getElementById('commissionCost').textContent = '₺' + commissionCost.toFixed(2);
    const profitEl = document.getElementById('netProfit');
    profitEl.textContent = '₺' + netProfit.toFixed(2);
    profitEl.style.color = netProfit >= 0 ? '#5DCAA5' : '#f28b8b';
  }

  async function generateContent() {
    const productName = document.getElementById('productName').value.trim();
    const platform = document.getElementById('platform').value;
    const btn = document.getElementById('generateBtn');

    if (!productName) {
      showMsg('Önce ürün adını gir.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Üretiliyor...';
    hideMsg();

    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const response = await fetch(SUPABASE_URL + '/functions/v1/generate-content', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ productName, platform }),
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error);

      generatedContent = data;
      document.getElementById('genTitle').textContent = data.title || '-';
      document.getElementById('genDesc').textContent = data.description || '-';
      document.getElementById('genTags').innerHTML = (data.tags || [])
        .map(t => `<span class="ai-tag">${escapeHtml(t)}</span>`).join('');
      document.getElementById('aiResult').classList.add('show');
    } catch (err) {
      showMsg('İçerik üretilemedi: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Başlık, açıklama ve etiket üret';
    }
  }

  async function saveProduct() {
    const productName = document.getElementById('productName').value.trim();
    const supplierPrice = parseFloat(document.getElementById('supplierPrice').value) || null;
    const weightKg = parseFloat(document.getElementById('weightKg').value) || null;
    const platform = document.getElementById('platform').value;
    const commissionRate = parseFloat(document.getElementById('commissionRate').value) || null;

    if (!productName) {
      showMsg('Ürün adı gerekli.', 'error');
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Kaydediliyor...';

    const { error } = await supabaseClient.from('products').insert({
      user_id: currentUser.id,
      name: productName,
      supplier_price: supplierPrice,
      weight_kg: weightKg,
      platform: platform,
      commission_rate: commissionRate,
      generated_title: generatedContent?.title || null,
      generated_description: generatedContent?.description || null,
    });

    if (error) {
      showMsg('Kaydedilemedi: ' + error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Ürünü kaydet';
      return;
    }

    showMsg('Ürün kaydedildi! Panele yönlendiriliyorsun...', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
  }
  function hideMsg() {
    const box = document.getElementById('msgBox');
    box.className = 'msg';
  }
</script>

</body>
</html>
