<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayarlar - Seltigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .back-link:hover { color: #fff; }

  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 120px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 24px; }

  .section-title {
    font-size: 14px; font-weight: 600; color: #9aa3b2; text-transform: uppercase;
    letter-spacing: 0.03em; margin: 28px 0 12px; scroll-margin-top: 20px;
  }
  .card { background: #141821; border-radius: 14px; border: 1px solid #232838; padding: 20px; }
  .card-desc { font-size: 13px; color: #9aa3b2; margin-bottom: 16px; line-height: 1.5; }
  .notice {
    font-size: 13px; line-height: 1.5; color: #f2d16b;
    background: #2e2712; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px;
  }
  .notice a { color: #f2d16b; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .field label { display: block; font-size: 13px; font-weight: 600; color: #cfd4de; margin-bottom: 6px; }
  .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field input[type="url"], .field input[type="number"],
  .field select, .field textarea {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; border-radius: 8px;
    color: #fff; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #1D9E75; }
  .field input:disabled, .field textarea:disabled { opacity: 0.5; cursor: not-allowed; }
  .field input.invalid { border-color: #e5484d; }
  .hint { font-size: 12px; color: #7d8596; margin-top: 5px; line-height: 1.45; }
  .error-text { font-size: 12px; color: #ff8a8d; margin-top: 5px; display: none; }

  .logo-preview {
    margin-top: 10px; display: none; width: 96px; height: 96px; border-radius: 10px;
    border: 1px solid #2a3040; background: #0d0f16; object-fit: contain; padding: 6px;
  }

  .btn-ghost { background: transparent; border: 1px solid #2a3040; color: #c3c9d4; padding: 9px 14px; border-radius: 9px; font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: #3a4258; color: #fff; }
  .ship-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .ship-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #0d0f16; border: 1px solid #232838; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .ship-item b { color: #fff; }
  .ship-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; margin-left: 6px; background: #232838; color: #c3c9d4; }
  .ship-tag.ok { background: #123222; color: #6ee7b7; }
  .ship-tag.warn { background: #2a2410; color: #f2d16b; }
  .ship-tag.err { background: #2a1416; color: #f28b8b; }
  .ship-item .acts { display: flex; gap: 6px; }
  .ship-form { margin-top: 12px; padding-top: 12px; border-top: 1px solid #232838; }
  .ship-sub { font-size: 13px; font-weight: 600; color: #cfd4de; margin: 16px 0 8px; }
  .ship-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; }
  .check-row input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 1px; accent-color: #1D9E75; flex-shrink: 0; cursor: pointer;
  }
  .check-row label { font-size: 14px; color: #e6e8ee; cursor: pointer; }
  .check-row .hint { margin-top: 3px; }

  .epr-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  @media (max-width: 600px) { .epr-list { grid-template-columns: 1fr; } }

  .save-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #141821; border-top: 1px solid #232838; padding: 14px 24px; }
  .save-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .status { font-size: 13px; color: #9aa3b2; }
  .status.ok { color: #6ee7b7; }
  .status.err { color: #ff8a8d; }
  .btn {
    background: #1D9E75; color: #fff; border: none; padding: 11px 22px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #178a65; }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .loading { text-align: center; color: #9aa3b2; padding: 60px 0; font-size: 14px; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { header { padding: 14px 16px; } main { padding: 24px 16px 120px; } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">S</div>
    <div class="logo-text">Seltigo</div>
  </div>
  <div class="header-right">
    <span id="langSwitcherHost"></span>
    <a href="dashboard.html" class="back-link" data-t="back"></a>
  </div>
</header>

<main>
  <h1 data-t="title"></h1>
  <p class="subtitle" data-t="subtitle"></p>

  <div id="loading" class="loading" data-t="loading"></div>

  <form id="settingsForm" class="hidden" novalidate>

    <!-- ========== DİL VE BÖLGE ========== -->
    <div class="section-title" id="bolge" data-t="secRegion"></div>
    <div class="card">
      <div class="grid">
        <div class="field">
          <label for="ui_language" data-t="lUiLang"></label>
          <select id="ui_language">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
          </select>
          <div class="hint" data-t="hUiLang"></div>
        </div>
        <div class="field">
          <label for="home_country" data-t="lCountry"></label>
          <select id="home_country"></select>
          <div class="hint" data-t="hCountry"></div>
        </div>
        <div class="field">
          <label for="home_currency" data-t="lCurrency"></label>
          <select id="home_currency"></select>
          <div class="hint" data-t="hCurrency"></div>
        </div>
        <div class="field">
          <label for="timezone" data-t="lTimezone"></label>
          <select id="timezone"></select>
        </div>
      </div>
    </div>

    <!-- ========== İŞLETME BİLGİLERİ ========== -->
    <div class="section-title" id="isletme" data-t="secBusiness"></div>
    <div class="card">
      <div class="grid">
        <div class="field full">
          <label for="business_type" data-t="lBizType"></label>
          <select id="business_type">
            <option value="" data-t="optSelect"></option>
            <option value="individual" data-t="optIndividual"></option>
            <option value="sole_proprietor" data-t="optSole"></option>
            <option value="company" data-t="optCompany"></option>
          </select>
          <div class="hint" data-t="hBizType"></div>
        </div>
        <div class="field full">
          <label for="company_name" data-t="lCompany"></label>
          <input type="text" id="company_name" maxlength="200">
          <div class="hint" data-t="hCompany"></div>
        </div>
        <div class="field">
          <label for="tax_office" data-t="lTaxOffice"></label>
          <input type="text" id="tax_office" maxlength="100">
        </div>
        <div class="field">
          <label for="tax_number" data-t="lTaxNo"></label>
          <input type="text" id="tax_number" maxlength="30">
          <div class="hint" data-t="hTaxNo"></div>
        </div>
      </div>
    </div>

    <!-- ========== MARKA ========== -->
    <div class="section-title" id="marka" data-t="secBrand"></div>
    <div class="card">
      <div class="card-desc" data-t="dBrand"></div>
      <div class="notice hidden" id="brandNoStore" data-th="noStore"></div>
      <div class="grid">
        <div class="field full">
          <label for="brand_name" data-t="lBrandName"></label>
          <input type="text" id="brand_name" maxlength="120" data-tp="phBrandName">
          <div class="hint" data-t="hBrandName"></div>
        </div>
        <div class="field full">
          <label for="brand_logo_url" data-t="lLogo"></label>
          <input type="url" id="brand_logo_url" maxlength="500" placeholder="https://...">
          <img id="logoPreview" class="logo-preview" alt="">
          <div class="error-text" id="logoError" data-t="eLogo"></div>
        </div>
        <div class="field full">
          <label for="brand_address" data-t="lInvAddress"></label>
          <textarea id="brand_address" maxlength="500" data-tp="phInvAddress"></textarea>
        </div>
        <div class="field full">
          <label for="website_url" data-t="lWebsite"></label>
          <input type="url" id="website_url" maxlength="300" placeholder="https://www.siten.com">
          <div class="hint" data-t="hWebsite"></div>
        </div>
      </div>
      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="buy_on_website">
        <div>
          <label for="buy_on_website" data-t="lBuyOnWebsite"></label>
          <div class="hint" data-t="hBuyOnWebsite"></div>
        </div>
      </div>
    </div>

    <!-- ========== VERGİ ========== -->
    <div class="section-title" id="vergi" data-t="secTax"></div>
    <div class="card">
      <div class="card-desc" data-t="dTax"></div>

      <div class="check-row">
        <input type="checkbox" id="vat_registered">
        <div>
          <label for="vat_registered" data-t="lVatReg"></label>
          <div class="hint" data-t="hVatReg"></div>
        </div>
      </div>
      <div class="field hidden" id="vatNumberWrap" style="margin: 10px 0 6px 28px;">
        <label for="vat_number" data-t="lVatNo"></label>
        <input type="text" id="vat_number" maxlength="30">
      </div>

      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="oss_registered">
        <div>
          <label for="oss_registered" data-t="lOss"></label>
          <div class="hint" data-t="hOss"></div>
        </div>
      </div>

      <div class="grid" style="margin-top: 18px;">
        <div class="field">
          <label for="ioss_number" data-t="lIoss"></label>
          <input type="text" id="ioss_number" maxlength="12" placeholder="IM1234567890">
          <div class="hint" data-t="hIoss"></div>
          <div class="error-text" id="iossError" data-t="eIoss"></div>
        </div>
        <div class="field">
          <label for="eori_number" data-t="lEori"></label>
          <input type="text" id="eori_number" maxlength="17" placeholder="TR1234567890">
          <div class="hint" data-t="hEori"></div>
          <div class="error-text" id="eoriError" data-t="eEori"></div>
        </div>
      </div>
    </div>

    <!-- ========== AB YASAL BİLGİLERİ ========== -->
    <div class="section-title" id="ab" data-t="secEu"></div>
    <div class="card">
      <div class="card-desc" data-th="dGpsr"></div>
      <div class="grid">
        <div class="field full">
          <label for="gpsr_name" data-t="lGpsrName"></label>
          <input type="text" id="gpsr_name" maxlength="200">
        </div>
        <div class="field full">
          <label for="gpsr_address" data-t="lGpsrAddress"></label>
          <textarea id="gpsr_address" maxlength="500"></textarea>
        </div>
        <div class="field">
          <label for="gpsr_email" data-t="lEmail"></label>
          <input type="email" id="gpsr_email" maxlength="200">
          <div class="error-text" id="gpsrEmailError" data-t="eEmail"></div>
        </div>
        <div class="field">
          <label for="gpsr_phone" data-t="lPhone"></label>
          <input type="tel" id="gpsr_phone" maxlength="40">
        </div>
      </div>

      <div class="card-desc" style="margin-top: 22px;" data-th="dEpr"></div>
      <div class="epr-list" id="eprList"></div>
    </div>

    <!-- ========== İADE ADRESİ ========== -->
    <div class="section-title" id="iade" data-t="secReturn"></div>
    <div class="card">
      <div class="card-desc" data-t="dReturn"></div>
      <div class="grid">
        <div class="field full">
          <label for="ret_name" data-t="lRetName"></label>
          <input type="text" id="ret_name" maxlength="200">
        </div>
        <div class="field full">
          <label for="ret_address" data-t="lAddress"></label>
          <textarea id="ret_address" maxlength="500"></textarea>
        </div>
        <div class="field">
          <label for="ret_district" data-t="lDistrict"></label>
          <input type="text" id="ret_district" maxlength="100">
        </div>
        <div class="field">
          <label for="ret_city" data-t="lCity"></label>
          <input type="text" id="ret_city" maxlength="100">
        </div>
        <div class="field">
          <label for="ret_postal" data-t="lPostal"></label>
          <input type="text" id="ret_postal" maxlength="20">
        </div>
        <div class="field">
          <label for="ret_country" data-t="lCountryShort"></label>
          <select id="ret_country"></select>
        </div>
        <div class="field">
          <label for="ret_phone" data-t="lPhone"></label>
          <input type="tel" id="ret_phone" maxlength="40">
        </div>
      </div>
    </div>

    <!-- ========== İADE KURALLARI ========== -->
    <div class="section-title" id="iade-kurallari" data-t="secReturnRules"></div>
    <div class="card">
      <div class="card-desc" id="rrLaw"></div>
      <div class="check-row">
        <input type="checkbox" id="rr_auto_approve">
        <div>
          <label for="rr_auto_approve" data-t="lRrAuto"></label>
          <div class="hint" id="rrAutoHint"></div>
        </div>
      </div>
      <div class="grid" style="margin-top: 12px;">
        <div class="field">
          <label for="rr_max" data-t="lRrMax"></label>
          <input type="number" id="rr_max" min="0" step="1">
          <div class="hint" data-t="hRrMax"></div>
        </div>
        <div class="field">
          <label for="rr_window" data-t="lRrWindow"></label>
          <input type="number" id="rr_window" min="1" max="365" step="1">
          <div class="hint" id="rrWindowHint"></div>
        </div>
      </div>
      <div class="ship-sub" data-t="lRrAutoReasons"></div>
      <div id="rrAutoReasons" class="epr-list"></div>
      <div class="hint" id="rrAutoReasonsHint" style="margin-top: 6px;"></div>
      <div class="ship-sub" data-t="lRrPhotoReasons"></div>
      <div id="rrPhotoReasons" class="epr-list"></div>
      <div class="hint" data-t="hRrPhoto" style="margin-top: 6px;"></div>
      <div class="check-row" style="margin-top: 14px;">
        <input type="checkbox" id="rr_customer_pays">
        <div>
          <label for="rr_customer_pays" data-t="lRrCustomerPays"></label>
          <div class="hint" id="rrPaysHint"></div>
        </div>
      </div>
      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="rr_restock">
        <div><label for="rr_restock" data-t="lRrRestock"></label></div>
      </div>
      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="rr_supplier_claim">
        <div><label for="rr_supplier_claim" data-t="lRrSupplier"></label></div>
      </div>
      <details style="margin-top: 14px;"><summary class="hint" style="cursor:pointer" data-t="rrPolicy"></summary><pre id="rrPolicyText" class="hint" style="white-space:pre-wrap; font-family:inherit; line-height:1.5;"></pre></details>
    </div>

    <!-- ========== KARGO ========== -->
    <div class="section-title" id="kargo" data-t="secShip"></div>
    <div class="card">
      <div class="card-desc" data-t="dShip"></div>
      <div class="ship-list" id="shipList"></div>
      <button type="button" class="btn-ghost" id="shipAddBtn" onclick="toggleShipForm(true)" data-t="shipAdd"></button>
      <div class="ship-form" id="shipForm" style="display:none">
        <div class="grid">
          <div class="field">
            <label for="ship_provider" data-t="lShipProvider"></label>
            <select id="ship_provider" onchange="renderShipFields()"></select>
          </div>
          <div class="field">
            <label for="ship_mode" data-t="lShipMode"></label>
            <select id="ship_mode"><option value="live" data-t="shipLive"></option><option value="test" data-t="shipTest"></option></select>
          </div>
        </div>
        <div class="grid" id="shipCredFields" style="margin-top:12px"></div>
        <div class="hint" id="shipProviderNote" style="margin-top:6px"></div>
        <div class="ship-sub" data-t="lShipSender"></div>
        <div class="grid">
          <div class="field"><label for="ship_s_name" data-t="lShipSName"></label><input type="text" id="ship_s_name" maxlength="120"></div>
          <div class="field"><label for="ship_s_phone" data-t="lPhone"></label><input type="tel" id="ship_s_phone" maxlength="40"></div>
          <div class="field full"><label for="ship_s_address" data-t="lShipSAddress"></label><input type="text" id="ship_s_address" maxlength="300"></div>
          <div class="field"><label for="ship_s_district" data-t="lShipSDistrict"></label><input type="text" id="ship_s_district" maxlength="80"></div>
          <div class="field"><label for="ship_s_city" data-t="lShipSCity"></label><input type="text" id="ship_s_city" maxlength="80"></div>
        </div>
        <div class="error-text" id="shipError" style="display:none"></div>
        <div class="ship-actions">
          <button type="button" class="btn-ghost" onclick="toggleShipForm(false)" data-t="shipCancel"></button>
          <button type="button" class="btn" id="shipConnectBtn" onclick="connectShip()" data-t="shipConnect"></button>
        </div>
      </div>
      <div class="check-row" style="margin-top: 14px;">
        <input type="checkbox" id="shipping_auto">
        <div>
          <label for="shipping_auto" data-t="lShipAuto"></label>
          <div class="hint" data-t="hShipAuto"></div>
        </div>
      </div>
    </div>

    <!-- ========== OTOMATİK SİPARİŞ ========== -->
    <div class="section-title" id="otomatik-siparis" data-t="secAutoOrder"></div>
    <div class="card">
      <div class="card-desc" data-t="dAutoOrder"></div>
      <div class="check-row">
        <input type="checkbox" id="cj_auto_pay">
        <div>
          <label for="cj_auto_pay" data-t="lCjAutoPay"></label>
          <div class="hint" data-t="hCjAutoPay"></div>
        </div>
      </div>
      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="ae_auto_pay">
        <div>
          <label for="ae_auto_pay" data-t="lAeAutoPay"></label>
          <div class="hint" data-t="hAeAutoPay"></div>
        </div>
      </div>
      <div class="check-row" style="margin-top: 12px;">
        <input type="checkbox" id="wa_tracking_notify">
        <div>
          <label for="wa_tracking_notify" data-t="lWaNotify"></label>
          <div class="hint" id="waTemplateStatus"></div>
        </div>
      </div>
    </div>

  </form>
</main>

<div class="save-bar hidden" id="saveBar">
  <div class="save-inner">
    <div class="status" id="status"></div>
    <button class="btn" id="saveBtn" type="button" data-t="save"></button>
  </div>
</div>

<script>

function lang() {
  const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
  return T[l] ? l : 'tr';
}
function t(key) {
  const v = T[lang()][key];
  return v !== undefined ? v : (T.tr[key] !== undefined ? T.tr[key] : key);
}

const $ = (id) => document.getElementById(id);

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setStatus(key, type, extra) {
  const el = $('status');
  lastStatusKey = key ? { key, type, extra } : null;
  el.textContent = key ? t(key) + (extra || '') : '';
  el.className = 'status' + (type ? ' ' + type : '');
}

function valOrNull(id) {
  const v = $(id).value.trim();
  return v === '' ? null : v;
}

function countryLabel(c) {
  if (lang() === 'en') {
    if (c.name_en) return c.name_en;
    try { if (Intl.DisplayNames) return new Intl.DisplayNames(['en'], { type: 'region' }).of(c.code); } catch (e) {}
  }
  return c.name_tr || c.code;
}

function buildTimezoneSelect() {

// ---------- Kargo hesapları (shipping-hub; bilgiler Vault'ta) ----------
const SHIP_PROVIDERS = [
  ['yurtici', 'Yurtiçi Kargo', [['wsUserName', 'fYkUser'], ['wsPassword', 'fYkPass']], 'nYurtici'],
  ['geliver', 'Geliver', [['token', 'fToken']], 'nGeliver'],
  ['basitkargo', 'Basit Kargo', [['token', 'fToken']], 'nBasit'],
  ['aras', 'Aras Kargo', [['username', 'fUser'], ['password', 'fPass'], ['customerCode', 'fCustomer']], 'nPendingCarrier'],
  ['mng', 'MNG Kargo', [['username', 'fUser'], ['password', 'fPass'], ['customerCode', 'fCustomer']], 'nPendingCarrier'],
  ['ptt', 'PTT Kargo', [['username', 'fUser'], ['password', 'fPass'], ['customerCode', 'fCustomer']], 'nPendingCarrier'],
  ['surat', 'Sürat Kargo', [['username', 'fUser'], ['password', 'fPass'], ['customerCode', 'fCustomer']], 'nPendingCarrier'],
  ['hepsijet', 'HepsiJet', [['username', 'fUser'], ['password', 'fPass'], ['customerCode', 'fCustomer']], 'nPendingCarrier'],
];
let shipAccounts = [];
async function shipCall(body) {
  const { data: { session } } = await db.auth.getSession();
  const r = await fetch(SUPABASE_URL + '/functions/v1/shipping-hub', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': SUPABASE_KEY },
    body: JSON.stringify(body)
  });
  return await r.json().catch(() => ({}));
}
async function loadShipping() {
  const { data } = await db.from('shipping_accounts').select('id, provider, mode, is_default, account_name, status, last_error, settings').eq('user_id', currentUserId).order('connected_at');
  shipAccounts = data || [];
  renderShipping();
}
function renderShipping() {
  const sel = $('ship_provider');
  const prev = sel.value;
  sel.innerHTML = SHIP_PROVIDERS.map(p => '<option value="' + p[0] + '">' + p[1] + '</option>').join('');
  if (prev) sel.value = prev;
  renderShipFields();
  const list = $('shipList');
  if (!shipAccounts.length) { list.innerHTML = '<div class="hint">' + escapeHtmlS(t('shipNone')) + '</div>'; return; }
  list.innerHTML = shipAccounts.map(a => {
    const name = (SHIP_PROVIDERS.find(p => p[0] === a.provider) || [0, a.provider])[1];
    const pending = a.settings && a.settings.verify_pending;
    const st = a.status === 'error' ? '<span class="ship-tag err" title="' + escapeHtmlS(a.last_error || '') + '">' + t('shipStErr') + '</span>'
      : pending ? '<span class="ship-tag warn">' + t('shipStPending') + '</span>' : '<span class="ship-tag ok">' + t('shipStOk') + '</span>';
    return '<div class="ship-item" data-ship="' + a.id + '"><span><b>' + escapeHtmlS(name) + '</b>' +
      '<span class="ship-tag">' + (a.mode === 'test' ? t('shipTest') : t('shipLive')) + '</span>' + st +
      (a.is_default ? '<span class="ship-tag ok">' + t('shipDefault') + '</span>' : '') + '</span>' +
      '<span class="acts">' + (a.is_default ? '' : '<button type="button" class="btn-ghost" onclick="defaultShip(\'' + a.id + '\')">' + t('shipMakeDefault') + '</button>') +
      '<button type="button" class="btn-ghost" onclick="removeShip(\'' + a.id + '\')">' + t('shipRemove') + '</button></span></div>';
  }).join('');
}
function escapeHtmlS(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderShipFields() {
  const p = SHIP_PROVIDERS.find(x => x[0] === $('ship_provider').value) || SHIP_PROVIDERS[0];
  const keep = {};
  document.querySelectorAll('#shipCredFields input').forEach(i => { keep[i.dataset.k] = i.value; });
  $('shipCredFields').innerHTML = p[2].map(([k, label]) => '<div class="field"><label>' + escapeHtmlS(t(label)) + '</label>' +
    '<input type="' + (/pass|token/i.test(k) ? 'password' : 'text') + '" data-k="' + k + '" autocomplete="off" data-lpignore="true" data-1p-ignore value="' + escapeHtmlS(keep[k] || '') + '"></div>').join('');
  $('shipProviderNote').textContent = t(p[3]);
}
function toggleShipForm(on) {
  $('shipForm').style.display = on ? 'block' : 'none';
  $('shipAddBtn').style.display = on ? 'none' : '';
  $('shipError').style.display = 'none';
  if (on) {
    // Gönderen bilgileri: iade adresi / marka bilgilerinden doldur
    if (!$('ship_s_name').value) $('ship_s_name').value = $('ret_name').value || $('brand_name').value || '';
    if (!$('ship_s_phone').value) $('ship_s_phone').value = $('ret_phone').value || '';
    if (!$('ship_s_address').value) $('ship_s_address').value = $('ret_address').value || '';
    if (!$('ship_s_city').value) $('ship_s_city').value = $('ret_city').value || '';
  }
}
async function connectShip() {
  const p = SHIP_PROVIDERS.find(x => x[0] === $('ship_provider').value);
  const credentials = {};
  let missing = false;
  document.querySelectorAll('#shipCredFields input').forEach(i => { credentials[i.dataset.k] = i.value.trim(); if (!i.value.trim()) missing = true; });
  const err = $('shipError');
  if (missing) { err.textContent = t('shipFillAll'); err.style.display = 'block'; return; }
  const btn = $('shipConnectBtn');
  btn.disabled = true; btn.textContent = t('shipConnecting'); err.style.display = 'none';
  try {
    const d = await shipCall({ action: 'connect', provider: p[0], mode: $('ship_mode').value, credentials, makeDefault: !shipAccounts.length || undefined,
      settings: { sender: { name: $('ship_s_name').value.trim(), phone: $('ship_s_phone').value.trim(), address: $('ship_s_address').value.trim(), district: $('ship_s_district').value.trim(), city: $('ship_s_city').value.trim() } } });
    if (!d.ok) throw new Error(d.error || t('saveFail'));
    toggleShipForm(false);
    document.querySelectorAll('#shipCredFields input').forEach(i => { i.value = ''; });
    setStatus(null);
    alertShip(d.verifyPending ? t('shipPendingNote') : t('shipConnected'));
    await loadShipping();
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = t('shipConnect'); }
}
function alertShip(msg) { const el = $('shipProviderNote'); const list = $('shipList'); const n = document.createElement('div'); n.className = 'hint'; n.style.color = '#6ee7b7'; n.textContent = msg; list.parentNode.insertBefore(n, list); setTimeout(() => n.remove(), 6000); }
async function defaultShip(id) { await shipCall({ action: 'default', accountId: id }); await loadShipping(); }
async function removeShip(id) {
  if (!confirm(t('shipRemoveConfirm'))) return;
  await shipCall({ action: 'disconnect', accountId: id });
  await loadShipping();
}

// "Web sitem": "www.siten.com" de yazılabilir; https:// kendiliğinden eklenir
function normalizeWebsite(v) {
  v = String(v || '').trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try { return new URL(v).origin; } catch (e) { return null; }
}

function updateLogoPreview() {
  const url = $('brand_logo_url').value.trim();
  const img = $('logoPreview');
  if (/^https:\/\/.+/i.test(url)) {
    img.src = url;
    img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  } else {
    img.removeAttribute('src');
    img.style.display = 'none';
  }
}

function ensureOption(selectId, value) {
  const sel = $(selectId);
  if (value && ![...sel.options].some(o => o.value === value)) {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    sel.appendChild(opt);
  }
}

  $('ui_language').value = (p.ui_language || lang()) === 'en' ? 'en' : 'tr';
  ensureOption('home_country', p.home_country || 'TR');

  const cur = (p.home_currency || 'TRY').trim();
  ensureOption('home_currency', cur);

  ensureOption('timezone', p.timezone);
  $('timezone').value = p.timezone || 'Europe/Istanbul';

  $('business_type').value = p.business_type || '';
  $('company_name').value = p.company_name || '';
  $('tax_office').value = p.tax_office || '';

  $('ret_district').value = r.district || '';

function showFieldError(inputId, errorId, show) {
  $(inputId).classList.toggle('invalid', show);
  $(errorId).style.display = show ? 'block' : 'none';
}

function validate() {
  let ok = true;
  const ioss = $('ioss_number').value.trim().toUpperCase();
  $('ioss_number').value = ioss;
  const iossBad = ioss !== '' && !/^IM[0-9]{10}$/.test(ioss);
  showFieldError('ioss_number', 'iossError', iossBad);
  if (iossBad) ok = false;

  const eori = $('eori_number').value.trim().toUpperCase().replace(/\s+/g, '');
  $('eori_number').value = eori;
  const eoriBad = eori !== '' && !/^[A-Z]{2}[A-Z0-9]{1,15}$/.test(eori);
  showFieldError('eori_number', 'eoriError', eoriBad);
  if (eoriBad) ok = false;

  const email = $('gpsr_email').value.trim();
  const emailBad = email !== '' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  showFieldError('gpsr_email', 'gpsrEmailError', emailBad);
  if (emailBad) ok = false;

  const logo = $('brand_logo_url').value.trim();
  const logoBad = hasStore && logo !== '' && !/^https:\/\/.+/i.test(logo);
  showFieldError('brand_logo_url', 'logoError', logoBad);
  if (logoBad) ok = false;
  return ok;
}

function buildJson(obj) {
  const cleaned = {};
  Object.entries(obj).forEach(([k, v]) => { if (v) cleaned[k] = v; });
  return Object.keys(cleaned).length ? cleaned : null;
}

async function saveProfile() {
  setStatus(null);
  if (!validate()) { setStatus('fixRed', 'err'); return; }

  const epr = {};
  document.querySelectorAll('[data-epr]').forEach(input => {
    const v = input.value.trim();
    if (v) epr[input.dataset.epr] = v;
  });
  const vatRegistered = $('vat_registered').checked;
  const businessType = valOrNull('business_type');

  const payload = {
    user_id: currentUserId,
    ui_language: $('ui_language').value,
    home_country: $('home_country').value,
    home_currency: $('home_currency').value,
    timezone: $('timezone').value,
    business_type: businessType,
    company_name: valOrNull('company_name'),
    tax_office: valOrNull('tax_office'),
    tax_number: valOrNull('tax_number'),
    vat_registered: vatRegistered,
    vat_number: vatRegistered ? valOrNull('vat_number') : null,
    oss_registered: $('oss_registered').checked,
    cj_auto_pay: $('cj_auto_pay').checked,
    shipping_auto: $('shipping_auto').checked,
    ae_auto_pay: $('ae_auto_pay').checked,
    wa_tracking_notify: $('wa_tracking_notify').checked,
    ioss_number: valOrNull('ioss_number'),
    eori_number: valOrNull('eori_number'),
    gpsr_responsible_person: buildJson({
      name: $('gpsr_name').value.trim(), address: $('gpsr_address').value.trim(),
      email: $('gpsr_email').value.trim(), phone: $('gpsr_phone').value.trim()
    }),
    epr_registrations: epr,
    return_address: buildJson({
      name: $('ret_name').value.trim(), address: $('ret_address').value.trim(),
      city: $('ret_city').value.trim(), district: $('ret_district').value.trim(), postal_code: $('ret_postal').value.trim(),
      country: $('ret_country').value, phone: $('ret_phone').value.trim()
    }),
    onboarding_completed: !!businessType
  };

  const btn = $('saveBtn');
  btn.disabled = true;
  btn.textContent = t('saving');
  try {
    const { error } = await db.from('user_profiles').upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
    if (hasStore) {
      const { error: brandError } = await db.from('store_settings').update({
        business_name: $('brand_name').value.trim(),
        business_logo_url: $('brand_logo_url').value.trim(),
        business_address: $('brand_address').value.trim(),
        business_tax_number: $('tax_number').value.trim(),
        website_url: normalizeWebsite($('website_url').value),
        buy_on_website: $('buy_on_website').checked
      }).eq('user_id', currentUserId);
      if (brandError) throw brandError;
    }
    await saveReturnRules();
    setStatus('saved', 'ok');
  } catch (err) {
    console.error(err);
    setStatus('saveFail', 'err', err.message || String(err));
  } finally {
    btn.disabled = false;
    btn.textContent = t('save');
  }
}

// ---------- İade Kuralları (yasal çerçeve: my_return_law; kilitli ayarlar) ----------
const RR_ALL = ['size', 'changed_mind', 'late', 'other', 'defective', 'damaged', 'wrong_item', 'not_as_described'];
const RR_DEFECT = ['defective', 'damaged', 'wrong_item', 'not_as_described'];
let RR_LAW = null;
async function loadReturnRules() {
  const [{ data: law }, { data: rr }] = await Promise.all([db.rpc('my_return_law'), db.from('return_rules').select('*').eq('user_id', currentUserId).maybeSingle()]);
  RR_LAW = law || { region: 'TR', statutory: true, window_days: 14, customer_may_pay: false, law_name_tr: 'Mesafeli Sözleşmeler Yönetmeliği', law_name_en: 'Turkish Distance Contracts Regulation', country: 'TR' };
  const r = rr || {};
  const en = (document.documentElement.lang === 'en');
  $('rrLaw').textContent = t('rrLaw').replace('{law}', en ? RR_LAW.law_name_en : RR_LAW.law_name_tr).replace('{c}', RR_LAW.country || RR_LAW.region);
  $('rr_auto_approve').checked = r.auto_approve !== false;
  $('rrAutoHint').textContent = t(RR_LAW.statutory ? 'hRrAutoStat' : 'hRrAutoPolicy');
  $('rr_max').value = r.max_auto_amount != null ? r.max_auto_amount : 1000;
  const win = RR_LAW.statutory ? Math.max(RR_LAW.window_days, r.window_days || 0) : (r.policy_days || RR_LAW.window_days);
  $('rr_window').value = win;
  $('rr_window').min = RR_LAW.statutory ? RR_LAW.window_days : 1;
  $('rrWindowHint').textContent = RR_LAW.statutory ? t('hRrWindowStat').replace('{n}', RR_LAW.window_days) : t('hRrWindowPolicy');
  const auto = r.auto_reasons || ['size', 'changed_mind', 'wrong_item', 'not_as_described', 'late'];
  const withdrawal = RR_ALL.filter(x => !RR_DEFECT.includes(x));
  $('rrAutoReasons').innerHTML = withdrawal.map(x => '<label class="check-row"><input type="checkbox" data-rr-auto="' + x + '"' + (RR_LAW.statutory || auto.includes(x) ? ' checked' : '') + (RR_LAW.statutory ? ' disabled' : '') + '> <span>' + t('rr_' + x) + '</span></label>').join('');
  $('rrAutoReasonsHint').textContent = RR_LAW.statutory ? t('hRrAutoReasonsStat') : '';
  $('rrPhotoReasons').innerHTML = RR_DEFECT.map(x => '<label class="check-row"><input type="checkbox" checked disabled> <span>' + t('rr_' + x) + '</span></label>').join('');
  const locked = !RR_LAW.customer_may_pay;
  $('rr_customer_pays').checked = !locked && !!r.customer_pays;
  $('rr_customer_pays').disabled = locked;
  $('rrPaysHint').textContent = t(locked ? 'hRrPaysTR' : 'hRrPaysDisclose');
  $('rr_restock').checked = r.restock !== false;
  $('rr_supplier_claim').checked = r.supplier_claim !== false;
  loadReturnPolicy();
}
async function loadReturnPolicy() {
  try {
    const { data: { session } } = await db.auth.getSession();
    const r = await fetch(SUPABASE_URL + '/functions/v1/returns', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ action: 'policy', userId: session.user.id, country: RR_LAW && RR_LAW.country }) }).then(x => x.json());
    $('rrPolicyText').textContent = r && r.ok ? (document.documentElement.lang === 'en' ? r.en : r.tr) : '';
  } catch (e) { console.warn('policy', e); }
}
async function saveReturnRules() {
  if (!RR_LAW) return;
  const win = Math.max(RR_LAW.statutory ? RR_LAW.window_days : 1, Number($('rr_window').value) || RR_LAW.window_days);
  const row = { user_id: currentUserId, auto_approve: $('rr_auto_approve').checked, max_auto_amount: Math.max(0, Number($('rr_max').value) || 0),
    restock: $('rr_restock').checked, supplier_claim: $('rr_supplier_claim').checked, customer_pays: RR_LAW.customer_may_pay ? $('rr_customer_pays').checked : false,
    updated_at: new Date().toISOString() };
  if (RR_LAW.statutory) row.window_days = win; else { row.policy_days = win; row.auto_reasons = [...document.querySelectorAll('[data-rr-auto]')].filter(x => x.checked).map(x => x.dataset.rrAuto).concat(RR_DEFECT); }
  $('rr_window').value = win;
  const { error } = await db.from('return_rules').upsert(row, { onConflict: 'user_id' });
  if (error) throw error;
  loadReturnPolicy();
}

async function init() {
  try {
    if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
  } catch (e) { console.warn('HS.init', e); }
  db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  applyTexts();
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  currentUserId = session.user.id;

  try {
    buildEprList();
    await loadCountries();
    await loadProfile();
    await loadBrand();
    loadWaTemplate();
    await loadShipping();
    applyTexts();
    await loadReturnRules();
    $('loading').classList.add('hidden');
    $('settingsForm').classList.remove('hidden');
    $('saveBar').classList.remove('hidden');
    if (location.hash) {
      const target = document.querySelector(location.hash);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 100);
    }
  } catch (err) {
    console.error(err);
    $('loading').textContent = t('loadFail') + (err.message || err);
  }
}

$('home_country').addEventListener('change', onCountryChange);
$('ui_language').addEventListener('change', onLanguageChange);
$('vat_registered').addEventListener('change', toggleVatNumber);
$('brand_logo_url').addEventListener('input', updateLogoPreview);
$('saveBtn').addEventListener('click', saveProfile);
$('settingsForm').addEventListener('input', () => setStatus(null));

// Üstteki bayrak düğmesiyle dil değişirse: sayfa + dil kutusu eşitlenir
function onLangChange() {
  if (typeof renderShipping === 'function' && document.getElementById('ship_provider')) renderShipping();
  if ($('ui_language').value !== lang() && (lang() === 'tr' || lang() === 'en')) $('ui_language').value = lang();
  applyTexts();
  renderWaTemplate();
}
window.addEventListener('hs:langchange', onLangChange);
document.addEventListener('hs:langchange', onLangChange);

init();
</script>
