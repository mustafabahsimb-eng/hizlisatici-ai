  </div>
</main>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function call(body) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'index.html'; return {}; }
  const r = await fetch(SUPABASE_URL + '/functions/v1/site-connect', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + SUPABASE_KEY, apikey: SUPABASE_KEY }, body: JSON.stringify({ ...body, userAccessToken: session.access_token }) });
  return await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
}
function msg(id, text, cls) { const el = $(id); el.textContent = text || ''; el.className = 'msg' + (cls ? ' ' + cls : ''); }

function applyStatic() {
  document.documentElement.lang = lang();
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });

  $('pageSub').textContent = t(MODE === 'migrate' ? 'subm' : 'sub');

  $('syncHours').innerHTML = [1, 3, 6, 12, 24, 72].map((h) => `<option value="${h}">${esc(t('every', { h }))}</option>`).join('');
  renderSites(); if (cur) render();
}
function renderSites() {
  $('sites').innerHTML = conns.map((c) => `<button class="site-chip${cur && c.id === cur.id ? ' on' : ''}" data-id="${c.id}">${esc(c.host + (c.scope_path !== '/' ? c.scope_path : ''))} ${c.verified_at ? '✅' : '⏳'}</button>`).join('')
    + (conns.length ? `<button class="site-chip" data-id="">${esc(t('newSite'))}</button>` : '');
  $('sites').querySelectorAll('button').forEach((b) => b.onclick = () => { cur = conns.find((c) => c.id === b.dataset.id) || null; detectInfo = null; if (!cur) { $('url').value = ''; } render(); renderSites(); });
}

function render() {
  $('connBox').classList.toggle('hidden', !cur);
  if (!cur) { clearInterval(poll); return; }
  $('url').value = cur.url;
  const info = cur.platform_info || {};
  $('platformPill').textContent = (info.name || cur.platform || '') + ' · ' + t(cur.method === 'api' ? 'mApiShort' : cur.method === 'feed' ? 'mFeedShort' : 'mCrawlShort');
  $('platformNote').textContent = info.note || '';
  $('methodLine').textContent = t(cur.method === 'api' ? 'mApi' : cur.method === 'feed' ? 'mFeed' : 'mCrawl') + (cur.platform_evidence ? ' · ' + cur.platform_evidence : '');
  const needApi = ['shopify', 'woocommerce', 'wix'].includes(cur.platform) && cur.method !== 'api';
  const robots = detectInfo?.robots?.blocked;
  $('apiHint').classList.toggle('hidden', !needApi && !robots);
  $('apiHint').innerHTML = robots ? esc(t('robotsBlocked')) : needApi ? `${esc(t('apiConnect'))} <a href="accounts.html" style="color:#7fd8b5">${esc(t('apiConnectLink'))}</a>` : '';
  $('feed').value = cur.feed_url || '';
  // Doğrulama
  const v = !!cur.verified_at;
  $('verifyPill').textContent = v ? t('verified') : t('notVerified');
  $('verifyPill').className = 'pill' + (v ? '' : ' warn');
  $('verifyBody').classList.toggle('hidden', v);
  if (v) msg('verifyMsg', t('verifiedBy', { m: cur.verify_method }), 'ok');
  else if (cur.verify) {
    $('metaWhere').textContent = t('metaWhere', { u: cur.verify.meta_where });
    $('metaCode').textContent = cur.verify.meta;
    if (cur.verify.dns) { $('dnsCode').textContent = `Tür / Type: TXT\nAd / Name: ${cur.verify.dns.name}\nDeğer / Value: ${cur.verify.dns.value}`; $('dnsVal').textContent = cur.verify.dns.value; }
    else $('dnsCode').textContent = t('dnsShared');
    $('fileWhere').textContent = t('fileWhere', { u: cur.verify.file.url });
    $('fileCode').textContent = cur.verify.file.content;
    if (cur.verify_error && !$('verifyMsg').textContent) msg('verifyMsg', cur.verify_error, 'err');
  }
  // Aktarım
  const mig = cur.purpose === 'migrate';
  $('importTitle').textContent = t(mig ? 'importTitleM' : 'importTitle');
  $('importHint').textContent = t(mig ? 'importHintM' : 'importHint');
  $('cardImport').style.opacity = v ? 1 : .55;
  $('importBtn').disabled = !v;
  const run = (cur.runs || [])[0];
  $('importBtn').textContent = run ? t('importAgain') : t(mig ? 'importBtnM' : 'importBtn');
  $('openStore').href = storeSlug ? 'magaza.html?slug=' + encodeURIComponent(storeSlug) : '#';
  $('openStore').classList.toggle('hidden', !storeSlug || !run);
  renderRun(run);
  // Eşitleme
  $('cardSync').style.opacity = v ? 1 : .55;
  $('autoSync').checked = !!cur.auto_sync;
  $('syncHours').value = String(cur.sync_hours || 6);
  if (!$('syncMsg').textContent && cur.last_sync_at) msg('syncMsg', t('lastSync', { d: fmtDate(cur.last_sync_at) }) + (cur.auto_sync && cur.next_sync_at ? ' · ' + t('nextSync', { d: fmtDate(cur.next_sync_at) }) : ''));
  // API
  $('cardApi').style.opacity = v ? 1 : .55;
  $('keyBtn').disabled = !v;
  $('keyBtn').textContent = cur.has_api_key ? t('keyRenew') : t('keyCreate');
  $('keyInfo').textContent = cur.has_api_key ? t('keyInfo', { p: cur.api_key_prefix, u: cur.api_last_used_at ? fmtDate(cur.api_last_used_at) : t('never') }) : '';
  $('whUrl').value = cur.webhook_url || '';
  if (cur.webhook_last_error && !$('whMsg').textContent) msg('whMsg', cur.webhook_last_error, 'err');
}
function renderRun(run) {
  $('progress').classList.toggle('hidden', !run);
  clearInterval(poll);
  if (!run) return;
  const pct = run.total ? Math.round(Math.min(1, run.done / run.total) * 100) : (run.status === 'done' ? 100 : 4);
  $('progBar').style.width = pct + '%';
  const line = run.status === 'done' ? t('pDone', { d: run.done }) : run.status === 'error' ? t('pError', { e: run.error || '' })
    : run.status === 'running' ? t('pRunning', { d: run.done, t: run.total }) : run.status === 'discover' ? t('pDiscover') : t('pQueued');
  msg('progLine', line, run.status === 'error' ? 'err' : run.status === 'done' ? 'ok' : '');
  const st = [['stTotal', run.total], ['stCreated', run.created], ['stUpdated', run.updated], ['stFailed', run.failed]];
  if (run.skipped_robots) st.push(['stRobots', run.skipped_robots]);
  if (run.removed) st.push(['stRemoved', run.removed]);
  if (cur.purpose === 'migrate' && cur.stats?.redirects != null) st.push(['stRedirects', cur.stats.redirects]);
  $('progStats').innerHTML = st.map(([k, n]) => `<div class="stat"><b>${n || 0}</b><span>${esc(t(k))}</span></div>`).join('');
  if (['queued', 'discover', 'running'].includes(run.status)) poll = setInterval(refresh, 3000);
}
async function refresh(selectId) {
  const d = await call({ action: 'status' });
  if (!d.ok) return;
  conns = (d.connections || []).filter((c) => MODE === 'migrate' ? c.purpose === 'migrate' : c.purpose !== 'migrate');
  const id = selectId || cur?.id;
  cur = conns.find((c) => c.id === id) || (selectId === undefined && !cur ? conns[0] : cur && conns.find((c) => c.id === cur.id)) || null;
  renderSites(); render();
}

async function detect() {
  const url = $('url').value.trim();
  if (!url) return;
  $('detectBtn').disabled = true; msg('urlMsg', t('detecting'));
  try {
    const d = await call({ action: 'detect', url, purpose: MODE });
    if (!d.ok) { msg('urlMsg', d.error || 'Hata', 'err'); return; }
    detectInfo = d; msg('urlMsg', '');
    await refresh(d.connection.id);
  } finally { $('detectBtn').disabled = false; }
}
async function verify() {
  $('verifyBtn').disabled = true; msg('verifyMsg', t('verifying'));
  const method = document.querySelector('.tab.on')?.dataset.v;
  try {
    const d = await call({ action: 'verify', id: cur.id, method });
    if (d.verified) { msg('verifyMsg', t('verifiedBy', { m: d.method }), 'ok'); await refresh(cur.id); }
    else msg('verifyMsg', d.detail || d.error || '', 'err');
  } finally { $('verifyBtn').disabled = false; }
}
async function startImport() {
  if (!cur.verified_at) { msg('importMsg', t('needVerify'), 'err'); return; }
  const showConsent = !$('consentRow').classList.contains('hidden');
  if (showConsent && !$('consent').checked) { msg('importMsg', t('needConsent'), 'err'); return; }
  $('importBtn').disabled = true;
  const d = await call({ action: 'import', id: cur.id, consent: $('consent').checked || undefined });
  $('importBtn').disabled = false;
  if (d.needConsent) { $('consentRow').classList.remove('hidden'); msg('importMsg', t('needConsent'), 'err'); return; }
  if (!d.ok) { msg('importMsg', d.error || 'Hata', 'err'); return; }
  msg('importMsg', '');
  await refresh(cur.id);
}
async function copyFrom(id, btn) { try { await navigator.clipboard.writeText($(id).textContent); const o = btn.textContent; btn.textContent = t('copied'); setTimeout(() => btn.textContent = o, 1500); } catch (e) {} }

async function init() {
  try { await HS.init({ auth: true }); } catch (e) {}
  db = HS.db;
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const { data: st } = await db.from('store_settings').select('store_slug').eq('user_id', session.user.id).maybeSingle();
  storeSlug = st?.store_slug || null;
  const { data: prof } = await db.from('user_profiles').select('image_terms_accepted_at').eq('user_id', session.user.id).maybeSingle();
  $('consentRow').classList.toggle('hidden', !!prof?.image_terms_accepted_at);
  applyStatic();
  $('detectBtn').onclick = detect;
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') detect(); });
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-vp]').forEach((p) => p.classList.toggle('hidden', p.dataset.vp !== b.dataset.v));
  });
  document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => copyFrom(b.dataset.copy, b));
  $('verifyBtn').onclick = verify;
  $('importBtn').onclick = startImport;
  $('feedBtn').onclick = async () => { const d = await call({ action: 'set', id: cur.id, feed_url: $('feed').value.trim() }); msg('feedMsg', d.ok ? t('saved') : d.error, d.ok ? 'ok' : 'err'); if (d.ok) refresh(cur.id); };
  $('syncSave').onclick = async () => { const d = await call({ action: 'set', id: cur.id, auto_sync: $('autoSync').checked, sync_hours: Number($('syncHours').value) }); msg('syncMsg', d.ok ? t('saved') : d.error, d.ok ? 'ok' : 'err'); if (d.ok) refresh(cur.id); };
  $('syncNow').onclick = async () => { const d = await call({ action: 'sync_now', id: cur.id }); msg('syncMsg', d.ok ? t('syncStarted') : d.error, d.ok ? 'ok' : 'err'); if (d.ok) refresh(cur.id); };
  $('keyBtn').onclick = async () => {
    if (cur.has_api_key && !confirm(t('confirmRenew'))) return;
    const d = await call({ action: 'api_key', id: cur.id });
    if (!d.ok) { msg('whMsg', d.error, 'err'); return; }
    $('keyBox').classList.remove('hidden'); $('keyVal').textContent = d.api_key; refresh(cur.id);
  };
  $('whSave').onclick = async () => {
    const d = await call({ action: 'set', id: cur.id, webhook_url: $('whUrl').value.trim() });
    if (!d.ok) { msg('whMsg', d.error, 'err'); return; }
    msg('whMsg', t('saved'), 'ok');
    if (d.webhook_secret) { $('whBox').classList.remove('hidden'); $('whVal').textContent = d.webhook_secret; }
    refresh(cur.id);
  };
  $('whSecret').onclick = async () => {
    if (!confirm(t('confirmSecret'))) return;
    const d = await call({ action: 'webhook_secret', id: cur.id });
    if (!d.ok) { msg('whMsg', d.error, 'err'); return; }
    $('whBox').classList.remove('hidden'); $('whVal').textContent = d.webhook_secret;
  };
  $('whTest').onclick = async () => { const d = await call({ action: 'webhook_test', id: cur.id }); msg('whMsg', d.ok ? t('whOk', { s: d.status }) : t('whFail', { e: d.error || ('HTTP ' + d.status) }), d.ok ? 'ok' : 'err'); };
  $('delBtn').onclick = async () => { if (!confirm(t('confirmRemove'))) return; await call({ action: 'delete', id: cur.id }); cur = null; await refresh(); };
  const pre = new URLSearchParams(location.search).get('url');
  if (pre) { $('url').value = pre; }
  await refresh(undefined);
}
document.addEventListener('hs:langchange', applyStatic);
window.addEventListener('hs:langchange', applyStatic);
init();
</script>
</body>
</html>
