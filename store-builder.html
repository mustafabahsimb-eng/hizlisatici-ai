<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mağazanı Kur - HızlıSatıcı AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 28px; }
  .card {
    background: #1c212c; border-radius: 12px; padding: 24px;
    border: 1px solid #232838; margin-bottom: 18px;
  }
  label { display: block; font-size: 14px; color: #e6e8ee; margin-bottom: 8px; font-weight: 500; }
  input {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; border-radius: 8px;
    padding: 12px 14px; color: #e6e8ee; font-size: 15px; margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: #1D9E75; }
  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 13px 18px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { background: #2a3040; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040;
    padding: 13px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .product-list { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
  .product-item {
    display: flex; gap: 12px; align-items: center;
    background: #0d0f16; border: 1px solid #232838; border-radius: 10px; padding: 12px;
  }
  .product-item img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #232838; flex-shrink: 0; }
  .product-item .info { flex: 1; }
  .product-item .info .pname { font-weight: 500; font-size: 14px; color: #fff; }
  .product-item .info .meta { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
  .product-item input[type="checkbox"] { width: auto; margin: 0; accent-color: #1D9E75; }
  .loading { text-align: center; padding: 40px 0; color: #9aa3b2; }
  .error-box {
    background: #2a1414; border: 1px solid #5a2530; color: #f28b8b;
    padding: 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
  }
  .success-box { text-align: center; padding: 20px 0; }
  .success-box .check { font-size: 44px; margin-bottom: 14px; }
  .success-box h2 { color: #fff; margin-bottom: 8px; }
  .store-name-input { font-size: 18px; font-weight: 600; }
  .step-label { color: #5DCAA5; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
  a.store-link { color: #5DCAA5; word-break: break-all; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>
<main>
  <h1>🏪 Mağazanı Kur</h1>
  <div class="subtitle">Hobinden yola çıkarak birkaç dakikada hazır bir mağaza oluşturalım</div>

  <div id="step1" class="card">
    <div class="step-label">1. ADIM</div>
    <label>Hobin / ilgi alanın ne?</label>
    <input type="text" id="hobbyInput" placeholder="örn. balık tutma, örgü, ev dekorasyonu...">
    <label>Bütçen ne kadar? (opsiyonel, TL)</label>
    <input type="number" id="budgetInput" placeholder="örn. 5000">
    <button class="btn-primary" id="suggestBtn" onclick="getSuggestions()">Ürün Önerilerini Getir</button>
  </div>

  <div id="loadingBox" class="card loading" style="display:none;">
    AI senin için ürünler araştırıyor, birkaç saniye sürebilir...
  </div>

  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div id="step2" class="card" style="display:none;">
    <div class="step-label">2. ADIM</div>
    <label>Mağaza adı</label>
    <input type="text" id="storeNameInput" class="store-name-input">
    <div id="productList" class="product-list"></div>
    <button class="btn-primary" id="createBtn" onclick="createStore()">Mağazamı Kur</button>
    <button class="btn-secondary" onclick="location.reload()">Baştan Başla</button>
  </div>

  <div id="step3" class="card success-box" style="display:none;">
    <div class="check">✅</div>
    <h2>Mağazan hazır!</h2>
    <p style="color:#9aa3b2; margin: 10px 0;">Ürünlerin panelinde otomatik eklendi.</p>
    <p>Mağaza adresin: <br><a class="store-link" id="storeLinkText" href="#"></a></p>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let lastSuggestion = null;
  let currentSession = null;

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentSession = session;
    document.getElementById('userEmail').textContent = session.user.email;
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  async function getSuggestions() {
    hideError();
    const hobby = document.getElementById('hobbyInput').value.trim();
    const budget = document.getElementById('budgetInput').value;

    if (!hobby) {
      showError('Lütfen hobi/ilgi alanını yaz.');
      return;
    }

    document.getElementById('step1').style.display = 'none';
    document.getElementById('loadingBox').style.display = 'block';

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/store-wizard', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          mode: 'suggest',
          hobby,
          budget: budget ? Number(budget) : null,
          userAccessToken: currentSession.access_token,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Bir hata oluştu');

      lastSuggestion = { hobby, budget: budget ? Number(budget) : null, store_slug: data.store_slug, products: data.products };

      document.getElementById('storeNameInput').value = data.store_name || hobby;
      renderProducts(data.products || []);

      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    } catch (err) {
      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      showError(err.message);
    }
  }

  function renderProducts(products) {
    const list = document.getElementById('productList');
    list.innerHTML = '';
    products.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'product-item';
      div.innerHTML = `
        <input type="checkbox" checked data-index="${i}" class="product-check">
        <img src="${p.image_url || ''}" onerror="this.style.display='none'">
        <div class="info">
          <div class="pname">${p.name}</div>
          <div class="meta">${p.category || ''} · ~${p.estimated_sale_price || '-'} TL</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  async function createStore() {
    hideError();
    if (!lastSuggestion) return;

    const storeName = document.getElementById('storeNameInput').value.trim();
    if (!storeName) {
      showError('Mağaza adı boş olamaz.');
      return;
    }

    const checks = document.querySelectorAll('.product-check');
    const selected = [];
    checks.forEach((c, i) => {
      if (c.checked) selected.push(lastSuggestion.products[i]);
    });

    if (selected.length === 0) {
      showError('En az bir ürün seçmelisin.');
      return;
    }

    const createBtn = document.getElementById('createBtn');
    createBtn.disabled = true;
    createBtn.textContent = 'Mağaza kuruluyor...';

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/store-wizard', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          mode: 'create',
          hobby: lastSuggestion.hobby,
          budget: lastSuggestion.budget,
          store_name: storeName,
          store_slug: lastSuggestion.store_slug,
          products: selected,
          userAccessToken: currentSession.access_token,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Bir hata oluştu');

      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
      const link = document.getElementById('storeLinkText');
      link.textContent = `magaza.html?m=${data.store_slug}`;
      link.href = `magaza.html?m=${data.store_slug}`;
    } catch (err) {
      showError(err.message);
      createBtn.disabled = false;
      createBtn.textContent = 'Mağazamı Kur';
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>
</body>
</html>
