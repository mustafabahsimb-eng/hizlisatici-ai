<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mağazanı Kur - Seltigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
    flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 28px; }
  .card {
    background: #1c212c; border-radius: 12px; padding: 24px;
    border: 1px solid #232838; margin-bottom: 18px;
  }
  label { display: block; font-size: 14px; color: #e6e8ee; margin-bottom: 8px; font-weight: 500; }
  input {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; border-radius: 8px;
    padding: 12px 14px; color: #e6e8ee; font-size: 15px; margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: #1D9E75; }
  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 13px 18px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { background: #2a3040; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040;
    padding: 13px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .product-list { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
  .product-item {
    display: flex; gap: 12px; align-items: center; cursor: pointer;
    background: #0d0f16; border: 1px solid #232838; border-radius: 10px; padding: 12px;
  }
  .product-item img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #232838; flex-shrink: 0; }
  .product-item .info { flex: 1; min-width: 0; }
  .product-item .info .pname { font-weight: 500; font-size: 14px; color: #fff; }
  .product-item .info .meta { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
  .product-item input[type="checkbox"] { width: auto; margin: 0; accent-color: #1D9E75; flex-shrink: 0; }
  .loading { text-align: center; padding: 40px 0; color: #9aa3b2; }
  .error-box {
    background: #2a1414; border: 1px solid #5a2530; color: #f28b8b;
    padding: 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
  }
  .success-box { text-align: center; padding: 20px 0; }
  .success-box .check { font-size: 44px; margin-bottom: 14px; }
  .success-box h2 { color: #fff; margin-bottom: 8px; }
  .success-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .success-actions a {
    text-decoration: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  .success-actions a.primary { background: #1D9E75; color: #fff; }
  .success-actions a.secondary { border: 1px solid #2a3040; color: #9aa3b2; }
  .store-name-input { font-size: 18px; font-weight: 600; }
  .step-label { color: #5DCAA5; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
  a.store-link { color: #5DCAA5; word-break: break-all; }
  @media (max-width: 520px) {
    header { padding: 14px 16px; }
    .logo-text, .user-email { display: none; }
    main { padding: 24px 16px; }
  }
  .consent-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #c3c9d4; margin: 10px 0 4px; cursor: pointer; }
  .consent-row input { width: auto; margin-top: 2px; accent-color: #1D9E75; }
  .site-status { font-size: 15px; color: #fff; margin-bottom: 10px; }
  .bar { height: 8px; background: #232838; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: #1D9E75; transition: width .4s; }
  .site-note { font-size: 12px; color: #9aa3b2; margin-top: 8px; line-height: 1.5; }
  .dist { margin: 18px 4px 0; padding: 16px 20px 4px; border-top: 1px solid #232838; text-align: left; }
  .dist-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .dist-chip { display: flex; align-items: center; gap: 6px; border: 1px solid #2a3040; border-radius: 9px; padding: 7px 11px; font-size: 13px; cursor: pointer; color: #e6e8ee; }
  .dist-chip input { width: auto; margin: 0; accent-color: #1D9E75; }
  .dist-chip small { color: #9aa3b2; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-dot">S</div>
    <div class="logo-text">Seltigo</div>
  </div>
  <div class="header-right">
    <a href="dashboard.html" class="back-link" data-t="back"></a>
    <span class="user-email" id="userEmail"></span>
    <span id="langSwitcherHost"></span>
    <button class="logout-btn" onclick="logout()" data-t="logout"></button>
  </div>
</header>
<main>
  <h1 data-t="title"></h1>
  <div class="subtitle" data-t="subtitle"></div>

  <div id="siteProgress" class="card" style="display:none;">
    <div class="site-status" id="siteStatus"></div>
    <div class="bar"><div class="bar-fill" id="siteBar"></div></div>
    <div class="site-note" id="siteNote"></div>
  </div>

  <div id="siteDone" class="card success-box" style="display:none;">
    <div class="check">✅</div>
    <h2 id="siteDoneTitle"></h2>
    <p><span data-t="storeAddress"></span><br><a class="store-link" id="siteStoreLink" href="#" target="_blank" rel="noopener"></a></p>
    <div class="success-actions">
      <a class="primary" id="siteOpenStore" href="#" target="_blank" rel="noopener" data-t="openStore"></a>
      <a class="secondary" href="dashboard.html" data-t="goDashboard"></a>
    </div>
    <div class="dist" id="distBox">
      <div class="dist-list" id="distList"></div>
      <button class="btn-primary" id="distBtn" onclick="distribute()" data-t="distBtn"></button>
      <div class="site-note" id="distNote"></div>
    </div>
  </div>

  <!-- Link ver, mağazan hazır: satıcının kendi sitesinden -->
  <div id="siteCard" class="card">
    <label for="siteInput" data-t="siteLabel"></label>
    <input type="url" id="siteInput" placeholder="www.siten.com" autocomplete="off">
    <label class="consent-row" id="siteConsentRow" style="display:none"><input type="checkbox" id="siteConsent"> <span data-t="imageTerms"></span></label>
    <button class="btn-primary" id="siteBtn" onclick="startSite()" data-t="siteBtn"></button>
  </div>

  <div id="step1" class="card">
    <div class="step-label" data-t="step1"></div>
    <label for="hobbyInput" data-t="hobbyLabel"></label>
    <input type="text" id="hobbyInput" data-tp="hobbyPh" autocomplete="off">
    <label for="budgetInput" data-t="budgetLabel"></label>
    <input type="number" id="budgetInput" data-tp="budgetPh" min="0">
    <button class="btn-primary" id="suggestBtn" onclick="getSuggestions()" data-t="suggestBtn"></button>
  </div>

  <div id="loadingBox" class="card loading" style="display:none;" data-t="loading"></div>

  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div id="step2" class="card" style="display:none;">
    <div class="step-label" data-t="step2"></div>
    <label for="storeNameInput" data-t="storeNameLabel"></label>
    <input type="text" id="storeNameInput" class="store-name-input" autocomplete="off">
    <div id="productList" class="product-list"></div>
    <button class="btn-primary" id="createBtn" onclick="createStore()" data-t="createBtn"></button>
    <button class="btn-secondary" onclick="location.reload()" data-t="restart"></button>
  </div>

  <div id="step3" class="card success-box" style="display:none;">
    <div class="check">✅</div>
    <h2 data-t="doneTitle"></h2>
    <p style="color:#9aa3b2; margin: 10px 0;" data-t="doneText"></p>
    <p><span data-t="storeAddress"></span><br><a class="store-link" id="storeLinkText" href="#" target="_blank" rel="noopener"></a></p>
    <div class="success-actions">
      <a class="primary" id="openStoreBtn" href="#" target="_blank" rel="noopener" data-t="openStore"></a>
      <a class="secondary" href="dashboard.html" data-t="goDashboard"></a>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  let db = null;

  let lastSuggestion = null;
  let currentSession = null;
  let lastErrorKey = null;
  let lastErrorExtra = '';
  let creating = false;

  // ================= DİL =================
  const T = {
    tr: {
      pageTitle: 'Mağazanı Kur - Seltigo',
      back: '← Panele dön',
      logout: 'Çıkış yap',
      title: '🏪 Mağazanı Kur',
      subtitle: 'Hobinden yola çıkarak birkaç dakikada hazır bir mağaza oluşturalım',
      step1: '1. ADIM',
      hobbyLabel: 'Hobin / ilgi alanın ne?',
      hobbyPh: 'örn. balık tutma, örgü, ev dekorasyonu...',
      budgetLabel: 'Bütçen ne kadar? (opsiyonel, TL)',
      budgetPh: 'örn. 5000',
      suggestBtn: 'Ürün Önerilerini Getir',
      loading: 'AI senin için ürünler araştırıyor, birkaç saniye sürebilir...',
      step2: '2. ADIM',
      storeNameLabel: 'Mağaza adı',
      createBtn: 'Mağazamı Kur',
      creating: 'Mağaza kuruluyor...',
      restart: 'Baştan Başla',
      doneTitle: 'Mağazan hazır!',
      doneText: 'Ürünlerin paneline otomatik eklendi.',
      storeAddress: 'Mağaza adresin:',
      openStore: 'Mağazayı aç',
      goDashboard: 'Panele git',
      needHobby: 'Lütfen hobi/ilgi alanını yaz.',
      needStoreName: 'Mağaza adı boş olamaz.',
      needProduct: 'En az bir ürün seçmelisin.',
      genericError: 'Bir hata oluştu',
      noSuggestions: 'Öneri gelmedi, farklı bir hobi yazarak tekrar dene.',
      siteLabel: 'Web sitenin adresi',
      siteBtn: 'Ürünlerimi getir',
      imageTerms: 'Orijinal ürün satıyorum, görsel kullanım sorumluluğu bana aittir',
      needSite: 'Sitenin adresini yaz (ör. www.siten.com).',
      needConsent: 'Devam etmek için görsel kullanım onayını işaretle.',
      siteStarting: 'Siten okunuyor...',
      siteRunning: 'Ürünlerin getiriliyor: {done} / {total}',
      siteNote: 'Sayfayı kapatabilirsin; iş arka planda sürer ve bitince panelde (ve asistanda) haber verilir. Eksik görseller arkadan tamamlanır.',
      siteDone: '{n} ürün mağazanda yayında',
      siteNone: 'Sitende ürün bulunamadı. Ürün sayfalarından birinin adresini yazmayı dene.',
      siteFailed: '{n} sayfa okunamadı.',
      distBtn: 'Bu ürünleri diğer kanallara da gönder',
      distNoChannel: 'Bağlı başka kanalın yok. Hesaplarım sayfasından Trendyol, Amazon, Instagram gibi kanalları bağlayınca buradan tek seferde gönderebilirsin.',
      distPick: 'En az bir kanal seç.',
      distTest: 'test',
      distDone: 'Gönderildi: {list}',
      distListings: '{n} ilan',
      distQueued: '{n} paylaşım sıraya alındı',
      waCatalog: 'WhatsApp kataloğu',
    },
    en: {
      pageTitle: 'Build Your Store - Seltigo',
      back: '← Back to dashboard',
      logout: 'Sign out',
      title: '🏪 Build Your Store',
      subtitle: 'Let\'s turn your hobby into a ready-to-sell store in a few minutes',
      step1: 'STEP 1',
      hobbyLabel: 'What is your hobby / interest?',
      hobbyPh: 'e.g. fishing, knitting, home decor...',
      budgetLabel: 'What is your budget? (optional, TRY)',
      budgetPh: 'e.g. 5000',
      suggestBtn: 'Get Product Suggestions',
      loading: 'AI is researching products for you, this may take a few seconds...',
      step2: 'STEP 2',
      storeNameLabel: 'Store name',
      createBtn: 'Build My Store',
      creating: 'Building your store...',
      restart: 'Start Over',
      doneTitle: 'Your store is ready!',
      doneText: 'Your products were added to your dashboard automatically.',
      storeAddress: 'Your store address:',
      openStore: 'Open store',
      goDashboard: 'Go to dashboard',
      needHobby: 'Please enter your hobby/interest.',
      needStoreName: 'Store name cannot be empty.',
      needProduct: 'You need to select at least one product.',
      genericError: 'Something went wrong',
      noSuggestions: 'No suggestions came back, try again with a different hobby.',
      siteLabel: 'Your website address',
      siteBtn: 'Bring my products',
      imageTerms: 'I sell original products and I am responsible for the use of images',
      needSite: 'Enter your website address (e.g. www.yoursite.com).',
      needConsent: 'Tick the image use confirmation to continue.',
      siteStarting: 'Reading your website...',
      siteRunning: 'Bringing your products: {done} / {total}',
      siteNote: 'You can close this page; the job continues in the background and you are notified on the dashboard (and the assistant) when it is done. Missing images are completed later.',
      siteDone: '{n} products are live in your store',
      siteNone: 'No products were found on your site. Try entering the address of one of your product pages.',
      siteFailed: '{n} pages could not be read.',
      distBtn: 'Send these products to other channels too',
      distNoChannel: 'You have no other connected channels. Connect Trendyol, Amazon, Instagram and others on My Accounts, then send from here in one go.',
      distPick: 'Choose at least one channel.',
      distTest: 'test',
      distDone: 'Sent: {list}',
      distListings: '{n} listings',
      distQueued: '{n} posts queued',
      waCatalog: 'WhatsApp catalog',
    }
  };
  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key) {
    const v = T[lang()][key];
    return v !== undefined ? v : (T.tr[key] !== undefined ? T.tr[key] : key);
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.getAttribute('data-tp')); });
    if (creating) document.getElementById('createBtn').textContent = t('creating');
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // AI tahmini fiyatları TL olarak döner
  function formatTry(v) {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return '-';
    try {
      return new Intl.NumberFormat(lang() === 'en' ? 'en-US' : 'tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(n);
    } catch (e) { return Math.round(n) + ' TL'; }
  }
  function safeImg(url) {
    return /^https?:\/\//i.test(String(url || '')) ? url : '';
  }

  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    applyStatic();
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentSession = session;
    document.getElementById('userEmail').textContent = session.user.email;
    prepareSite();
  }

  function showError(key, extra) {
    lastErrorKey = key; lastErrorExtra = extra || '';
    renderError();
  }
  function renderError() {
    const box = document.getElementById('errorBox');
    if (!lastErrorKey && !lastErrorExtra) { box.style.display = 'none'; return; }
    box.textContent = (lastErrorKey ? t(lastErrorKey) : '') + (lastErrorKey && lastErrorExtra ? ' ' : '') + lastErrorExtra;
    box.style.display = 'block';
  }
  function hideError() {
    lastErrorKey = null; lastErrorExtra = '';
    renderError();
  }

  async function getSuggestions() {
    hideError();
    const hobby = document.getElementById('hobbyInput').value.trim();
    const budget = document.getElementById('budgetInput').value;

    if (!hobby) { showError('needHobby'); return; }

    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentSession = session;

    document.getElementById('step1').style.display = 'none';
    document.getElementById('loadingBox').style.display = 'block';

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/store-wizard', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          mode: 'suggest',
          hobby,
          budget: budget ? Number(budget) : null,
          userAccessToken: session.access_token,
          language: lang(),
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.error) throw new Error(data.error || t('genericError'));
      const products = Array.isArray(data.products) ? data.products : [];
      if (!products.length) throw new Error(t('noSuggestions'));

      lastSuggestion = { hobby, budget: budget ? Number(budget) : null, store_slug: data.store_slug, products: products };

      document.getElementById('storeNameInput').value = data.store_name || hobby;
      renderProducts();

      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    } catch (err) {
      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      showError(null, err.message);
    }
  }

  function renderProducts() {
    if (!lastSuggestion) return;
    const list = document.getElementById('productList');
    // Dil değişiminde işaretler korunsun
    const prev = {};
    list.querySelectorAll('.product-check').forEach(c => { prev[c.getAttribute('data-index')] = c.checked; });
    list.innerHTML = lastSuggestion.products.map((p, i) => {
      const checked = prev[i] === undefined ? true : prev[i];
      const img = safeImg(p.image_url);
      return '<label class="product-item">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + ' data-index="' + i + '" class="product-check">' +
        (img ? '<img src="' + escapeHtml(img) + '" alt="" onerror="this.style.display=\'none\'">' : '<img alt="" style="visibility:hidden">') +
        '<div class="info">' +
          '<div class="pname">' + escapeHtml(p.name || '') + '</div>' +
          '<div class="meta">' + escapeHtml(p.category || '') + (p.category ? ' · ' : '') + '~' + escapeHtml(formatTry(p.estimated_sale_price)) + '</div>' +
        '</div></label>';
    }).join('');
  }

  async function createStore() {
    hideError();
    if (!lastSuggestion || creating) return;

    const storeName = document.getElementById('storeNameInput').value.trim();
    if (!storeName) { showError('needStoreName'); return; }

    const selected = [];
    document.querySelectorAll('.product-check').forEach(c => {
      if (c.checked) selected.push(lastSuggestion.products[Number(c.getAttribute('data-index'))]);
    });
    if (selected.length === 0) { showError('needProduct'); return; }

    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentSession = session;

    const createBtn = document.getElementById('createBtn');
    creating = true;
    createBtn.disabled = true;
    createBtn.textContent = t('creating');

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/store-wizard', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          mode: 'create',
          hobby: lastSuggestion.hobby,
          budget: lastSuggestion.budget,
          store_name: storeName,
          store_slug: lastSuggestion.store_slug,
          products: selected,
          userAccessToken: session.access_token,
          language: lang(),
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.error) throw new Error(data.error || t('genericError'));

      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
      const rel = 'magaza.html?slug=' + encodeURIComponent(data.store_slug || lastSuggestion.store_slug || '');
      const full = new URL(rel, window.location.href).href;
      const link = document.getElementById('storeLinkText');
      link.textContent = full;
      link.href = rel;
      document.getElementById('openStoreBtn').href = rel;
    } catch (err) {
      showError(null, err.message);
      createBtn.disabled = false;
      createBtn.textContent = t('createBtn');
    } finally {
      creating = false;
    }
  }

  // ================= Link ver, mağazan hazır =================
  let siteJobId = null, sitePoll = null, siteJob = null, siteChannels = null;
  function tv(key, vars) { let s = t(key); Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); }); return s; }
  async function callSite(body) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return {}; }
    const res = await fetch(SUPABASE_URL + '/functions/v1/site-store', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ ...body, userAccessToken: session.access_token }),
    });
    return await res.json().catch(() => ({}));
  }
  async function prepareSite() {
    // Görsel kullanım onayı daha önce verildiyse tekrar sorulmaz
    const { data } = await db.from('user_profiles').select('image_terms_accepted_at').eq('user_id', currentSession.user.id).maybeSingle();
    document.getElementById('siteConsentRow').style.display = data && data.image_terms_accepted_at ? 'none' : 'flex';
    // Yarım kalan iş varsa ilerlemeyi göster
    const { data: jobs } = await db.from('site_import_jobs').select('*').order('created_at', { ascending: false }).limit(1);
    const j = jobs && jobs[0];
    if (j && (j.status === 'queued' || j.status === 'running') && Date.now() - new Date(j.updated_at).getTime() < 10 * 60000) { siteJobId = j.id; showProgress(j); pollSite(); }
    // Biten ve panelde bildirimi kapatılmamış iş: sonuç + diğer kanallara gönderme (yeni site de getirilebilir)
    else if (j && j.status === 'done' && !j.notified_at && (j.product_ids || []).length) {
      siteJobId = j.id;
      await showSiteDone(j);
      document.getElementById('siteCard').style.display = 'block';
    }
  }
  async function startSite() {
    hideError();
    const url = document.getElementById('siteInput').value.trim();
    if (!url) { showError('needSite'); return; }
    const consentShown = document.getElementById('siteConsentRow').style.display !== 'none';
    const consent = document.getElementById('siteConsent').checked;
    if (consentShown && !consent) { showError('needConsent'); return; }
    const btn = document.getElementById('siteBtn');
    btn.disabled = true;
    try {
      const d = await callSite({ action: 'start', siteUrl: url, consent: consentShown ? consent : undefined });
      if (!d.ok) { showError(null, d.error || t('genericError')); btn.disabled = false; return; }
      siteJobId = d.jobId;
      document.getElementById('siteDone').style.display = 'none';
      document.getElementById('siteCard').style.display = 'none';
      document.getElementById('step1').style.display = 'none';
      showProgress({ status: 'queued', done: 0, total: 0, failed: 0 });
      pollSite();
    } catch (e) { showError(null, e.message); btn.disabled = false; }
  }
  function showProgress(j) {
    siteJob = j;
    document.getElementById('siteCard').style.display = 'none';
    document.getElementById('step1').style.display = 'none';
    document.getElementById('siteProgress').style.display = 'block';
    const total = Math.max(j.total || 0, (j.done || 0) + (j.failed || 0));
    document.getElementById('siteStatus').textContent = total ? tv('siteRunning', { done: j.done || 0, total }) : t('siteStarting');
    document.getElementById('siteBar').style.width = (total ? Math.round(((j.done || 0) + (j.failed || 0)) / total * 100) : 3) + '%';
    document.getElementById('siteNote').textContent = t('siteNote');
  }
  function pollSite() {
    clearInterval(sitePoll);
    sitePoll = setInterval(async () => {
      const { data: j } = await db.from('site_import_jobs').select('*').eq('id', siteJobId).maybeSingle();
      if (!j) return;
      if (j.status === 'done' || j.status === 'error') { clearInterval(sitePoll); showSiteDone(j); }
      else showProgress(j);
    }, 2500);
  }
  async function showSiteDone(j) {
    siteJob = j;
    document.getElementById('siteProgress').style.display = 'none';
    const n = (j.product_ids || []).length;
    if (!n) {
      document.getElementById('siteCard').style.display = 'block';
      document.getElementById('siteBtn').disabled = false;
      showError(null, t('siteNone') + (j.error ? ' (' + j.error + ')' : ''));
      return;
    }
    document.getElementById('siteDone').style.display = 'block';
    document.getElementById('siteBtn').disabled = false;
    document.getElementById('siteDoneTitle').textContent = tv('siteDone', { n }) + (j.failed ? ' · ' + tv('siteFailed', { n: j.failed }) : '');
    const rel = 'magaza.html?slug=' + encodeURIComponent(j.store_slug || '');
    const link = document.getElementById('siteStoreLink');
    link.textContent = new URL(rel, window.location.href).href;
    link.href = rel;
    document.getElementById('siteOpenStore').href = rel;
    siteChannels = await callSite({ action: 'channels' });
    renderChannels();
  }
  function renderChannels() {
    const c = siteChannels || {};
    const items = [];
    (c.marketplaces || []).forEach(m => items.push(['mp:' + m.id, m.label || m.code, m.test]));
    (c.instagram || []).forEach(i => items.push(['ig:' + i.id, 'Instagram' + (i.name ? ' @' + i.name : ''), false]));
    if (c.whatsappCatalog) items.push(['wa', t('waCatalog'), false]);
    const list = document.getElementById('distList');
    if (!items.length) {
      list.innerHTML = '';
      document.getElementById('distBtn').style.display = 'none';
      document.getElementById('distNote').textContent = t('distNoChannel');
      return;
    }
    list.innerHTML = items.map(([id, name, test]) => '<label class="dist-chip"><input type="checkbox" value="' + escapeHtml(id) + '" checked> ' + escapeHtml(name) +
      (test ? ' <small>(' + escapeHtml(t('distTest')) + ')</small>' : '') + '</label>').join('');
  }
  async function distribute() {
    const channels = [...document.querySelectorAll('#distList input:checked')].map(x => x.value);
    const note = document.getElementById('distNote');
    if (!channels.length) { note.textContent = t('distPick'); return; }
    const btn = document.getElementById('distBtn');
    btn.disabled = true;
    try {
      const d = await callSite({ action: 'distribute', jobId: siteJob.id, channels });
      if (!d.ok) throw new Error(d.error || t('genericError'));
      const parts = [];
      Object.entries(d.result || {}).forEach(([k, v]) => {
        if (v && v.listings != null) parts.push(k + ': ' + tv('distListings', { n: v.listings }));
        else if (v && v.queued != null) parts.push('Instagram: ' + tv('distQueued', { n: v.queued }));
        else if (v && v.error) parts.push(k + ': ' + v.error);
      });
      // WhatsApp kataloğu: Meta kataloğuna gönderim (satıcının oturumuyla)
      if (d.whatsappCatalog) {
        const { data: { session } } = await db.auth.getSession();
        const r = await fetch(SUPABASE_URL + '/functions/v1/social-catalog', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
          body: JSON.stringify({ action: 'sync', productIds: siteJob.product_ids, userAccessToken: session.access_token }),
        }).then(x => x.json()).catch(() => ({}));
        parts.push(t('waCatalog') + ': ' + (r.error ? r.error : '✓'));
      }
      note.textContent = tv('distDone', { list: parts.join(' · ') });
    } catch (e) {
      note.textContent = e.message;
      btn.disabled = false;
    }
  }

  async function logout() {
    await db.auth.signOut();
    window.location.href = 'index.html';
  }

  document.getElementById('siteInput').addEventListener('keydown', e => { if (e.key === 'Enter') startSite(); });
  document.getElementById('hobbyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') getSuggestions();
  });

  function onLangChange() {
    applyStatic();
    renderError();
    renderProducts();
    if (siteJob && document.getElementById('siteProgress').style.display === 'block') showProgress(siteJob);
    if (siteJob && document.getElementById('siteDone').style.display === 'block') { showSiteDone(siteJob); }
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);

  init();
</script>
</body>
</html>
