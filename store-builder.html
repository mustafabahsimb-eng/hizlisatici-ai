<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Mağazanı Kur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main { max-width: 700px; margin: 0 auto; padding: 40px 24px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 12px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040;
    padding: 12px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }

  .wizard-card {
    background: #141821; border: 1px solid #232838; border-radius: 14px;
    padding: 28px; margin-bottom: 20px;
  }
  .wizard-card label { display: block; font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 10px; }
  .wizard-card input[type="text"], .wizard-card input[type="number"], .wizard-card select {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; color: #e6e8ee;
    padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
  }
  .budget-row { display: flex; gap: 10px; }
  .budget-row input { flex: 1; }
  .budget-row select { width: 90px; flex-shrink: 0; }
  .step-progress { font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }

  .hidden { display: none; }

  .result-title { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 20px; }
  .result-section { margin-bottom: 24px; }
  .result-section h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .product-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .product-card { background: #1c212c; border-radius: 12px; padding: 16px; border: 1px solid #232838; }
  .product-card .name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .product-card .reasoning { font-size: 13px; color: #9aa3b2; margin-bottom: 8px; line-height: 1.4; }
  .product-card .cost { font-size: 13px; font-weight: 600; color: #5DCAA5; }
  .platform-card {
    background: #141821; border: 1px solid #232838; border-radius: 14px;
    padding: 18px; font-size: 14px; line-height: 1.6; color: #e6e8ee;
  }
  .launch-steps { list-style: none; counter-reset: step; }
  .launch-steps li {
    counter-increment: step;
    background: #1c212c; border: 1px solid #232838; border-radius: 10px;
    padding: 12px 16px 12px 44px; margin-bottom: 10px; position: relative;
    font-size: 14px; line-height: 1.5;
  }
  .launch-steps li::before {
    content: counter(step);
    position: absolute; left: 14px; top: 12px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #1D9E75; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .loading-note { text-align: center; color: #9aa3b2; font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1>Mağazanı Kur</h1>
      <div class="subtitle">Hobine göre kişiselleştirilmiş ürün ve başlangıç planı</div>
    </div>
    <button class="btn-secondary" onclick="window.location.href='dashboard.html'">← Panele Dön</button>
  </div>

  <div id="wizardContainer">
    <div class="wizard-card" id="step1Card">
      <div class="step-progress">Adım 1/3</div>
      <label for="hobbyInput">Hobin veya ilgi alanın ne?</label>
      <input type="text" id="hobbyInput" placeholder="Örn: balık tutma, yoga, kahve, evcil hayvanlar...">
      <button class="btn-primary" onclick="goToStep(2)">Devam et →</button>
    </div>

    <div class="wizard-card hidden" id="step2Card">
      <div class="step-progress">Adım 2/3</div>
      <label for="budgetInput">Bütçen ne kadar?</label>
      <div class="budget-row">
        <input type="number" id="budgetInput" placeholder="Örn: 5000" min="0">
        <select id="currencySelect">
          <option value="₺">₺</option>
          <option value="$">$</option>
        </select>
      </div>
      <button class="btn-primary" onclick="goToStep(3)">Devam et →</button>
    </div>

    <div class="wizard-card hidden" id="step3Card">
      <div class="step-progress">Adım 3/3</div>
      <label for="platformSelect">Hangi platformda satmak istersin?</label>
      <select id="platformSelect">
        <option value="">Bilmiyorum, sen öner</option>
        <option value="Trendyol">Trendyol</option>
        <option value="Hepsiburada">Hepsiburada</option>
        <option value="N11">N11</option>
        <option value="Çiçeksepeti">Çiçeksepeti</option>
        <option value="PTT AVM">PTT AVM</option>
        <option value="Amazon TR">Amazon TR</option>
        <option value="Pazarama">Pazarama</option>
        <option value="Etsy">Etsy</option>
        <option value="Amazon (Global)">Amazon (Global)</option>
        <option value="eBay">eBay</option>
        <option value="Facebook Marketplace">Facebook Marketplace</option>
        <option value="TikTok Shop">TikTok Shop</option>
        <option value="Shopify">Shopify</option>
        <option value="WooCommerce">WooCommerce</option>
        <option value="Wix">Wix</option>
      </select>
      <button class="btn-primary" id="generateBtn" onclick="generatePlan()">🚀 Mağazamı Oluştur</button>
    </div>

    <div class="wizard-card hidden" id="loadingCard">
      <div class="loading-note">Hobine uygun ürünler ve başlangıç planın hazırlanıyor, birkaç saniye sürebilir...</div>
    </div>
  </div>

  <div id="resultContainer" class="hidden">
    <div class="result-title" id="resultTitle"></div>

    <div class="result-section">
      <h2>🛍️ Önerilen Ürünler</h2>
      <div class="product-cards" id="productCards"></div>
    </div>

    <div class="result-section">
      <h2>🏬 Platform Önerisi</h2>
      <div class="platform-card" id="platformCard"></div>
    </div>

    <div class="result-section">
      <h2>🚀 İlk Hafta Başlangıç Planı</h2>
      <ol class="launch-steps" id="launchStepsList"></ol>
    </div>

    <button class="btn-secondary" onclick="resetWizard()">↺ Yeniden Başla</button>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentSession = null;

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentSession = session;
    document.getElementById('userEmail').textContent = session.user.email;
  }

  function goToStep(step) {
    if (step === 2) {
      const hobby = document.getElementById('hobbyInput').value.trim();
      if (!hobby) {
        alert('Lütfen hobin veya ilgi alanını yaz.');
        return;
      }
      document.getElementById('step1Card').classList.add('hidden');
      document.getElementById('step2Card').classList.remove('hidden');
    } else if (step === 3) {
      const budget = document.getElementById('budgetInput').value;
      if (!budget || Number(budget) <= 0) {
        alert('Lütfen geçerli bir bütçe gir.');
        return;
      }
      document.getElementById('step2Card').classList.add('hidden');
      document.getElementById('step3Card').classList.remove('hidden');
    }
  }

  async function generatePlan() {
    const hobby = document.getElementById('hobbyInput').value.trim();
    const budget = document.getElementById('budgetInput').value;
    const currency = document.getElementById('currencySelect').value;
    const platformPreference = document.getElementById('platformSelect').value;

    document.getElementById('step3Card').classList.add('hidden');
    document.getElementById('loadingCard').classList.remove('hidden');

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/store-builder', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          hobby,
          budget: Number(budget),
          currency,
          platformPreference,
          userAccessToken: currentSession.access_token,
        }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      renderResult(data);
    } catch (err) {
      alert('Plan oluşturulamadı: ' + err.message);
      document.getElementById('loadingCard').classList.add('hidden');
      document.getElementById('step3Card').classList.remove('hidden');
    }
  }

  function renderResult(data) {
    document.getElementById('wizardContainer').classList.add('hidden');
    document.getElementById('resultContainer').classList.remove('hidden');

    document.getElementById('resultTitle').textContent = data.title;

    const productCards = document.getElementById('productCards');
    productCards.innerHTML = (data.products || []).map(p => `
      <div class="product-card">
        <div class="name">${escapeHtml(p.name || '')}</div>
        <div class="reasoning">${escapeHtml(p.reasoning || '')}</div>
        <div class="cost">${escapeHtml(p.estimatedCost || '')}</div>
      </div>
    `).join('');

    document.getElementById('platformCard').textContent = data.platformRecommendation || '';

    const launchList = document.getElementById('launchStepsList');
    launchList.innerHTML = (data.launchSteps || []).map(step => `<li>${escapeHtml(step)}</li>`).join('');
  }

  function resetWizard() {
    document.getElementById('hobbyInput').value = '';
    document.getElementById('budgetInput').value = '';
    document.getElementById('platformSelect').value = '';
    document.getElementById('resultContainer').classList.add('hidden');
    document.getElementById('wizardContainer').classList.remove('hidden');
    document.getElementById('loadingCard').classList.add('hidden');
    document.getElementById('step2Card').classList.add('hidden');
    document.getElementById('step3Card').classList.add('hidden');
    document.getElementById('step1Card').classList.remove('hidden');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
