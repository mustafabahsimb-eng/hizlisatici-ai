# Seltigo sabit IP çıkış sunucusu — Squid ayarı (kurulum.sh tarafından /etc/squid/squid.conf'a yazılır)
# Yalnız şifreli (Basic auth) istemciler, yalnız HTTPS (CONNECT 443), yalnız izinli alan adları.
# __OUT_IP__ kurulumda sunucunun IPv4 adresiyle değiştirilir: hedefler daima bu IP'yi görür.

http_port 3128

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm seltigo
auth_param basic credentialsttl 2 hours
auth_param basic children 5 startup=2 idle=1

acl SSL_ports port 443
acl CONNECT method CONNECT
acl authed proxy_auth REQUIRED
acl izinli dstdomain "/etc/squid/izinli-alanlar.txt"

http_access deny !authed
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access deny !izinli
http_access allow authed
http_access deny all

# Çıkış her zaman sabit IPv4'ten (IPv6 kullanılırsa hedef başka adres görür)
tcp_outgoing_address __OUT_IP__
dns_nameservers 1.1.1.1 9.9.9.9

# Gizlilik ve sadelik: önbellek yok, istemci bilgisi eklenmez
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on

connect_timeout 15 seconds
read_timeout 120 seconds
request_timeout 30 seconds
client_lifetime 10 minutes

# Kayıt: logrotate günlük döndürür, 7 gün saklar
access_log daemon:/var/log/squid/access.log squid
logfile_rotate 0
coredump_dir /var/spool/squid
shutdown_lifetime 5 seconds
