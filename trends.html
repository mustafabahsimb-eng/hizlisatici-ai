<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Trend Ürünler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .back-link:hover { color: #fff; }

  main { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 24px; }

  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  select {
    background: #1c212c; border: 1px solid #2a3040; border-radius: 8px;
    padding: 10px 12px; color: #fff; font-size: 14px; font-family: inherit;
  }
  .btn-primary {
    background: #1D9E75; color: #fff; border: none;
    padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .note { font-size: 12px; color: #9aa3b2; margin-bottom: 24px; line-height: 1.5; }

  .msg { margin-bottom: 20px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { background: #2a1414; color: #f28b8b; display: block; }

  .empty-state {
    padding: 60px 20px; text-align: center; color: #9aa3b2;
    background: #141821; border-radius: 14px; border: 1px solid #232838;
  }

  .trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .trend-card {
    background: #141821; border-radius: 14px; border: 1px solid #232838;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .trend-img-wrap { width: 100%; height: 140px; border-radius: 10px; overflow: hidden; background: #1c212c; flex-shrink: 0; }
  .trend-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .trend-top-row { display: flex; align-items: center; gap: 10px; }
  .trend-icon {
    width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .trend-title { font-size: 15px; font-weight: 600; color: #fff; }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #1c3a2e; color: #5DCAA5; }
  .badge.demand-high { background: #2a1414; color: #f28b8b; }
  .badge.demand-rising { background: #1c3a2e; color: #5DCAA5; }
  .badge.demand-medium { background: #262a1c; color: #d7c95d; }
  .trend-reason { font-size: 13px; color: #c5cad4; line-height: 1.5; flex-grow: 1; }
  .trend-platforms { font-size: 12px; color: #9aa3b2; }
  .btn-add {
    background: transparent; border: 1px solid #1D9E75; color: #5DCAA5;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .btn-add:hover { background: #123222; }

  .loading { text-align: center; padding: 60px 20px; color: #9aa3b2; font-size: 14px; }
  @media (max-width: 600px) { header { padding: 14px 16px; } main { padding: 24px 16px 80px; } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span id="langSwitcherHost"></span>
    <a href="dashboard.html" class="back-link" data-t="back"></a>
  </div>
</header>

<main>
  <h1 data-t="title"></h1>
  <div class="subtitle" data-t="subtitle"></div>

  <div class="controls">
    <select id="scopeSelect">
      <option value="turkiye" data-t="scopeTr"></option>
      <option value="global" data-t="scopeGlobal"></option>
    </select>
    <button class="btn-primary" id="scanBtn" onclick="scanTrends()" data-t="scan"></button>
  </div>

  <div class="note" data-t="note"></div>

  <div class="msg" id="msgBox"></div>

  <div id="resultArea"></div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  let db = null;

  // ================= DİL =================
  const T = {
    tr: {
      pageTitle: 'HızlıSatıcı AI - Trend Ürünler',
      back: '← Panele dön',
      title: 'Trend ürünler',
      subtitle: 'AI, güncel web verilerini tarayarak şu an talebi artan ürünleri buluyor.',
      scopeTr: 'Sadece Türkiye pazaryerleri',
      scopeGlobal: 'Türkiye + Uluslararası',
      scan: '🔍 Trendleri tara',
      scanning: 'Taranıyor... (biraz sürebilir)',
      note: "Bu liste AI'nin web araması sonucu ürettiği bir tahmindir, kesin satış garantisi değildir. Görseller bulunabildiğinde gerçek ürün görselleridir, bulunamadığında kategori ikonu gösterilir. Bir ürünü eklemeden önce kendi araştırmanla da doğrulaman önerilir.",
      startHint: 'Trendleri görmek için yukarıdaki "Trendleri tara" butonuna bas.',
      loadingText: 'AI web araması yapıyor, trend ürünleri analiz ediyor...',
      loadFail: 'Trendler yüklenemedi: ',
      none: 'Şu an için belirgin bir trend bulunamadı, tekrar dene.',
      platforms: 'Önerilen platform: ',
      add: '+ Bu ürünü ekle',
    },
    en: {
      pageTitle: 'HızlıSatıcı AI - Trending Products',
      back: '← Back to dashboard',
      title: 'Trending products',
      subtitle: 'AI scans current web data to find products whose demand is rising right now.',
      scopeTr: 'Turkish marketplaces only',
      scopeGlobal: 'Turkey + International',
      scan: '🔍 Scan trends',
      scanning: 'Scanning... (this may take a while)',
      note: 'This list is an estimate produced by AI web search, not a sales guarantee. Images are real product images when found; otherwise a category icon is shown. Please verify with your own research before adding a product.',
      startHint: 'Press "Scan trends" above to see trends.',
      loadingText: 'AI is searching the web and analyzing trending products...',
      loadFail: 'Could not load trends: ',
      none: 'No clear trend found right now, please try again.',
      platforms: 'Suggested platforms: ',
      add: '+ Add this product',
    }
  };
  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key) {
    const v = T[lang()][key];
    return v !== undefined ? v : (T.tr[key] !== undefined ? T.tr[key] : key);
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
  }

  // Kategori: AI Türkçe veya İngilizce dönebilir; ikisini de tanı
  const CATEGORY_STYLE = {
    electronics: { emoji: '📱', bg: 'linear-gradient(135deg,#4f7cff,#2f4bb3)', tr: 'Elektronik', en: 'Electronics', alias: ['elektronik', 'electronics'] },
    clothing:    { emoji: '👕', bg: 'linear-gradient(135deg,#ff8a65,#e64a19)', tr: 'Giyim', en: 'Clothing', alias: ['giyim', 'clothing', 'apparel', 'fashion'] },
    home:        { emoji: '🏠', bg: 'linear-gradient(135deg,#4caf50,#2e7d32)', tr: 'Ev & Yaşam', en: 'Home & Living', alias: ['ev & yaşam', 'ev ve yaşam', 'home & living', 'home'] },
    beauty:      { emoji: '💄', bg: 'linear-gradient(135deg,#ec4899,#a21caf)', tr: 'Kozmetik & Kişisel Bakım', en: 'Beauty & Personal Care', alias: ['kozmetik & kişisel bakım', 'kozmetik', 'beauty & personal care', 'beauty'] },
    baby:        { emoji: '👶', bg: 'linear-gradient(135deg,#60a5fa,#3b5bdb)', tr: 'Anne & Bebek', en: 'Mother & Baby', alias: ['anne & bebek', 'mother & baby', 'baby'] },
    sports:      { emoji: '⚽', bg: 'linear-gradient(135deg,#f59e0b,#c2680a)', tr: 'Spor & Outdoor', en: 'Sports & Outdoor', alias: ['spor & outdoor', 'spor', 'sports & outdoor', 'sports'] },
    accessory:   { emoji: '⌚', bg: 'linear-gradient(135deg,#eab308,#92610a)', tr: 'Aksesuar', en: 'Accessories', alias: ['aksesuar', 'accessories', 'accessory'] },
    other:       { emoji: '📦', bg: 'linear-gradient(135deg,#64748b,#334155)', tr: 'Diğer', en: 'Other', alias: ['diğer', 'other'] },
  };
  function categoryKey(cat) {
    const c = String(cat || '').toLowerCase().trim();
    for (const k of Object.keys(CATEGORY_STYLE)) { if (CATEGORY_STYLE[k].alias.includes(c)) return k; }
    return c ? null : 'other';
  }
  function categoryStyle(cat) { return CATEGORY_STYLE[categoryKey(cat) || 'other']; }
  function categoryLabel(cat) {
    const k = categoryKey(cat);
    return k ? CATEGORY_STYLE[k][lang()] : String(cat);
  }

  const DEMAND = {
    high:   { tr: 'Yüksek', en: 'High', alias: ['yüksek', 'high'] },
    rising: { tr: 'Yükselişte', en: 'Rising', alias: ['yükselişte', 'rising', 'trending'] },
    medium: { tr: 'Orta', en: 'Medium', alias: ['orta', 'medium', 'moderate'] },
  };
  function demandKey(d) {
    const v = String(d || '').toLowerCase().trim();
    for (const k of Object.keys(DEMAND)) { if (DEMAND[k].alias.includes(v)) return k; }
    return null;
  }
  function demandLabel(d) {
    const k = demandKey(d);
    return k ? DEMAND[k][lang()] : (d || '-');
  }

  let lastTrends = null;   // son sonuç (dil değişince yeniden çizmek için)
  let lastError = null;

  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    applyStatic();
    renderStart();
  }

  function renderStart() {
    if (lastTrends) { renderTrends(lastTrends); return; }
    document.getElementById('resultArea').innerHTML =
      '<div class="empty-state"><p>' + escapeHtml(t('startHint')) + '</p></div>';
  }

  async function scanTrends() {
    const btn = document.getElementById('scanBtn');
    const resultArea = document.getElementById('resultArea');
    const scope = document.getElementById('scopeSelect').value;

    btn.disabled = true;
    btn.textContent = t('scanning');
    hideMsg();
    lastError = null;
    resultArea.innerHTML = '<div class="loading">' + escapeHtml(t('loadingText')) + '</div>';

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/trend-discovery', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ scope, language: lang() }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      lastTrends = data.trends || [];
      renderTrends(lastTrends);
    } catch (err) {
      lastError = err.message;
      showMsg(t('loadFail') + err.message, 'error');
      resultArea.innerHTML = '';
    } finally {
      btn.disabled = false;
      btn.textContent = t('scan');
    }
  }

  function handleImgError(img) {
    const card = img.closest('.trend-card');
    const wrap = img.parentElement;
    const cat = img.getAttribute('data-cat');
    wrap.remove();
    const style = categoryStyle(cat);
    const topRow = card.querySelector('.trend-top-row');
    const icon = document.createElement('div');
    icon.className = 'trend-icon';
    icon.style.background = style.bg;
    icon.textContent = style.emoji;
    topRow.insertBefore(icon, topRow.firstChild);
  }

  function renderTrends(trends) {
    const resultArea = document.getElementById('resultArea');
    if (!trends.length) {
      resultArea.innerHTML = '<div class="empty-state"><p>' + escapeHtml(t('none')) + '</p></div>';
      return;
    }
    resultArea.innerHTML = '<div class="trend-grid">' + trends.map((tr, i) => {
      const hasImg = tr.imageUrl && /^https?:\/\//.test(tr.imageUrl);
      const cat = tr.category || 'Diğer';
      const style = categoryStyle(cat);
      const dk = demandKey(tr.demandLevel);
      const imgBlock = hasImg
        ? '<div class="trend-img-wrap"><img src="' + escapeHtml(tr.imageUrl) + '" class="trend-img" alt="" data-cat="' + escapeHtml(cat) + '" onerror="handleImgError(this)"></div>'
        : '';
      const iconBlock = hasImg ? '' : '<div class="trend-icon" style="background:' + style.bg + '">' + style.emoji + '</div>';
      return '<div class="trend-card">' + imgBlock +
        '<div class="trend-top-row">' + iconBlock + '<div class="trend-title">' + escapeHtml(tr.productIdea || '-') + '</div></div>' +
        '<div class="badge-row"><span class="badge">' + escapeHtml(categoryLabel(cat)) + '</span>' +
          '<span class="badge' + (dk ? ' demand-' + dk : '') + '">' + escapeHtml(demandLabel(tr.demandLevel)) + '</span></div>' +
        '<div class="trend-reason">' + escapeHtml(tr.reason || '') + '</div>' +
        '<div class="trend-platforms">' + escapeHtml(t('platforms')) + ((tr.suggestedPlatforms || []).map(escapeHtml).join(', ') || '-') + '</div>' +
        '<button class="btn-add" data-idx="' + i + '">' + escapeHtml(t('add')) + '</button>' +
      '</div>';
    }).join('') + '</div>';
    resultArea.querySelectorAll('.btn-add').forEach(b => {
      b.addEventListener('click', () => addProduct((trends[Number(b.dataset.idx)] || {}).productIdea || ''));
    });
  }

  function addProduct(name) {
    window.location.href = 'add-product.html?name=' + encodeURIComponent(name);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
  }
  function hideMsg() { document.getElementById('msgBox').className = 'msg'; }

  function onLangChange() {
    applyStatic();
    const btn = document.getElementById('scanBtn');
    if (btn.disabled) btn.textContent = t('scanning');
    if (lastError) showMsg(t('loadFail') + lastError, 'error');
    if (!btn.disabled) renderStart();
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);

  init();
</script>

</body>
</html>
