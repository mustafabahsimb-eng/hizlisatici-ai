    <!-- Tasarım -->

      <div class="card"><h2 data-t="customTitle"></h2>
        <div class="row" id="colorRow"></div>
        <div class="row"><div><label class="f" data-t="font"></label><select id="thFont"></select></div><div><label class="f" data-t="layout"></label><select id="thLayout"></select></div><div><label class="f" data-t="radius"></label><input type="number" id="thRadius" min="0" max="24"></div></div>

        <label class="f" data-t="heroSub"></label><input id="thHeroSub" maxlength="160">
        <label class="f" data-t="announce"></label><input id="thAnn" maxlength="120">

        <div class="row" style="margin-top:10px"><button class="btn" id="keysSave" data-t="keysSave"></button></div><div class="msg" id="keysMsg"></div></div>

    </section>

    <!-- Alan adı -->
    <section data-p="domain" class="hidden">

        <table><thead><tr><th data-t="redFrom"></th><th data-t="redTo"></th><th data-t="redHits"></th></tr></thead><tbody id="redRows"></tbody></table></div>
    </section>
  </div>
</main>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const msg = (id, text, ok) => { const el = $(id); el.textContent = text || ''; el.className = 'msg ' + (ok === true ? 'ok' : ok === false ? 'err' : ''); };
const TABS = ['design', 'checkout', 'coupons', 'domain', 'seo', 'migrate'];
const COLORS = ['bg', 'panel', 'panel2', 'border', 'text', 'dim', 'accent'];
const PRESET_COLORS = { gece: ['#0b1220', '#111a2e', '#1D9E75', '#e7ecf5'], beyaz: ['#ffffff', '#f6f7f9', '#111827', '#14171c'], butik: ['#faf7f2', '#ffffff', '#8a5a3b', '#2b2118'], pastel: ['#fdf6f9', '#ffffff', '#c2477d', '#3a2a33'], canli: ['#0f0f1a', '#181830', '#ffcc00', '#f3f3ff'], dogal: ['#f4f6ef', '#ffffff', '#3f6b2a', '#1f2a17'] };
let db, S = null, theme = null, ship = [], tab = 'design';

async function call(body) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'index.html'; return {}; }
  const r = await fetch(SUPABASE_URL + '/functions/v1/store-admin', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + SUPABASE_KEY, apikey: SUPABASE_KEY }, body: JSON.stringify({ ...body, userAccessToken: session.access_token }) });
  return await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
}
function applyStatic() {
  document.documentElement.lang = lang();
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach((el) => { el.placeholder = t(el.dataset.tp); });
  document.title = t('title').replace(/^\S+\s/, '') + ' - Seltigo';
  $('tabs').innerHTML = TABS.map((x) => `<button class="tab${x === tab ? ' on' : ''}" data-tab="${x}">${esc(t('t_' + x))}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.tab; history.replaceState({}, '', '?tab=' + tab); applyStatic(); });
  document.querySelectorAll('section[data-p]').forEach((s) => s.classList.toggle('hidden', s.dataset.p !== tab));
  $('thFont').innerHTML = ['system', 'serif', 'rounded', 'mono'].map((f) => `<option value="${f}">${esc(t('f_' + f))}</option>`).join('');
  $('thLayout').innerHTML = ['grid', 'large', 'list'].map((f) => `<option value="${f}">${esc(t('l_' + f))}</option>`).join('');
  $('cpKind').innerHTML = ['percent', 'amount', 'free_shipping'].map((f) => `<option value="${f}">${esc(t('k_' + f))}</option>`).join('');
  $('provEnv').innerHTML = `<option value="sandbox">${esc(t('env_sandbox'))}</option><option value="live">${esc(t('env_live'))}</option>`;
  if (S) render();
}
function render() {
  const st = S.store;
  $('viewStore').href = 'magaza.html?slug=' + encodeURIComponent(st.slug);
  // Tasarım
  $('presets').innerHTML = S.presets.map((p) => { const c = PRESET_COLORS[p] || []; return `<div class="preset${theme.preset === p ? ' on' : ''}" data-p="${p}" style="background:${c[0]};color:${c[3]}"><b>${esc(t('p_' + p))}</b><div class="sw">${c.map((x) => `<i style="background:${x}"></i>`).join('')}</div></div>`; }).join('');
  $('presets').querySelectorAll('.preset').forEach((d) => d.onclick = async () => { const r = await call({ action: 'design', preset: d.dataset.p }); if (r.ok) { theme = { ...r.theme, hero: theme.hero, announcement: theme.announcement }; renderTheme(); render(); } });
  renderTheme();
  // Kargo
  renderShip();
  const co = st.checkout || {}, m = co.methods || ['cod'];
  $('mCod').checked = m.includes('cod'); $('mBank').checked = m.includes('bank_transfer'); $('mIyzico').checked = m.includes('iyzico'); $('mPaytr').checked = m.includes('paytr');
  $('codFee').value = co.cod_fee || ''; $('iban').value = co.iban || ''; $('accName').value = co.account_name || '';
  for (const p of ['iyzico', 'paytr']) {
    const pr = S.providers.find((x) => x.provider === p);
    $(p + 'Pill').textContent = pr && pr.enabled ? t('connected', { e: t('env_' + pr.environment) }) : t('notConnected');
    $(p + 'Pill').className = 'pill' + (pr && pr.enabled ? '' : ' warn');
  }
  $('notifyUrl').textContent = S.payment_notify_url;
  // Kuponlar
  $('cpRows').innerHTML = S.coupons.map((c) => `<tr><td><b>${esc(c.code)}</b></td><td>${esc(t('k_' + c.kind))}</td><td>${c.kind === 'free_shipping' ? '–' : esc(c.value) + (c.kind === 'percent' ? '%' : ' TL')}</td><td>${c.used_count}${c.max_uses ? ' / ' + c.max_uses : ''}</td><td>${c.ends_at ? esc(new Date(c.ends_at).toLocaleDateString()) : '–'}</td>
    <td><button class="btn2" data-tg="${c.id}">${esc(c.active ? t('on') : t('off'))}</button> <button class="btn2" data-del="${c.id}">${esc(t('del'))}</button></td></tr>`).join('');
  $('cpRows').querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => { await db.from('store_coupons').delete().eq('id', b.dataset.del); load(); });
  $('cpRows').querySelectorAll('[data-tg]').forEach((b) => b.onclick = async () => { const c = S.coupons.find((x) => x.id === b.dataset.tg); await db.from('store_coupons').update({ active: !c.active }).eq('id', c.id); load(); });
  // Alan adı
  $('domEdge').textContent = S.edge.configured ? '' : t('domEdgeOff');
  $('domList').innerHTML = S.domains.map((d) => `<div class="card"><div class="row"><h2 style="flex:1;margin:0">${esc(d.hostname)}</h2><span class="pill ${d.status === 'active' ? '' : d.status === 'error' ? 'err' : 'warn'}" style="flex:0 0 auto">${esc(t('ds_' + d.status))}</span></div>
    ${d.status !== 'active' ? `<p class="hint" style="margin-top:8px">${esc(t('domRecords'))}</p><table><tr><th>Tür</th><th>Ad</th><th>Değer</th></tr>${(d.records || []).map((r) => `<tr><td>${esc(r.type)}</td><td><code>${esc(r.name)}</code></td><td><code>${esc(r.value)}</code></td></tr>`).join('')}</table>` : `<p class="hint"><a href="https://${esc(d.hostname)}" target="_blank" style="color:#7fd8b5">https://${esc(d.hostname)}</a></p>`}
    ${d.error ? `<p class="msg">${esc(d.error)}</p>` : ''}${d.provider ? `<p class="hint">DNS: ${esc(d.provider)}</p>` : ''}
    <div class="row" style="margin-top:8px">${d.connect_url ? `<a class="btn" href="${esc(d.connect_url)}" target="_blank">${esc(t('domOneClick', { p: d.domain_connect && d.domain_connect.provider_name || '' }))}</a>` : ''}<button class="btn2" data-dc="${d.id}">${esc(t('domCheck'))}</button><button class="btn2" data-dr="${d.id}">${esc(t('domRemove'))}</button></div></div>`).join('');
  $('domList').querySelectorAll('[data-dc]').forEach((b) => b.onclick = async () => { b.disabled = true; await call({ action: 'domain_check', id: b.dataset.dc }); load(); });
  $('domList').querySelectorAll('[data-dr]').forEach((b) => b.onclick = async () => { await call({ action: 'domain_remove', id: b.dataset.dr }); load(); });
  // SEO
  const seo = st.seo || {};
  $('seoT').value = seo.title || ''; $('seoD').value = seo.description || ''; $('seoK').value = seo.keywords || ''; $('seoImg').value = seo.og_image || '';
  const sm = SUPABASE_URL + '/functions/v1/store-checkout?action=sitemap&slug=' + encodeURIComponent(st.slug);
  $('sitemapLink').href = st.custom_domain ? 'https://' + st.custom_domain + '/sitemap.xml' : sm; $('sitemapLink').textContent = $('sitemapLink').href;
  $('redirInfo').textContent = t('redInfo', { n: S.redirects });
}
function renderTheme() {
  const c = theme.colors;
  $('colorRow').innerHTML = COLORS.map((k) => `<div><label class="f">${esc(t('c_' + k))}</label><input type="color" data-c="${k}" value="${esc(c[k])}"></div>`).join('');
  $('colorRow').querySelectorAll('[data-c]').forEach((i) => i.oninput = () => { theme.colors[i.dataset.c] = i.value; preview(); });
  $('thFont').value = theme.font; $('thLayout').value = theme.layout; $('thRadius').value = theme.radius;
  $('thHeroTitle').value = theme.hero?.title || ''; $('thHeroSub').value = theme.hero?.subtitle || ''; $('thAnn').value = theme.announcement || '';
  preview();
}
function readTheme() {
  return { ...theme, font: $('thFont').value, layout: $('thLayout').value, radius: Number($('thRadius').value) || 0, hero: { title: $('thHeroTitle').value, subtitle: $('thHeroSub').value }, announcement: $('thAnn').value };
}
function preview() {
  const th = readTheme(), c = th.colors, ff = { system: "'Segoe UI',Arial,sans-serif", serif: 'Georgia,serif', rounded: "'Nunito','Segoe UI',Arial,sans-serif", mono: 'ui-monospace,Consolas,monospace' }[th.font];
  const btnText = c.accentText || '#fff';
  $('preview').style.cssText = `background:${c.bg};color:${c.text};font-family:${ff};border-radius:${th.radius}px`;
  $('preview').innerHTML = (th.announcement ? `<div style="background:${c.accent};color:${btnText};padding:5px;text-align:center;font-size:12px;margin:-16px -16px 12px;border-radius:${th.radius}px ${th.radius}px 0 0">${esc(th.announcement)}</div>` : '')
    + `<div style="font-size:20px;font-weight:700">${esc(th.hero.title || S.store.name)}</div><div style="color:${c.dim};font-size:13px">${esc(th.hero.subtitle)}</div>`
    + [1, 2, 3].map((i) => `<div class="pc" style="background:${c.panel};border:1px solid ${c.border};border-radius:${th.radius}px"><div style="height:80px;background:${c.panel2};border-radius:${Math.max(0, th.radius - 4)}px"></div><div style="font-size:13px;margin:6px 0">${esc(t('previewProd'))} ${i}</div><div style="font-weight:700">₺${199 + i * 50}</div><div style="background:${c.accent};color:${btnText};border-radius:${th.radius}px;padding:6px;text-align:center;font-size:12px;margin-top:6px">${esc(t('previewBuy'))}</div></div>`).join('');
}
function renderShip() {
  $('shipRows').innerHTML = ship.map((s, i) => `<tr><td><input data-s="${i}" data-k="name" value="${esc(s.name)}"></td><td><input type="number" min="0" step="0.01" data-s="${i}" data-k="price" value="${esc(s.price)}"></td><td><input type="number" min="0" data-s="${i}" data-k="free_over" value="${esc(s.free_over ?? '')}"></td><td><input data-s="${i}" data-k="days" value="${esc(s.days || '')}"></td><td><button class="btn2" data-sx="${i}">✕</button></td></tr>`).join('');
  $('shipRows').querySelectorAll('input').forEach((inp) => inp.oninput = () => { ship[+inp.dataset.s][inp.dataset.k] = inp.value; });
  $('shipRows').querySelectorAll('[data-sx]').forEach((b) => b.onclick = () => { ship.splice(+b.dataset.sx, 1); renderShip(); });
}
async function load() {
  S = await call({ action: 'settings' });
  if (!S.ok) { msg('themeMsg', S.error, false); return; }
  if (!S.store) { $('noStore').classList.remove('hidden'); return; }
  $('app').classList.remove('hidden');
  theme = theme || S.store.theme;
  ship = S.store.shipping_options.map((x) => ({ ...x }));
  render();
}
async function init() {
  try { await HS.init({ auth: true }); } catch (e) {}
  db = HS.db;
  const q = new URLSearchParams(location.search).get('tab');
  if (TABS.includes(q)) tab = q;
  applyStatic();
  ['thFont', 'thLayout', 'thRadius', 'thHeroTitle', 'thHeroSub', 'thAnn'].forEach((id) => $(id).addEventListener('input', preview));
  $('aiBtn').onclick = async () => { $('aiBtn').disabled = true; msg('aiMsg', t('aiWorking')); const r = await call({ action: 'design', prompt: $('aiPrompt').value }); $('aiBtn').disabled = false; if (!r.ok) { msg('aiMsg', r.error, false); return; } theme = r.theme; renderTheme(); render(); msg('aiMsg', t('aiDone') + (r.note ? ' ' + r.note : ''), true); };
  $('saveTheme').onclick = async () => { const r = await call({ action: 'save', theme: readTheme() }); msg('themeMsg', r.ok ? t('saved') : r.error, r.ok); if (r.ok) { theme = r.theme; renderTheme(); } };
  $('shipAdd').onclick = () => { ship.push({ id: 'k' + (ship.length + 1), name: '', price: 0, free_over: null, days: '' }); renderShip(); };
  $('shipSave').onclick = async () => { const r = await call({ action: 'save', shipping_options: ship }); msg('shipMsg', r.ok ? t('saved') : r.error, r.ok); if (r.ok) load(); };
  $('paySave').onclick = async () => {
    const methods = [['mCod', 'cod'], ['mBank', 'bank_transfer'], ['mIyzico', 'iyzico'], ['mPaytr', 'paytr']].filter(([id]) => $(id).checked).map(([, m]) => m);
    const r = await call({ action: 'save', checkout: { methods, iban: $('iban').value, account_name: $('accName').value, cod_fee: Number($('codFee').value) || 0 } });
    msg('payMsg', r.ok ? t('saved') : r.error, r.ok); if (r.ok) load();
  };
  $('provSel').onchange = () => { const p = $('provSel').value; $('keysIyzico').classList.toggle('hidden', p !== 'iyzico'); $('keysPaytr').classList.toggle('hidden', p !== 'paytr'); };
  $('keysSave').onclick = async () => {
    const p = $('provSel').value;
    const keys = p === 'iyzico' ? { api_key: $('kApi').value, secret_key: $('kSecret').value } : { merchant_id: $('kMid').value, merchant_key: $('kMkey').value, merchant_salt: $('kMsalt').value };
    $('keysSave').disabled = true; const r = await call({ action: 'payment_set', provider: p, environment: $('provEnv').value, keys }); $('keysSave').disabled = false;
    msg('keysMsg', r.ok ? t('keysOk') : r.error, r.ok); if (r.ok) { ['kApi', 'kSecret', 'kMid', 'kMkey', 'kMsalt'].forEach((id) => $(id).value = ''); load(); }
  };
  $('cpAdd').onclick = async () => {
    const { data: { session } } = await db.auth.getSession();
    const code = $('cpCode').value.trim().toUpperCase().replace(/\s+/g, '');
    if (!/^[A-Z0-9_-]{3,30}$/.test(code)) { msg('cpMsg', t('cpCode') + ': A-Z 0-9 (3-30)', false); return; }
    const row = { user_id: session.user.id, code, kind: $('cpKind').value, value: Number($('cpValue').value) || 0, min_total: Number($('cpMin').value) || 0, max_uses: Number($('cpMax').value) || null, ends_at: $('cpEnd').value ? new Date($('cpEnd').value + 'T23:59:59').toISOString() : null };
    const { error } = await db.from('store_coupons').insert(row);
    msg('cpMsg', error ? (error.code === '23505' ? 'Bu kod var' : error.message) : t('saved'), !error); if (!error) { $('cpCode').value = ''; load(); }
  };
  $('domAdd').onclick = async () => { $('domAdd').disabled = true; const r = await call({ action: 'domain_add', hostname: $('domIn').value }); $('domAdd').disabled = false; msg('domMsg', r.ok ? (r.note || t('saved')) : r.error, r.ok); if (r.ok) { $('domIn').value = ''; load(); } };
  $('seoSave').onclick = async () => { const r = await call({ action: 'save', seo: { title: $('seoT').value, description: $('seoD').value, keywords: $('seoK').value, og_image: $('seoImg').value } }); msg('seoMsg', r.ok ? t('saved') : r.error, r.ok); };
  await load();
  if (S && S.store && tab === 'migrate') {
    const { data } = await db.from('store_redirects').select('from_path, to_url, hits').order('hits', { ascending: false }).limit(50);
    $('redRows').innerHTML = (data || []).map((r) => `<tr><td><code>${esc(r.from_path)}</code></td><td><code>${esc(r.to_url)}</code></td><td>${r.hits}</td></tr>`).join('');
  }
}
document.addEventListener('hs:langchange', applyStatic);
window.addEventListener('hs:langchange', applyStatic);
init();
</script>
</body>
</html>
