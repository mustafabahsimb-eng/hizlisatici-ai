<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px;
    background: #1D9E75; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .top-row {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 16px; margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; }
  .btn-primary {
    background: #1D9E75; color: #fff; border: none; padding: 11px 18px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-secondary {
    background: transparent; color: #9aa3b2; border: 1px solid #2a3040;
    padding: 11px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .alarm-banner {
    background: #2a1414; border: 1px solid #4a2020; color: #f28b8b;
    border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; font-size: 13px;
  }
  .alarm-summary { cursor: pointer; font-weight: 600; }
  .alarm-detail-item { padding: 8px 0 0; font-weight: 400; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px;
  }
  @media (max-width: 700px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: #1c212c; border-radius: 12px; padding: 16px; border: 1px solid #232838;
  }
  .stat-label { font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #fff; }
  .stat-value.green { color: #5DCAA5; }
  .stat-note { font-size: 11px; color: #7d8596; margin-top: 6px; line-height: 1.4; }
  .product-list {
    background: #141821; border-radius: 14px; border: 1px solid #232838; overflow: hidden;
  }
  .empty-state { padding: 60px 20px; text-align: center; color: #9aa3b2; }
  .empty-state h3 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 500; }
  .empty-state p { font-size: 14px; margin-bottom: 20px; }
  .product-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid #232838; flex-wrap: wrap; gap: 10px;
  }
  .product-row:last-child { border-bottom: none; }
  .product-name { font-size: 14px; font-weight: 500; color: #fff; }
  .product-meta { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
  .channel-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .channel-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: #cfd4de; background: #1c212c;
    border: 1px solid #2a3040; border-radius: 12px; padding: 2px 8px; white-space: nowrap;
  }
  .channel-dot { width: 6px; height: 6px; border-radius: 50%; background: #5a6275; }
  .channel-dot.published { background: #5DCAA5; }
  .channel-dot.error { background: #f28b8b; }
  .channel-chip.none { color: #7d8596; border-style: dashed; }
  .product-profit { font-size: 15px; font-weight: 600; color: #5DCAA5; }
  .product-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .delete-btn {
    background: transparent; border: 1px solid #2a3040; color: #9aa3b2;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .delete-btn:hover { border-color: #f28b8b; color: #f28b8b; background: #2a1414; }
  .bulk-actions-bar {
    display: none; align-items: center; justify-content: space-between;
    background: #1c212c; border: 1px solid #2a3040; border-radius: 10px;
    padding: 10px 16px; margin-bottom: 14px; font-size: 13px; color: #e6e8ee;
  }

  .bulk-actions-bar input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .bulk-delete-controls { display: none; align-items: center; gap: 12px; }
  .btn-danger {
    background: #2a1414; color: #f28b8b; border: 1px solid #4a2020;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;

  .product-checkbox { width: 16px; height: 16px; cursor: pointer; margin-top: 3px; flex-shrink: 0; }
  .score-badge {

  .score-low { background: #2a1414; color: #f28b8b; }

  .price-badge {

  const db = HS.db;
  const t = HS.t;
  const esc = HS.escapeHtml;
  const INTERNATIONAL_PLATFORMS = ['Etsy', 'Amazon (Global)', 'eBay', 'Facebook Marketplace', 'TikTok Shop', 'Shopify', 'WooCommerce', 'Wix'];
  const MARGIN_ALARM_THRESHOLD = 15; // % - bu eşiğin altındaki (ya da negatif) marjlar "tehlikede" sayılır

  let currentProducts = [];
  let listingsByProduct = {};
  let marketplaceNames = {};
  let shippingRates = [];
  let selectedProductIds = new Set();
  let renderToken = 0;

  function go(url) { window.location.href = url; }

  function productCurrency(p) {
    const c = (p.cost_currency || '').trim();
    if (c) return c;
    return INTERNATIONAL_PLATFORMS.includes(p.platform) ? 'USD' : 'TRY';
  }

  function getShippingCost(weightKg) {
    if (!weightKg || !shippingRates || shippingRates.length === 0) return 0;
    const matches = shippingRates
      .filter(r => r.min_weight_kg <= weightKg && r.max_weight_kg >= weightKg)
      .sort((a, b) => a.price - b.price);
    return matches.length > 0 ? matches[0].price : 0;
  }

    const ctx = await HS.init();
    if (!ctx) return;
    document.getElementById('userEmail').textContent = ctx.user.email;
    window.addEventListener('hs:langchange', () => renderAll());
    await loadProducts();
  }

  async function loadProducts() {
    const [prodRes, listRes, mkRes, shipRes] = await Promise.all([
      db.from('products')
        .select('*')
        .eq('user_id', HS.user.id)
        .is('merged_into', null)
        .is('deleted_at', null)
        .order('created_at', { ascending: false }),
      db.from('listings')
        .select('product_id, marketplace_code, status')
        .is('deleted_at', null),
      db.from('marketplaces').select('code, name'),
      db.from('shipping_rates').select('*')
    ]);

    if (prodRes.error) {
      console.error(prodRes.error);
      document.getElementById('productList').innerHTML =
        '<div class="load-error">' + esc(t('dash.loadError', { e: prodRes.error.message })) + '</div>';
      return;
    }

    currentProducts = prodRes.data || [];
    shippingRates = shipRes.data || [];

    marketplaceNames = {};
    (mkRes.data || []).forEach(m => { marketplaceNames[m.code] = m.name; });

    listingsByProduct = {};
    (listRes.data || []).forEach(l => {
      const key = String(l.product_id);
      (listingsByProduct[key] = listingsByProduct[key] || []).push(l);
    });

    const existingIds = new Set(currentProducts.map(p => String(p.id)));
    selectedProductIds = new Set(Array.from(selectedProductIds).filter(id => existingIds.has(id)));

    await renderAll();
  }

  // ============================================================
  // Çizim
  // ============================================================
  function computeRows() {
    return currentProducts.map(p => {
      const supplierPrice = p.supplier_price || 0;
      const salePrice = p.sale_price || 0;
      const commissionRate = p.commission_rate || 0;
      const currency = productCurrency(p);
      let netProfit = null;
      let marginPct = null;
      if (salePrice > 0) {
        const shippingCost = getShippingCost(p.weight_kg);
        const commissionCost = salePrice * (commissionRate / 100);
        netProfit = salePrice - supplierPrice - shippingCost - commissionCost;
        marginPct = (netProfit / salePrice) * 100;
      }
      return { p, netProfit, marginPct, currency };
    });
  }

  async function renderAll() {
    const myToken = ++renderToken;
    const products = currentProducts;

    document.getElementById('totalProducts').textContent = HS.number(products.length);
    document.getElementById('productCountText').textContent =
      products.length === 0 ? t('dash.none') : t('dash.count', { n: HS.number(products.length) });
    document.getElementById('bulkActionsBar').style.display = products.length > 0 ? 'flex' : 'none';

    if (products.length === 0) {
      document.getElementById('alarmBanner').style.display = 'none';
      document.getElementById('avgMargin').textContent = '-';
      document.getElementById('totalProfit').textContent = HS.money(0);
      document.getElementById('totalProfitNote').textContent = '';
      document.getElementById('productList').innerHTML =
        '<div class="empty-state">' +
          '<h3>' + esc(t('dash.emptyTitle')) + '</h3>' +
          '<p>' + esc(t('dash.emptyText')) + '</p>' +
          '<button class="btn-primary" onclick="go(\'add-product.html\')">' + esc(t('menu.add')) + '</button>' +
        '</div>';
      return;
    }

    const rows = computeRows();

    // Ortalama marj
    const margins = rows.filter(r => r.marginPct !== null).map(r => r.marginPct);
    document.getElementById('avgMargin').textContent =
      margins.length ? HS.percent(margins.reduce((a, b) => a + b, 0) / margins.length) : '-';

    // Marj alarmı
    renderAlarm(rows);

    // Ürün listesi
    renderList(rows);
    updateBulkBar();

    // Toplam kâr: para birimine göre topla, sonra senin para birimine çevir
    const sums = {};
    rows.forEach(r => {
      if (r.netProfit === null) return;
      sums[r.currency] = (sums[r.currency] || 0) + r.netProfit;
    });
    const parts = Object.keys(sums).map(c => HS.money(sums[c], c)).join(' + ') || HS.money(0);
    const home = HS.homeCurrency();

    let total = 0;
    let missing = false;
    for (const c of Object.keys(sums)) {
      const v = await HS.convert(sums[c], c, home);
      if (v === null) { missing = true; break; }
      total += v;
    }
    if (myToken !== renderToken) return; // bu arada dil değiştiyse eski çizimi bırak

    const profitEl = document.getElementById('totalProfit');
    const noteEl = document.getElementById('totalProfitNote');
    if (missing) {
      profitEl.textContent = parts;
      noteEl.textContent = t('dash.profitNoRate', { parts: parts });
    } else {
      profitEl.textContent = HS.money(total, home);
      noteEl.textContent = Object.keys(sums).length > 1 || Object.keys(sums)[0] !== home
        ? t('dash.profitNote', { cur: home, parts: parts })
        : '';
    }
  }

  function renderAlarm(rows) {
    const risky = rows.filter(r => r.marginPct !== null && r.marginPct < MARGIN_ALARM_THRESHOLD);
    const banner = document.getElementById('alarmBanner');
    if (risky.length === 0) {
      banner.style.display = 'none';
      return;
    }
    banner.style.display = 'block';
    document.getElementById('alarmSummary').textContent = t('dash.alarm', { n: risky.length });
    document.getElementById('alarmDetail').innerHTML = risky.map(r => {
      const marginText = r.marginPct < 0 ? t('dash.alarmLoss') : t('dash.margin', { p: HS.percent(r.marginPct) });
      return '<div class="alarm-detail-item">' + esc(r.p.name || t('dash.unnamed')) + ' — ' +
             esc(marginText) + ' (' + esc(HS.money(r.netProfit, r.currency)) + ')</div>';
    }).join('');
  }

  function channelChips(p) {
    const list = listingsByProduct[String(p.id)] || [];
    if (list.length === 0) {
      return '<span class="channel-chip none">' + esc(t('dash.noListing')) + '</span>';
    }
    return list.map(l => {
      const name = l.marketplace_code === 'own_store'
        ? t('ch.own')
        : (marketplaceNames[l.marketplace_code] || l.marketplace_code);
      const dotClass = l.status === 'published' ? 'published' : (l.status === 'error' ? 'error' : '');
      return '<span class="channel-chip" title="' + esc(t('st.' + l.status)) + '">' +
             '<span class="channel-dot ' + dotClass + '"></span>' + esc(name) + '</span>';
    }).join('');
  }

  function renderList(rows) {
    const listEl = document.getElementById('productList');
    listEl.innerHTML = rows.map(({ p, netProfit, marginPct, currency }) => {
      const id = esc(String(p.id));

      const scoreHtml = p.winning_score != null
        ? `<span class="score-badge ${scoreLevelClass(p.winning_score)}" onclick="showScoreDetail('${id}')" title="${esc(t('score.detail'))}">🏆 ${p.winning_score}/100</span>
           <button class="icon-btn-mini" title="${esc(t('score.refresh'))}" onclick="calculateWinningScore('${id}', this)">🔄</button>`
        : `<button class="btn-secondary score-calc-btn" onclick="calculateWinningScore('${id}', this)">${esc(t('score.calc'))}</button>`;

      const priceHtml = p.suggested_price != null
        ? `<span class="price-badge" onclick="showPriceSuggestion('${id}')" title="${esc(t('score.detail'))}">💡 ${esc(HS.money(p.suggested_price, currency))}</span>
           <button class="icon-btn-mini" title="${esc(t('price.refresh'))}" onclick="calculatePriceSuggestion('${id}', this)">🔄</button>`
        : `<button class="btn-secondary price-calc-btn" onclick="calculatePriceSuggestion('${id}', this)">${esc(t('price.suggest'))}</button>`;

      const stockHtml = (p.stock_status && p.stock_status !== 'bilinmiyor')
        ? `<span class="stock-badge ${stockClass(p.stock_status)}" onclick="showMonitorNote('${id}')" title="${esc(t('score.detail'))}">${esc(stockLabel(p))}</span>`
        : '';

      const autoPriceHtml = p.supplier === 'cj'
        ? `<label class="auto-price-label" title="${esc(t('auto.title'))}"><input type="checkbox" ${p.auto_price ? 'checked' : ''} onchange="toggleAutoPrice('${id}', this)"> ${esc(t('auto.label'))}</label>`
        : '';

      const profitHtml = netProfit !== null
        ? esc(HS.money(netProfit, currency))
        : `<span style="color:#9aa3b2; font-weight:400; font-size:12px;">${esc(t('dash.noSalePrice'))}</span>`;

      return `
      <div class="product-row" data-id="${id}">
        <div style="display:flex; align-items:flex-start; gap:12px;">
          <input type="checkbox" class="product-checkbox" data-id="${id}" ${selectedProductIds.has(String(p.id)) ? 'checked' : ''} onchange="toggleProductSelect('${id}', this)">
          <div>
            <div class="product-name">${esc(p.name || t('dash.unnamed'))}</div>
            ${marginPct !== null ? `<div class="product-meta">${esc(t('dash.margin', { p: HS.percent(marginPct) }))}</div>` : ''}
            <div class="channel-row">${channelChips(p)}</div>
          </div>
        </div>
        <div class="product-right">
          ${stockHtml}
          ${autoPriceHtml}
          ${scoreHtml}
          ${priceHtml}
          <div class="product-profit" style="${netProfit !== null && netProfit < 0 ? 'color:#f28b8b;' : ''}">${profitHtml}</div>
          <button class="delete-btn" title="${esc(t('dash.deleteTitle'))}" onclick="deleteProduct('${id}')">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  // ============================================================
  // Seçim ve silme
  // ============================================================
  function toggleProductSelect(id, checkbox) {
    const key = String(id);
    if (checkbox.checked) selectedProductIds.add(key);
    else selectedProductIds.delete(key);
    updateBulkBar();
  }

  function toggleSelectAll(checkbox) {
    selectedProductIds = new Set();
    if (checkbox.checked) currentProducts.forEach(p => selectedProductIds.add(String(p.id)));
    document.querySelectorAll('.product-checkbox').forEach(cb => { cb.checked = checkbox.checked; });
    updateBulkBar();
  }

  function updateBulkBar() {
    const controls = document.getElementById('bulkDeleteControls');
    const countText = document.getElementById('selectedCountText');
    const selectAllCb = document.getElementById('selectAllCheckbox');
    if (selectedProductIds.size > 0) {
      controls.style.display = 'flex';
      countText.textContent = t('dash.selected', { n: selectedProductIds.size });
    } else {
      controls.style.display = 'none';
    }
    if (selectAllCb) {
      selectAllCb.checked = currentProducts.length > 0 && selectedProductIds.size === currentProducts.length;
    }
  }

  async function bulkDeleteProducts() {
    const ids = Array.from(selectedProductIds);
    if (ids.length === 0) return;
    if (!confirm(t('dash.confirmBulk', { n: ids.length }))) return;
    const { error } = await db.from('products').delete().in('id', ids);
    if (error) {
      alert(t('dash.deleteFail', { e: error.message }));
      return;
    }
    selectedProductIds = new Set();
    loadProducts();
  }

  async function deleteProduct(productId) {
    if (!confirm(t('dash.confirmOne'))) return;
    const { error } = await db.from('products').delete().eq('id', productId);
    if (error) {
      alert(t('dash.deleteFail', { e: error.message }));
      return;
    }
    loadProducts();
  }

  function toggleAlarmDetail() {
    const detail = document.getElementById('alarmDetail');
    detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
  }

  // ============================================================
  // Kazanan Ürün Skoru
  // ============================================================
  function scoreLevelClass(score) {
    if (score >= 70) return 'score-high';
    if (score >= 40) return 'score-mid';
    return 'score-low';
  }

  async function callFunction(name, body) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error('Session');
    const response = await fetch(HS.SUPABASE_URL + '/functions/v1/' + name, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + HS.SUPABASE_KEY,
        'apikey': HS.SUPABASE_KEY,
      },
      body: JSON.stringify(Object.assign({}, body, { userAccessToken: session.access_token })),
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  async function calculateWinningScore(productId, btn) {
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      await callFunction('winning-score', { productId });
      loadProducts();
    } catch (err) {
      alert(t('score.fail', { e: err.message }));
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  function showScoreDetail(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p || !p.winning_score_data) return;
    const m = p.winning_score_data.modules;
    const lines = [
      t('score.title', { n: p.winning_score_data.overall }),
      '',
      t('score.price') + ': ' + m.price.score + '/100 - ' + m.price.note,
      t('score.review') + ': ' + m.review.score + '/100 - ' + m.review.note,
      t('score.shipping') + ': ' + m.shipping.score + '/100 - ' + m.shipping.note,
      t('score.keyword') + ': ' + m.keyword.score + '/100 - ' + m.keyword.note,
      t('score.ad') + ': ' + m.ad.score + '/100 - ' + m.ad.note,
      t('score.margin') + ': ' + m.margin.score + '/100 - ' + m.margin.note,
    ];
    alert(lines.join('\n'));
  }

  // ============================================================
  // Fiyat önerisi
  // ============================================================
  async function calculatePriceSuggestion(productId, btn) {
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      await callFunction('price-optimize', { productId });
      loadProducts();
    } catch (err) {
      alert(t('price.fail', { e: err.message }));
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  function showPriceSuggestion(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p || !p.suggested_price_reasoning) return;
    let data;
    try { data = JSON.parse(p.suggested_price_reasoning); } catch { return; }
    const cur = productCurrency(p);
    const lines = [
      t('price.suggested', { v: HS.money(p.suggested_price, cur) }),
      data.currentPrice != null ? t('price.current', { v: HS.money(data.currentPrice, cur) }) : t('price.currentNone'),
      '',
      data.competitorRangeNote ? t('price.competitor', { v: data.competitorRangeNote }) : '',
      data.reasoning ? t('price.reason', { v: data.reasoning }) : '',
      '',
      data.currentMarginPct != null ? t('price.curMargin', { v: HS.percent(data.currentMarginPct) }) : '',
      data.projectedMarginPct != null ? t('price.newMargin', { v: HS.percent(data.projectedMarginPct) }) : '',
    ].filter(line => line !== '');
    if (confirm(lines.join('\n') + '\n\n' + t('price.apply'))) {
      applySuggestedPrice(productId, p.suggested_price);
    }
  }

  async function applySuggestedPrice(productId, price) {
    const { error } = await db.from('products').update({ sale_price: price }).eq('id', productId);
    if (error) {
      alert(t('price.applyFail', { e: error.message }));
      return;
    }
    loadProducts();
  }

  // ============================================================
  // Stok ve fiyat takibi
  // ============================================================
  function stockClass(status) {
    if (status === 'tukendi') return 'stock-out';
    if (status === 'az') return 'stock-low';
    return 'stock-ok';
  }

  function stockLabel(p) {
    const qty = p.stock_qty != null ? ' (' + HS.number(p.stock_qty) + ')' : '';
    if (p.stock_status === 'tukendi') return t('stock.out');
    if (p.stock_status === 'az') return t('stock.low') + qty;
    return t('stock.ok') + qty;
  }

  function showMonitorNote(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p) return;
    const status = (p.stock_status || t('stock.unknown')) +
      (p.stock_qty != null ? ' (' + t('stock.pieces', { n: HS.number(p.stock_qty) }) + ')' : '');
    const lines = [
      t('stock.status', { v: status }),
      p.supplier_cost != null ? t('stock.cost', { v: HS.money(p.supplier_cost, 'USD') }) : '',
      p.last_checked_at ? t('stock.lastCheck', { v: HS.date(p.last_checked_at, true) }) : '',
      p.monitor_note ? t('stock.note', { v: p.monitor_note }) : '',
    ].filter(line => line !== '');
    alert(lines.join('\n'));
  }

  async function toggleAutoPrice(productId, checkbox) {
    const { error } = await db.from('products').update({ auto_price: checkbox.checked }).eq('id', productId);
    if (error) {
      alert(t('auto.fail', { e: error.message }));
      checkbox.checked = !checkbox.checked;
      return;
    }
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (p) p.auto_price = checkbox.checked;
  }

  async function runStockPriceMonitor(btn) {
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = t('mon.running');
    try {
      const data = await callFunction('stock-price-monitor', {});
      if (!data.checked) {
        alert(data.message || t('mon.none'));
      } else {
        const results = data.results || [];
        const changed = results.filter(r => r.note && r.note !== 'Değişiklik yok');
        const errors = results.filter(r => r.error);
        const lines = [t('mon.checked', { n: data.checked })];
        if (changed.length > 0) {
          lines.push('', t('mon.changed'));
          changed.forEach(r => lines.push('• ' + (r.name || t('mon.product')) + ': ' + r.note));
        } else {
          lines.push(t('mon.nochange'));
        }
        if (errors.length > 0) {
          lines.push('', t('mon.errors'));
          errors.forEach(r => lines.push('• ' + (r.name || t('mon.product')) + ': ' + r.error));
        }
        const raw = results.filter(r => r.stockRaw);
        if (raw.length > 0) {
          lines.push('', t('mon.raw'), raw[0].stockRaw);
        }
        alert(lines.join('\n'));
      }
      loadProducts();
    } catch (err) {
      alert(t('mon.fail', { e: err.message }));
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  init();
</script>
</body>
</html>
