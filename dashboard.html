<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #1D9E75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #9aa3b2;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .top-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; }
  .btn-primary {
    background: #1D9E75;
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-secondary {
    background: transparent;
    color: #9aa3b2;
    border: 1px solid #2a3040;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }
  .alarm-banner {
    background: #2a1414;
    border: 1px solid #4a2020;
    color: #f28b8b;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .alarm-summary { cursor: pointer; font-weight: 600; }
  .alarm-detail-item { padding: 8px 0 0; font-weight: 400; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #1c212c;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #232838;
  }
  .stat-label { font-size: 12px; color: #9aa3b2; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #fff; }
  .stat-value.green { color: #5DCAA5; }
  .product-list {
    background: #141821;
    border-radius: 14px;
    border: 1px solid #232838;
    overflow: hidden;
  }
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: #9aa3b2;
  }
  .empty-state h3 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 500; }
  .empty-state p { font-size: 14px; margin-bottom: 20px; }
  .product-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #232838;
    flex-wrap: wrap;
    gap: 10px;
  }
  .product-row:last-child { border-bottom: none; }
  .product-name { font-size: 14px; font-weight: 500; color: #fff; }
  .product-meta { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
  .product-profit { font-size: 15px; font-weight: 600; color: #5DCAA5; }
  .product-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .delete-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #9aa3b2;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .delete-btn:hover { border-color: #f28b8b; color: #f28b8b; background: #2a1414; }
  .bulk-actions-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: #1c212c;
    border: 1px solid #2a3040;
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 14px;
    font-size: 13px;
    color: #e6e8ee;
  }
  .bulk-actions-bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .bulk-actions-bar input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .bulk-delete-controls { display: none; align-items: center; gap: 12px; }
  .btn-danger {
    background: #2a1414;
    color: #f28b8b;
    border: 1px solid #4a2020;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-danger:hover { background: #3a1a1a; }
  .product-checkbox { width: 16px; height: 16px; cursor: pointer; margin-top: 3px; flex-shrink: 0; }
  .score-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .score-high { background: #123222; color: #6ee7b7; }
  .score-mid { background: #2a2410; color: #e6c96a; }
  .score-low { background: #2a1414; color: #f28b8b; }
  .score-calc-btn { font-size: 12px; padding: 7px 12px; }
  .price-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    background: #241a3d;
    color: #c9a8f5;
  }
  .price-calc-btn { font-size: 12px; padding: 7px 12px; }
  .icon-btn-mini {
    background: transparent;
    border: 1px solid #2a3040;
    color: #9aa3b2;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn-mini:hover { border-color: #3a4258; color: #fff; }
  .stock-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .stock-ok { background: #123222; color: #6ee7b7; }
  .stock-low { background: #2a2410; color: #e6c96a; }
  .stock-out { background: #2a1414; color: #f28b8b; }
  .auto-price-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #9aa3b2;
    cursor: pointer;
    white-space: nowrap;
  }
  .auto-price-label input { width: 14px; height: 14px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>
<main>
  <div class="top-row">
    <div>
      <h1>Ürünlerin</h1>
      <div class="subtitle" id="productCountText">Yükleniyor...</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-secondary" onclick="window.location.href='chat.html'">💬 Sohbetle Yönet</button>
      <button class="btn-secondary" onclick="window.location.href='orders.html'">📦 Siparişler</button>
      <button class="btn-secondary" onclick="window.location.href='accounts.html'">🔑 Hesaplarım</button>
      <button class="btn-secondary" onclick="window.location.href='report.html'">📊 Kâr-Zarar Raporu</button>
      <button class="btn-secondary" onclick="window.location.href='trends.html'">🔥 Trend ürünler</button>
      <button class="btn-secondary" onclick="window.location.href='briefing.html'">📅 Haftalık Brifing</button>
      <button class="btn-secondary" onclick="window.location.href='store-builder.html'">🧭 Mağazanı Kur</button>
      <button class="btn-secondary" onclick="window.location.href='store-xray.html'">🔍 Mağaza X-Ray</button>
      <button class="btn-secondary" onclick="window.location.href='trend-calendar.html'">📅 Trend Takvimi</button>
      <button class="btn-secondary" onclick="window.location.href='marka-ayarlari.html'">🏷️ Marka Ayarları</button>
      <button class="btn-secondary" onclick="window.location.href='gorsel-studyosu.html'">🎨 Görsel Stüdyosu</button>
      <button class="btn-secondary" onclick="window.location.href='pod.html'">Print on Demand</button>
      <button class="btn-secondary" id="monitorBtn" onclick="runStockPriceMonitor(this)">📡 Stok ve Fiyat Takibi</button>
      <button class="btn-primary" onclick="window.location.href='add-product.html'">+ Yeni ürün ekle</button>
    </div>
  </div>
  <div class="alarm-banner" id="alarmBanner" style="display:none;">
    <div class="alarm-summary" id="alarmSummary" onclick="toggleAlarmDetail()"></div>
    <div id="alarmDetail" style="display:none;"></div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Toplam ürün</div>
      <div class="stat-value" id="totalProducts">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ortalama kâr marjı</div>
      <div class="stat-value green" id="avgMargin">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Toplam potansiyel kâr</div>
      <div class="stat-value green" id="totalProfit">₺0</div>
    </div>
  </div>
  <div class="bulk-actions-bar" id="bulkActionsBar">
    <label>
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
      <span>Tümünü seç</span>
    </label>
    <div class="bulk-delete-controls" id="bulkDeleteControls">
      <span id="selectedCountText"></span>
      <button class="btn-danger" onclick="bulkDeleteProducts()">🗑 Seçilenleri sil</button>
    </div>
  </div>
  <div class="product-list" id="productList">
    <div class="empty-state">
      <h3>Henüz ürün eklemedin</h3>
      <p>İlk ürününü ekleyerek AI ile içerik üretmeye ve kâr hesaplamaya başla.</p>
      <button class="btn-primary" onclick="window.location.href='add-product.html'">+ Yeni ürün ekle</button>
    </div>
  </div>
</main>
<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const INTERNATIONAL_PLATFORMS = ['Etsy', 'Amazon (Global)', 'eBay', 'Facebook Marketplace', 'TikTok Shop', 'Shopify', 'WooCommerce', 'Wix'];
  const MARGIN_ALARM_THRESHOLD = 15; // % - bu eşiğin altındaki (ya da negatif) marjlar "tehlikede" sayılır
  function currencySymbolFor(platform) {
    return INTERNATIONAL_PLATFORMS.includes(platform) ? '$' : '₺';
  }
  let currentProducts = [];
  let selectedProductIds = new Set();
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('userEmail').textContent = session.user.email;
    loadProducts(session.user.id);
  }
  async function loadProducts(userId) {
    const { data: products, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });
    if (error) {
      console.error(error);
      return;
    }
    currentProducts = products;
    // Silinmiş/artık listede olmayan ürünlerin seçimini temizle
    const existingIds = new Set(products.map(p => String(p.id)));
    selectedProductIds = new Set(Array.from(selectedProductIds).filter(id => existingIds.has(id)));
    document.getElementById('totalProducts').textContent = products.length;
    document.getElementById('productCountText').textContent =
      products.length === 0 ? 'Henüz ürün yok' : products.length + ' ürün listeleniyor';
    document.getElementById('bulkActionsBar').style.display = products.length > 0 ? 'flex' : 'none';
    if (products.length === 0) {
      document.getElementById('alarmBanner').style.display = 'none';
      return;
    }
    const { data: shippingRates } = await supabaseClient
      .from('shipping_rates')
      .select('*');
    function getShippingCost(weightKg) {
      if (!weightKg || !shippingRates || shippingRates.length === 0) return 0;
      const matches = shippingRates
        .filter(r => r.min_weight_kg <= weightKg && r.max_weight_kg >= weightKg)
        .sort((a, b) => a.price - b.price);
      return matches.length > 0 ? matches[0].price : 0;
    }
    let tryProfit = 0;
    let usdProfit = 0;
    let marginSum = 0;
    let marginCount = 0;
    const computed = products.map(p => {
      const supplierPrice = p.supplier_price || 0;
      const salePrice = p.sale_price || 0;
      const commissionRate = p.commission_rate || 0;
      const symbol = currencySymbolFor(p.platform);
      let netProfit = null;
      let marginPct = null;
      if (salePrice > 0) {
        const shippingCost = getShippingCost(p.weight_kg);
        const commissionCost = salePrice * (commissionRate / 100);
        netProfit = salePrice - supplierPrice - shippingCost - commissionCost;
        marginPct = (netProfit / salePrice) * 100;
        if (symbol === '$') {
          usdProfit += netProfit;
        } else {
          tryProfit += netProfit;
        }
        marginSum += marginPct;
        marginCount++;
      }
      return { p, netProfit, marginPct, symbol };
    });
    document.getElementById('totalProfit').textContent =
      usdProfit !== 0 ? '₺' + tryProfit.toFixed(2) + ' + $' + usdProfit.toFixed(2) : '₺' + tryProfit.toFixed(2);
    document.getElementById('avgMargin').textContent =
      marginCount > 0 ? (marginSum / marginCount).toFixed(1) + '%' : '-';
    // Sessiz Alarm: marjı eşiğin altında ya da zararda olan ürünleri tespit et
    const riskyProducts = computed.filter(({ marginPct }) => marginPct !== null && marginPct < MARGIN_ALARM_THRESHOLD);
    const alarmBanner = document.getElementById('alarmBanner');
    const alarmSummary = document.getElementById('alarmSummary');
    const alarmDetail = document.getElementById('alarmDetail');
    if (riskyProducts.length > 0) {
      alarmBanner.style.display = 'block';
      alarmSummary.textContent = '⚠️ ' + riskyProducts.length + ' üründe marj tehlikede (detay için tıkla)';
      alarmDetail.innerHTML = riskyProducts.map(({ p, netProfit, marginPct, symbol }) => {
        const marginText = marginPct < 0 ? 'zararda' : '%' + marginPct.toFixed(1) + ' marj';
        return '<div class="alarm-detail-item">' + escapeHtml(p.name || 'İsimsiz ürün') + ' — ' + marginText + ' (' + symbol + netProfit.toFixed(2) + ')</div>';
      }).join('');
    } else {
      alarmBanner.style.display = 'none';
    }
    const listEl = document.getElementById('productList');
    listEl.innerHTML = computed.map(({ p, netProfit, marginPct, symbol }) => {
      const scoreHtml = p.winning_score != null
        ? `<span class="score-badge ${scoreLevelClass(p.winning_score)}" onclick="showScoreDetail('${p.id}')" title="Detay için tıkla">🏆 ${p.winning_score}/100</span>
           <button class="icon-btn-mini" title="Skoru yenile" onclick="calculateWinningScore('${p.id}', this)">🔄</button>`
        : `<button class="btn-secondary score-calc-btn" onclick="calculateWinningScore('${p.id}', this)">🏆 Skor Hesapla</button>`;
      const priceHtml = p.suggested_price != null
        ? `<span class="price-badge" onclick="showPriceSuggestion('${p.id}')" title="Detay için tıkla">💡 ${symbol}${Number(p.suggested_price).toFixed(2)}</span>
           <button class="icon-btn-mini" title="Fiyatı yenile" onclick="calculatePriceSuggestion('${p.id}', this)">🔄</button>`
        : `<button class="btn-secondary price-calc-btn" onclick="calculatePriceSuggestion('${p.id}', this)">💡 Fiyat Öner</button>`;
      const stockHtml = (p.stock_status && p.stock_status !== 'bilinmiyor')
        ? `<span class="stock-badge ${stockClass(p.stock_status)}" onclick="showMonitorNote('${p.id}')" title="Detay için tıkla">${stockLabel(p)}</span>`
        : '';
      const autoPriceHtml = p.supplier === 'cj'
        ? `<label class="auto-price-label" title="Tedarikçi maliyeti değişince satış fiyatı aynı oranda otomatik güncellenir"><input type="checkbox" ${p.auto_price ? 'checked' : ''} onchange="toggleAutoPrice('${p.id}', this)"> Otomatik fiyat</label>`
        : '';
      return `
      <div class="product-row" data-id="${p.id}">
        <div style="display:flex; align-items:flex-start; gap:12px;">
          <input type="checkbox" class="product-checkbox" data-id="${p.id}" ${selectedProductIds.has(String(p.id)) ? 'checked' : ''} onchange="toggleProductSelect('${p.id}', this)">
          <div>
            <div class="product-name">${escapeHtml(p.name || 'İsimsiz ürün')}</div>
            <div class="product-meta">${escapeHtml(p.platform || '-')}${marginPct !== null ? ' · %' + marginPct.toFixed(1) + ' marj' : ''}</div>
          </div>
        </div>
        <div class="product-right">
          ${stockHtml}
          ${autoPriceHtml}
          ${scoreHtml}
          ${priceHtml}
          <div class="product-profit" style="${netProfit !== null && netProfit < 0 ? 'color:#f28b8b;' : ''}">
            ${netProfit !== null ? symbol + netProfit.toFixed(2) : '<span style="color:#9aa3b2; font-weight:400; font-size:12px;">satış fiyatı girilmemiş</span>'}
          </div>
          <button class="delete-btn" title="Ürünü sil" onclick="deleteProduct('${p.id}')">🗑</button>
        </div>
      </div>
    `;
    }).join('');
    updateBulkBar();
  }
  function toggleProductSelect(id, checkbox) {
    const key = String(id);
    if (checkbox.checked) {
      selectedProductIds.add(key);
    } else {
      selectedProductIds.delete(key);
    }
    updateBulkBar();
  }
  function toggleSelectAll(checkbox) {
    selectedProductIds = new Set();
    if (checkbox.checked) {
      currentProducts.forEach(p => selectedProductIds.add(String(p.id)));
    }
    document.querySelectorAll('.product-checkbox').forEach(cb => { cb.checked = checkbox.checked; });
    updateBulkBar();
  }
  function updateBulkBar() {
    const controls = document.getElementById('bulkDeleteControls');
    const countText = document.getElementById('selectedCountText');
    const selectAllCb = document.getElementById('selectAllCheckbox');
    if (selectedProductIds.size > 0) {
      controls.style.display = 'flex';
      countText.textContent = selectedProductIds.size + ' ürün seçildi';
    } else {
      controls.style.display = 'none';
    }
    if (selectAllCb) {
      selectAllCb.checked = currentProducts.length > 0 && selectedProductIds.size === currentProducts.length;
    }
  }
  async function bulkDeleteProducts() {
    const ids = Array.from(selectedProductIds);
    if (ids.length === 0) return;
    if (!confirm(ids.length + ' ürünü silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const { error } = await supabaseClient
      .from('products')
      .delete()
      .in('id', ids);
    if (error) {
      alert('Silinemedi: ' + error.message);
      return;
    }
    selectedProductIds = new Set();
    loadProducts(session.user.id);
  }
  function toggleAlarmDetail() {
    const detail = document.getElementById('alarmDetail');
    detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
  }
  function scoreLevelClass(score) {
    if (score >= 70) return 'score-high';
    if (score >= 40) return 'score-mid';
    return 'score-low';
  }
  async function calculateWinningScore(productId, btn) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/winning-score', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ productId, userAccessToken: session.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      loadProducts(session.user.id);
    } catch (err) {
      alert('Skor hesaplanamadı: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }
  function showScoreDetail(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p || !p.winning_score_data) return;
    const m = p.winning_score_data.modules;
    const lines = [
      'Kazanan Ürün Skoru: ' + p.winning_score_data.overall + '/100',
      '',
      '💰 Fiyat rekabetçiliği: ' + m.price.score + '/100 - ' + m.price.note,
      '⭐ Yorum potansiyeli: ' + m.review.score + '/100 - ' + m.review.note,
      '📦 Kargo uygunluğu: ' + m.shipping.score + '/100 - ' + m.shipping.note,
      '🔍 Anahtar kelime talebi: ' + m.keyword.score + '/100 - ' + m.keyword.note,
      '📣 Reklam/Wow potansiyeli: ' + m.ad.score + '/100 - ' + m.ad.note,
      '📊 Kâr marjı: ' + m.margin.score + '/100 - ' + m.margin.note,
    ];
    alert(lines.join('\n'));
  }
  async function calculatePriceSuggestion(productId, btn) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/price-optimize', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ productId, userAccessToken: session.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      loadProducts(session.user.id);
    } catch (err) {
      alert('Fiyat önerisi hesaplanamadı: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }
  function showPriceSuggestion(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p || !p.suggested_price_reasoning) return;
    let data;
    try {
      data = JSON.parse(p.suggested_price_reasoning);
    } catch {
      return;
    }
    const symbol = currencySymbolFor(p.platform);
    const lines = [
      'Önerilen satış fiyatı: ' + symbol + Number(p.suggested_price).toFixed(2),
      data.currentPrice != null ? 'Mevcut fiyat: ' + symbol + Number(data.currentPrice).toFixed(2) : 'Mevcut fiyat: girilmemiş',
      '',
      data.competitorRangeNote ? '🔍 Rakip fiyat notu: ' + data.competitorRangeNote : '',
      data.reasoning ? '💡 Gerekçe: ' + data.reasoning : '',
      '',
      data.currentMarginPct != null ? 'Mevcut marj: %' + data.currentMarginPct.toFixed(1) : '',
      data.projectedMarginPct != null ? 'Önerilen fiyatla marj: %' + data.projectedMarginPct.toFixed(1) : '',
    ].filter(line => line !== '');
    const wantsApply = confirm(lines.join('\n') + '\n\nBu fiyatı ürüne uygulamak ister misin?');
    if (wantsApply) {
      applySuggestedPrice(productId, p.suggested_price);
    }
  }
  async function applySuggestedPrice(productId, price) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const { error } = await supabaseClient
      .from('products')
      .update({ sale_price: price })
      .eq('id', productId);
    if (error) {
      alert('Fiyat uygulanamadı: ' + error.message);
      return;
    }
    loadProducts(session.user.id);
  }
  function stockClass(status) {
    if (status === 'tukendi') return 'stock-out';
    if (status === 'az') return 'stock-low';
    return 'stock-ok';
  }
  function stockLabel(p) {
    const qty = p.stock_qty != null ? ' (' + p.stock_qty + ')' : '';
    if (p.stock_status === 'tukendi') return '📦 Stok bitti';
    if (p.stock_status === 'az') return '📦 Stok az' + qty;
    return '📦 Stokta' + qty;
  }
  function showMonitorNote(productId) {
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (!p) return;
    const lines = [
      'Stok durumu: ' + (p.stock_status || 'bilinmiyor') + (p.stock_qty != null ? ' (' + p.stock_qty + ' adet)' : ''),
      p.supplier_cost != null ? 'Tedarikçi maliyeti (güncel): $' + Number(p.supplier_cost).toFixed(2) : '',
      p.last_checked_at ? 'Son kontrol: ' + new Date(p.last_checked_at).toLocaleString('tr-TR') : '',
      p.monitor_note ? 'Not: ' + p.monitor_note : '',
    ].filter(line => line !== '');
    alert(lines.join('\n'));
  }
  async function toggleAutoPrice(productId, checkbox) {
    const { error } = await supabaseClient
      .from('products')
      .update({ auto_price: checkbox.checked })
      .eq('id', productId);
    if (error) {
      alert('Ayar kaydedilemedi: ' + error.message);
      checkbox.checked = !checkbox.checked;
      return;
    }
    const p = currentProducts.find(x => String(x.id) === String(productId));
    if (p) p.auto_price = checkbox.checked;
  }
  async function runStockPriceMonitor(btn) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/stock-price-monitor', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ userAccessToken: session.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      if (!data.checked) {
        alert(data.message || 'Kontrol edilecek CJ ürünü yok.');
      } else {
        const changed = (data.results || []).filter(r => r.note && r.note !== 'Değişiklik yok');
        const errors = (data.results || []).filter(r => r.error);
        const lines = [data.checked + ' ürün kontrol edildi.'];
        if (changed.length > 0) {
          lines.push('', 'Değişenler:');
          changed.forEach(r => lines.push('• ' + (r.name || 'Ürün') + ': ' + r.note));
        } else {
          lines.push('Değişiklik yok.');
        }
        if (errors.length > 0) {
          lines.push('', 'Hatalar:');
          errors.forEach(r => lines.push('• ' + (r.name || 'Ürün') + ': ' + r.error));
        }
        const raw = (data.results || []).filter(r => r.stockRaw);
        if (raw.length > 0) {
          lines.push('', 'Stok okunamadı (CJ cevabı):', raw[0].stockRaw);
        }
        alert(lines.join('\n'));
      }
      loadProducts(session.user.id);
    } catch (err) {
      alert('Kontrol yapılamadı: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }
  async function deleteProduct(productId) {
    if (!confirm('Bu ürünü silmek istediğine emin misin?')) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const { error } = await supabaseClient
      .from('products')
      .delete()
      .eq('id', productId);
    if (error) {
      alert('Silinemedi: ' + error.message);
      return;
    }
    loadProducts(session.user.id);
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }
  init();
</script>
</body>
</html>
