<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Takvimi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    padding: 20px; border-bottom: 1px solid #232838; background: #141821;
    display: flex; align-items: center; gap: 12px;
  }
  header a { color: #9aa3b2; text-decoration: none; font-size: 14px; }
  header a:hover { color: #fff; }
  header h1 { font-size: 18px; font-weight: 700; color: #fff; flex: 1; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
  .intro { color: #9aa3b2; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  select {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #232838;
    background: #141821; color: #e6e8ee; font-size: 14px; margin-bottom: 16px;
  }
  select:focus { outline: none; border-color: #1D9E75; }
  .analyze-btn {
    width: 100%; background: #1D9E75; color: #fff; border: none; padding: 13px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 24px;
  }
  .analyze-btn:hover { background: #178a65; }
  .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .loading { text-align: center; color: #9aa3b2; padding: 30px; font-size: 14px; }
  .error-box {
    background: #2a1620; border: 1px solid #4a2030; color: #f28b8b;
    padding: 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  .result-section { background: #141821; border: 1px solid #232838; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .result-section h3 { font-size: 13px; color: #5DCAA5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .result-section p { font-size: 14px; line-height: 1.6; color: #e6e8ee; white-space: pre-wrap; }
  .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .month-cell { padding: 10px 6px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: 600; }
  .month-low { background: #1c212c; color: #6b7280; }
  .month-mid { background: #2a2410; color: #e6c96a; }
  .month-high { background: #123222; color: #6ee7b7; }
  .legend { display: flex; gap: 12px; margin-top: 12px; font-size: 11px; color: #9aa3b2; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .key-date-item { padding: 12px 0; border-bottom: 1px solid #1c212c; }
  .key-date-item:last-child { border-bottom: none; }
  .kd-name { font-size: 14px; font-weight: 600; color: #fff; }
  .kd-meta { font-size: 12px; color: #9aa3b2; margin: 2px 0; }
  .kd-note { font-size: 12px; color: #9aa3b2; }
  .impact-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .impact-high { background: #123222; color: #6ee7b7; }
  .impact-medium { background: #2a2410; color: #e6c96a; }
  .impact-low { background: #1c212c; color: #9aa3b2; }
  @media (max-width: 420px) { .month-grid { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header>
  <a href="dashboard.html" data-tt="backTitle">←</a>
  <h1 data-t="title"></h1>
  <span id="langSwitcherHost"></span>
</header>
<main>
  <div class="intro" data-t="intro"></div>

  <select id="productSelect"></select>
  <button class="analyze-btn" id="analyzeBtn" onclick="analyzeTrend()" data-t="analyze"></button>

  <div id="resultArea"></div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  let db = null;
  let products = [];
  let productsLoaded = false;
  let lastData = null;
  let lastErrorKey = null;
  let lastErrorExtra = '';

  // ================= DİL =================
  const T = {
    tr: {
      pageTitle: 'Trend Takvimi',
      backTitle: 'Panele dön',
      title: '📅 Trend Takvimi',
      intro: 'Bir ürün seç, AI o ürünün yıl içindeki mevsimsel talep dalgalanmasını ve önemli özel günleri senin için çıkarsın.',
      analyze: 'Trend Takvimini Göster',
      loadingProducts: 'Ürünler yükleniyor...',
      noProducts: 'Henüz ürün eklemedin',
      pickProduct: 'Ürün seç...',
      unnamed: 'İsimsiz ürün',
      needProduct: 'Lütfen bir ürün seç.',
      loading: 'Trend analizi yapılıyor...',
      error: 'Hata: ',
      pattern: 'Genel Talep Deseni',
      monthly: 'Aylık Talep',
      keyDates: 'Önemli Tarihler',
      recommendation: 'Öneri',
      noResult: 'Sonuç alınamadı.',
      high: 'Yüksek', medium: 'Orta', low: 'Düşük',
      months: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'],
    },
    en: {
      pageTitle: 'Trend Calendar',
      backTitle: 'Back to dashboard',
      title: '📅 Trend Calendar',
      intro: 'Pick a product and AI will map its seasonal demand through the year along with key shopping dates.',
      analyze: 'Show Trend Calendar',
      loadingProducts: 'Loading products...',
      noProducts: "You haven't added any products yet",
      pickProduct: 'Select a product...',
      unnamed: 'Unnamed product',
      needProduct: 'Please select a product.',
      loading: 'Analyzing trends...',
      error: 'Error: ',
      pattern: 'Overall Demand Pattern',
      monthly: 'Monthly Demand',
      keyDates: 'Key Dates',
      recommendation: 'Recommendation',
      noResult: 'No result received.',
      high: 'High', medium: 'Medium', low: 'Low',
      months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
    }
  };
  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key) {
    const v = T[lang()][key];
    return v !== undefined ? v : (T.tr[key] !== undefined ? T.tr[key] : key);
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-tt]').forEach(el => { el.title = t(el.getAttribute('data-tt')); });
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // AI Türkçe ya da İngilizce dönebilir: seviye ve ayları ikisinden de tanı
  function levelKey(v) {
    const s = String(v || '').toLowerCase().trim();
    if (['yüksek', 'high', 'peak'].includes(s)) return 'high';
    if (['orta', 'medium', 'moderate', 'mid'].includes(s)) return 'medium';
    if (['düşük', 'low'].includes(s)) return 'low';
    return null;
  }
  function monthLabel(m) {
    const s = String(m || '').toLowerCase().trim();
    const idxTr = T.tr.months.findIndex(x => x.toLowerCase() === s);
    const idxEn = T.en.months.findIndex(x => x.toLowerCase() === s || x.toLowerCase().slice(0, 3) === s);
    const idx = idxTr >= 0 ? idxTr : idxEn;
    return idx >= 0 ? t('months')[idx] : String(m || '');
  }

  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    applyStatic();
    fillProductSelect();

    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    let r = await db.from('products').select('*').eq('user_id', session.user.id).is('deleted_at', null).order('created_at', { ascending: false });
    if (r.error) r = await db.from('products').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
    products = r.data || [];
    productsLoaded = true;
    fillProductSelect();

    const firstWithData = products.find(p => p.trend_calendar_data);
    if (firstWithData) {
      document.getElementById('productSelect').value = firstWithData.id;
      lastData = firstWithData.trend_calendar_data;
      renderResult();
    }
  }

  function fillProductSelect() {
    const select = document.getElementById('productSelect');
    const keep = select.value;
    if (!productsLoaded) { select.innerHTML = '<option value="">' + escapeHtml(t('loadingProducts')) + '</option>'; return; }
    if (!products.length) { select.innerHTML = '<option value="">' + escapeHtml(t('noProducts')) + '</option>'; return; }
    select.innerHTML = '<option value="">' + escapeHtml(t('pickProduct')) + '</option>' +
      products.map(p => '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.name || p.generated_title || t('unnamed')) + '</option>').join('');
    if (keep) select.value = keep;
  }

  function showError(key, extra) {
    lastErrorKey = key; lastErrorExtra = extra || ''; lastData = null;
    renderResult();
  }

  async function analyzeTrend() {
    const productId = document.getElementById('productSelect').value;
    const resultArea = document.getElementById('resultArea');
    const btn = document.getElementById('analyzeBtn');
    if (!productId) { showError('needProduct'); return; }

    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    btn.disabled = true;
    btn.textContent = '...';
    lastErrorKey = null;
    resultArea.innerHTML = '<div class="loading">' + escapeHtml(t('loading')) + '</div>';

    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/trend-calendar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ productId, userAccessToken: session.access_token, language: lang() })
      });
      const data = await response.json();
      if (data.error) { showError('error', data.error); return; }
      lastData = data;
      const p = products.find(x => String(x.id) === String(productId));
      if (p) p.trend_calendar_data = data;
      renderResult();
    } catch (err) {
      showError('error', String(err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = t('analyze');
    }
  }

  function renderResult() {
    const resultArea = document.getElementById('resultArea');
    if (lastErrorKey) { resultArea.innerHTML = '<div class="error-box">' + escapeHtml(t(lastErrorKey) + lastErrorExtra) + '</div>'; return; }
    if (!lastData) { resultArea.innerHTML = ''; return; }
    let data = lastData;
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = {}; } }
    if (data && data.result && !data.monthlyDemand) data = data.result;
    let html = '';

    if (data.overallPattern) {
      html += '<div class="result-section"><h3>' + escapeHtml(t('pattern')) + '</h3><p>' + escapeHtml(data.overallPattern) + '</p></div>';
    }
    if (data.monthlyDemand && data.monthlyDemand.length) {
      html += '<div class="result-section"><h3>' + escapeHtml(t('monthly')) + '</h3><div class="month-grid">';
      data.monthlyDemand.forEach(m => {
        const k = levelKey(m.level);
        const cls = k === 'high' ? 'month-high' : k === 'medium' ? 'month-mid' : 'month-low';
        html += '<div class="month-cell ' + cls + '" title="' + escapeHtml(k ? t(k) : (m.level || '')) + '">' + escapeHtml(monthLabel(m.month)) + '</div>';
      });
      html += '</div><div class="legend">' +
        '<span><i style="background:#6ee7b7"></i>' + escapeHtml(t('high')) + '</span>' +
        '<span><i style="background:#e6c96a"></i>' + escapeHtml(t('medium')) + '</span>' +
        '<span><i style="background:#6b7280"></i>' + escapeHtml(t('low')) + '</span></div></div>';
    }
    if (data.keyDates && data.keyDates.length) {
      html += '<div class="result-section"><h3>' + escapeHtml(t('keyDates')) + '</h3>';
      data.keyDates.forEach(kd => {
        const k = levelKey(kd.impact);
        html += '<div class="key-date-item"><div class="kd-name">' + escapeHtml(kd.name || '') +
          (kd.impact ? '<span class="impact-badge impact-' + (k || 'medium') + '">' + escapeHtml(k ? t(k) : kd.impact) + '</span>' : '') + '</div>' +
          '<div class="kd-meta">' + escapeHtml(kd.approxDate || '') + '</div>' +
          '<div class="kd-note">' + escapeHtml(kd.note || '') + '</div></div>';
      });
      html += '</div>';
    }
    if (data.recommendation) {
      html += '<div class="result-section"><h3>' + escapeHtml(t('recommendation')) + '</h3><p>' + escapeHtml(data.recommendation) + '</p></div>';
    }
    resultArea.innerHTML = html || '<div class="error-box">' + escapeHtml(t('noResult')) + '</div>';
  }

  document.getElementById('productSelect').addEventListener('change', e => {
    const p = products.find(x => String(x.id) === String(e.target.value));
    lastErrorKey = null;
    lastData = p && p.trend_calendar_data ? p.trend_calendar_data : null;
    renderResult();
  });

  function onLangChange() {
    applyStatic();
    fillProductSelect();
    const btn = document.getElementById('analyzeBtn');
    if (btn.disabled) { btn.textContent = '...'; return; }
    renderResult();
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);

  init();
</script>
</body>
</html>
