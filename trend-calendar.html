<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Takvimi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    padding: 20px;
    border-bottom: 1px solid #232838;
    background: #141821;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header a { color: #9aa3b2; text-decoration: none; font-size: 14px; }
  header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .intro { color: #9aa3b2; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #232838;
    background: #141821;
    color: #e6e8ee;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .analyze-btn {
    width: 100%;
    background: #1D9E75;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .analyze-btn:disabled { opacity: 0.6; }
  .loading { text-align: center; color: #9aa3b2; padding: 30px; font-size: 14px; }
  .error-box {
    background: #2a1620;
    border: 1px solid #4a2030;
    color: #f28b8b;
    padding: 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .result-section {
    background: #141821;
    border: 1px solid #232838;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .result-section h3 {
    font-size: 13px;
    color: #5DCAA5;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .result-section p { font-size: 14px; line-height: 1.6; color: #e6e8ee; }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .month-cell {
    padding: 10px 6px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
  }
  .month-low { background: #1c212c; color: #6b7280; }
  .month-mid { background: #2a2410; color: #e6c96a; }
  .month-high { background: #123222; color: #6ee7b7; }
  .key-date-item {
    padding: 12px 0;
    border-bottom: 1px solid #1c212c;
  }
  .key-date-item:last-child { border-bottom: none; }
  .kd-name { font-size: 14px; font-weight: 600; color: #fff; }
  .kd-meta { font-size: 12px; color: #9aa3b2; margin: 2px 0; }
  .kd-note { font-size: 12px; color: #9aa3b2; }
  .impact-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .impact-yüksek { background: #123222; color: #6ee7b7; }
  .impact-orta { background: #2a2410; color: #e6c96a; }
</style>
</head>
<body>
<header>
  <a href="dashboard.html">←</a>
  <h1>📅 Trend Takvimi</h1>
</header>
<main>
  <div class="intro">Bir ürün seç, AI o ürünün yıl içindeki mevsimsel talep dalgalanmasını ve önemli özel günleri senin için çıkarsın.</div>

  <select id="productSelect">
    <option value="">Ürün seçiliyor...</option>
  </select>
  <button class="analyze-btn" id="analyzeBtn" onclick="analyzeTrend()">Trend Takvimini Göster</button>

  <div id="resultArea"></div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let products = [];

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }

    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    const select = document.getElementById('productSelect');

    if (error || !data || data.length === 0) {
      select.innerHTML = '<option value="">Henüz ürün eklemedin</option>';
      return;
    }

    products = data;
    select.innerHTML = '<option value="">Ürün seç...</option>' +
      data.map(p => `<option value="${p.id}">${escapeHtml(p.name || p.generated_title || 'İsimsiz ürün')}</option>`).join('');

    const firstWithData = data.find(p => p.trend_calendar_data);
    if (firstWithData) {
      select.value = firstWithData.id;
      renderResult(firstWithData.trend_calendar_data);
    }
  }

  async function analyzeTrend() {
    const productId = document.getElementById('productSelect').value;
    const resultArea = document.getElementById('resultArea');
    const btn = document.getElementById('analyzeBtn');

    if (!productId) {
      resultArea.innerHTML = '<div class="error-box">Lütfen bir ürün seç.</div>';
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    btn.disabled = true;
    btn.textContent = '...';
    resultArea.innerHTML = '<div class="loading">Trend analizi yapılıyor...</div>';

    try {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/trend-calendar`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY
        },
        body: JSON.stringify({ productId, userAccessToken: session.access_token })
      });

      const data = await response.json();

      if (data.error) {
        resultArea.innerHTML = `<div class="error-box">Hata: ${escapeHtml(data.error)}</div>`;
        return;
      }

      renderResult(data);
    } catch (err) {
      resultArea.innerHTML = `<div class="error-box">Hata: ${escapeHtml(String(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Trend Takvimini Göster';
    }
  }

  function monthClass(level) {
    if (level === 'yüksek') return 'month-high';
    if (level === 'orta') return 'month-mid';
    return 'month-low';
  }

  function renderResult(data) {
    const resultArea = document.getElementById('resultArea');
    let html = '';

    if (data.overallPattern) {
      html += `<div class="result-section"><h3>Genel Talep Deseni</h3><p>${escapeHtml(data.overallPattern)}</p></div>`;
    }

    if (data.monthlyDemand && data.monthlyDemand.length > 0) {
      html += `<div class="result-section"><h3>Aylık Talep</h3><div class="month-grid">`;
      data.monthlyDemand.forEach(m => {
        html += `<div class="month-cell ${monthClass(m.level)}">${escapeHtml(m.month)}</div>`;
      });
      html += `</div></div>`;
    }

    if (data.keyDates && data.keyDates.length > 0) {
      html += `<div class="result-section"><h3>Önemli Tarihler</h3>`;
      data.keyDates.forEach(kd => {
        html += `<div class="key-date-item">
          <div class="kd-name">${escapeHtml(kd.name || '')}<span class="impact-badge impact-${escapeHtml(kd.impact || 'orta')}">${escapeHtml(kd.impact || '')}</span></div>
          <div class="kd-meta">${escapeHtml(kd.approxDate || '')}</div>
          <div class="kd-note">${escapeHtml(kd.note || '')}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (data.recommendation) {
      html += `<div class="result-section"><h3>Öneri</h3><p>${escapeHtml(data.recommendation)}</p></div>`;
    }

    resultArea.innerHTML = html || '<div class="error-box">Sonuç alınamadı.</div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
