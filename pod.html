<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Print on Demand</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; }
  .back-link:hover { color: #fff; }

  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 90px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 22px; line-height: 1.5; }

  .card {
    background: #141821; border: 1px solid #232838; border-radius: 14px;
    padding: 20px; margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .step {
    width: 22px; height: 22px; border-radius: 50%; background: #1D9E75; color: #fff;
    font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hint { font-size: 13px; color: #9aa3b2; margin: 6px 0 12px; line-height: 1.55; }
  .err { font-size: 13px; color: #f5a3a3; background: #2e1414; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .ok-box { font-size: 13px; color: #6ee7b7; background: #123222; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .warn-box { font-size: 13px; color: #f2d16b; background: #2e2712; border-radius: 8px; padding: 10px 12px; margin: 8px 0; line-height: 1.5; }

  label { display: block; font-size: 12px; color: #9aa3b2; margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; color: #e6e8ee;
    border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #1D9E75; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=range] { width: 100%; accent-color: #1D9E75; }
  input[type=file] { font-size: 13px; color: #9aa3b2; width: 100%; }

  .btn {
    background: #1D9E75; color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn:hover { background: #178a65; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: transparent; color: #9aa3b2; border: 1px solid #2a3040; }
  .btn.secondary:hover { border-color: #3a4258; color: #fff; }
  .btn.danger { background: transparent; color: #f5a3a3; border: 1px solid #5a2a2a; }
  .btn.danger:hover { background: #2e1414; }
  .btn.small { padding: 6px 12px; font-size: 12px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; }
  .badge.ok { background: #123222; color: #6ee7b7; }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 12px; align-items: end; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip {
    padding: 6px 13px; border-radius: 16px; border: 1px solid #2a3040; font-size: 13px;
    cursor: pointer; color: #9aa3b2; user-select: none;
  }
  .chip:hover { border-color: #3a4258; color: #fff; }
  .chip.on { background: #123222; border-color: #1D9E75; color: #6ee7b7; }

  .bp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .bp {
    background: #0d0f16; border: 1px solid #232838; border-radius: 10px; overflow: hidden;
    cursor: pointer; transition: border-color 0.15s;
  }
  .bp:hover { border-color: #1D9E75; }
  .bp.sel { border-color: #1D9E75; box-shadow: 0 0 0 1px #1D9E75; }
  .bp img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1a1f2c; }
  .bp-t { font-size: 12px; color: #fff; padding: 8px 10px 2px; line-height: 1.35; }
  .bp-b { font-size: 11px; color: #9aa3b2; padding: 0 10px 8px; }

  .prov-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
  .prov {
    background: #0d0f16; border: 1px solid #232838; border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .prov:hover { border-color: #1D9E75; }
  .prov.sel { border-color: #1D9E75; background: #0f1f19; }
  .prov-t { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .prov-m { font-size: 11px; color: #9aa3b2; }

  .opt-block { margin-bottom: 14px; }
  .opt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .opt-name { font-size: 13px; font-weight: 600; color: #fff; }
  .linkbtn { background: none; border: none; color: #1D9E75; font-size: 12px; cursor: pointer; margin-left: 10px; font-family: inherit; }

  .design-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 10px; }
  .design {
    background: #0d0f16; border: 1px solid #232838; border-radius: 12px; padding: 14px;
  }
  .design-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  .design canvas { width: 100%; max-width: 280px; border-radius: 8px; display: block; margin: 8px 0; background: #e9ecf3; }
  .ctl { margin-top: 8px; }
  .ctl-row { display: grid; grid-template-columns: 80px 1fr 44px; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; color: #9aa3b2; }
  .ctl-row span:last-child { text-align: right; color: #e6e8ee; }

  .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .mock-grid img { width: 100%; border-radius: 8px; background: #1a1f2c; aspect-ratio: 1; object-fit: cover; }

  .tbl-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid #232838; border-radius: 10px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: #9aa3b2; font-weight: 600; font-size: 12px; padding: 10px 12px; background: #0d0f16; white-space: nowrap; }
  .tbl td { padding: 8px 12px; border-top: 1px solid #232838; white-space: nowrap; }
  .tbl input { width: 96px; padding: 6px 8px; }
  .pos { color: #6ee7b7; }
  .neg { color: #f5a3a3; }

  .my-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }
  .my { background: #0d0f16; border: 1px solid #232838; border-radius: 10px; overflow: hidden; }
  .my img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1a1f2c; }
  .my-t { font-size: 12px; color: #fff; padding: 8px 10px; line-height: 1.35; min-height: 44px; }
  .my-a { display: flex; gap: 6px; padding: 0 10px 10px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #232838; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 50; max-width: 90vw; line-height: 1.45;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #5a1f1f; }
  .toast.good { background: #14532d; }
  .status-line { font-size: 13px; color: #f2d16b; margin-left: 4px; }

  .opt-row { display: flex; gap: 28px; flex-wrap: wrap; }
  .opt-row .opt-block { min-width: 230px; }
  .dd { position: relative; display: inline-block; }
  .dd-btn {
    background: #0d0f16; border: 1px solid #2a3040; color: #e6e8ee; border-radius: 8px;
    padding: 9px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 230px;
  }
  .dd-btn:hover, .dd.open .dd-btn { border-color: #1D9E75; }
  .dd-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    width: 300px; max-width: 88vw; background: #141821; border: 1px solid #2a3040;
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dd.open .dd-panel { display: block; }
  .dd-head { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #232838; }
  .dd-head .linkbtn { margin-left: 0; }
  .dd-list { max-height: 280px; overflow-y: auto; padding: 4px 0; }
  .dd-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: #e6e8ee; cursor: pointer; margin: 0; }
  .dd-item:hover { background: #1c2230; }
  .dd-item input { width: 16px; height: 16px; accent-color: #1D9E75; flex-shrink: 0; cursor: pointer; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #4a5468; flex-shrink: 0; }
  .dd-sum { font-size: 12px; color: #9aa3b2; margin-top: 8px; line-height: 1.5; max-width: 420px; }
  .pub-box { margin-top: 22px; padding-top: 18px; border-top: 1px solid #232838; }
  .pub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .pub-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid #2a3040; border-radius: 8px; font-size: 13px; color: #e6e8ee; cursor: pointer; margin: 0; }
  .pub-item:hover { border-color: #3a4258; }
  .pub-item input { width: auto; margin: 0; }
  .pub-item small { color: #9aa3b2; }
  @media (max-width: 520px) {
    header { padding: 14px 16px; }
    .logo-text { display: none; }
    main { padding: 20px 16px 90px; }
    .dd-btn { min-width: 0; width: 100%; }
    .opt-row .opt-block { min-width: 0; width: 100%; }
    .dd { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <a href="dashboard.html" class="back-link" data-t="back"></a>
    <span id="langSwitcherHost"></span>
  </div>
</header>

<main>
  <h1>Print on Demand</h1>
  <div class="subtitle" data-t="subtitle"></div>

  <!-- Görsel Stüdyosu'ndan gelen tasarım -->
  <div class="card" id="studioCard" style="display:none">
    <h2 data-t="studioTitle"></h2>
    <div class="row" style="align-items:center">
      <img id="studioThumb" alt="" style="width:90px;height:90px;object-fit:contain;border-radius:8px;background:#e9ecf3">
      <div style="flex:1;min-width:220px">
        <div class="hint" data-t="studioHint"></div>
        <button class="btn danger small" onclick="dropStudioDesign()" data-t="studioDrop"></button>
      </div>
    </div>
  </div>

  <!-- Printify bağlantısı -->
  <div class="card">
    <h2 data-t="accountTitle"></h2>
    <div id="connectBody"></div>
  </div>

  <div id="studio" style="display:none">

    <!-- 1. Ürün türü -->
    <div class="card">
      <h2><span class="step">1</span> <span data-t="s1Title"></span></h2>
      <div class="hint" data-t="s1Hint"></div>
      <div class="chips" id="quickChips"></div>
      <div class="row">
        <div style="flex:1; min-width:200px"><input type="text" id="bpQuery" data-tp="s1Placeholder" onkeydown="if(event.key==='Enter')searchTyped()"></div>
        <button class="btn" onclick="searchTyped()" data-t="search"></button>
      </div>
      <div class="bp-grid" id="bpGrid"></div>
    </div>

    <!-- 2. Sağlayıcı -->
    <div class="card" id="provCard" style="display:none">
      <h2><span class="step">2</span> <span data-t="s2Title"></span></h2>
      <div class="hint" data-t="s2Hint"></div>
      <div class="prov-list" id="provList"></div>
    </div>

    <!-- 3. Renk / beden -->
    <div class="card" id="optCard" style="display:none">
      <h2><span class="step">3</span> <span data-t="s3Title"></span></h2>
      <div class="hint" data-t="s3Hint"></div>
      <div id="optBody"></div>
      <div class="hint" id="variantCount"></div>
    </div>

    <!-- 4. Tasarım -->
    <div class="card" id="designCard" style="display:none">
      <h2><span class="step">4</span> <span data-t="s4Title"></span></h2>
      <div class="hint" data-t="s4Hint"></div>
      <div class="design-grid" id="designGrid"></div>
    </div>

    <!-- 5. Ürün bilgisi -->
    <div class="card" id="infoCard" style="display:none">
      <h2><span class="step">5</span> <span data-t="s5Title"></span></h2>
      <div class="hint" data-t="s5Hint"></div>
      <div style="margin-bottom:12px"><label data-t="pTitleLabel"></label><input type="text" id="pTitle" data-tp="pTitlePh"></div>
      <div style="margin-bottom:12px"><label data-t="pDescLabel"></label><textarea id="pDesc" data-tp="pDescPh"></textarea></div>
      <div class="fields">
        <div><label data-t="pPriceLabel"></label><input type="number" id="pPrice" value="29.99" step="0.01" min="1"></div>
      </div>
      <div class="row">
        <button class="btn" id="draftBtn" onclick="createDraft()" data-t="draftBtn"></button>
        <span class="status-line" id="draftStatus"></span>
      </div>
    </div>

    <!-- 6. Sonuç -->
    <div class="card" id="resultCard" style="display:none">
      <h2><span class="step">6</span> <span data-t="s6Title"></span></h2>
      <div class="hint" id="rInfo"></div>
      <div class="mock-grid" id="rMock"></div>
      <div class="fields">
        <div><label data-t="platformLabel"></label><select id="platformSel" onchange="onPlatformChange()"></select></div>
        <div><label data-t="commissionLabel"></label><input type="number" id="commission" step="0.1" min="0" oninput="recalcAll()"></div>
        <div><label data-t="marginLabel"></label><input type="number" id="targetMargin" value="35" step="1" min="1" max="80"></div>
        <div><button class="btn secondary" onclick="applyMargin()" data-t="applyAll"></button></div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th data-t="thVariant"></th><th data-t="thCost"></th><th data-t="thPrice"></th><th data-t="thNet"></th><th data-t="thMargin"></th></tr></thead>
          <tbody id="rBody"></tbody>
        </table>
      </div>
      <div class="hint" data-t="netHint"></div>
      <div id="rShip"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="savePrices()" data-t="savePrices"></button>
        <button class="btn" onclick="addToPanel()" data-t="addToPanel"></button>
        <button class="btn danger" onclick="deleteCurrent()" data-t="deleteDraft"></button>
      </div>
      <div id="rMsg"></div>

      <div class="pub-box" id="pubBox">
        <div id="pubShopsInfo"></div>
        <div id="pubForm" style="display:none">
          <div class="fields">
            <div><label data-t="pubPlatform"></label><select id="pubMain" onchange="renderPubExtra()"></select></div>
          </div>
          <div id="pubExtraWrap" style="display:none">
            <label data-t="pubAlso"></label>
            <div class="hint" style="margin-top:0" data-t="pubAlsoHint"></div>
            <div class="pub-grid" id="pubExtra"></div>
          </div>
          <div class="warn-box" data-t="pubWarn"></div>
          <div style="margin-bottom:12px"><label data-t="pubTitleSrc"></label><input type="text" id="pubTitleTr" data-tp="pubTitleSrcPh"></div>
          <div style="margin-bottom:12px"><label data-t="pubDescSrc"></label><textarea id="pubDescTr" data-tp="pubDescSrcPh"></textarea></div>
          <div class="row" style="margin-bottom:12px"><button class="btn secondary" id="pubTransBtn" onclick="translatePub()" data-t="translate"></button></div>
          <div style="margin-bottom:12px"><label data-t="pubTitleEn"></label><input type="text" id="pubTitle" maxlength="140" data-tp="pubTitleEnPh"></div>
          <div style="margin-bottom:12px"><label data-t="pubDescEn"></label><textarea id="pubDesc" data-tp="pubDescEnPh"></textarea></div>
          <div style="margin-bottom:12px"><label data-t="pubTags"></label><input type="text" id="pubTags" data-tp="pubTagsPh"></div>
          <div class="row"><button class="btn" id="pubBtn" onclick="publishProduct()" data-t="publish"></button></div>
        </div>
        <div id="pubMsg"></div>
      </div>
    </div>

    <!-- Taslaklarım -->
    <div class="card">
      <h2 data-t="myTitle"></h2>
      <div class="hint" data-t="myHint"></div>
      <div class="my-grid" id="myGrid"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key, vars) {
    let v = T[lang()][key];
    if (v === undefined) v = T.tr[key] !== undefined ? T.tr[key] : key;
    if (vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
    return v;
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.getAttribute('data-tp')); });
  }
  function pct(n, d) {
    const s = Number(n || 0).toFixed(d == null ? 1 : d);
    return lang() === 'tr' ? '%' + s.replace('.', ',') : s + '%';
  }

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastTimer;
  function toast(msg, type) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, type === 'err' ? 8000 : 3500);
  }

  async function callFn(name, payload) {
    const { data: { session: s } } = await db.auth.getSession();
    if (!s) { window.location.href = 'index.html'; throw new Error(t('sessionEnded')); }
    session = s;
    const res = await fetch(FN + name, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify(Object.assign({}, payload, { userAccessToken: s.access_token, language: lang() }))
    });
    let data;
    try { data = await res.json(); } catch (e) { throw new Error(t('badResponse', { s: res.status })); }
    if (!data.ok) throw new Error(data.error || t('unknownError'));
    return data;
  }

  // ---------- Printify bağlantısı ----------
  async function loadConnection() {
    S.conn = 'checking'; renderConnection();
    try {
      const st = await callFn('printify-connect', { action: 'status' });
      if (!st.connected) { S.conn = 'form'; renderConnection(); $('studio').style.display = 'none'; return; }
      if (st.shop_id) {
        S.shopId = st.shop_id; S.shopTitle = st.shop_title;
        S.conn = 'connected'; renderConnection();
        $('studio').style.display = 'block';
        loadMyProducts();
        return;
      }
      $('studio').style.display = 'none';
      const r = await callFn('printify-connect', { action: 'list_shops' });
      S.shopsForPicker = r.shops || [];
      S.conn = S.shopsForPicker.length ? 'picker' : 'noshops';
      renderConnection();
    } catch (e) {
      S.conn = 'error'; S.connError = e.message; renderConnection();
    }
  }

  function renderConnection() {
    const box = $('connectBody');
    if (S.conn === 'checking') { box.innerHTML = '<div class="hint">' + esc(t('checking')) + '</div>'; return; }
    if (S.conn === 'error') {
      box.innerHTML = '<div class="err">' + esc(S.connError) + '</div><button class="btn secondary small" onclick="loadConnection()">' + esc(t('retry')) + '</button>';
      return;
    }
    if (S.conn === 'form') {
      const keep = $('pfToken') ? $('pfToken').value : '';
      box.innerHTML =
        '<div class="hint">' + t('connectHelp') + '</div>' +
        '<div class="row"><div style="flex:1; min-width:240px"><input type="password" id="pfToken" autocomplete="new-password" placeholder="' + esc(t('tokenPh')) + '"></div>' +
        '<button class="btn" id="pfConnectBtn" onclick="connectPrintify()">' + esc(t('connect')) + '</button></div>';
      $('pfToken').value = keep;
      return;
    }
    if (S.conn === 'noshops') {
      box.innerHTML =
        '<div class="warn-box">' + t('noShops') + '</div>' +
        '<div class="row"><button class="btn" onclick="loadConnection()">' + esc(t('refreshedCheck')) + '</button>' +
        '<button class="btn danger small" onclick="disconnectPrintify()">' + esc(t('disconnect')) + '</button></div>';
      return;
    }
    if (S.conn === 'picker') {
      const prev = $('shopSel') ? $('shopSel').value : '';
      let opts = '';
      S.shopsForPicker.forEach((s) => {
        opts += '<option value="' + esc(s.id) + '">' + esc(s.title) + (s.sales_channel ? ' (' + esc(s.sales_channel) + ')' : '') + '</option>';
      });
      box.innerHTML =
        '<div class="hint">' + esc(t('pickShop')) + '</div>' +
        '<div class="row"><div style="flex:1; min-width:220px"><select id="shopSel">' + opts + '</select></div>' +
        '<button class="btn" onclick="selectShop()">' + esc(t('useShop')) + '</button>' +
        '<button class="btn danger small" onclick="disconnectPrintify()">' + esc(t('disconnect')) + '</button></div>';
      if (prev) $('shopSel').value = prev;
      return;
    }

  // Printify renk kodu vermediği için renk isminden tahmini bir renk noktası üretilir
  const COLOR_MAP = [
    [/light blue|baby blue|sky/i, '#9fc5e8'], [/light pink|baby pink/i, '#f6c1d2'], [/light grey|light gray|ash/i, '#cfd3d8'],
    [/dark chocolate|chocolate|brown/i, '#4a2f24'], [/heavy metal|charcoal|dark grey|dark gray|graphite/i, '#3c3f44'],
    [/heather/i, '#9aa0a6'], [/kelly green/i, '#2e9e4a'], [/military green|olive|army|forest/i, '#5b6b3a'],
    [/midnight navy|navy/i, '#1b2440'], [/royal/i, '#2a4bbd'], [/turquoise|teal|aqua/i, '#22b3b3'],
    [/purple|violet/i, '#7b3fb0'], [/cardinal|maroon|burgundy|wine/i, '#a3132f'], [/pink|rose/i, '#ef7fa7'],
    [/orange/i, '#f28c28'], [/yellow|gold|mustard|daisy/i, '#f2c230'], [/natural|cream|ivory|sand|beige/i, '#efe6d0'],
    [/white/i, '#f5f5f5'], [/black/i, '#111318'], [/grey|gray|silver/i, '#9aa0a6'], [/green/i, '#2e8b57'],
    [/blue/i, '#2f5fd0'], [/red/i, '#d62828']
  ];
  function colorHex(name) {
    for (const [re, hex] of COLOR_MAP) { if (re.test(name)) return hex; }
    return null;
  }
  function optLabel(k) { return t('opt')[String(k).toLowerCase()] || k; }

  function renderOptions() {
    if (!S.optionKeys.length) {
      $('optBody').innerHTML = '<div class="hint">' + esc(t('noOptions')) + '</div>';
      updateVariantCount();

    }
    let h = '<div class="opt-row">';
    S.optionKeys.forEach((k, ki) => {
      const isColor = /colou?r/i.test(k);
      h += '<div class="opt-block"><div class="opt-name" style="margin-bottom:6px">' + esc(optLabel(k)) + '</div>' +
        '<div class="dd" id="dd' + ki + '">' +
        '<button type="button" class="dd-btn" onclick="toggleDD(' + ki + ', event)"><span id="ddl' + ki + '"></span><span>▾</span></button>' +
        '<div class="dd-panel"><div class="dd-head">' +
        '<button type="button" class="linkbtn" onclick="setAllOpt(' + ki + ',true)">' + esc(t('selectAll')) + '</button>' +
        '<button type="button" class="linkbtn" onclick="setAllOpt(' + ki + ',false)">' + esc(t('clear')) + '</button></div><div class="dd-list">';
      S.optionValues[k].forEach((val, vi) => {

        h += '<label class="dd-item"><input type="checkbox"' + (on ? ' checked' : '') + ' onchange="toggleOpt(' + ki + ',' + vi + ',this.checked)">' +
          (hex ? '<span class="dot" style="background:' + hex + '"></span>' : '') +
          '<span>' + esc(val) + '</span></label>';
      });
      h += '</div></div></div><div class="dd-sum" id="dds' + ki + '"></div></div>';
    });
    h += '</div>';
    $('optBody').innerHTML = h;
    S.optionKeys.forEach((_, ki) => updateOptSummary(ki));

  function updateOptSummary(ki) {
    const k = S.optionKeys[ki];
    const chosen = S.optionValues[k].filter((v) => S.selectedOpts[k].has(v));
    const btn = $('ddl' + ki), sum = $('dds' + ki);

  function toggleDD(ki, ev) {

  function toggleOpt(ki, vi, on) {
    const k = S.optionKeys[ki]; const val = S.optionValues[k][vi];

    updateOptSummary(ki);

  }
  function setAllOpt(ki, on) {

  function sliderRow(idx, key, label, min, max, val) {

  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t('imgOpenFail'))); };
      img.src = url;
    });
  }

  // Görseli en fazla ~4 MB olacak şekilde küçültür (Printify'a base64 olarak gönderilecek)
  async function prepareDesign(file) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error(t('imgTypeOnly'));
    const src = await loadImageFromFile(file);
    const isJpeg = file.type === 'image/jpeg';
    const LIMIT = 4 * 1024 * 1024;
    let maxDim = 4000;
    for (let attempt = 0; attempt < 7; attempt++) {
      const k = Math.min(1, maxDim / Math.max(src.naturalWidth, src.naturalHeight));
      const w = Math.max(1, Math.round(src.naturalWidth * k));
      const h = Math.max(1, Math.round(src.naturalHeight * k));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(src, 0, 0, w, h);
      const dataUrl = isJpeg ? c.toDataURL('image/jpeg', 0.92) : c.toDataURL('image/png');
      const bytes = (dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75;
      if (bytes <= LIMIT) {
        const base = (file.name.replace(/\.[^.]+$/, '') || 'design').replace(/[^\w\-]+/g, '_');
        return { img: c, dataUrl: dataUrl, w: w, h: h, fileName: base + (isJpeg ? '.jpg' : '.png') };
      }
      maxDim = Math.round(Math.max(w, h) * 0.75);
    }
    throw new Error(t('imgTooBig'));
  }

  async function onDesignFile(idx, input) {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      await applyDesign(idx, file);
    } catch (e) {
      toast(e.message, 'err');
      input.value = '';
    }
  }
  async function applyDesign(idx, file) {
    const d = await prepareDesign(file);
    const pos = S.placeholders[idx];
    const fitScale = Math.min(1, (pos.height * d.w) / (pos.width * d.h));
    d.x = 0.5; d.y = 0.5; d.scale = fitScale; d.angle = 0;
    S.designs[idx] = d;
    $('ctl' + idx).style.display = 'block';
    setSlider(idx, 'scale', Math.round(d.scale * 100));
    setSlider(idx, 'x', 50); setSlider(idx, 'y', 50); setSlider(idx, 'angle', 0);
    drawPreview(idx);
  }

  // ---------- Görsel Stüdyosu'ndan gelen tasarım ----------
  function readStudioDesign() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open('hizlisatici-studio', 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
        req.onerror = () => resolve(null);
        req.onsuccess = () => {
          try {
            const g = req.result.transaction('kv', 'readonly').objectStore('kv').get('pod-design');
            g.onsuccess = () => { req.result.close(); resolve(g.result || null); };
            g.onerror = () => { req.result.close(); resolve(null); };
          } catch (e) { resolve(null); }
        };
      } catch (e) { resolve(null); }
    });
  }
  async function loadStudioDesign() {
    if (new URLSearchParams(location.search).get('studio') !== '1') return;
    const rec = await readStudioDesign();
    if (!rec || !rec.dataUrl) { toast(t('studioNotFound'), 'err'); return; }
    S.studio = rec;
    $('studioThumb').src = rec.dataUrl;
    $('studioCard').style.display = 'block';
  }
  function dropStudioDesign() {
    S.studio = null;
    $('studioCard').style.display = 'none';
    document.querySelectorAll('.studio-use').forEach((el) => el.remove());
  }
  async function useStudioDesign(idx) {
    if (!S.studio) return;
    try {
      const blob = await (await fetch(S.studio.dataUrl)).blob();
      const file = new File([blob], 'studio-design.png', { type: 'image/png' });
      await applyDesign(idx, file);
      toast(t('studioAdded'), 'good');
    } catch (e) { toast(e.message, 'err'); }
  }
  function setSlider(idx, key, val) {
    $('sl_' + key + idx).value = val;
    $('sv_' + key + idx).textContent = val;
  }
  function onSlider(idx, key, raw) {
    const d = S.designs[idx]; if (!d) return;
    const v = Number(raw);
    $('sv_' + key + idx).textContent = v;
    if (key === 'scale') d.scale = v / 100;
    if (key === 'x') d.x = v / 100;
    if (key === 'y') d.y = v / 100;
    if (key === 'angle') d.angle = v;
    drawPreview(idx);
  }
  function removeDesign(idx) {
    delete S.designs[idx];
    $('ctl' + idx).style.display = 'none';
    const inputs = $('designGrid').querySelectorAll('input[type=file]');
    if (inputs[idx]) inputs[idx].value = '';
    drawPreview(idx);
  }
  function drawPreview(idx) {
    const cv = $('cv' + idx); if (!cv) return;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#e9ecf3';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#b8bfcf';
    ctx.setLineDash([5, 4]);
    ctx.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
    ctx.setLineDash([]);
    const d = S.designs[idx];
    const q = $('q' + idx);
    if (!d) {
      ctx.fillStyle = '#8a92a6'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t('printArea'), cv.width / 2, cv.height / 2);
      if (q) q.textContent = '';
      return;
    }
    const dw = d.scale * cv.width;
    const dh = dw * d.h / d.w;
    ctx.save();
    ctx.translate(d.x * cv.width, d.y * cv.height);
    ctx.rotate(d.angle * Math.PI / 180);
    ctx.drawImage(d.img, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
    if (q) {
      const pos = S.placeholders[idx];
      const printedPx = d.scale * pos.width;
      const quality = Math.min(100, Math.round(d.w / printedPx * 100));
      q.innerHTML = esc(t('quality')) + '<b class="' + (quality >= 60 ? 'pos' : 'neg') + '">' + esc(pct(quality, 0)) + '</b>' + (quality < 60 ? esc(t('qualityLow')) : '');
    }
  }

  // ---------- 5. Taslak ----------
  function setDraftStatus(s) { $('draftStatus').textContent = s || ''; }

  async function createDraft() {
    const title = $('pTitle').value.trim();
    const description = $('pDesc').value.trim();
    const ids = selectedVariantIds();
    const idxs = Object.keys(S.designs).map(Number);
    if (!S.blueprint || !S.provider) { toast(t('needTypeProvider'), 'err'); return; }
    if (!title) { toast(t('titleEmpty'), 'err'); return; }
    if (!ids.length) { toast(t('needVariant'), 'err'); return; }
    if (ids.length > 100) { toast(t('maxVariants'), 'err'); return; }
    if (!idxs.length) { toast(t('needDesign'), 'err'); return; }
    const btn = $('draftBtn');
    btn.disabled = true;
    try {
      const placements = [];
      let n = 0;
      for (const idx of idxs) {
        n++;
        setDraftStatus(t('uploading', { n: n, t: idxs.length }));
        const d = S.designs[idx];
        const up = await callFn('printify-create-product', { action: 'upload_image', fileName: d.fileName, imageBase64: d.dataUrl });
        placements.push({ position: S.placeholders[idx].position, imageId: up.image.id, x: d.x, y: d.y, scale: d.scale, angle: d.angle });
      }
      setDraftStatus(t('creatingDraft'));
      const price = Number($('pPrice').value) || 29.99;
      const r = await callFn('printify-create-product', {
        action: 'create_draft', title: title, description: description || title,
        blueprintId: S.blueprint.id, providerId: S.provider.id,
        variantIds: ids, placements: placements, price: Math.round(price * 100)
      });
      S.product = r.product;
      initPrices();
      renderResults(true);
      loadMyProducts();
      toast(t('draftCreated'), 'good');
    } catch (e) {
      toast(e.message, 'err');
    } finally {
      btn.disabled = false;
      setDraftStatus('');
    }
  }

  function initPrices() {
    S.prices = {};
    (S.product.variants || []).filter((v) => v.is_enabled).forEach((v) => { S.prices[v.id] = (v.price || 0) / 100; });
  }

  // ---------- 6. Sonuç ----------
  function uniqueImages(images) {
    const seen = new Set(); const out = [];
    (images || []).forEach((i) => { if (i.src && !seen.has(i.src)) { seen.add(i.src); out.push(i.src); } });
    return out.slice(0, 8);
  }

  function renderMockups() {
    const imgs = uniqueImages(S.product.images);
    $('rMock').innerHTML = imgs.length
      ? imgs.map((s) => '<img loading="lazy" src="' + esc(s) + '" alt="">').join('')
      : '<div class="hint">' + esc(t('mockPending')) + '</div>';
  }

  function renderResults(poll, noScroll, keepMsg) {
    const p = S.product;
    $('resultCard').style.display = 'block';
    $('rInfo').innerHTML = '<b style="color:#fff">' + esc(p.title) + '</b>' + esc(t('rInfo'));
    if (!keepMsg) $('rMsg').innerHTML = '';
    renderMockups();

    const sel = $('platformSel');
    if (!sel.options.length) {
      Object.keys(PLATFORMS).forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
      sel.value = 'Etsy';
      $('commission').value = PLATFORMS['Etsy'];
    }

    let rows = '';
    (p.variants || []).filter((v) => v.is_enabled).forEach((v) => {
      rows += '<tr><td>' + esc(v.title) + '</td><td>' + money(v.cost) + '</td>' +
        '<td><input type="number" step="0.01" min="0" value="' + (S.prices[v.id] || 0).toFixed(2) + '" onchange="setPrice(' + v.id + ', this.value)"></td>' +
        '<td id="pf' + v.id + '"></td><td id="mg' + v.id + '"></td></tr>';
    });
    $('rBody').innerHTML = rows || '<tr><td colspan="5">' + esc(t('noActive')) + '</td></tr>';
    recalcAll();
    renderShipping();

    if (S.pubForId !== p.id) {
      S.pubForId = p.id;
      $('pubTitle').value = ''; $('pubDesc').value = ''; $('pubTags').value = '';
      $('pubTitleTr').value = p.title || '';
      $('pubDescTr').value = (p.description && p.description !== p.title) ? p.description : '';
      $('pubMsg').innerHTML = '';
    }
    if (S.pubShops === null && !S.pubShopsError) loadPubShops();

    if (!noScroll) $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (poll && !uniqueImages(p.images).length) pollMockups(p.id, 0);
  }

  async function pollMockups(id, n) {
    if (n >= 6 || !S.product || S.product.id !== id) return;
    await new Promise((r) => setTimeout(r, 5000));
    try {
      const r = await callFn('printify-create-product', { action: 'get_product', productId: id });
      if (S.product && S.product.id === id) {
        S.product.images = r.product.images;
        renderMockups();
        if (!uniqueImages(r.product.images).length) pollMockups(id, n + 1);
      }
    } catch (e) { /* sessizce geç */ }
  }

  function renderShipping() {
    const box = $('rShip');
    if (!S.shipping || !S.shipping.profiles || !S.shipping.profiles.length || !S.blueprint || !S.provider || S.product.blueprint_id !== S.blueprint.id) { box.innerHTML = ''; return; }
    let h = '<div class="opt-name" style="margin:14px 0 6px">' + esc(t('shipTitle')) + '</div>';
    if (S.shipping.handling_time) {
      const u = S.shipping.handling_time.unit === 'day' ? t('days') : S.shipping.handling_time.unit;
      h += '<div class="hint" style="margin-top:0">' + esc(t('handling', { v: S.shipping.handling_time.value, u: u })) + '</div>';
    }
    h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + esc(t('thCountries')) + '</th><th>' + esc(t('thFirst')) + '</th><th>' + esc(t('thAdditional')) + '</th></tr></thead><tbody>';
    S.shipping.profiles.slice(0, 12).forEach((pr) => {
      const c = (pr.countries || []);
      const label = c.length > 8 ? c.slice(0, 8).join(', ') + ' +' + (c.length - 8) : c.join(', ');
      h += '<tr><td style="white-space:normal">' + esc(label) + '</td><td>' + (pr.first_item ? money(pr.first_item.cost) : '-') + '</td><td>' + (pr.additional_items ? money(pr.additional_items.cost) : '-') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    box.innerHTML = h;
  }

  function onPlatformChange() {
    $('commission').value = PLATFORMS[$('platformSel').value] || 0;
    recalcAll();
  }
  function commissionPct() { return Math.max(0, Number($('commission').value) || 0); }

  function updateRow(v) {
    const price = S.prices[v.id] || 0;
    const net = price * (1 - commissionPct() / 100) - (v.cost || 0) / 100;
    const margin = price > 0 ? net / price * 100 : 0;
    const cls = net >= 0 ? 'pos' : 'neg';
    const pf = $('pf' + v.id), mg = $('mg' + v.id);
    if (pf) pf.innerHTML = '<span class="' + cls + '">' + (net < 0 ? '-$' : '$') + Math.abs(net).toFixed(2) + '</span>';
    if (mg) mg.innerHTML = '<span class="' + cls + '">' + esc(pct(margin, 1)) + '</span>';
  }
  function recalcAll() {
    if (!S.product) return;
    (S.product.variants || []).filter((v) => v.is_enabled).forEach(updateRow);
  }
  function setPrice(id, val) {
    S.prices[id] = Math.max(0, Number(val) || 0);
    const v = (S.product.variants || []).find((x) => x.id === id);
    if (v) updateRow(v);
  }

  function applyMargin() {
    if (!S.product) return;
    const m = (Number($('targetMargin').value) || 0) / 100;
    const c = commissionPct() / 100;
    const denom = 1 - c - m;
    if (m <= 0 || denom < 0.05) { toast(t('marginTooHigh'), 'err'); return; }
    (S.product.variants || []).filter((v) => v.is_enabled).forEach((v) => {
      const raw = (v.cost / 100) / denom;
      S.prices[v.id] = Math.floor(raw) + 0.99;
    });
    renderResults(false, true);
  }

  async function savePrices() {
    if (!S.product) return;
    const prices = {};
    Object.keys(S.prices).forEach((id) => { prices[id] = Math.round(S.prices[id] * 100); });
    try {
      const r = await callFn('printify-create-product', { action: 'update_product', productId: S.product.id, prices: prices });
      S.product = r.product;
      initPrices();
      renderResults(false, true);
      $('rMsg').innerHTML = '<div class="ok-box">' + esc(t('pricesSaved')) + '</div>';
      loadMyProducts();
    } catch (e) { toast(e.message, 'err'); }
  }

  // ---------- Yayınla (bağlı mağazalar) ----------
  const CHANNEL_NAMES = {
    etsy: 'Etsy', shopify: 'Shopify', woocommerce: 'WooCommerce', ebay: 'eBay', wix: 'Wix',
    tiktok: 'TikTok Shop', amazon: 'Amazon', bigcartel: 'Big Cartel', prestashop: 'PrestaShop',
    bigcommerce: 'BigCommerce', squarespace: 'Squarespace'
  };
  function channelName(c) { return CHANNEL_NAMES[String(c || '').toLowerCase()] || c || ''; }
  function shopLabel(s) {
    const ch = channelName(s.sales_channel);
    return s.title + (ch ? ' (' + ch + ')' : '');
  }

  async function loadPubShops() {
    S.pubShopsError = '';
    $('pubShopsInfo').innerHTML = '<div class="hint">' + esc(t('checkingShops')) + '</div>';
    try {
      const r = await callFn('printify-connect', { action: 'list_shops' });
      S.pubShops = (r.shops || []).filter((s) => s.sales_channel && String(s.sales_channel).toLowerCase() !== 'disconnected');
    } catch (e) {
      S.pubShops = null;
      S.pubShopsError = e.message;
    }
    renderPubShops();
  }

  function renderPubShops() {
    const info = $('pubShopsInfo');
    if (S.pubShopsError) {
      $('pubForm').style.display = 'none';
      info.innerHTML = '<div class="err">' + esc(S.pubShopsError) + '</div><button class="btn secondary small" onclick="loadPubShops()">' + esc(t('retry')) + '</button>';
      return;
    }
    if (S.pubShops === null) return;
    const shops = S.pubShops;
    if (!shops.length) {
      $('pubForm').style.display = 'none';
      info.innerHTML =
        '<div class="warn-box">' + t('noChannelShops') + '</div>' +
        '<button class="btn secondary small" onclick="loadPubShops()">' + esc(t('refreshedAgain')) + '</button>';
      return;
    }
    info.innerHTML = '<div class="row" style="margin-bottom:12px"><span class="hint" style="margin:0">' + esc(t('shopsFound', { n: shops.length })) + '</span>' +
      '<button class="btn secondary small" onclick="loadPubShops()">' + esc(t('refresh')) + '</button></div>';
    const prev = $('pubMain').value;
    $('pubMain').innerHTML = shops.map((s) => '<option value="' + esc(s.id) + '">' + esc(shopLabel(s)) + '</option>').join('');
    if (prev && shops.some((s) => String(s.id) === String(prev))) $('pubMain').value = prev;
    $('pubForm').style.display = 'block';
    renderPubExtra();
  }

  function renderPubExtra() {
    const main = $('pubMain').value;
    const others = (S.pubShops || []).filter((s) => String(s.id) !== String(main));
    const wrap = $('pubExtraWrap');
    const checked = Array.from(document.querySelectorAll('.pubExtraCheck:checked')).map((c) => c.value);
    if (!others.length) { wrap.style.display = 'none'; $('pubExtra').innerHTML = ''; return; }
    wrap.style.display = 'block';
    $('pubExtra').innerHTML = others.map((s) =>
      '<label class="pub-item"><input type="checkbox" class="pubExtraCheck" value="' + esc(s.id) + '"' + (checked.indexOf(String(s.id)) >= 0 ? ' checked' : '') + '>' +
      '<span>' + esc(s.title) + ' <small>' + esc(channelName(s.sales_channel)) + '</small></span></label>'
    ).join('');
  }

  async function translatePub() {
    if (!S.product) return;
    const btn = $('pubTransBtn');
    const title = $('pubTitleTr').value.trim();
    const description = $('pubDescTr').value.trim() || title;
    if (!title) { toast(t('needSrcTitle'), 'err'); return; }
    btn.disabled = true; btn.textContent = t('translating');
    try {
      const res = await fetch(FN + 'translate-listing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ title: title, description: description, tags: '', productName: title })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      $('pubTitle').value = data.titleEn || '';
      $('pubDesc').value = data.descriptionEn || '';
      $('pubTags').value = (data.tagsEn || []).join(', ');
      toast(t('translated'), 'good');
    } catch (e) {
      toast(t('translateFail') + e.message, 'err');
    } finally {
      btn.disabled = false; btn.textContent = t('translate');
    }
  }

  async function publishProduct() {
    if (!S.product) return;
    const title = $('pubTitle').value.trim();
    const description = $('pubDesc').value.trim();
    const tags = $('pubTags').value.split(',').map((x) => x.trim()).filter(Boolean);
    const main = $('pubMain').value;
    if (!main) { toast(t('pickPlatform'), 'err'); return; }
    if (!title || !description) { toast(t('needEn'), 'err'); return; }
    if (tags.length > 13) { toast(t('maxTags'), 'err'); return; }
    if (/[çğıöşüÇĞİÖŞÜ]/.test(title + ' ' + description) && !confirm(t('trCharsConfirm'))) return;

    const targets = [main].concat(Array.from(document.querySelectorAll('.pubExtraCheck:checked')).map((c) => c.value));
    const names = targets.map((id) => {
      const sh = (S.pubShops || []).find((x) => String(x.id) === String(id));
      return sh ? shopLabel(sh) : id;
    });
    if (!confirm(t('publishConfirm', { names: names.join('\n') }))) return;

    const btn = $('pubBtn');
    btn.disabled = true; btn.textContent = t('publishing');
    $('pubMsg').innerHTML = '<div class="hint">' + esc(t('sendingPrintify')) + '</div>';
    try {
      const r = await callFn('printify-publish', {
        action: 'publish', productId: String(S.product.id), sourceShopId: String(S.shopId),
        targetShopIds: targets, title: title, description: description, tags: tags
      });
      let h = '';
      (r.results || []).forEach((x) => {
        const sh = (S.pubShops || []).find((y) => String(y.id) === String(x.shopId));
        const nm = sh ? shopLabel(sh) : x.shopId;
        h += x.ok
          ? '<div class="ok-box"><b>' + esc(nm) + ':</b> ' + esc(t('pubOk')) + '</div>'
          : '<div class="err"><b>' + esc(nm) + ':</b> ' + esc(x.error || t('pubFail')) + '</div>';
      });
      $('pubMsg').innerHTML = h;
      loadMyProducts();
    } catch (e) {
      $('pubMsg').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    } finally {
      btn.disabled = false; btn.textContent = t('publish');
    }
  }

  async function addToPanel() {
    if (!S.product) return;
    const enabled = (S.product.variants || []).filter((v) => v.is_enabled);
    if (!enabled.length) { toast(t('noActive'), 'err'); return; }
    const cheapest = enabled.reduce((a, b) => (a.cost <= b.cost ? a : b));
    const imgs = uniqueImages(S.product.images);
    const row = {
      user_id: session.user.id,
      name: S.product.title,
      supplier_price: (cheapest.cost || 0) / 100,
      weight_kg: 0,
      platform: $('platformSel').value,
      commission_rate: commissionPct(),
      generated_title: S.product.title,
      generated_description: S.product.description || S.product.title,
      sale_price: S.prices[cheapest.id] || 0,
      supplier: 'printify',
      supplier_item_id: String(S.product.id),
      supplier_variant_id: String(cheapest.id),
      image_url: imgs.length ? imgs[0] : null
    };
    const { error } = await db.from('products').insert(row);
    if (error) {
      $('rMsg').innerHTML = '<div class="err">' + esc(t('panelFail')) + ': ' + esc(error.message) + '</div>';
      toast(t('panelFail'), 'err');
      return;
    }
    $('rMsg').innerHTML = '<div class="ok-box">' + esc(t('panelAdded')) + ' <a href="dashboard.html" style="color:#6ee7b7">' + esc(t('goPanel')) + '</a></div>';
    toast(t('panelToast'), 'good');
  }

  async function deleteCurrent() {
    if (!S.product) return;
    await deletePrintifyProduct(S.product.id);
  }

  // ---------- Ürünlerim ----------
  async function loadMyProducts() {
    if (S.myProducts === null) $('myGrid').innerHTML = '<div class="hint">' + esc(t('loading')) + '</div>';
    try {
      const r = await callFn('printify-create-product', { action: 'list_products' });
      S.myProducts = r.products || [];
      S.myError = '';
    } catch (e) {
      S.myError = e.message;
    }
    renderMyProducts();
  }

  function renderMyProducts() {
    const grid = $('myGrid');
    if (S.myError) { grid.innerHTML = '<div class="err">' + esc(S.myError) + '</div>'; return; }
    if (S.myProducts === null) { grid.innerHTML = '<div class="hint">' + esc(t('loading')) + '</div>'; return; }
    if (!S.myProducts.length) { grid.innerHTML = '<div class="hint">' + esc(t('noProducts')) + '</div>'; return; }
    let h = '';
    S.myProducts.forEach((p, i) => {
      h += '<div class="my">' + (p.image ? '<img loading="lazy" src="' + esc(p.image) + '" alt="">' : '<div style="aspect-ratio:1;background:#1a1f2c"></div>') +
        '<div class="my-t">' + esc(p.title) + '</div>' +
        '<div class="my-a"><button class="btn small" data-act="open" data-idx="' + i + '">' + esc(t('open')) + '</button>' +
        '<button class="btn danger small" data-act="del" data-idx="' + i + '">' + esc(t('del')) + '</button></div></div>';
    });
    grid.innerHTML = h;
  }
  $('myGrid').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b || !S.myProducts) return;
    const p = S.myProducts[Number(b.getAttribute('data-idx'))];
    if (!p) return;
    if (b.getAttribute('data-act') === 'open') openProduct(p.id);
    else deletePrintifyProduct(p.id);
  });

  async function openProduct(id) {
    try {
      const r = await callFn('printify-create-product', { action: 'get_product', productId: id });
      S.product = r.product;
      initPrices();
      renderResults(false);
    } catch (e) { toast(e.message, 'err'); }
  }

  async function deletePrintifyProduct(id) {
    if (!confirm(t('confirmDelete'))) return;
    try {
      await callFn('printify-create-product', { action: 'delete_product', productId: id });
      if (S.product && String(S.product.id) === String(id)) { S.product = null; $('resultCard').style.display = 'none'; }
      toast(t('deleted'));
      loadMyProducts();
    } catch (e) { toast(e.message, 'err'); }
  }

  // ---------- Dil değişimi ----------
  function onLangChange() {
    applyStatic();
    renderConnection();
    renderQuickChips();
    if (S.blueprints.length) renderBlueprints();
    if ($('provCard').style.display !== 'none' && S.providers.length) renderProviders();
    if (S.variants.length) {
      renderOptions();
      if ($('designCard').style.display !== 'none') renderDesigns();
    }
    if (S.product && $('resultCard').style.display !== 'none') renderResults(false, true, true);
    renderPubShops();
    if (S.myProducts !== null || S.myError) renderMyProducts();
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);

  // ---------- Başlat ----------
  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    applyStatic();
    renderConnection();
    const { data: { session: s } } = await db.auth.getSession();
    if (!s) { window.location.href = 'index.html'; return; }
    session = s;
    renderQuickChips();
    loadStudioDesign();
    await loadConnection();
    applyPreselect();
  }

  // Baskı Sağlayıcıları sayfasından gelindiyse (?bp=ürün türü&pp=atölye) ürün türü ve atölye hazır seçili gelir
  async function applyPreselect() {
    const params = new URLSearchParams(window.location.search);
    const bp = Number(params.get('bp'));
    const pp = Number(params.get('pp'));
    if (!bp) return;
    if (S.conn !== 'connected') return;
    const title = (params.get('t') || '').slice(0, 140);
    S.blueprints = [{ id: bp, title: title, brand: '', image: null }];
    renderBlueprints();
    await pickBlueprint(0);
    if (!pp) return;
    const j = S.providers.findIndex((p) => Number(p.id) === pp);
    if (j < 0) { toast(t('provNotFound'), 'err'); return; }
    await pickProvider(j);
    toast(t('preselected') + S.provider.title);
  }
  init();
</script>

</body>
</html>
