<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendyol Eşleştirme Testi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0d0f16; color: #e6e8ee; padding: 20px; max-width: 900px; margin: 0 auto; }
  h2 { margin-bottom: 16px; }
  label { display: block; margin: 12px 0 6px; color: #9aa3b2; font-size: 13px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; background: #1c212c; color: #fff; border: 1px solid #2a3040; border-radius: 8px; }
  textarea { min-height: 70px; }
  button { margin-top: 14px; padding: 11px 18px; font-size: 14px; cursor: pointer; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  .box { background: #141821; border: 1px solid #232838; border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
  .ok { color: #6ee7b7; } .warn { color: #f2d16b; } .err { color: #f28b8b; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-bottom: 1px solid #232838; vertical-align: top; }
  pre { background: #1c212c; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  details { margin-top: 16px; }
</style>
</head>
<body>
  <h2>Trendyol Eşleştirme Testi</h2>

  <label>Ürün adı</label>
  <input type="text" id="title" value="Kadın Pamuklu Uzun Kollu Pijama Takımı Lacivert">

  <label>Açıklama</label>
  <textarea id="desc">%100 pamuk, çiçek desenli, rahat kesim, M beden</textarea>

  <button id="btn" onclick="runTest()">Eşleştir</button>

  <div id="result"></div>

  <script src="app.js"></script>
  <script>
    function esc(s) { return HS.escapeHtml(s == null ? '' : String(s)); }

    async function runTest() {
      const btn = document.getElementById('btn');
      const out = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = 'Çalışıyor... (15-30 sn)';
      out.innerHTML = '';

      try {
        const { data, error } = await HS.db.functions.invoke('trendyol-match', {
          body: {
            title: document.getElementById('title').value,
            description: document.getElementById('desc').value
          }
        });
        const r = data || {};
        if (error || !r.ok) {
          let detail = r.error || (error && error.message) || 'bilinmeyen hata';
          if (error && error.context && error.context.json) {
            try { const j = await error.context.json(); detail = j.error || JSON.stringify(j); } catch (e) {}
          }
          out.innerHTML = '<div class="box err">Hata: ' + esc(detail) + '</div>';
          return;
        }

        let html = '<div class="box"><div class="ok"><b>Kategori:</b> ' + esc(r.category.path) +
          ' <small>(#' + esc(r.category.id) + ', güven: ' + Math.round((r.category.confidence || 0) * 100) + '%)</small></div>';
        if (r.alternatives && r.alternatives.length) {
          html += '<div style="margin-top:6px;color:#9aa3b2">Alternatifler: ' +
            r.alternatives.map(a => esc(a.path)).join(' · ') + '</div>';
        }
        html += '</div>';

        html += '<div class="box"><b>Marka:</b> ' +
          (r.brand.guess ? esc(r.brand.guess) + (r.brand.match ? ' <span class="ok">(Trendyol\'da bulundu #' + esc(r.brand.match.id) + ')</span>' : ' <span class="warn">(Trendyol\'da birebir bulunamadı)</span>')
                         : '<span style="color:#9aa3b2">Ürün metninde marka yok</span>') + '</div>';

        html += '<div class="box"><b>Zorunlu özellikler (' + r.attributes.length + ')</b><table>';
        r.attributes.forEach(a => {
          const val = a.value_name || a.custom_value;
          const cls = a.missing ? 'err' : (a.guessed ? 'warn' : 'ok');
          const note = a.missing ? 'eksik' : (a.guessed ? 'tahmin' : '');
          html += '<tr><td>' + esc(a.name) + '</td><td class="' + cls + '">' + (val ? esc(val) : '—') +
            (note ? ' <small>(' + note + ')</small>' : '') + '</td></tr>';
        });
        html += '</table></div>';

        html += '<div style="margin-top:10px;color:#9aa3b2;font-size:13px">Süre: ' + (r.ms / 1000).toFixed(1) + ' sn · Arama kelimeleri: ' + esc((r.keywords || []).join(', ')) + '</div>';
        html += '<details><summary>Ham sonuç</summary><pre>' + esc(JSON.stringify(r, null, 2)) + '</pre></details>';
        out.innerHTML = html;
      } catch (e) {
        out.innerHTML = '<div class="box err">Hata: ' + esc(e.message || e) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Eşleştir';
      }
    }

    HS.init({ auth: true });
  </script>
</body>
</html>
