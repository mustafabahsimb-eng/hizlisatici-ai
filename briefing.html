<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Haftalık Brifing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #1D9E75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .user-email { font-size: 13px; color: #9aa3b2; }
  .logout-btn {
    background: transparent;
    border: 1px solid #2a3040;
    color: #9aa3b2;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { border-color: #3a4258; color: #fff; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-top: 4px; }
  .btn-primary {
    background: #1D9E75;
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { background: #178a65; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    background: transparent;
    color: #9aa3b2;
    border: 1px solid #2a3040;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-secondary:hover { border-color: #3a4258; color: #fff; }

  .empty-briefing {
    padding: 60px 20px;
    text-align: center;
    color: #9aa3b2;
    background: #141821;
    border-radius: 14px;
    border: 1px solid #232838;
  }
  .empty-briefing h3 { color: #fff; font-size: 16px; margin-bottom: 6px; font-weight: 500; }
  .empty-briefing p { font-size: 14px; }

  .briefing-section { margin-bottom: 28px; }
  .briefing-section h2 { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .briefing-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .briefing-card {
    background: #1c212c;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #232838;
  }
  .briefing-card .name { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .briefing-card .meta { font-size: 12px; color: #9aa3b2; margin-bottom: 8px; }
  .briefing-card .profit { font-size: 15px; font-weight: 600; }
  .profit-positive { color: #5DCAA5; }
  .profit-negative { color: #f28b8b; }
  .no-data-note { color: #9aa3b2; font-size: 13px; }

  .trend-card {
    background: #141821;
    border: 1px solid #232838;
    border-radius: 14px;
    padding: 20px;
    font-size: 14px;
    line-height: 1.6;
    color: #e6e8ee;
  }

  .timestamp { font-size: 12px; color: #9aa3b2; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span class="user-email" id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Çıkış yap</button>
  </div>
</header>

<main>
  <div class="top-row">
    <div>
      <h1>Haftalık AI Brifingi</h1>
      <div class="subtitle">Ürünlerinin kâr/marj performansı ve trend özeti</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" onclick="window.location.href='dashboard.html'">← Panele Dön</button>
      <button class="btn-primary" id="generateBtn" onclick="generateBriefing()">🔄 Brifingi Oluştur</button>
    </div>
  </div>

  <div id="briefingContent">
    <div class="empty-briefing">
      <h3>Henüz brifing oluşturulmadı</h3>
      <p>Yukarıdaki "Brifingi Oluştur" butonuna basarak en kârlı/en düşük marjlı ürünlerini ve trend özetini gör.</p>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentSession = null;

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentSession = session;
    document.getElementById('userEmail').textContent = session.user.email;
  }

  async function generateBriefing() {
    const btn = document.getElementById('generateBtn');
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor...';
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/weekly-briefing', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ userAccessToken: currentSession.access_token }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      renderBriefing(data);
    } catch (err) {
      alert('Brifing oluşturulamadı: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  function productCardHtml(p) {
    const profitClass = p.netProfit >= 0 ? 'profit-positive' : 'profit-negative';
    const metaParts = [p.platform || '-'];
    if (p.category) metaParts.push(p.category);
    metaParts.push('%' + p.marginPct.toFixed(1) + ' marj');
    return `
      <div class="briefing-card">
        <div class="name">${escapeHtml(p.name || 'İsimsiz ürün')}</div>
        <div class="meta">${escapeHtml(metaParts.join(' · '))}</div>
        <div class="profit ${profitClass}">${p.symbol}${p.netProfit.toFixed(2)}</div>
      </div>
    `;
  }

  function renderBriefing(data) {
    const topHtml = data.topProducts && data.topProducts.length > 0
      ? data.topProducts.map(productCardHtml).join('')
      : '<div class="no-data-note">Fiyatlandırılmış ürün bulunamadı.</div>';

    const lowHtml = data.lowProducts && data.lowProducts.length > 0
      ? data.lowProducts.map(productCardHtml).join('')
      : '<div class="no-data-note">Fiyatlandırılmış ürün bulunamadı.</div>';

    const generatedDate = new Date(data.generatedAt).toLocaleString('tr-TR');

    document.getElementById('briefingContent').innerHTML = `
      <div class="briefing-section">
        <h2>🏆 En Kârlı Ürünlerin</h2>
        <div class="briefing-cards">${topHtml}</div>
      </div>
      <div class="briefing-section">
        <h2>⚠️ Marjı Düşük Ürünlerin</h2>
        <div class="briefing-cards">${lowHtml}</div>
      </div>
      <div class="briefing-section">
        <h2>🔥 Trend Kategori Özeti</h2>
        <div class="trend-card">${escapeHtml(data.trendSummary || '')}</div>
      </div>
      <div class="timestamp">Oluşturulma zamanı: ${generatedDate}</div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  init();
</script>

</body>
</html>
