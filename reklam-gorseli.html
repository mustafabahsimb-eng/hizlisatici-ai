const MAX_PRODUCTS = 20;
const PREVIEW_SCALE = 0.5;
const SETTINGS_KEY = 'hs_ad_settings';
const $ = (id) => document.getElementById(id);
const t = (k, v) => HS.t(k, v);

const TEMPLATES = {
  dark:  { bg: ['#0b1220', '#1f2937'], glow: 'rgba(250,204,21,0.22)', text: '#ffffff', sub: 'rgba(255,255,255,0.72)', price: '#facc15', priceText: '#111111', badge: '#ef4444', badgeText: '#ffffff', sw: '#1f2937' },
  light: { bg: ['#ffffff', '#e2e8f0'], glow: 'rgba(22,163,74,0.18)', text: '#0f172a', sub: '#475569', price: '#0f172a', priceText: '#ffffff', badge: '#dc2626', badgeText: '#ffffff', sw: '#e2e8f0' },
  sale:  { bg: ['#dc2626', '#7f1d1d'], glow: 'rgba(250,204,21,0.30)', text: '#ffffff', sub: 'rgba(255,255,255,0.82)', price: '#facc15', priceText: '#7f1d1d', badge: '#facc15', badgeText: '#7f1d1d', sw: '#dc2626' },
  brand: null // kullanıcının rengine göre hesaplanır
};

let S = { tpl: 'dark', color: '#1D9E75', store: '', phone: '', badge: '', cta: '', sq: true, st: true };
let products = [];      // { id, title, price, images[], idx, bmp, bmpFailed }
let homeCur = 'TRY';

// ---------- Ayarları hatırla ----------
function loadSettings() {
  try { Object.assign(S, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
  const meta = HS.user && HS.user.user_metadata && HS.user.user_metadata.ad_settings;
  if (meta && typeof meta === 'object') Object.assign(S, meta);
}
let saveTimer = null;
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    HS.db.auth.updateUser({ data: { ad_settings: S } }).catch(() => {});
  }, 1500);
}

// ---------- Yardımcılar ----------
function darken(hex, k) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  if (isNaN(n)) return '#111111';
  const r = Math.round(((n >> 16) & 255) * (1 - k)), g = Math.round(((n >> 8) & 255) * (1 - k)), b = Math.round((n & 255) * (1 - k));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}
function theme() {
  if (S.tpl !== 'brand') return TEMPLATES[S.tpl] || TEMPLATES.dark;
  const c = /^#[0-9a-f]{6}$/i.test(S.color) ? S.color : '#1D9E75';
  return { bg: [c, darken(c, 0.55)], glow: 'rgba(255,255,255,0.18)', text: '#ffffff', sub: 'rgba(255,255,255,0.8)', price: '#ffffff', priceText: darken(c, 0.35), badge: '#facc15', badgeText: '#111111', sw: c };
}
function priceText(v, cur) {
  if (!(v > 0)) return '';
  if (v >= 100) v = Math.round(v); // reklamda kuruş göstermeyelim
  const frac = Math.round(v * 100) % 100 !== 0;
  try {
    return new Intl.NumberFormat(HS.lang === 'en' ? 'en-US' : 'tr-TR', {
      style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol',
      minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2
    }).format(v);
  } catch (e) { return v + ' ' + cur; }
}
function shortTitle(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (s.length <= 70) return s;
  const cut = s.slice(0, 70);
  return cut.slice(0, Math.max(40, cut.lastIndexOf(' '))).replace(/[,\-–|:;\s]+$/, '');
}
function fileName(p, kind) {
  const base = String(p.title || 'urun').toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'urun';
  return base + '-' + kind + '.jpg';
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Yazıyı en fazla maxLines satıra sığdır; sığmazsa küçült, yine sığmazsa "…" ile kes
function fitLines(ctx, text, maxW, maxLines, size, minSize, weight) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  for (let fs = size; fs >= minSize; fs -= 2) {
    ctx.font = weight + ' ' + fs + 'px Poppins, sans-serif';
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW) cur = test;
      else { if (cur) lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    const fits = lines.every(l => ctx.measureText(l).width <= maxW);
    if (lines.length <= maxLines && fits) return { lines, fs };
    if (fs - 2 < minSize) {
      const out = lines.slice(0, maxLines);
      let last = out[out.length - 1] || '';
      while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      out[out.length - 1] = last.trim() + (lines.length > maxLines || !fits ? '…' : '');
      return { lines: out, fs };
    }
  }
  return { lines: [], fs: minSize };
}

// ---------- Resim getirme (başka sitelerin resmi için image-proxy) ----------
function isOwnStorage(u) {
  try { return new URL(u).hostname === new URL(HS.SUPABASE_URL).hostname; } catch (e) { return false; }
}
async function fetchBlob(u) {
  if (isOwnStorage(u)) {
    const r = await fetch(u);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.blob();
  }
  try {
    const r = await fetch(u, { mode: 'cors' });
    if (r.ok) { const b = await r.blob(); if (b.type.indexOf('image/') === 0) return b; }
  } catch (e) {}
  const r = await fetch(HS.SUPABASE_URL + '/functions/v1/image-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
    body: JSON.stringify({ url: u })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.blob();
}
async function ensureBitmap(p) {
  const url = p.images[p.idx];
  if (!url) { p.bmp = null; p.bmpFailed = true; return; }
  if (p.bmpUrl === url && (p.bmp || p.bmpFailed)) return;
  p.bmpUrl = url; p.bmp = null; p.bmpFailed = false;
  try {
    p.bmp = await createImageBitmap(await fetchBlob(url));
  } catch (e) {
    console.warn('resim açılamadı', url, e);
    if (p.bmpUrl === url) p.bmpFailed = true;
  }
}

// ---------- Çizim ----------
// Tüm ölçüler 1080 genişliğe göre; kare 1080×1080, dikey 1080×1920
function draw(canvas, p, kind, scale) {
  const W = 1080, H = kind === 'st' ? 1920 : 1080;
  canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const th = theme();
  const st = kind === 'st';
  const L = st
    ? { pad: 70, storeY: 150, storeFs: 42, cardY: 225, gap: 40, titleFs: 68, titleMin: 46, titleLines: 3, priceH: 140, priceFs: 90, ctaH: 118, ctaFs: 46, bottom: 1830, badgeFs: 62, badgeH: 116 }
    : { pad: 60, storeY: 66, storeFs: 34, cardY: 116, gap: 22, titleFs: 52, titleMin: 38, titleLines: 2, priceH: 100, priceFs: 64, ctaH: 84, ctaFs: 36, bottom: 1040, badgeFs: 46, badgeH: 86 };
  const cardX = L.pad, cardW = W - L.pad * 2;

  // Arka plan
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, th.bg[0]); g.addColorStop(1, th.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Ölçüleri önce hesapla: ürün adı + fiyat + WhatsApp çubuğu alttan yerleşir, kalan yükseklik ürün fotoğrafının
  const tl = fitLines(ctx, p.title, cardW, L.titleLines, L.titleFs, L.titleMin, '700');
  const lh = Math.round(tl.fs * 1.2);
  const titleH = tl.lines.length * lh;
  const pt = p.price;
  const hasCta = !!(S.cta || S.phone);
  const cardH = L.bottom - L.cardY - L.gap - titleH - (pt ? L.gap + L.priceH : 0) - (hasCta ? L.gap + L.ctaH : 0);

  const cx = W / 2, cy = L.cardY + cardH / 2;
  const rg = ctx.createRadialGradient(cx, cy, 50, cx, cy, W * 0.75);
  rg.addColorStop(0, th.glow); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // Mağaza adı
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  if (S.store) {
    ctx.fillStyle = th.sub;
    const f = fitLines(ctx, S.store.toLocaleUpperCase(HS.lang === 'en' ? 'en' : 'tr'), cardW - (S.badge ? (st ? 420 : 340) : 0), 1, L.storeFs, 22, '700');
    ctx.font = '700 ' + f.fs + 'px Poppins, sans-serif';
    ctx.fillText(f.lines[0] || '', L.pad, L.storeY);
  }

  // Ürün kartı (fotoğraf olduğu gibi, beyaz zemin üstünde)
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  ctx.fillStyle = '#ffffff';
  rr(ctx, cardX, L.cardY, cardW, cardH, 36); ctx.fill();
  ctx.restore();
  if (p.bmp) {
    const ip = 30, bw = cardW - ip * 2, bh = cardH - ip * 2;
    const k = Math.min(bw / p.bmp.width, bh / p.bmp.height);
    const dw = p.bmp.width * k, dh = p.bmp.height * k;
    ctx.save();
    rr(ctx, cardX, L.cardY, cardW, cardH, 36); ctx.clip();
    ctx.drawImage(p.bmp, cardX + (cardW - dw) / 2, L.cardY + (cardH - dh) / 2, dw, dh);
    ctx.restore();
  } else if (!p.bmpFailed) {
    ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
    ctx.font = '500 34px Poppins, sans-serif';
    ctx.fillText('…', W / 2, L.cardY + cardH / 2);
    ctx.textAlign = 'left';
  }

  // Köşe rozeti: büyük, hafif eğik, kartın sağ üst köşesine taşan etiket
  if (S.badge) {
    const txt = S.badge.toLocaleUpperCase(HS.lang === 'en' ? 'en' : 'tr');
    const bf = fitLines(ctx, txt, cardW * 0.6, 1, L.badgeFs, 24, '800');
    ctx.font = '800 ' + bf.fs + 'px Poppins, sans-serif';
    const bw = ctx.measureText(bf.lines[0] || '').width + L.badgeH * 0.9;
    const bh = L.badgeH;
    const bcx = W - L.pad - bw / 2 + 14, bcy = L.cardY + 8;
    ctx.save();
    ctx.translate(bcx, bcy);
    ctx.rotate(-6 * Math.PI / 180);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    ctx.fillStyle = th.badge; rr(ctx, -bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = st ? 6 : 5; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    rr(ctx, -bw / 2, -bh / 2, bw, bh, bh / 2); ctx.stroke();
    ctx.fillStyle = th.badgeText; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bf.lines[0] || '', 0, 3);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // Ürün adı (kartın hemen altında)
  let y = L.cardY + cardH + L.gap;
  ctx.fillStyle = th.text;
  ctx.font = '700 ' + tl.fs + 'px Poppins, sans-serif';
  ctx.textBaseline = 'top';
  tl.lines.forEach((line, i) => ctx.fillText(line, L.pad, y + i * lh));
  y += titleH;

  // Fiyat (ürün adının hemen altında)
  ctx.textBaseline = 'middle';
  if (pt) {
    y += L.gap;
    ctx.font = '800 ' + L.priceFs + 'px Poppins, sans-serif';
    const pw = Math.min(ctx.measureText(pt).width + 80, cardW);
    ctx.fillStyle = th.price; rr(ctx, L.pad, y, pw, L.priceH, 24); ctx.fill();
    ctx.fillStyle = th.priceText;
    ctx.fillText(pt, L.pad + 40, y + L.priceH / 2 + 3, pw - 80);
    y += L.priceH;
  }

  // WhatsApp çubuğu (en altta)
  if (hasCta) {
    const ctaY = L.bottom - L.ctaH;
    ctx.fillStyle = '#25D366'; rr(ctx, L.pad, ctaY, cardW, L.ctaH, L.ctaH / 2); ctx.fill();
    const label = [S.cta, S.phone].filter(Boolean).join('  ·  ');
    const iconFs = Math.round(L.ctaFs * 1.25);
    ctx.font = '400 ' + iconFs + 'px "Font Awesome 6 Brands"';
    const iw = ctx.measureText('\uf232').width;
    const lf = fitLines(ctx, label, cardW - iw - 120, 1, L.ctaFs, 22, '700');
    ctx.font = '700 ' + lf.fs + 'px Poppins, sans-serif';
    const tw = ctx.measureText(lf.lines[0] || '').width;
    const x = (W - (iw + 18 + tw)) / 2;
    ctx.fillStyle = '#ffffff';
    ctx.font = '400 ' + iconFs + 'px "Font Awesome 6 Brands"';
    ctx.fillText('\uf232', x, ctaY + L.ctaH / 2 + 2);
    ctx.font = '700 ' + lf.fs + 'px Poppins, sans-serif';
    ctx.fillText(lf.lines[0] || '', x + iw + 18, ctaY + L.ctaH / 2 + 3);
  }
}

// ---------- Ekran ----------
function kinds() { return [S.sq ? 'sq' : null, S.st ? 'st' : null].filter(Boolean); }

function renderTemplates() {
  const row = $('tplRow');
  row.innerHTML = '';
  ['dark', 'light', 'sale', 'brand'].forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tpl-btn' + (S.tpl === k ? ' active' : '');
    const sw = k === 'brand' ? S.color : TEMPLATES[k].sw;
    b.innerHTML = '<span class="tpl-sw" style="background:' + sw + '"></span>' + HS.escapeHtml(t('ad.tpl.' + k));
    b.onclick = () => { S.tpl = k; saveSettings(); renderTemplates(); redrawAll(); };
    row.appendChild(b);
  });
  if (S.tpl === 'brand') {
    const c = document.createElement('input');
    c.type = 'color'; c.value = S.color; c.title = t('ad.brandColor');
    c.oninput = () => { S.color = c.value; saveSettings(); const s = row.querySelector('.tpl-btn.active .tpl-sw'); if (s) s.style.background = c.value; redrawAll(); };
    row.appendChild(c);
  }
}

function renderList() {
  const list = $('list');
  list.innerHTML = '';
  products.forEach((p, i) => {
    const box = document.createElement('div');
    box.className = 'card prod';
    box.innerHTML =
      '<div class="prod-head"><div class="prod-name"></div>' +
      '<div class="img-nav"><span>' + HS.escapeHtml(t('ad.photo')) + '</span>' +
      '<button class="btn btn-sec btn-sm" data-a="prev">◀</button><span data-a="idx"></span>' +
      '<button class="btn btn-sec btn-sm" data-a="next">▶</button></div></div>' +
      '<div class="prod-fields">' +
      '<div class="field"><label>' + HS.escapeHtml(t('ad.prodTitle')) + '</label><input type="text" data-a="title" maxlength="120"></div>' +
      '<div class="field"><label>' + HS.escapeHtml(t('ad.prodPrice')) + '</label><input type="text" data-a="price" maxlength="30" placeholder="' + HS.escapeHtml(t('ad.prodPricePh')) + '"></div>' +
      '</div>' +
      '<div class="previews"></div><div class="warn hidden" data-a="warn"></div>';
    box.querySelector('.prod-name').textContent = (i + 1) + '. ' + (p.origTitle || '');
    const ti = box.querySelector('[data-a="title"]'); ti.value = p.title;
    ti.oninput = () => { p.title = ti.value; redraw(p); };
    const pi = box.querySelector('[data-a="price"]'); pi.value = p.price;
    pi.oninput = () => { p.price = pi.value.trim(); redraw(p); };
    const nav = box.querySelector('.img-nav');
    if (p.images.length < 2) nav.classList.add('hidden');
    box.querySelector('[data-a="prev"]').onclick = () => { p.idx = (p.idx - 1 + p.images.length) % p.images.length; loadAndDraw(p); };
    box.querySelector('[data-a="next"]').onclick = () => { p.idx = (p.idx + 1) % p.images.length; loadAndDraw(p); };
    const pv = box.querySelector('.previews');
    p.canvases = {};
    kinds().forEach(k => {
      const d = document.createElement('div');
      d.className = 'pv ' + k;
      d.innerHTML = '<div class="pv-label">' + HS.escapeHtml(t('ad.' + k)) + '</div><canvas></canvas><div class="pv-btns"></div>';
      const btns = d.querySelector('.pv-btns');
      const dl = document.createElement('button');
      dl.className = 'btn btn-sec btn-sm'; dl.textContent = t('ad.download');
      dl.onclick = () => downloadOne(p, k);
      btns.appendChild(dl);
      if (canShareFiles()) {
        const sh = document.createElement('button');
        sh.className = 'btn btn-sm'; sh.textContent = t('ad.share');
        sh.onclick = () => shareFiles([{ p, k }]);
        btns.appendChild(sh);
      }
      pv.appendChild(d);
      p.canvases[k] = d.querySelector('canvas');
    });
    p.box = box;
    list.appendChild(box);
    redraw(p);
  });
  updateButtons();
}

function redraw(p) {
  if (!p.canvases) return;
  Object.keys(p.canvases).forEach(k => draw(p.canvases[k], p, k, PREVIEW_SCALE));
  const idx = p.box && p.box.querySelector('[data-a="idx"]');
  if (idx) idx.textContent = (p.idx + 1) + '/' + p.images.length;
  const w = p.box && p.box.querySelector('[data-a="warn"]');
  if (w) { w.textContent = t('ad.noImage'); w.classList.toggle('hidden', !p.bmpFailed); }
}
let redrawTimer = null;
function redrawAll() {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => products.forEach(redraw), 60);
}
async function loadAndDraw(p) {
  redraw(p);
  await ensureBitmap(p);
  redraw(p);
}

function updateButtons() {
  const n = products.length * kinds().length;
  $('btnDownloadAll').textContent = t('ad.downloadAll', { n });
  $('btnDownloadAll').disabled = n === 0;
  const sa = $('btnShareAll');
  sa.textContent = t('ad.shareAll', { n: Math.min(n, 10) });
  sa.classList.toggle('hidden', !canShareFiles() || n === 0);
  $('status').textContent = kinds().length ? '' : t('ad.noSize');
}

// ---------- İndir / paylaş ----------
function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/jpeg' })], 'a.jpg', { type: 'image/jpeg' })] }));
  } catch (e) { return false; }
}
async function makeFile(p, k) {
  await ensureBitmap(p);
  const c = document.createElement('canvas');
  draw(c, p, k, 1);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
  c.width = c.height = 1;
  return new File([blob], fileName(p, k === 'st' ? 'dikey' : 'kare'), { type: 'image/jpeg' });
}
function saveFile(file) {
  const a = document.createElement('a');
  const u = URL.createObjectURL(file);
  a.href = u; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
async function downloadOne(p, k) {
  saveFile(await makeFile(p, k));
}
async function downloadAll() {
  const jobs = [];
  products.forEach(p => kinds().forEach(k => jobs.push({ p, k })));
  const btn = $('btnDownloadAll'); btn.disabled = true;
  for (let i = 0; i < jobs.length; i++) {
    $('status').textContent = t('ad.preparing', { i: i + 1, n: jobs.length });
    saveFile(await makeFile(jobs[i].p, jobs[i].k));
    await new Promise(r => setTimeout(r, 450));
  }
  $('status').textContent = t('ad.done', { n: jobs.length });
  btn.disabled = false;
}
async function shareFiles(jobs) {
  try {
    const files = [];
    for (let i = 0; i < jobs.length; i++) {
      if (jobs.length > 1) $('status').textContent = t('ad.preparing', { i: i + 1, n: jobs.length });
      files.push(await makeFile(jobs[i].p, jobs[i].k));
    }
    $('status').textContent = '';
    await navigator.share({ files });
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.warn(e);
    $('status').textContent = t('ad.shareFail');
  }
}
function shareAll() {
  const jobs = [];
  products.forEach(p => kinds().forEach(k => jobs.push({ p, k })));
  shareFiles(jobs.slice(0, 10));
}

// ---------- Veriler ----------
async function loadProducts(ids) {
  const db = HS.db;
  const [pr, im, li, ss] = await Promise.all([
    db.from('products').select('*').in('id', ids),
    db.from('product_images').select('product_id, url, position').in('product_id', ids).order('position', { ascending: true }),
    db.from('listings').select('product_id, price, currency, marketplace_code').in('product_id', ids).eq('marketplace_code', 'own_store').is('deleted_at', null),
    db.from('store_settings').select('*').eq('user_id', HS.user.id).limit(1)
  ]);
  if (pr.error) throw pr.error;
  const store = (ss.data && ss.data[0]) || {};
  const storeName = store.store_name || store.business_name || store.name || '';
  const imgs = {}, lst = {};
  (im.data || []).forEach(r => { (imgs[r.product_id] = imgs[r.product_id] || []).push(r.url); });
  (li.data || []).forEach(r => { lst[r.product_id] = r; });
  const order = new Map(ids.map((id, i) => [String(id), i]));
  const rows = (pr.data || []).sort((a, b) => order.get(String(a.id)) - order.get(String(b.id)));
  const out = [];
  for (const p of rows) {
    const list = [];
    if (p.image_url) list.push(p.image_url);
    (imgs[p.id] || []).forEach(u => { if (list.indexOf(u) === -1) list.push(u); });
    const l = lst[p.id];
    let v = null, c = homeCur;
    if (l && Number(l.price) > 0) { v = Number(l.price); c = l.currency || 'TRY'; }
    else if (Number(p.sale_price) > 0) { v = Number(p.sale_price); c = p.cost_currency || 'TRY'; }
    if (v && c !== homeCur) {
      try { const x = await HS.convert(v, c, homeCur); if (x != null && x > 0) { v = Math.round(x * 100) / 100; c = homeCur; } } catch (e) {}
    }
    const full = p.generated_title || p.name || '';
    out.push({
      id: p.id, origTitle: full, title: shortTitle(full),
      price: v ? priceText(v, c) : '',
      images: list.filter(u => /^https?:\/\//i.test(u)), idx: 0, bmp: null, bmpFailed: false
    });
  }
  return { list: out, storeName };
}

function bindSettings() {
  const map = [['fStore', 'store'], ['fPhone', 'phone'], ['fBadge', 'badge'], ['fCta', 'cta']];
  map.forEach(([id, key]) => {
    const el = $(id);
    el.value = S[key] || '';
    el.oninput = () => { S[key] = el.value.trim(); saveSettings(); redrawAll(); };
  });
  $('szSq').checked = !!S.sq; $('szSt').checked = !!S.st;
  $('szSq').onchange = () => { S.sq = $('szSq').checked; saveSettings(); renderList(); };
  $('szSt').onchange = () => { S.st = $('szSt').checked; saveSettings(); renderList(); };
}

async function start() {
  const ok = await HS.init();
  if (!ok) return;
  homeCur = HS.homeCurrency();
  let ids = (new URLSearchParams(location.search).get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  ids = Array.from(new Set(ids));
  if (!ids.length) {
    $('loading').classList.add('hidden');
    const e = $('emptyBox');
    e.innerHTML = HS.escapeHtml(t('ad.noIds')) + '<br><br><a href="dashboard.html">' + HS.escapeHtml(t('ad.goDash')) + '</a>';
    e.classList.remove('hidden');
    return;
  }
  const tooMany = ids.length > MAX_PRODUCTS;
  ids = ids.slice(0, MAX_PRODUCTS);
  loadSettings();
  let data;
  try {
    data = await loadProducts(ids);
  } catch (err) {
    console.error(err);
    $('loading').textContent = t('ad.loadErr') + (err.message || err);
    return;
  }
  if (!S.store) S.store = data.storeName || '';
  if (!S.cta) S.cta = t('ad.ctaDefault');
  products = data.list;
  // Yazı tiplerini bekle ki görseller doğru yazıyla çizilsin
  try {
    await Promise.all([
      document.fonts.load('700 40px Poppins'), document.fonts.load('800 40px Poppins'),
      document.fonts.load('400 40px "Font Awesome 6 Brands"')
    ]);
  } catch (e) {}
  $('loading').classList.add('hidden');
  $('app').classList.remove('hidden');
  bindSettings();
  renderTemplates();
  renderList();
  if (tooMany) $('status').textContent = t('ad.tooMany', { n: MAX_PRODUCTS });
  // Resimleri 3'er 3'er yükle
  let next = 0;
  const worker = async () => { while (next < products.length) { const p = products[next++]; await loadAndDraw(p); } };
  await Promise.all([worker(), worker(), worker()]);
}

window.addEventListener('hs:langchange', () => { if (products.length) { renderTemplates(); renderList(); } });
start();
</script>
