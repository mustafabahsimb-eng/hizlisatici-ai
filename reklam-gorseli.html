const MAX_PRODUCTS = 20;
const PREVIEW_SCALE = 0.5;
const SETTINGS_KEY = 'hs_ad_settings';
const $ = (id) => document.getElementById(id);
const t = (k, v) => HS.t(k, v);

const TEMPLATES = {
  dark:  { bg: ['#0b1220', '#1f2937'], glow: 'rgba(250,204,21,0.22)', text: '#ffffff', sub: 'rgba(255,255,255,0.72)', price: '#facc15', priceText: '#111111', badge: '#ef4444', badgeText: '#ffffff', sw: '#1f2937' },
  light: { bg: ['#ffffff', '#e2e8f0'], glow: 'rgba(22,163,74,0.18)', text: '#0f172a', sub: '#475569', price: '#0f172a', priceText: '#ffffff', badge: '#dc2626', badgeText: '#ffffff', sw: '#e2e8f0' },
  sale:  { bg: ['#dc2626', '#7f1d1d'], glow: 'rgba(250,204,21,0.30)', text: '#ffffff', sub: 'rgba(255,255,255,0.82)', price: '#facc15', priceText: '#7f1d1d', badge: '#facc15', badgeText: '#7f1d1d', sw: '#dc2626' },
  brand: null // kullanıcının rengine göre hesaplanır
};

let S = { tpl: 'dark', color: '#1D9E75', store: '', phone: '', badge: '', cta: '', sq: true, st: true };
let products = [];      // { id, title, price, images[], idx, bmp, bmpFailed }
let homeCur = 'TRY';

// ---------- Ayarları hatırla ----------
function loadSettings() {
  try { Object.assign(S, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
  const meta = HS.user && HS.user.user_metadata && HS.user.user_metadata.ad_settings;
  if (meta && typeof meta === 'object') Object.assign(S, meta);
}
let saveTimer = null;
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    HS.db.auth.updateUser({ data: { ad_settings: S } }).catch(() => {});
  }, 1500);
}

// ---------- Yardımcılar ----------
function darken(hex, k) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  if (isNaN(n)) return '#111111';
  const r = Math.round(((n >> 16) & 255) * (1 - k)), g = Math.round(((n >> 8) & 255) * (1 - k)), b = Math.round((n & 255) * (1 - k));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}
function theme() {
  if (S.tpl !== 'brand') return TEMPLATES[S.tpl] || TEMPLATES.dark;
  const c = /^#[0-9a-f]{6}$/i.test(S.color) ? S.color : '#1D9E75';
  return { bg: [c, darken(c, 0.55)], glow: 'rgba(255,255,255,0.18)', text: '#ffffff', sub: 'rgba(255,255,255,0.8)', price: '#ffffff', priceText: darken(c, 0.35), badge: '#facc15', badgeText: '#111111', sw: c };
}
function priceText(v, cur) {
  if (!(v > 0)) return '';
  const frac = Math.round(v * 100) % 100 !== 0;
  try {
    return new Intl.NumberFormat(HS.lang === 'en' ? 'en-US' : 'tr-TR', {
      style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol',
      minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2
    }).format(v);
  } catch (e) { return v + ' ' + cur; }
}
function shortTitle(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (s.length <= 70) return s;
  const cut = s.slice(0, 70);
  return cut.slice(0, Math.max(40, cut.lastIndexOf(' '))).replace(/[,\-–|:;\s]+$/, '');
}
function fileName(p, kind) {
  const base = String(p.title || 'urun').toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'urun';
  return base + '-' + kind + '.jpg';
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Yazıyı en fazla maxLines satıra sığdır; sığmazsa küçült, yine sığmazsa "…" ile kes
function fitLines(ctx, text, maxW, maxLines, size, minSize, weight) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  for (let fs = size; fs >= minSize; fs -= 2) {
    ctx.font = weight + ' ' + fs + 'px Poppins, sans-serif';
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW) cur = test;
      else { if (cur) lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    const fits = lines.every(l => ctx.measureText(l).width <= maxW);
    if (lines.length <= maxLines && fits) return { lines, fs };
    if (fs - 2 < minSize) {
      const out = lines.slice(0, maxLines);
      let last = out[out.length - 1] || '';
      while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      out[out.length - 1] = last.trim() + (lines.length > maxLines || !fits ? '…' : '');
      return { lines: out, fs };
    }
  }
  return { lines: [], fs: minSize };
}

// ---------- Resim getirme (başka sitelerin resmi için image-proxy) ----------
function isOwnStorage(u) {
  try { return new URL(u).hostname === new URL(HS.SUPABASE_URL).hostname; } catch (e) { return false; }
}
async function fetchBlob(u) {
  if (isOwnStorage(u)) {
    const r = await fetch(u);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.blob();
  }
  try {
    const r = await fetch(u, { mode: 'cors' });
    if (r.ok) { const b = await r.blob(); if (b.type.indexOf('image/') === 0) return b; }
  } catch (e) {}
  const r = await fetch(HS.SUPABASE_URL + '/functions/v1/image-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + HS.SUPABASE_KEY, 'apikey': HS.SUPABASE_KEY },
    body: JSON.stringify({ url: u })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.blob();
}
async function ensureBitmap(p) {
  const url = p.images[p.idx];
  if (!url) { p.bmp = null; p.bmpFailed = true; return; }
  if (p.bmpUrl === url && (p.bmp || p.bmpFailed)) return;
  p.bmpUrl = url; p.bmp = null; p.bmpFailed = false;
  try {
    p.bmp = await createImageBitmap(await fetchBlob(url));
  } catch (e) {
    console.warn('resim açılamadı', url, e);
    if (p.bmpUrl === url) p.bmpFailed = true;
  }
}

// ---------- Çizim ----------
// Tüm ölçüler 1080 genişliğe göre; kare 1080×1080, dikey 1080×1920
function draw(canvas, p, kind, scale) {
  const W = 1080, H = kind === 'st' ? 1920 : 1080;
  canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const th = theme();
  const L = kind === 'st'
    ? { pad: 70, storeY: 170, storeFs: 40, cardY: 250, cardH: 900, titleY: 1200, titleFs: 64, titleMin: 44, titleLines: 3, priceH: 130, priceFs: 82, ctaH: 110, ctaFs: 44, bottom: 1750 }
    : { pad: 60, storeY: 72, storeFs: 34, cardY: 125, cardH: 525, titleY: 678, titleFs: 50, titleMin: 36, titleLines: 2, priceH: 100, priceFs: 62, ctaH: 84, ctaFs: 36, bottom: 1030 };

  // Arka plan
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, th.bg[0]); g.addColorStop(1, th.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = L.cardY + L.cardH / 2;
  const rg = ctx.createRadialGradient(cx, cy, 50, cx, cy, W * 0.75);
  rg.addColorStop(0, th.glow); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // Mağaza adı
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  if (S.store) {
    ctx.fillStyle = th.sub;
    const f = fitLines(ctx, S.store.toLocaleUpperCase(HS.lang === 'en' ? 'en' : 'tr'), W - L.pad * 2 - (S.badge ? 330 : 0), 1, L.storeFs, 22, '700');
    ctx.font = '700 ' + f.fs + 'px Poppins, sans-serif';
    ctx.fillText(f.lines[0] || '', L.pad, L.storeY);
  }

  // Ürün kartı (fotoğraf olduğu gibi, beyaz zemin üstünde)
  const cardX = L.pad, cardW = W - L.pad * 2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  ctx.fillStyle = '#ffffff';
  rr(ctx, cardX, L.cardY, cardW, L.cardH, 36); ctx.fill();
