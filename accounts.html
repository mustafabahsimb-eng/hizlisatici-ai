<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Hesaplarım</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16; color: #e6e8ee; min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; border-bottom: 1px solid #232838; background: #141821; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px; background: #1D9E75;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .back-link { color: #9aa3b2; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .back-link:hover { color: #fff; }

  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #9aa3b2; margin-bottom: 18px; line-height: 1.5; }
  .secure-note {
    font-size: 12px; color: #9aa3b2; background: #141821; border: 1px solid #232838;
    border-left: 3px solid #1D9E75; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; line-height: 1.5;
  }
  .section-title {
    font-size: 14px; font-weight: 600; color: #9aa3b2; text-transform: uppercase;
    letter-spacing: 0.03em; margin: 28px 0 12px;
  }

  .acc-list { background: #141821; border-radius: 14px; border: 1px solid #232838; overflow: hidden; }
  .acc-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; border-bottom: 1px solid #232838; gap: 14px;
  }
  .acc-row:last-child { border-bottom: none; }
  .acc-info { flex: 1; min-width: 0; }
  .acc-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .acc-desc { font-size: 12px; color: #9aa3b2; line-height: 1.5; }
  .inline-link { color: #6ee7b7; text-decoration: none; }
  .inline-link:hover { text-decoration: underline; }

  .conn-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .conn-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #c3c9d4; }
  .conn-env { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #1c2130; color: #9aa3b2; border: 1px solid #2a3040; }
  .conn-env.live { color: #6ee7b7; border-color: #1f4d3a; }
  .conn-remove {
    background: none; border: none; color: #f87171; font-size: 12px; cursor: pointer; padding: 0 2px;
  }
  .conn-remove:hover { text-decoration: underline; }
  .conn-date { color: #6b7385; font-size: 11px; }

  .acc-status { font-size: 11px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  .acc-status.connected { background: #123222; color: #6ee7b7; }
  .acc-status.pending { background: #2e2712; color: #f2d16b; }
  .acc-status.test { background: #1b2540; color: #93b4ff; }
  .acc-status.error { background: #3a1616; color: #f87171; }
  .acc-status.none { background: #232838; color: #9aa3b2; }

  .acc-btn {
    background: #1D9E75; color: #fff; border: none; padding: 9px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; display: inline-block;
  }
  .acc-btn:hover { background: #178a65; }
  .acc-btn.secondary { background: transparent; color: #9aa3b2; border: 1px solid #2a3040; }
  .acc-btn.secondary:hover { border-color: #3a4258; color: #fff; }
  .acc-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .acc-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-box {
    background: #141821; border: 1px solid #232838; border-radius: 14px;
    padding: 24px; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto;
  }
  .modal-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .modal-sub { font-size: 12px; color: #9aa3b2; margin-bottom: 16px; line-height: 1.5; }
  .modal-label { font-size: 12px; color: #9aa3b2; margin-bottom: 5px; display: block; }
  .modal-input {
    width: 100%; background: #0d0f16; border: 1px solid #2a3040; border-radius: 8px;
    padding: 10px 12px; color: #e6e8ee; font-size: 13px; margin-bottom: 14px;
  }
  .modal-input:focus { outline: none; border-color: #1D9E75; }
  /* Gizli alan: şifre kutusu gibi noktalı görünür ama Chrome "şifre kaydedilsin mi" diye sormaz */
  .secret-input { -webkit-text-security: disc; text-security: disc; }
  .env-group { display: flex; gap: 8px; margin-bottom: 8px; }
  .env-opt {
    flex: 1; border: 1px solid #2a3040; border-radius: 8px; padding: 10px; cursor: pointer;
    font-size: 13px; color: #c3c9d4; display: flex; align-items: center; gap: 8px; background: #0d0f16;
  }
  .env-opt input { accent-color: #1D9E75; }
  .env-opt.active { border-color: #1D9E75; color: #fff; }
  .env-help { font-size: 11px; color: #6b7385; margin-bottom: 14px; line-height: 1.5; }
  .modal-error { font-size: 12px; color: #f87171; margin-bottom: 10px; min-height: 16px; white-space: pre-wrap; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #141821; border: 1px solid #1D9E75; color: #fff; padding: 12px 18px;
    border-radius: 10px; font-size: 13px; z-index: 200; display: none; max-width: 90vw;
  }
  .toast.err { border-color: #f87171; }

  @media (max-width: 560px) {
    .acc-row { flex-direction: column; }
    .acc-right { justify-content: flex-start; }
    header { padding: 14px 16px; }
    main { padding: 24px 16px 80px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <span id="langSwitcherHost"></span>
    <a href="dashboard.html" class="back-link" data-t="back"></a>
  </div>
</header>

<main>
  <h1 data-t="title"></h1>
  <div class="subtitle" data-t="subtitle"></div>
  <div class="secure-note" data-t="secureNote"></div>

  <div class="section-title" data-t="secTR"></div>
  <div class="acc-list" id="listTR"></div>

  <div class="section-title" data-t="secIntl"></div>
  <div class="acc-list" id="listIntl"></div>

  <div class="section-title" data-t="secSup"></div>
  <div class="acc-list" id="listSup"></div>
</main>

<div class="modal-overlay" id="connectModalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="connectModalTitle"></div>
    <div class="modal-sub" id="connectModalSub"></div>

    <label class="modal-label" data-t="envLabel"></label>
    <div class="env-group">
      <label class="env-opt" id="envOptLive"><input type="radio" name="env" value="live" checked> <span data-t="envLive"></span></label>
      <label class="env-opt" id="envOptSandbox"><input type="radio" name="env" value="sandbox"> <span data-t="envSandbox"></span></label>
    </div>
    <div class="env-help" id="envHelp"></div>

    <label class="modal-label" data-t="fLabel"></label>
    <input type="text" id="connectLabel" class="modal-input" autocomplete="off" data-lpignore="true" data-1p-ignore>
    <label class="modal-label" id="lblSellerId"></label>
    <input type="text" id="connectSellerId" class="modal-input" autocomplete="off" data-lpignore="true" data-1p-ignore>
    <label class="modal-label" id="lblApiKey"></label>
    <input type="text" id="connectApiKey" class="modal-input" autocomplete="off" data-lpignore="true" data-1p-ignore>
    <label class="modal-label" id="lblApiSecret"></label>
    <input type="text" id="connectApiSecret" class="modal-input secret-input" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore>

    <div class="modal-error" id="connectModalError"></div>
    <div class="modal-actions">
      <button class="acc-btn secondary" id="connectCancelBtn" onclick="closeConnectModal()"></button>
      <button class="acc-btn" id="connectSubmitBtn" onclick="submitConnect()"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key, vars) {
    let s = (T[lang()][key] !== undefined ? T[lang()][key] : T.tr[key]);
    if (s === undefined) return key;
    if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.getElementById('connectCancelBtn').textContent = t('btnCancel');
    const sb = document.getElementById('connectSubmitBtn');
    if (!sb.disabled) sb.textContent = t('btnSave');
  }
  let toastTimer = null;
  function toast(msg, isErr) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (isErr ? ' err' : '');
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
  function fmtDate(d) {
    if (!d) return '';
    try {
      if (window.HS && HS.date) return HS.date(d);
      return new Date(d).toLocaleDateString(lang() === 'en' ? 'en-GB' : 'tr-TR');
    } catch (e) { return ''; }

  let marketplaceRows = [];   // marketplaces tablosu
  let connections = [];       // store_connections (kullanıcının)

  function mpCodeFor(key) {
    const def = MP[key];
    const found = def.codes.find(c => marketplaceRows.some(m => m.code === c));
    return found || def.codes[0];
  }
  function mpRowFor(key) {
    const code = mpCodeFor(key);
    return marketplaceRows.find(m => m.code === code) || null;
  }
  function connectionsFor(key) {
    const code = mpCodeFor(key);
    const row = mpRowFor(key);
    return connections.filter(c => !c.deleted_at && (
      (c.marketplace_code && c.marketplace_code === code) ||
      (row && c.marketplace_id != null && String(c.marketplace_id) === String(row.id))
    ));
  }
  function statusInfo(c) {
    if (c.status === 'connected') return { cls: 'connected', text: t('stConnected') };
    if (c.status === 'pending') return c.environment === 'sandbox' ? { cls: 'test', text: t('stTest') } : { cls: 'pending', text: t('stPending') };
    if (c.status === 'expired') return { cls: 'error', text: t('stExpired') };
    if (c.status === 'revoked') return { cls: 'none', text: t('stRevoked') };
    if (c.status === 'error') return { cls: 'error', text: t('stError') };
    return { cls: 'none', text: esc(c.status || '') };
  }

  async function loadMarketplaceData() {
    try {
      const { data } = await db.from('marketplaces').select('*');
      marketplaceRows = data || [];
    } catch (e) { marketplaceRows = []; }
    try {
      const { data, error } = await db.from('store_connections').select('*').order('created_at', { ascending: true });
      connections = error ? [] : (data || []);
    } catch (e) { connections = []; }
  }

  async function getSession() {
    const { data: { session } } = await db.auth.getSession();
    return session;
  }

  function errorText(result) {
    const code = result && result.error;
    const detail = result && (result.detail || result.message || (result.missing ? [].concat(result.missing).join(', ') : ''));
    if (code === 'not_authenticated') return t('errNotAuth');
    if (code === 'unsupported_marketplace') return t('errUnsupported');
    if (code === 'missing_fields') return t('errMissing') + (detail || '');
    if (code === 'verify_failed') return t('errVerify') + (detail ? '\n(' + detail + ')' : '');
    if (code === 'not_found') return t('errNotFound');
    if (code === 'server_error') return t('errServer') + (detail ? '\n(' + detail + ')' : '');
    return (code || t('errServer')) + (detail ? ' (' + detail + ')' : '');
  }

  async function callStoreConnect(payload) {
    const session = await getSession();
    if (!session) { window.location.href = 'index.html'; return null; }
    const res = await fetch(SUPABASE_URL + '/functions/v1/store-connect', {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ userAccessToken: session.access_token, language: lang() }, payload)),
    });
    let json = null;
    try { json = await res.json(); } catch (e) { json = { ok: false, error: 'server_error', detail: 'HTTP ' + res.status }; }
    return json;
  }

  async function submitConnect() {
    const key = currentKey;
    if (!key) return;
    const def = MP[key];
    const errorEl = document.getElementById('connectModalError');
    errorEl.textContent = '';
    const vals = {
      sellerId: document.getElementById('connectSellerId').value.trim(),
      apiKey: document.getElementById('connectApiKey').value.trim(),
      apiSecret: document.getElementById('connectApiSecret').value.trim(),
    };
    if (def.req.some(f => !vals[f])) { errorEl.textContent = t('fillAll'); return; }
    // Çiçeksepeti: secret yoksa API Key'i kullan (eski davranış)
    if (key === 'ciceksepeti' && !vals.apiSecret) vals.apiSecret = vals.apiKey;

    const env = selectedEnv();
    const label = document.getElementById('connectLabel').value.trim();
    const sb = document.getElementById('connectSubmitBtn');
    sb.disabled = true;
    sb.textContent = (env === 'live' && def.verify) ? t('checking') : t('saving');

    try {
      const code = mpCodeFor(key);
      const result = await callStoreConnect({
        action: 'connect',
        marketplaceCode: code,
        environment: env,
        label: label || null,
        sellerId: vals.sellerId,
        apiKey: vals.apiKey,
        apiSecret: vals.apiSecret,
      });
      if (!result) return;
      if (!result.ok) {
        errorEl.textContent = errorText(result);
        sb.disabled = false; sb.textContent = t('btnSave');
        return;
      }
      const status = result.status || (env === 'sandbox' ? 'pending' : 'connected');
      closeConnectModal();
      if (env === 'sandbox') toast(t('okSandbox', { name: def.name }));
      else if (status === 'connected') toast(t('okConnected', { name: def.name }));
      else toast(t('okPending', { name: def.name }));
      await loadMarketplaceData();
      renderAll();
    } catch (e) {
      errorEl.textContent = t('errNetwork') + e.message;
      sb.disabled = false; sb.textContent = t('btnSave');
    }
  }

  async function disconnectStore(key, connectionId) {
    const def = MP[key];
    const c = connections.find(x => String(x.id) === String(connectionId));
    const envTxt = c && c.environment === 'sandbox' ? t('envSandbox') : t('envLive');
    if (!confirm(t('confirmRemove', { name: def.name, env: envTxt }))) return;
    try {
      const result = await callStoreConnect({ action: 'disconnect', connectionId: connectionId });
      if (!result) return;
      if (!result.ok) { toast(t('failRemove') + errorText(result), true); return; }
      toast(t('okRemoved'));
      await loadMarketplaceData();
      renderAll();
    } catch (e) {
      toast(t('errNetwork') + e.message, true);
    }
  }

  // ---------- Etsy OAuth (platform_tokens - etsy-callback.html ile uyumlu) ----------
  function generateRandomString(length) {
    const array = new Uint8Array(length);
    crypto.getRandomValues(array);
    return Array.from(array, d => ('0' + d.toString(16)).substr(-2)).join('');
  }
  function base64UrlEncode(buffer) {
    let str = '';
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function generateCodeChallenge(verifier) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return base64UrlEncode(digest);
  }
  async function connectEtsy() {
    const session = await getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    const codeVerifier = generateRandomString(64);
    const codeChallenge = await generateCodeChallenge(codeVerifier);
    const state = generateRandomString(16);
    sessionStorage.setItem('etsy_code_verifier', codeVerifier);
    sessionStorage.setItem('etsy_oauth_state', state);
    const authUrl = 'https://www.etsy.com/oauth/connect?' + new URLSearchParams({
      response_type: 'code',
      client_id: '1z497h37rk069va5r0xvxqw3',
      redirect_uri: 'https://mustafabahsimb-eng.github.io/hizlisatici-ai/etsy-callback.html',
      scope: 'listings_r listings_w transactions_r',
      state: state,
      code_challenge: codeChallenge,
      code_challenge_method: 'S256',
    }).toString();
    window.location.href = authUrl;
  }
  async function renderEtsy() {
    const el = document.getElementById('right-etsy');
    if (!el) return;
    try {
      const session = await getSession();
      if (!session) return;
      const { data, error } = await db.from('platform_tokens').select('access_token')
        .eq('user_id', session.user.id).eq('platform', 'etsy').maybeSingle();
      if (!error && data) {
        el.innerHTML = '<span class="acc-status connected">' + t('stConnected') + '</span><button class="acc-btn secondary" onclick="disconnectEtsy()">' + t('btnRemove') + '</button>';
      } else {
        el.innerHTML = '<span class="acc-status none">' + t('stNone') + '</span><button class="acc-btn" onclick="connectEtsy()">' + t('btnConnect') + '</button>';
      }
    } catch (e) {
      el.innerHTML = '<span class="acc-status none">' + t('stCheckFail') + '</span><button class="acc-btn" onclick="connectEtsy()">' + t('btnConnect') + '</button>';
    }
  }
  async function disconnectEtsy() {
    if (!confirm(t('etsyConfirmRemove'))) return;
    const session = await getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    const { error } = await db.from('platform_tokens').delete().eq('user_id', session.user.id).eq('platform', 'etsy');
    if (error) { toast(t('failRemove') + error.message, true); return; }
    await renderEtsy();
  }

      if (st === 'connected') el.innerHTML = '<span class="acc-status connected">' + t('stConnected') + '</span><a class="acc-btn secondary" href="pod.html">' + t('btnManage') + '</a>';

        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ action: 'status', userAccessToken: session.access_token }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'error');
      printifyCache = data.connected ? 'connected' : 'none';
    } catch (e) {
      printifyCache = 'fail';
    }
    draw(printifyCache);
  }

  // ---------- Başlat ----------
  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const session = await getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    renderAll();                 // önce iskelet
    await loadMarketplaceData(); // sonra bağlantılar
    renderAll();
  }

  function onLangChange() {
    renderAll();
    if (currentKey) fillModalTexts();
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);
  document.getElementById('connectModalOverlay').addEventListener('click', e => {
    if (e.target.id === 'connectModalOverlay') closeConnectModal();
  });

  init();
</script>

</body>
</html>
