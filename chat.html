<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HızlıSatıcı AI - Sohbetle Yönet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f16;
    color: #e6e8ee;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid #232838;
    background: #141821;
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 30px; height: 30px; border-radius: 8px;
    background: #1D9E75; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .logo-text { font-size: 16px; font-weight: 600; color: #fff; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .back-link {
    color: #9aa3b2; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 6px;
  }
  .back-link:hover { color: #fff; }

  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .intro { margin-bottom: 16px; }
  .intro h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .intro p { font-size: 13px; color: #9aa3b2; }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 8px 4px;
    margin-bottom: 12px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.user .msg-bubble {
    background: #1D9E75;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.ai .msg-bubble {
    background: #1c212c;
    border: 1px solid #232838;
    color: #e6e8ee;
    border-bottom-left-radius: 4px;
  }
  .msg-row.ai .msg-bubble.system {
    color: #9aa3b2;
    font-size: 12px;
    font-style: italic;
  }
  .msg-row.ai .msg-bubble.typing { color: #9aa3b2; font-style: italic; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .suggestion-chip {
    background: #1c212c; border: 1px solid #2a3040; color: #9aa3b2;
    padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
  }
  .suggestion-chip:hover { border-color: #1D9E75; color: #fff; }

  .chat-input-row {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-input-row input {
    flex: 1;
    min-width: 0;
    background: #1c212c;
    border: 1px solid #2a3040;
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .chat-input-row input:focus { border-color: #1D9E75; }
  .send-btn {
    background: #1D9E75; color: #fff; border: none;
    padding: 0 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .send-btn:hover { background: #178a65; }
  .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  @media (max-width: 520px) {
    header { padding: 14px 16px; }
    .logo-text { display: none; }
    main { padding: 16px; }
    .msg-bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot">H</div>
    <div class="logo-text">HızlıSatıcı AI</div>
  </div>
  <div class="header-right">
    <a href="dashboard.html" class="back-link" data-t="back"></a>
    <span id="langSwitcherHost"></span>
  </div>
</header>

<main>
  <div class="intro">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
  </div>

  <div class="suggestions" id="suggestions"></div>

  <div class="chat-log" id="chatLog"></div>

  <div class="chat-input-row">
    <input type="text" id="chatInput" data-tp="placeholder" autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" data-t="send"></button>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://ytucdrrgxsjhrqmaxckt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xJXwqD9NmwU70kv2eFKk0A_O2q9gOcD';
  let db = null;

  let currentUser = null;
  let cachedProducts = [];
  let busy = false;
  // Mesaj geçmişi: {role:'user'|'ai', text} ya da {role:'ai', key, vars} (sabit metinler dil değişince çevrilir)
  const messages = [];

  // ================= DİL =================
  const T = {
    tr: {
      pageTitle: 'HızlıSatıcı AI - Sohbetle Yönet',
      back: '← Panele dön',
      title: '💬 Sohbetle Yönet',
      intro: 'Ürün eklemek, silmek veya listeni görmek için doğal dille yaz — "kablosuz kulaklık ekle" veya "ürünlerimi listele" gibi.',
      placeholder: 'Örn: robot süpürge ekle',
      send: 'Gönder',
      suggestions: ['ürünlerimi listele', 'kablosuz kulaklık ekle'],
      greeting: 'Merhaba! Ürünlerinle ilgili ne yapmak istersin? "ürünlerimi listele" ya da "[ürün adı] ekle" yazabilirsin.',
      typing: 'Yazıyor...',
      error: 'Bir hata oldu: ',
      adding: '"{name}" ürününü ekliyorum, ürün ekleme sayfasına yönlendiriyorum...',
      confirmDeleteNamed: '"{name}" ürününü silmek istediğine emin misin?',
      confirmDelete: 'Bu ürünü silmek istediğine emin misin?',
      deleteFailed: 'Silinemedi: ',
      deleted: 'Ürün silindi.',
      notDeleted: 'Tamam, silmedim.',
      notFound: 'Bu ürünü listende bulamadım.',
      listIntro: 'İşte ürünlerin:',
      noProducts: 'Henüz hiç ürünün yok.',
      unnamed: 'İsimsiz ürün',
      notUnderstood: 'Anlayamadım, tekrar dener misin?',
    },
    en: {
      pageTitle: 'HızlıSatıcı AI - Chat to Manage',
      back: '← Back to dashboard',
      title: '💬 Chat to Manage',
      intro: 'Type in plain language to add, delete or list your products — like "add wireless earbuds" or "list my products".',
      placeholder: 'e.g. add robot vacuum',
      send: 'Send',
      suggestions: ['list my products', 'add wireless earbuds'],
      greeting: 'Hi! What would you like to do with your products? You can type "list my products" or "add [product name]".',
      typing: 'Typing...',
      error: 'Something went wrong: ',
      adding: 'Adding "{name}", redirecting you to the add product page...',
      confirmDeleteNamed: 'Are you sure you want to delete "{name}"?',
      confirmDelete: 'Are you sure you want to delete this product?',
      deleteFailed: 'Could not delete: ',
      deleted: 'Product deleted.',
      notDeleted: "OK, I didn't delete it.",
      notFound: "I couldn't find this product in your list.",
      listIntro: 'Here are your products:',
      noProducts: "You don't have any products yet.",
      unnamed: 'Unnamed product',
      notUnderstood: "I didn't get that, could you try again?",
    }
  };
  function lang() {
    const l = (window.HS && HS.lang) || document.documentElement.lang || 'tr';
    return T[l] ? l : 'tr';
  }
  function t(key, vars) {
    let v = T[lang()][key];
    if (v === undefined) v = T.tr[key] !== undefined ? T.tr[key] : key;
    if (vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
    return v;
  }
  function applyStatic() {
    document.documentElement.lang = lang();
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.getAttribute('data-tp')); });
    renderSuggestions();
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderSuggestions() {
    const box = document.getElementById('suggestions');
    box.innerHTML = t('suggestions').map((s, i) =>
      '<div class="suggestion-chip" data-idx="' + i + '">' + escapeHtml(s) + '</div>').join('');
  }
  document.getElementById('suggestions').addEventListener('click', e => {
    const chip = e.target.closest('.suggestion-chip');
    if (!chip || busy) return;
    const s = t('suggestions')[Number(chip.getAttribute('data-idx'))];
    if (s) { document.getElementById('chatInput').value = s; sendMessage(); }
  });

  // ================= MESAJLAR =================
  function messageText(m) {
    if (m.key === 'productList') {
      if (!m.items.length) return t('noProducts');
      return m.items.map(p => '• ' + (p.name || t('unnamed')) + (p.platform ? ' (' + p.platform + ')' : '')).join('\n');
    }
    if (m.key) return (m.prefixKey ? t(m.prefixKey) : '') + t(m.key, m.vars) + (m.suffix || '');
    return (m.prefixKey ? t(m.prefixKey) : '') + (m.text || '');
  }
  function renderLog() {
    const log = document.getElementById('chatLog');
    log.innerHTML = messages.map(m => {
      const cls = 'msg-bubble' + (m.system ? ' system' : '') + (m.typing ? ' typing' : '');
      const text = m.typing ? t('typing') : messageText(m);
      return '<div class="msg-row ' + (m.role === 'user' ? 'user' : 'ai') + '"><div class="' + cls + '">' + escapeHtml(text) + '</div></div>';
    }).join('');
    log.scrollTop = log.scrollHeight;
  }
  function push(m) { messages.push(m); renderLog(); return m; }
  function addUserMessage(text) { push({ role: 'user', text }); }
  function addAiText(text, system) { push({ role: 'ai', text, system: !!system }); }
  function addAiKey(key, vars, opts) { push(Object.assign({ role: 'ai', key, vars }, opts || {})); }
  function removeMsg(m) { const i = messages.indexOf(m); if (i >= 0) messages.splice(i, 1); renderLog(); }

  // ================= VERİ =================
  async function init() {
    try {
      if (window.HS && typeof HS.init === 'function') await HS.init({ auth: true });
    } catch (e) { console.warn('HS.init', e); }
    db = (window.HS && HS.db) ? HS.db : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    applyStatic();

    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
    await refreshProducts();
    addAiKey('greeting');
    document.getElementById('chatInput').focus();
  }

  async function refreshProducts() {
    let r = await db.from('products').select('id, name, platform')
      .eq('user_id', currentUser.id).is('deleted_at', null)
      .order('created_at', { ascending: false });
    if (r.error) {
      r = await db.from('products').select('id, name, platform')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });
    }
    cachedProducts = r.data || [];
  }

  async function sendMessage() {
    if (busy) return;
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = '';
    busy = true;
    btn.disabled = true;
    const typingMsg = push({ role: 'ai', typing: true });

    try {
      const { data: { session } } = await db.auth.getSession();
      const response = await fetch(SUPABASE_URL + '/functions/v1/chat-to-sell', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({
          message: text,
          products: cachedProducts,
          userAccessToken: session ? session.access_token : null,
          language: lang(),
        }),
      });
      const data = await response.json();
      removeMsg(typingMsg);
      if (data.error) throw new Error(data.error);
      await handleAction(data);
    } catch (err) {
      removeMsg(typingMsg);
      addAiText(t('error') + (err.message || err));
    } finally {
      busy = false;
      btn.disabled = false;
      input.focus();
    }
  }

  async function deleteProduct(id) {
    // Önce yumuşak silme (listing'ler ve siparişler bozulmasın), olmazsa kalıcı silme
    const soft = await db.from('products').update({ deleted_at: new Date().toISOString() })
      .eq('id', id).eq('user_id', currentUser.id);
    if (!soft.error) return null;
    const hard = await db.from('products').delete().eq('id', id).eq('user_id', currentUser.id);
    return hard.error;
  }

  async function handleAction(data) {
    const action = data.action || 'none';
    const params = data.params || {};

    if (action === 'add_product' && params.name) {
      if (data.reply) addAiText(data.reply); else addAiKey('adding', { name: params.name });
      setTimeout(() => {
        window.location.href = 'add-product.html?name=' + encodeURIComponent(params.name);
      }, 900);
      return;
    }

    if (action === 'delete_product' && params.id) {
      const product = cachedProducts.find(p => String(p.id) === String(params.id));
      if (!product) { addAiKey('notFound'); return; }
      const confirmMsg = product.name ? t('confirmDeleteNamed', { name: product.name }) : t('confirmDelete');
      if (confirm(confirmMsg)) {
        const error = await deleteProduct(params.id);
        if (error) {
          addAiKey('deleteFailed', null, { suffix: error.message });
        } else {
          if (data.reply) addAiText(data.reply); else addAiKey('deleted');
          await refreshProducts();
        }
      } else {
        addAiKey('notDeleted');
      }
      return;
    }

    if (action === 'list_products') {
      await refreshProducts();
      if (data.reply) addAiText(data.reply); else addAiKey('listIntro');
      push({ role: 'ai', key: 'productList', items: cachedProducts.slice(), system: true });
      return;
    }

    if (data.reply) addAiText(data.reply); else addAiKey('notUnderstood');
  }

  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) sendMessage();
  });

  function onLangChange() {
    applyStatic();
    renderLog();
  }
  window.addEventListener('hs:langchange', onLangChange);
  document.addEventListener('hs:langchange', onLangChange);

  init();
</script>

</body>
</html>
